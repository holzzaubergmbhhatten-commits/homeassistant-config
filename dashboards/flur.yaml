      tap_action:
        action: navigate
        navigation_path: /flur-display/kalender-buchungen
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Einkauf
      icon: mdi:cart
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/einkauf
      grid_options:
