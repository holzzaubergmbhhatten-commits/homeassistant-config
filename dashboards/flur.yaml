# Dashboard "Flur" (Touchmonitor) im Apple-Stil – wird aus GitHub eingespielt.
# Adresse: /flur-display/start   Änderungen bitte im Repository, nicht in der Oberfläche.
# Termine landen im lokalen Kalender "Geburtstage" (calendar.geburtstage).

views:
- title: Zuhause
  path: start
  icon: mdi:home
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: weather.touchmonitor_home
    show_name: false
    show_state: true
    show_icon: true
    state_content:
    - state
    - temperature
  - type: entity
    entity: sensor.lichter_an
    name: Lichter an
    show_name: true
    show_state: true
    show_icon: true
    color: amber
    tap_action:
      action: navigate
      navigation_path: /flur-display/licht
  - type: entity
    entity: switch.shelly1g4_a085e3bd629c
    name: Hoftor
    show_name: true
    show_state: true
    icon: mdi:gate
  header:
    card:
      type: markdown
      text_only: true
      content: |-
        # Zuhause
        {{ now().strftime('%H:%M') }} · {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}, {{ now().day }}. {{ ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month-1] }}
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Termine
      heading_style: title
    - type: weather-forecast
      entity: weather.touchmonitor_home
      forecast_type: daily
      show_forecast: true
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set t = state_attr('sensor.termine_vorschau', 'familie') or [] %}
        {% set heute = now().date() %}
        {% set tage = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
        {% for name, versatz, farbe in [('Heute', 0, '#FF3B30'), ('Morgen', 1, '#007AFF'), ('Übermorgen', 2, '#007AFF')] %}
        {%- set d = heute + timedelta(days=versatz) %}
        {%- set ns2 = namespace(l=[]) %}
        {%- for e in t %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        {%- if sd <= d and (ed > d or sd == d) %}{% set ns2.l = ns2.l + [e] %}{% endif %}
        {%- endfor %}
        ### <font color="{{ farbe }}">{{ name }}</font> <font color="#8E8E93">{{ tage[d.weekday()] }} {{ d.strftime('%d.%m.') }}</font>
        {% if ns2.l %}
        {%- for e in ns2.l %}{{ '<br>' if not loop.first }}<font color="{{ farbe }}">●</font> <b>{{ e.titel }}</b>{{ ' · ' ~ as_datetime(e.start).strftime('%H:%M') ~ ' Uhr' if 'T' in (e.start | string) else '' }}{% endfor %}
        {%- else %}
        <font color="#8E8E93">Nichts geplant</font>
        {%- endif %}

        {% endfor %}
        {%- set ns = namespace(spaeter=[]) %}
        {%- for e in t %}{% if as_datetime(e.start).date() > heute + timedelta(days=2) %}{% set ns.spaeter = ns.spaeter + [e] %}{% endif %}{% endfor %}
        {%- if ns.spaeter %}
        ### Demnächst
        {% for e in ns.spaeter[:6] %}
        {%- set sd = as_datetime(e.start) %}{{ '<br>' if not loop.first }}<font color="#8E8E93">●</font> <b>{{ e.titel }}</b> · {{ tage[sd.weekday()] }} {{ sd.strftime('%d.%m.') }}{{ ' · ' ~ sd.strftime('%H:%M') ~ ' Uhr' if 'T' in (e.start | string) else '' }}
        {%- endfor %}
        {%- endif %}
  - type: grid
    cards:
    - type: heading
      heading: Aufgaben
      heading_style: title
      icon: mdi:checkbox-marked-circle-outline
      tap_action:
        action: navigate
        navigation_path: /flur-display/aufgaben
      badges:
      - type: entity
        entity: todo.aufgaben
        show_state: true
        show_icon: false
        color: orange
        tap_action:
          action: navigate
          navigation_path: /flur-display/aufgaben
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |
        {% set n = states('todo.aufgaben') | int(0) %}
        {%- if n > 0 %}
        ## <font color="#FF9500">{{ n }}</font> <font color="#8E8E93">offen</font>
        {%- else %}
        ## <font color="#34C759"><ha-icon icon="mdi:check-circle"></ha-icon></font> <font color="#8E8E93">Alles erledigt</font>
        {%- endif %}
    - type: todo-list
      entity: todo.aufgaben
      hide_completed: true
      hide_create: true
      display_order: none
      grid_options:
        columns: full
    - type: heading
      heading: Ferienwohnung & Stellplätze
      heading_style: title
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set b = state_attr('sensor.termine_vorschau', 'buchungen') or [] %}
        {% set heute = now().date() %}
        {% set tage = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
        {% set fw_kal = ['calendar.holidu', 'calendar.privat_mit_buchung'] %}
        {% set ns = namespace(fw=[], fw_keys=[], sp=[], hat_sp=false) %}
        {% set ns.hat_sp = states.calendar | selectattr('entity_id', 'search', 'stellpl') | list | count > 0
           or (state_attr('sensor.termine_vorschau', 'stellplatz_status') or '') is match('ok') %}
        {# Anreisetage bei Holidu = Ferienwohnung (Abreisetag zählen Holidu und Portal unterschiedlich) #}
        {% set ns_h = namespace(keys=[]) %}
        {% for e in b if e.kalender == 'calendar.holidu' %}{% set ns_h.keys = ns_h.keys + [(e.start | string)[:10]] %}{% endfor %}
        {# Portal-Kalender (export-ical-ferienwohnung.php) = nur Ferienwohnung; bei gleicher Anreise wie Holidu gilt der Holidu-Eintrag (mit Gästenamen) #}
        {% for e in b if e.kalender == 'calendar.privat_mit_buchung' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns_h.keys %}{% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% for e in b if e.kalender == 'calendar.holidu' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
        {% endfor %}
        {% for e in b if 'stellpl' in e.kalender %}{% set ns.sp = ns.sp + [e] %}{% endfor %}
        {% for bereich, symbol, liste in [('Ferienwohnung', 'mdi:home-heart', ns.fw | sort(attribute='start')), ('Stellplätze', 'mdi:rv-truck', ns.sp | sort(attribute='start'))] %}
        {%- set ns2 = namespace(aktuell=[], naechste=[]) %}
        {%- for e in liste %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        {%- if sd <= heute and ed > heute %}{% set ns2.aktuell = ns2.aktuell + [e] %}
        {%- elif sd > heute %}{% set ns2.naechste = ns2.naechste + [e] %}{% endif %}
        {%- endfor %}
        <ha-icon icon="{{ symbol }}"></ha-icon> **{{ bereich }}**
        {%- if bereich == 'Stellplätze' and not ns.hat_sp %}
        - <font color="#8E8E93">Stellplatz-Daten nicht erreichbar ({{ state_attr('sensor.termine_vorschau', 'stellplatz_status') or '?' }})</font>
        {%- else %}
        {%- for e in ns2.aktuell %}
        {%- set ed = as_datetime(e.ende).date() %}
        - <font color="#FF453A">●</font> **Belegt** bis {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.aktuell | count == 0 %}
        - <font color="#30D158">●</font> **Heute frei**
        {%- endif %}
        {%- for e in ns2.naechste[:2] %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        - {{ 'Nächste Anreise' if loop.first else 'Danach' }}: {{ tage[sd.weekday()] }} {{ sd.strftime('%d.%m.') }} – {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.naechste | count == 0 %}
        - keine weiteren Buchungen
        {%- endif %}
        {%- endif %}

        {% endfor %}
    - type: button
      name: Stellplätze verwalten
      icon: mdi:rv-truck
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.stellplaetze_verwalten
      grid_options:
        columns: full
        rows: 1
    - type: heading
      heading: Einkaufsliste
      heading_style: title
      icon: mdi:cart
      tap_action:
        action: navigate
        navigation_path: /flur-display/einkauf
      badges:
      - type: entity
        entity: todo.einkaufsliste
        show_state: true
        show_icon: false
        color: amber
        tap_action:
          action: navigate
          navigation_path: /flur-display/einkauf
    - type: todo-list
      entity: todo.einkaufsliste
      hide_completed: true
      hide_create: true
      display_order: none
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Schnellzugriff
      heading_style: title
    - type: tile
      entity: switch.shelly1g4_a085e3bd629c
      name: Hoftor
      icon: mdi:gate
      tap_action:
        action: toggle
      grid_options:
        columns: full
        rows: 2
      vertical: true
    - type: button
      name: Alle Lichter aus
      icon: mdi:lightbulb-group-off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: all
        confirmation:
          text: Wirklich alle Lichter ausschalten?
      grid_options:
        columns: full
        rows: 2
    - type: button
      name: Alle Lampen
      icon: mdi:lightbulb-group
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/licht
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Musik
      icon: mdi:music
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/musik
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Kalender
      icon: mdi:calendar-month
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/kalender-buchungen
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Einkauf
      icon: mdi:cart
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/einkauf
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Aufgaben
      icon: mdi:checkbox-marked-circle-outline
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/aufgaben
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Kameras
      icon: mdi:cctv
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/kameras
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Amazon
      icon: mdi:cart
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.amazon_startseite
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Amazon-Bestellungen
      icon: mdi:package-variant
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.amazon_auf_monitor
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: input_select.design
      name: Design
      icon: mdi:theme-light-dark
      features:
      - type: select-options
      features_position: bottom
      grid_options:
        columns: full
        rows: 2
