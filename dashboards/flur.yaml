# Dashboard "Flur" (Touchmonitor) im Apple-Stil – wird aus GitHub eingespielt.
# Adresse: /flur-display/start   Änderungen bitte im Repository, nicht in der Oberfläche.
# Termine landen im lokalen Kalender "Geburtstage" (calendar.geburtstage).

views:
- title: Zuhause
  path: start
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    # Begrüßung mit Familienwappen (Bild von der eigenen Webseite), darunter Uhrzeit und Datum
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        {%- set h = now().hour -%}
        ## <img src="https://urlaub-wie-zuhause.eu/images/wappen-schlag.png" height="56" alt=""> {{ 'Gute Nacht' if h < 5 or h >= 22 else 'Guten Morgen' if h < 11 else 'Guten Tag' if h < 18 else 'Guten Abend' }}, <font color="#B8902F"><i>Familie Schlag</i></font>

        ### {{ now().strftime('%H:%M') }} <font color="#8E8E93">· {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}, {{ now().day }}. {{ ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month-1] }}</font>
      heading_style: title
    # Nachricht von Jarvis / Telegram ("Schreib auf den Monitor: …"), verschwindet von selbst
    - type: conditional
      grid_options:
        columns: full
      conditions:
      - condition: state
        entity: input_text.flur_nachricht
        state_not: ''
      - condition: state
        entity: input_text.flur_nachricht
        state_not: unknown
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: |-
            ## <ha-icon icon="mdi:message-text"></ha-icon> {{ states('input_text.flur_nachricht') }}
            <font color="#8E8E93">{{ (states.input_text.flur_nachricht.last_changed | as_local).strftime('%H:%M') }} Uhr</font>
        - type: button
          name: Nachricht ausblenden
          icon: mdi:close-circle-outline
          show_state: false
          icon_height: 28px
          tap_action:
            action: perform-action
            perform_action: script.jarvis_monitor_nachricht
            data:
              text: ''
    # Alles für heute in EINEM Kasten: Warnungen/Müll/Schule (sensor.haus_hinweise), Termine heute & morgen, Essen
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {%- set t = state_attr('sensor.termine_vorschau', 'familie') or [] %}
        {%- set heute = now().date() %}
        {%- for h in state_attr('sensor.haus_hinweise', 'liste') or [] %}<font color="{{ h.farbe }}"><ha-icon icon="{{ h.icon }}"></ha-icon></font> <b>{{ h.text }}</b><br>{% endfor %}
        {%- for name, versatz, farbe in [('Heute', 0, '#FF3B30'), ('Morgen', 1, '#007AFF')] %}
        {%- set d = heute + timedelta(days=versatz) %}
        {%- set ns2 = namespace(l=[]) %}
        {%- for e in t %}{% set sd = as_datetime(e.start).date() %}{% set ed = as_datetime(e.ende).date() %}{% if sd <= d and (ed > d or sd == d) %}{% set ns2.l = ns2.l + [e] %}{% endif %}{% endfor %}
        <font color="{{ farbe }}"><b>{{ name }}</b></font> {% if ns2.l %}{% for e in ns2.l %}{{ ' · ' if not loop.first }}{{ e.titel }}{{ ' ' ~ as_datetime(e.start).strftime('%H:%M') if 'T' in (e.start | string) else '' }}{% endfor %}{% else %}<font color="#8E8E93">nichts geplant</font>{% endif %}<br>
        {%- endfor %}
        {%- set g = state_attr('sensor.kueche_heute', 'gericht') %}
        {%- if g %}<ha-icon icon="mdi:silverware-fork-knife"></ha-icon> Essen: <b>{{ g }}</b>{% endif %}
    - type: weather-forecast
      entity: weather.touchmonitor_home
      forecast_type: daily
      show_forecast: true
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Aufgaben
      heading_style: title
      icon: mdi:checkbox-marked-circle-outline
      tap_action:
        action: navigate
        navigation_path: /flur-display/aufgaben
    # Wartung der Woche (packages/startseite.yaml) – eine Zeile, Haken = erledigt
    - type: conditional
      grid_options:
        columns: full
      conditions:
      - condition: state
        entity: sensor.wartung_diese_woche
        state_not: nichts
      card:
        type: tile
        entity: sensor.wartung_diese_woche
        name: Wartung diese Woche
        icon: mdi:wrench-clock
        color: orange
        hide_state: false
        tap_action:
          action: navigate
          navigation_path: /flur-display/wartung
        icon_tap_action:
          action: perform-action
          perform_action: script.wartung_diese_woche_erledigt
          confirmation:
            text: Diese Wartung als erledigt abhaken? (Symbol antippen = erledigt, Kachel antippen = Anleitung)
    # Abhaken direkt hier: Kreis antippen = erledigt. Hausarbeit der Woche steht in eigener Liste (Reiter "Aufgaben")
    - type: todo-list
      entity: todo.aufgaben
      hide_create: true
      hide_completed: true
      display_order: none
      grid_options:
        columns: full
    - type: conditional
      grid_options:
        columns: full
      conditions:
      - condition: numeric_state
        entity: todo.hausarbeit
        above: 0
      card:
        type: tile
        entity: todo.hausarbeit
        name: Hausarbeit diese Woche
        icon: mdi:broom
        tap_action:
          action: navigate
          navigation_path: /flur-display/aufgaben
  - type: grid
    cards:
    - type: heading
      heading: Ferienwohnung & Stellplätze
      heading_style: title
      badges:
      - type: entity
        entity: sensor.knopf_stellplatze
        show_icon: true
        show_state: true
        tap_action:
          action: navigate
          navigation_path: /flur-display/verwaltung
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set b = state_attr('sensor.termine_vorschau', 'buchungen') or [] %}
        {% set heute = now().date() %}
        {% set tage = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
        {% set fw_kal = ['calendar.holidu', 'calendar.privat_mit_buchung'] %}
        {% set ns = namespace(fw=[], fw_keys=[], sp=[], hat_sp=false) %}
        {% set ns.hat_sp = states.calendar | selectattr('entity_id', 'search', 'stellpl') | list | count > 0
           or (state_attr('sensor.termine_vorschau', 'stellplatz_status') or '') is match('ok') %}
        {# Anreisetage bei Holidu = Ferienwohnung (Abreisetag zählen Holidu und Portal unterschiedlich) #}
        {% set ns_h = namespace(keys=[]) %}
        {% for e in b if e.kalender == 'calendar.holidu' %}{% set ns_h.keys = ns_h.keys + [(e.start | string)[:10]] %}{% endfor %}
        {# Portal-Kalender (export-ical-ferienwohnung.php) = nur Ferienwohnung; bei gleicher Anreise wie Holidu gilt der Holidu-Eintrag (mit Gästenamen) #}
        {% for e in b if e.kalender == 'calendar.privat_mit_buchung' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns_h.keys %}{% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% for e in b if e.kalender == 'calendar.holidu' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
        {% endfor %}
        {% for e in b if 'stellpl' in e.kalender %}{% set ns.sp = ns.sp + [e] %}{% endfor %}
        {% for bereich, symbol, liste in [('Ferienwohnung', 'mdi:home-heart', ns.fw | sort(attribute='start')), ('Stellplätze', 'mdi:rv-truck', ns.sp | sort(attribute='start'))] %}
        {%- set ns2 = namespace(aktuell=[], naechste=[]) %}
        {%- for e in liste %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        {%- if sd <= heute and ed > heute %}{% set ns2.aktuell = ns2.aktuell + [e] %}
        {%- elif sd > heute %}{% set ns2.naechste = ns2.naechste + [e] %}{% endif %}
        {%- endfor %}
        <ha-icon icon="{{ symbol }}"></ha-icon> **{{ bereich }}**
        {%- if bereich == 'Stellplätze' and not ns.hat_sp %}
        - <font color="#8E8E93">Stellplatz-Daten nicht erreichbar ({{ state_attr('sensor.termine_vorschau', 'stellplatz_status') or '?' }})</font>
        {%- else %}
        {%- for e in ns2.aktuell %}
        {%- set ed = as_datetime(e.ende).date() %}
        - <font color="#FF453A">●</font> **Belegt** bis {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.aktuell | count == 0 %}
        - <font color="#30D158">●</font> **Heute frei**
        {%- endif %}
        {%- for e in ns2.naechste[:2] %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        - {{ 'Nächste Anreise' if loop.first else 'Danach' }}: {{ tage[sd.weekday()] }} {{ sd.strftime('%d.%m.') }} – {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.naechste | count == 0 %}
        - keine weiteren Buchungen
        {%- endif %}
        {%- endif %}

        {% endfor %}
    - type: heading
      heading: Einkaufsliste
      heading_style: title
      icon: mdi:cart
      tap_action:
        action: navigate
        navigation_path: /flur-display/einkauf
      badges:
      - type: entity
        entity: todo.einkaufsliste
        show_state: true
        show_icon: false
        color: amber
        tap_action:
          action: navigate
          navigation_path: /flur-display/einkauf
    - type: todo-list
      entity: todo.einkaufsliste
      hide_completed: true
      hide_create: true
      display_order: none
      grid_options:
        columns: full
    # Kamin: nur sichtbar, solange er heizt – Tippen öffnet das Anlagenbild
    - type: conditional
      grid_options:
        columns: full
      conditions:
      - condition: state
        entity: binary_sensor.kamin_heizt
        state: 'on'
      card:
        type: tile
        entity: sensor.hwr_warmepumpe_puffertemperatur_oben
        name: Kamin heizt · Puffer
        icon: mdi:fireplace
        color: deep-orange
        tap_action:
          action: navigate
          navigation_path: /flur-display/kamin
    - type: tile
      entity: switch.shelly1g4_a085e3bd629c
      name: Hoftor
      icon: mdi:gate
      tap_action:
        action: toggle
      grid_options:
        columns: 6
        rows: 2
      vertical: true
    - type: button
      name: Alle Lichter aus
      icon: mdi:lightbulb-group-off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: all
        confirmation:
          text: Wirklich alle Lichter ausschalten?
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Helfer
      icon: mdi:toolbox-outline
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/helfer
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Amazon
      icon: mdi:cart
      show_state: false
      icon_height: 34px
      tap_action:
        action: perform-action
        perform_action: script.amazon_startseite
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Bestellungen
      icon: mdi:package-variant
      show_state: false
      icon_height: 34px
      tap_action:
        action: perform-action
        perform_action: script.amazon_auf_monitor
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Einstellungen
      icon: mdi:cog-outline
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/einstellungen
      grid_options:
        columns: 4
        rows: 2
# Einstellungen (Knopf auf der Startseite): Ansage-Lautstärke, Heizung & Kamin, Hausalarm, Urlaubsmodus, Design
- title: Einstellungen
  path: einstellungen
  icon: mdi:cog-outline
  subview: true
  back_path: /flur-display/start
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Morgen-Ansage
      heading_style: title
    # Lautstärke der Morgen-Ansage (packages/jarvis.yaml) – Regler schieben, aufs Symbol tippen spielt eine Probe ab
    - type: tile
      entity: input_number.morgen_ansage_lautstaerke
      name: Lautstärke Morgen-Ansage
      icon: mdi:volume-medium
      grid_options:
        columns: full
      tap_action:
        action: none
      icon_tap_action:
        action: perform-action
        perform_action: script.jarvis_morgen_ansage_probe
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
    - type: heading
      heading: Heizung & Kamin
      heading_style: title
      icon: mdi:fireplace
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.kamin_modus
      name: Kamin-Modus
      icon: mdi:fireplace
      color: deep-orange
      tap_action:
        action: toggle
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: binary_sensor.kamin_heizt
      name: Kamin heizt
      icon: mdi:fire
      color: orange
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: input_boolean.pv_warmwasser
      name: Sonnen-Warmwasser
      icon: mdi:solar-power-variant
      color: amber
      tap_action:
        action: toggle
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: input_boolean.kamin_waerme_abladen
      name: Kamin-Wärme ins Haus
      icon: mdi:heat-wave
      color: red
      tap_action:
        action: toggle
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.hwr_warmepumpe_puffertemperatur_oben
      name: Puffer
      icon: mdi:water-thermometer
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: button.hwr_warmepumpe_einmalige_ladung_aktivieren
      name: Warmwasser jetzt aufheizen
      icon: mdi:water-boiler
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.hwr_warmepumpe_einmalige_ladung_aktivieren
        confirmation:
          text: Warmwasser jetzt einmal mit der Wärmepumpe aufheizen?
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: input_boolean.hausalarm
      name: Hausalarm
      icon: mdi:alarm-light
      color: red
      tap_action:
        action: toggle
        confirmation:
          text: Hausalarm umschalten? (AN = alle Lichter an, Sirene und Ansage auf allen Lautsprechern, Telegram an alle)
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: input_boolean.urlaubsmodus
      name: Urlaubsmodus
      icon: mdi:bag-suitcase
      tap_action:
        action: toggle
        confirmation:
          text: Urlaubsmodus umschalten? (Licht wie bewohnt, Morgen-Ansage aus, strenger Wasser-Wächter)
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: input_select.design
      name: Design
      icon: mdi:theme-light-dark
      features:
      - type: select-options
      features_position: bottom
      grid_options:
        columns: full
        rows: 2
