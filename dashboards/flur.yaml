        navigation_path: /flur-display/grundriss
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Musik
      icon: mdi:music
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/musik
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Kalender
      icon: mdi:calendar-month
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/kalender-buchungen
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Einkauf
      icon: mdi:cart
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/einkauf
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Aufgaben
      icon: mdi:checkbox-marked-circle-outline
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/aufgaben
      grid_options:
        columns: 4
        rows: 2
    - type: button
      name: Mucki
      icon: mdi:star-face
      show_state: false
      icon_height: 34px
      tap_action:
        action: navigate
        navigation_path: /flur-display/mucki
      grid_options:
        columns: 4
