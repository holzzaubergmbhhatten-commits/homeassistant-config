# Dashboard "Flur" (Touchmonitor) im Apple-Stil – wird aus GitHub eingespielt.
# Adresse: /flur-display/start   Änderungen bitte im Repository, nicht in der Oberfläche.
# Voraussetzung: lokaler Kalender "Termine" (calendar.termine) ist angelegt.

views:
- title: Zuhause
  path: start
  icon: mdi:home
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: weather.touchmonitor_home
    show_name: false
    show_state: true
    show_icon: true
    state_content:
    - state
    - temperature
  - type: entity
    entity: sensor.lichter_an
    name: Lichter an
    show_name: true
    show_state: true
    show_icon: true
    color: amber
    tap_action:
      action: navigate
      navigation_path: /flur-display/licht
  - type: entity
    entity: switch.shelly1g4_a085e3bd629c
    name: Hoftor
    show_name: true
    show_state: true
    icon: mdi:gate
  header:
    card:
      type: markdown
      text_only: true
      content: '# Zuhause

        {{ now().strftime(''%H:%M'') }} · {{ [''Montag'',''Dienstag'',''Mittwoch'',''Donnerstag'',''Freitag'',''Samstag'',''Sonntag''][now().weekday()]
        }}, {{ now().day }}. {{ [''Januar'',''Februar'',''März'',''April'',''Mai'',''Juni'',''Juli'',''August'',''September'',''Oktober'',''November'',''Dezember''][now().month-1]
        }}'
  background:
    opacity: 33
    alignment: center
    size: cover
    repeat: no-repeat
    attachment: scroll
    image:
      media_content_id: media-source://image_upload/f15a5ff16a39533008ac2f410fca7a21
      media_content_type: image/jpeg
      metadata:
        title: Hintergund.jpg
        thumbnail: /api/image/serve/f15a5ff16a39533008ac2f410fca7a21/256x256
        media_class: image
        navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://image_upload
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Termine
      heading_style: title
    - type: weather-forecast
      entity: weather.touchmonitor_home
      forecast_type: daily
      show_forecast: true
      grid_options:
        columns: full
    - type: calendar
      initial_view: listWeek
      entities:
      - calendar.termine
      - calendar.privat_mit_buchung
      - calendar.holidu
      - calendar.geburtstage
      grid_options:
        columns: full
        rows: 6
  - type: grid
    cards:
    - type: heading
      heading: Einkaufsliste
      heading_style: title
    - type: todo-list
      entity: todo.einkaufsliste
      hide_create: true
      display_order: none
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Schnellzugriff
      heading_style: title
    - type: tile
      entity: switch.shelly1g4_a085e3bd629c
      name: Hoftor
      icon: mdi:gate
      tap_action:
        action: toggle
      grid_options:
        columns: full
        rows: 2
      vertical: true
    - type: button
      name: Alle Lichter aus
      icon: mdi:lightbulb-group-off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: all
        confirmation:
          text: Wirklich alle Lichter ausschalten?
      grid_options:
        columns: full
        rows: 2
    - type: button
      name: Licht
      icon: mdi:lightbulb
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/licht
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Kalender
      icon: mdi:calendar-month
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /flur-display/kalender-buchungen
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Amazon-Bestellungen
      icon: mdi:package-variant
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.amazon_auf_monitor
      grid_options:
        columns: full
        rows: 2
