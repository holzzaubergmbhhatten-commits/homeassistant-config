# Dashboard "Flur" (Touchmonitor) im Apple-Stil – wird aus GitHub eingespielt.
# Adresse: /flur-display/start   Änderungen bitte im Repository, nicht in der Oberfläche.
# Termine landen im lokalen Kalender "Geburtstage" (calendar.geburtstage).

views:
- title: Zuhause
  path: start
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    # Nachricht von Jarvis / Telegram ("Schreib auf den Monitor: …"), verschwindet von selbst
    - type: conditional
      grid_options:
        columns: full
      conditions:
      - condition: state
        entity: input_text.flur_nachricht
        state_not: ''
      - condition: state
        entity: input_text.flur_nachricht
        state_not: unknown
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: |-
            ## <ha-icon icon="mdi:message-text"></ha-icon> {{ states('input_text.flur_nachricht') }}
            <font color="#8E8E93">{{ (states.input_text.flur_nachricht.last_changed | as_local).strftime('%H:%M') }} Uhr</font>
        - type: button
          name: Nachricht ausblenden
          icon: mdi:close-circle-outline
          show_state: false
          icon_height: 28px
          tap_action:
            action: perform-action
            perform_action: script.jarvis_monitor_nachricht
            data:
              text: ''
    # Uhrzeit und Datum klein statt der großen Kopfzeile (Platz sparen)
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: >-
        ### {{ now().strftime('%H:%M') }} <font color="#8E8E93">· {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}, {{ now().day }}. {{ ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month-1] }}</font>
      heading_style: title
    - type: weather-forecast
      entity: weather.touchmonitor_home
      forecast_type: daily
      show_forecast: true
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set t = state_attr('sensor.termine_vorschau', 'familie') or [] %}
        {% set heute = now().date() %}
        {% set tage = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
        {% for name, versatz, farbe in [('Heute', 0, '#FF3B30'), ('Morgen', 1, '#007AFF'), ('Übermorgen', 2, '#007AFF')] %}
        {%- set d = heute + timedelta(days=versatz) %}
        {%- set ns2 = namespace(l=[]) %}
        {%- for e in t %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        {%- if sd <= d and (ed > d or sd == d) %}{% set ns2.l = ns2.l + [e] %}{% endif %}
        {%- endfor %}
        ### <font color="{{ farbe }}">{{ name }}</font> <font color="#8E8E93">{{ tage[d.weekday()] }} {{ d.strftime('%d.%m.') }}</font>
        {% if ns2.l %}
        {%- for e in ns2.l %}{{ '<br>' if not loop.first }}<font color="{{ farbe }}">●</font> <b>{{ e.titel }}</b>{{ ' · ' ~ as_datetime(e.start).strftime('%H:%M') ~ ' Uhr' if 'T' in (e.start | string) else '' }}{% endfor %}
        {%- else %}
        <font color="#8E8E93">Nichts geplant</font>
        {%- endif %}

        {% endfor %}
        {%- set ns = namespace(spaeter=[]) %}
        {%- for e in t %}{% if as_datetime(e.start).date() > heute + timedelta(days=2) %}{% set ns.spaeter = ns.spaeter + [e] %}{% endif %}{% endfor %}
        {%- if ns.spaeter %}
        ### Demnächst
        {% for e in ns.spaeter[:6] %}
        {%- set sd = as_datetime(e.start) %}{{ '<br>' if not loop.first }}<font color="#8E8E93">●</font> <b>{{ e.titel }}</b> · {{ tage[sd.weekday()] }} {{ sd.strftime('%d.%m.') }}{{ ' · ' ~ sd.strftime('%H:%M') ~ ' Uhr' if 'T' in (e.start | string) else '' }}
        {%- endfor %}
        {%- endif %}
    # Garten-To-dos aus Pflanzplan + Wetter (sensor.garten_aufgaben, packages/garten.yaml) – Tippen öffnet den Garten
    - type: heading
      heading: Garten heute
      heading_style: title
      icon: mdi:sprout
      tap_action:
        action: navigate
        navigation_path: /flur-display/garten
      # Fragen oder "erledigt" melden: öffnet auf der Garten-Seite gleich den Reiter "Fragen"
      badges:
      - type: entity
        entity: sensor.knopf_claude_fragen
        show_icon: true
        show_state: true
        color: green
        tap_action:
          action: navigate
          navigation_path: /flur-display/garten#fragen
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set a = state_attr('sensor.garten_aufgaben', 'aufgaben') or [] %}
        {% set b = state_attr('sensor.garten_aufgaben', 'bald') or [] %}
        {% for t in a %}
        {{ '<br>' if not loop.first }}<font color="{{ t.farbe }}"><ha-icon icon="{{ t.icon }}"></ha-icon></font> <b>{{ t.titel }}</b>{{ ' – ' ~ t.kurz if t.kurz }}
        {%- endfor %}
        {%- if not a %}
        <font color="#34C759"><ha-icon icon="mdi:check-circle"></ha-icon></font> <font color="#8E8E93">Heute nichts Besonderes im Garten</font>
        {%- endif %}
        {%- if b %}

        <font color="#8E8E93"><b>Die nächsten Tage</b></font><br>
        {% for t in b %}
        {{ '<br>' if not loop.first }}<font color="#8E8E93"><ha-icon icon="{{ t.icon }}"></ha-icon></font> {{ t.titel }}{{ ' – ' ~ t.kurz if t.kurz }}
        {%- endfor %}
        {%- endif %}
  - type: grid
    cards:
    - type: heading
      heading: Aufgaben
      heading_style: title
      icon: mdi:checkbox-marked-circle-outline
      tap_action:
        action: navigate
        navigation_path: /flur-display/aufgaben
      badges:
      - type: entity
        entity: todo.aufgaben
        show_state: true
        show_icon: false
        color: orange
        tap_action:
          action: navigate
          navigation_path: /flur-display/aufgaben
    # Kompakt: eine Zeile je Aufgabe mit Datum (seit wann sie auf der Liste steht); abhaken im Reiter "Aufgaben"
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set l = state_attr('sensor.aufgaben_liste', 'items') or [] %}
        {% set heute = now().strftime('%Y-%m-%d') %}
        {% set gestern = (now() - timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% set faellig = l | selectattr('faellig', 'ne', '') | selectattr('faellig', 'le', heute) | list %}
        {% set rest = l | reject('in', faellig) | sort(attribute='seit', reverse=true) | list %}
        {% for x in (faellig + rest)[:10] %}
        {%- set d = as_datetime(x.seit, none) %}
        {{ '<br>' if not loop.first }}{% if x in faellig %}<font color="#FF3B30"><ha-icon icon="mdi:alert-circle"></ha-icon></font>{% elif x.seit >= gestern %}<font color="#34C759"><ha-icon icon="mdi:new-box"></ha-icon></font>{% else %}<font color="#8E8E93"><ha-icon icon="mdi:checkbox-blank-outline"></ha-icon></font>{% endif %} {{ x.titel[:60] }}{{ '…' if x.titel | length > 60 }} <font color="#8E8E93">· {{ 'fällig ' ~ x.faellig[8:10] ~ '.' ~ x.faellig[5:7] ~ '.' if x in faellig else ('neu' if x.seit >= gestern else 'seit ' ~ (d.strftime('%d.%m.') if d else x.seit)) }}</font>
        {%- endfor %}
        {%- if l | count > 10 %}<br><font color="#8E8E93">+ {{ l | count - 10 }} weitere</font>{% endif %}
        {%- if not l %}<font color="#34C759"><ha-icon icon="mdi:check-circle"></ha-icon></font> <font color="#8E8E93">Alles erledigt</font>{% endif %}
    - type: heading
      heading: Ferienwohnung & Stellplätze
      heading_style: title
      badges:
      - type: entity
        entity: sensor.knopf_stellplaetze
        show_icon: true
        show_state: true
        tap_action:
          action: perform-action
          perform_action: script.stellplaetze_verwalten
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set b = state_attr('sensor.termine_vorschau', 'buchungen') or [] %}
        {% set heute = now().date() %}
        {% set tage = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
        {% set fw_kal = ['calendar.holidu', 'calendar.privat_mit_buchung'] %}
        {% set ns = namespace(fw=[], fw_keys=[], sp=[], hat_sp=false) %}
        {% set ns.hat_sp = states.calendar | selectattr('entity_id', 'search', 'stellpl') | list | count > 0
           or (state_attr('sensor.termine_vorschau', 'stellplatz_status') or '') is match('ok') %}
        {# Anreisetage bei Holidu = Ferienwohnung (Abreisetag zählen Holidu und Portal unterschiedlich) #}
        {% set ns_h = namespace(keys=[]) %}
        {% for e in b if e.kalender == 'calendar.holidu' %}{% set ns_h.keys = ns_h.keys + [(e.start | string)[:10]] %}{% endfor %}
        {# Portal-Kalender (export-ical-ferienwohnung.php) = nur Ferienwohnung; bei gleicher Anreise wie Holidu gilt der Holidu-Eintrag (mit Gästenamen) #}
        {% for e in b if e.kalender == 'calendar.privat_mit_buchung' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns_h.keys %}{% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% for e in b if e.kalender == 'calendar.holidu' %}
          {% set key = (e.start | string)[:10] %}
          {% if key not in ns.fw_keys %}{% set ns.fw = ns.fw + [e] %}{% set ns.fw_keys = ns.fw_keys + [key] %}{% endif %}
        {% endfor %}
        {% for e in b if 'stellpl' in e.kalender %}{% set ns.sp = ns.sp + [e] %}{% endfor %}
        {% for bereich, symbol, liste in [('Ferienwohnung', 'mdi:home-heart', ns.fw | sort(attribute='start')), ('Stellplätze', 'mdi:rv-truck', ns.sp | sort(attribute='start'))] %}
        {%- set ns2 = namespace(aktuell=[], naechste=[]) %}
        {%- for e in liste %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        {%- if sd <= heute and ed > heute %}{% set ns2.aktuell = ns2.aktuell + [e] %}
        {%- elif sd > heute %}{% set ns2.naechste = ns2.naechste + [e] %}{% endif %}
        {%- endfor %}
        <ha-icon icon="{{ symbol }}"></ha-icon> **{{ bereich }}**
        {%- if bereich == 'Stellplätze' and not ns.hat_sp %}
        - <font color="#8E8E93">Stellplatz-Daten nicht erreichbar ({{ state_attr('sensor.termine_vorschau', 'stellplatz_status') or '?' }})</font>
        {%- else %}
        {%- for e in ns2.aktuell %}
        {%- set ed = as_datetime(e.ende).date() %}
        - <font color="#FF453A">●</font> **Belegt** bis {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.aktuell | count == 0 %}
        - <font color="#30D158">●</font> **Heute frei**
        {%- endif %}
        {%- for e in ns2.naechste[:2] %}
        {%- set sd = as_datetime(e.start).date() %}
        {%- set ed = as_datetime(e.ende).date() %}
        - {{ 'Nächste Anreise' if loop.first else 'Danach' }}: {{ tage[sd.weekday()] }} {{ sd.strftime('%d.%m.') }} – {{ tage[ed.weekday()] }} {{ ed.strftime('%d.%m.') }} · {{ e.titel }}
        {%- endfor %}
        {%- if ns2.naechste | count == 0 %}
        - keine weiteren Buchungen
        {%- endif %}
        {%- endif %}

        {% endfor %}
    - type: heading
      heading: Einkaufsliste
      heading_style: title
      icon: mdi:cart
      tap_action:
        action: navigate
