# Dashboard "Flur" (Touchmonitor) im Apple-Stil – wird aus GitHub eingespielt.
# Adresse: /flur-display/start   Änderungen bitte im Repository, nicht in der Oberfläche.
# Termine landen im lokalen Kalender "Geburtstage" (calendar.geburtstage).

views:
- title: Zuhause
  path: start
  icon: mdi:home
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: weather.touchmonitor_home
    show_name: false
    show_state: true
    show_icon: true
    state_content:
    - state
    - temperature
  - type: entity
    entity: sensor.lichter_an
    name: Lichter an
    show_name: true
    show_state: true
    show_icon: true
    color: amber
    tap_action:
      action: navigate
      navigation_path: /flur-display/licht
  - type: entity
    entity: switch.shelly1g4_a085e3bd629c
    name: Hoftor
    show_name: true
    show_state: true
    icon: mdi:gate
  header:
    card:
      type: markdown
      text_only: true
      content: '# Zuhause

        {{ now().strftime(''%H:%M'') }} · {{ [''Montag'',''Dienstag'',''Mittwoch'',''Donnerstag'',''Freitag'',''Samstag'',''Sonntag''][now().weekday()]
        }}, {{ now().day }}. {{ [''Januar'',''Februar'',''März'',''April'',''Mai'',''Juni'',''Juli'',''August'',''September'',''Oktober'',''November'',''Dezember''][now().month-1]
        }}'
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Termine
      heading_style: title
    - type: weather-forecast
      entity: weather.touchmonitor_home
      forecast_type: daily
      show_forecast: true
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '{% set t = state_attr(''sensor.termine_vorschau'', ''familie'') or [] %}

        {% set heute = now().date() %}

        {% set tage = [''Mo'',''Di'',''Mi'',''Do'',''Fr'',''Sa'',''So''] %}

        {% set ns = namespace(spaeter=[]) %}

        {% for name, versatz in [(''Heute'', 0), (''Morgen'', 1), (''Übermorgen'', 2)] %}

        {%- set d = heute + timedelta(days=versatz) %}

        **{{ name }}** · {{ tage[d.weekday()] }} {{ d.strftime(''%d.%m.'') }}

        {%- set ns2 = namespace(n=0) %}

        {%- for e in t %}

        {%- set sd = as_datetime(e.start).date() %}

        {%- set ed = as_datetime(e.ende).date() %}

        {%- if sd <= d and (ed > d or sd == d) %}

        {%- set ns2.n = ns2.n + 1 %}

        - {{ as_datetime(e.start).strftime(''%H:%M'') ~ '' · '' if ''T'' in (e.start | string) else '''' }}{{ e.titel }}

        {%- endif %}

        {%- endfor %}

        {%- if ns2.n == 0 %}

        - <font color="#8E8E93">nichts geplant</font>

        {%- endif %}


        {% endfor %}

        {%- for e in t %}

        {%- set sd = as_datetime(e.start).date() %}

        {%- if sd > heute + timedelta(days=2) %}{% set ns.spaeter = ns.spaeter + [e] %}{% endif %}

        {%- endfor %}

        {%- if ns.spaeter | count > 0 %}

        **Demnächst**

        {%- for e in ns.spaeter[:5] %}

        {%- set d = as_datetime(e.start) %}

        - {{ tage[d.weekday()] }} {{ d.strftime(''%d.%m.'') }}{{ '' · '' ~ d.strftime(''%H:%M'') if ''T'' in (e.start | string)
        else '''' }} · {{ e.titel }}

        {%- endfor %}

        {%- endif %}

        '
  - type: grid
    cards:
    - type: heading
      heading: Ferienwohnung & Stellplätze
      heading_style: title
    - type: markdown
      grid_options:
        columns: full
      content: '{% set b = state_attr(''sensor.termine_vorschau'', ''buchungen'') or [] %}

        {% set heute = now().date() %}

        {% set tage = [''Mo'',''Di'',''Mi'',''Do'',''Fr'',''Sa'',''So''] %}

        {% for bereich, symbol, kal in [(''Ferienwohnung'', ''mdi:home-heart'', ''calendar.holidu''), (''Stellplätze'', ''mdi:rv-truck'',
        ''calendar.privat_mit_buchung'')] %}

        {%- set ns = namespace(aktuell=[], naechste=[]) %}

        {%- for e in b %}

        {%- if e.kalender == kal %}

        {%- set sd = as_datetime(e.start).date() %}

        {%- set ed = as_datetime(e.ende).date() %}

        {%- if sd <= heute and ed > heute %}{% set ns.aktuell = ns.aktuell + [e] %}

        {%- elif sd > heute %}{% set ns.naechste = ns.naechste + [e] %}{% endif %}

        {%- endif %}

        {%- endfor %}

        <ha-icon icon="{{ symbol }}"></ha-icon> **{{ bereich }}**

        {%- for e in ns.aktuell %}

        {%- set ed = as_datetime(e.ende).date() %}

        - <font color="#FF453A">●</font> **Belegt** bis {{ tage[ed.weekday()] }} {{ ed.strftime(''%d.%m.'') }} · {{ e.titel
        }}

        {%- endfor %}

        {%- if ns.aktuell | count == 0 %}

        - <font color="#30D158">●</font> **Heute frei**

        {%- endif %}

        {%- for e in ns.naechste[:2] %}

        {%- set sd = as_datetime(e.start).date() %}

        {%- set ed = as_datetime(e.ende).date() %}

        - {{ ''Nächste Anreise'' if loop.first else ''Danach'' }}: {{ tage[sd.weekday()] }} {{ sd.strftime(''%d.%m.'') }}
        – {{ tage[ed.weekday()] }} {{ ed.strftime(''%d.%m.'') }} · {{ e.titel }}

        {%- endfor %}

        {%- if ns.naechste | count == 0 %}

        - keine weiteren Buchungen

        {%- endif %}


        {% endfor %}

        '
