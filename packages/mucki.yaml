# Muckis Seite auf dem Flur-Monitor (www/mucki.html, im Dashboard als Vollbild eingebettet):
# links der Stundenplan (änderbar), rechts die Taschengeld-Tafel mit 6 Feldern.
# Stundenplan und Aufgaben-Magnete liegen lokal in /config/www/mucki_daten.json (nicht im Repository).
# Die 6 Felder der Woche stehen in input_text.mucki_felder (Aufgaben mit | getrennt),
# damit Monitor, Handy und Laptop immer dasselbe zeigen.
input_text:
  mucki_felder:
    name: Mucki – erledigte Aufgaben diese Woche
    icon: mdi:piggy-bank
    max: 255
  # Lern-Challenge der Woche: "2026-W41:101|110" (Rechnen, Lesen, Schreiben – 1 = geschafft | gelöste Rechenaufgaben)
  mucki_lernen:
    name: Mucki – Lernaufgaben diese Woche
    icon: mdi:school
    max: 40

shell_command:
  mucki_schreiben: python3 /config/claude_tools/mucki_speichern.py {{ b64 }}
  mucki_verlauf: python3 /config/claude_tools/mucki_verlauf.py {{ b64 }}
  mucki_ergebnis: python3 /config/claude_tools/mucki_ergebnis.py {{ b64 }}

script:
  mucki_speichern:
    alias: Muckis Seite speichern
    mode: queued
    fields:
      daten:
        description: Inhalt als JSON-Text
    sequence:
      - action: shell_command.mucki_schreiben
        data:
          # schon hier kodieren – sonst würde Home Assistant den JSON-Text in ein Objekt umwandeln
          b64: "{{ (daten if daten is string else (daten | to_json)) | base64_encode }}"
        response_variable: ergebnis
      - if: "{{ not (ergebnis.stdout | default('') | trim).startswith('ok') }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: mucki
              title: Muckis Seite speichern
              message: "{{ ergebnis.stdout | default('keine Antwort') }}"

  # Woche abschließen: erledigte Aufgaben mit Kalenderwoche in den Verlauf (mucki_verlauf.json), Felder leeren.
  # Läuft über den Knopf "Neue Woche" und automatisch montags um 0:05 (für die Vorwoche).
  mucki_woche_abschliessen:
    alias: "Mucki: Woche abschließen (Verlauf speichern, Felder leeren)"
    icon: mdi:calendar-check
    mode: queued
    fields:
      woche:
        description: Kalenderwoche wie 2026-W40 (Standard diese Woche)
    sequence:
      - variables:
          kw: "{{ woche if (woche | default('', true) | string) is match('^\\d{4}-W\\d{2}$') else now().strftime('%G-W%V') }}"
          aufgaben: >-
            {% set v = states('input_text.mucki_felder') %}
            {{ v.split('|') | reject('eq', '') | list if v not in ['', 'unknown', 'unavailable'] else [] }}
          lernen: >-
            {% set v = states('input_text.mucki_lernen') %}
            {{ v.split(':')[1].split('|')[0] | list | select('eq', '1') | list | count if v.startswith(kw ~ ':') else 0 }}
      - if: "{{ aufgaben | count > 0 or lernen | int(0) > 0 }}"
        then:
          - action: shell_command.mucki_verlauf
            data:
              b64: "{{ {'woche': kw, 'aufgaben': aufgaben, 'lernen': lernen | int(0)} | to_json | base64_encode }}"
            response_variable: ergebnis
          - if: "{{ not (ergebnis.stdout | default('') | trim).startswith('ok') }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: mucki_verlauf
                  title: Muckis Wochen-Verlauf
                  message: "{{ ergebnis.stdout | default('keine Antwort') }}"
              - stop: Verlauf nicht gespeichert – Felder bleiben stehen
      - action: input_text.set_value
        target:
          entity_id: input_text.mucki_felder
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.mucki_lernen
        data:
          value: ""

  mucki_neue_woche:
    alias: "Mucki: neue Woche (Taschengeld-Felder leeren)"
    icon: mdi:delete-sweep
    sequence:
      - action: script.mucki_woche_abschliessen

automation:
  - id: mucki_woche_automatisch
    alias: "Mucki: Woche montags automatisch abschließen"
    triggers:
      - trigger: time
        at: "00:05:00"
    conditions:
      - condition: template
        value_template: "{{ now().weekday() == 0 }}"
    actions:
      - action: script.mucki_woche_abschliessen
        data:
          woche: "{{ (now() - timedelta(days=1)).strftime('%G-W%V') }}"

  # Sonntag 18:00: Erinnerung ans Taschengeld (Durchsage in Küche und Muckis Zimmer + Monitor).
  # Alles geschafft (6 Felder + 3 Lernaufgaben) → Ergebnis per Telegram an die Familie teilen + Jubel-Durchsage.
  - id: mucki_taschengeld_erinnerung
    alias: "Mucki: Erinnerung Taschengeld sonntags 18 Uhr"
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: template
        value_template: "{{ now().weekday() == 6 }}"
    actions:
      - variables:
          kw: "{{ now().strftime('%G-W%V') }}"
          felder: >-
            {% set v = states('input_text.mucki_felder') %}
            {{ v.split('|') | reject('eq', '') | list if v not in ['', 'unknown', 'unavailable'] else [] }}
          lern: >-
            {% set v = states('input_text.mucki_lernen') %}
            {{ v.split(':')[1].split('|')[0] | list | select('eq', '1') | list | count if v.startswith(now().strftime('%G-W%V') ~ ':') else 0 }}
      - action: shell_command.mucki_ergebnis
        continue_on_error: true
        data:
          b64: "{{ {'woche': kw, 'felder': felder, 'lernen': lern | int(0)} | to_json | base64_encode }}"
        response_variable: rechnung
      - variables:
          r: "{{ (rechnung.stdout | from_json) if rechnung is defined and rechnung is mapping and (rechnung.stdout | default('')).startswith('{') else {} }}"
          betrag: "{{ '%.2f' | format(r.gesamt | default(0) | float) | replace('.', ',') }}"
          alles: "{{ r.alles | default(false) }}"
      - if: "{{ alles }}"
        then:
          - repeat:
              for_each: >-
                {{ (states('input_text.telegram_empfaenger') | string).split(';')
                   | reject('in', ['', 'unknown', 'unavailable']) | list }}
              sequence:
                - action: telegram_bot.send_message
                  continue_on_error: true
                  data:
                    chat_id: "{{ repeat.item | int }}"
                    message: >-
                      🏆 Mucki hat diese Woche (KW {{ kw[-2:] | int }}) ALLES geschafft!
                      ✅ 6 von 6 Haushaltsaufgaben: {{ felder | join(', ') }}
                      📚 Lern-Challenge: 3 von 3
                      {%- if r.bonus | default(0) | float > 0 %}
                      🎁 Dazu der Bonus für 2 Wochen hintereinander!{% endif %}
                      💰 Taschengeld diese Woche: {{ betrag }} €
          - action: script.jarvis_durchsage
            continue_on_error: true
            data:
              raeume: Küche, Muckis Zimmer
              text: >-
                Achtung, Achtung! Mucki hat diese Woche alles geschafft: alle sechs Haushaltsaufgaben und die Lern-Challenge.
                Das gibt {{ betrag | replace(',00', '') }} Euro Taschengeld. Herzlichen Glückwunsch, Mucki!
        else:
          - action: script.jarvis_durchsage
            continue_on_error: true
            data:
              raeume: Küche, Muckis Zimmer
              text: >-
                Taschengeld-Zeit! Mucki hat diese Woche {{ felder | count }} von 6 Haushaltsaufgaben
                und {{ lern }} von 3 Lernaufgaben geschafft. Das sind {{ betrag | replace(',00', '') }} Euro.
      - action: script.jarvis_monitor_nachricht
        continue_on_error: true
        data:
          text: >-
            Taschengeld-Zeit! Mucki: {{ felder | count }} von 6 Aufgaben, {{ lern }} von 3 Lernaufgaben – {{ betrag }} €{{ ' – alles geschafft!' if alles else '' }}
          minuten: 120
