# Digitale Akte (claude_tools/akte.py): Belege, Arztrechnungen, Versicherungen, Verträge, Bescheide per Telegram ablegen.
# - PDF an den Bot → Akte. Foto mit Text "Beleg"/"Akte" → Akte; "+"/"weiter"/"Seite 2" → weitere Seite zum letzten Beleg.
#   Fotos ohne solchen Text erkennt packages/eingang.yaml (Rechnung & Co. → hierher, Pflanze → Garten, Haus → Eingang).
# - Text: "Akte <Frage>", "Steuer 2026", "Einreichen", "Eingereicht [1 3]", "Fristen", "Akte Hilfe".
# - "Mach bitte ein Schreiben für die Kündigung …" → Brief (PDF + Word); "Schick Mirka: …" / "Sag Mirka, dass …" → Nachricht weiterleiten.
# - Mehrere Belege → ein Vorgang (Kostenaufstellung mit Summe, ein PDF mit allen Belegen): Fotos als Album schicken und zum
#   ersten "gehören zusammen, bitte Kostenaufstellung" schreiben – oder danach "Die gehören alle zusammen …".
# - Ohne Telegram: Dateien in Home Assistant → Medien → Lokale Medien → Ordner "Akte-Eingang" hochladen.
# - Notizen ("ist bezahlt") per Telegram oder am Monitor; Mahnungen werden mit der Rechnung abgeglichen;
#   sonntags prüft Claude die ganze Akte und meldet Auffälliges.
# - Erinnerungen: Fristen eine Woche vorher (täglich geprüft), offene Arztrechnungen am Monatsanfang.
# Ablage nur lokal: /config/akte_ablage (PDFs, damit in jedem Backup), /config/akte.json (Verzeichnis). Die Arbeit läuft im Hintergrund weiter und
# antwortet selbst per Telegram (Home Assistant wartet nur 60 Sekunden auf einen Befehl).
input_text:
  # Schlüssel für das Haus-Handbuch (GitHub, nur Schreibrecht auf das Repository „webseiten“) – trägt Marco selbst ein,
  # er steht nur hier in Home Assistant, nie im Repository. Gebraucht für „📖 Ja, ins Haus-Handbuch“.
  github_handbuch_schluessel:
    name: GitHub-Schlüssel Haus-Handbuch
    mode: password
    max: 255
    icon: mdi:key-variant

shell_command:
  akte: python3 /config/claude_tools/akte.py {{ aktion }} {{ wert }}
  anleitung_handbuch: python3 /config/claude_tools/anleitung_handbuch.py {{ wert }}
  # Hochladen über die Akte-Seite: ein Stück der Datei (Base64, in Argumente zu je 100 000 Zeichen geteilt)
  akte_stueck: python3 /config/claude_tools/akte.py stueck {{ kennung }} {{ teil }} {{ name }} {{ letzt }} {{ daten }}

automation:
  # Knopf „📖 Ja, ins Haus-Handbuch“ (kommt von der Akte, wenn ein Dokument eine Bedienungsanleitung ist)
  - id: akte_anleitung_ins_handbuch
    alias: "Akte: Anleitung ins Haus-Handbuch"
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
    conditions:
      - condition: template
        value_template: "{{ (trigger.event.data.data | default('')).startswith('/anl_') }}"
    actions:
      - variables:
          ja: "{{ trigger.event.data.data.startswith('/anl_ja_') }}"
          kennung: "{{ trigger.event.data.data[8:] | regex_replace('[^A-Za-z0-9_-]', '') }}"
          schluessel: "{{ states('input_text.github_handbuch_schluessel') | string }}"
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "{{ 'Kommt ins Handbuch …' if ja else 'OK' }}"
      - if: "{{ not ja }}"
        then:
          - action: telegram_bot.edit_replymarkup
            continue_on_error: true
            data:
              config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
              chat_id: "{{ trigger.event.data.chat_id }}"
              message_id: "{{ trigger.event.data.message.message_id }}"
              inline_keyboard: []
          - stop: Nein gedrückt
      - action: shell_command.anleitung_handbuch
        continue_on_error: true
        data:
          wert: >-
            {{ {'id': kennung, 'schluessel': schluessel if schluessel not in ['unknown', 'unavailable'] else '',
                'von': trigger.event.data.from_first | default('', true)} | to_json | base64_encode }}
        response_variable: roh
      - variables:
          a: >-
            {% set t = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ t | from_json if (t | string).startswith('{') else {'ok': false, 'fehler': t or 'keine Antwort'} }}
      # Knopf erst weg, wenn es geklappt hat (fehlt der Schlüssel noch, kann man danach nochmal drücken)
      - if: "{{ a.ok | default(false) }}"
        then:
          - action: telegram_bot.edit_replymarkup
            continue_on_error: true
            data:
              config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
              chat_id: "{{ trigger.event.data.chat_id }}"
              message_id: "{{ trigger.event.data.message.message_id }}"
              inline_keyboard: []
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          chat_id: "{{ trigger.event.data.chat_id }}"
          message: >-
            {% if a.schon | default(false) %}📖 „{{ a.name }}“ ist schon im Haus-Handbuch (gehört zum selben Dokument).
            {%- elif a.ok | default(false) %}📖 „{{ a.name }}“ ist unterwegs ins Haus-Handbuch – in etwa 5 Minuten unter „📄 Anleitungen“
            {{- ' (neu angelegt unter „Sonstiges“)' if a.neu else ' und beim Gerät' }}.
            {%- elif a.fehler == 'kein_schluessel' %}📖 Dafür fehlt einmalig der GitHub-Schlüssel. So geht's (5 Minuten, nur einmal):
            {{ '\n' }}1. Am Laptop auf github.com anmelden → oben rechts Profilbild → Settings → ganz unten „Developer settings“
            → „Personal access tokens“ → „Fine-grained tokens“ → „Generate new token“.
            {{ '\n' }}2. Name: Home Assistant Handbuch · Ablauf: 1 Jahr · Repository access: „Only select repositories“ → webseiten
            · Permissions → Repository → Contents: „Read and write“ → „Generate token“.
            {{ '\n' }}3. Den Schlüssel kopieren (nur jetzt sichtbar) und in Home Assistant eintragen: Einstellungen → Geräte & Dienste
            → Helfer → „GitHub-Schlüssel Haus-Handbuch“ → einfügen → Aktualisieren.
            {{ '\n' }}4. Dann oben nochmal auf „📖 Ja, ins Haus-Handbuch“ tippen.
            {{ '\n' }}Den Schlüssel bitte nirgends sonst hinschicken.
            {%- else %}⚠️ Ins Handbuch ging nicht: {{ a.fehler | default('?') }} – an Claude weiterleiten.{% endif %}

  # Nebenkosten Nadorster Str.: Zähler jedes Jahr zum Ende des Abrechnungszeitraums (31.10.) ablesen –
  # eine Woche vorher als Aufgabe + Telegram, am Stichtag nochmal per Telegram
  - id: nebenkosten_zaehler_ablesen
    alias: "Nebenkosten: Zähler Nadorster Str. ablesen (Stichtag 31.10.)"
    triggers:
      - trigger: time
        at: "09:05:00"
    conditions:
      - condition: template
        value_template: "{{ now().month == 10 and now().day in [24, 31] }}"
    actions:
      - if: "{{ now().day == 24 }}"
        then:
          - action: todo.add_item
            continue_on_error: true
            target:
              entity_id: todo.aufgaben
            data:
              item: "Zähler Nadorster Str. ablesen (Stichtag 31.10.)"
              due_date: "{{ now().strftime('%Y') }}-10-31"
              description: "Alle Zähler fotografieren (Nummer + Stand gut lesbar): Gas, Hauptwasser, 3× Kaltwasser, 2× Warmwasser, 3 Wärmezähler, Strom Allgemein. Fotos in der Akte unter Nebenkosten → Zählerfoto hochladen."
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
          message: >-
            {{ '🔢 In einer Woche (31.10.) Zähler in der Nadorster Str. ablesen' if now().day == 24 else '🔢 Heute Stichtag: Zähler in der Nadorster Str. ablesen' }}
            – alle Zähler fotografieren (Nummer und Stand lesbar) und in der Akte unter 🧾 Nebenkosten → 📷 Zählerfoto hochladen.
            Am besten mit der Mieterin zusammen oder ihr eine Kopie geben.

  - id: telegram_akte_datei
    alias: "Akte: PDF, ZIP oder Beleg-Foto aus Telegram ablegen"
    mode: queued
    max: 200
    triggers:
      - trigger: event
        event_type: telegram_attachment
    conditions:
      - condition: template
        value_template: >-
          {% set m = trigger.event.data.file_mime_type | default('') %}
          {{ m in ['application/pdf', 'application/zip', 'application/x-zip-compressed'] or (m.startswith('image/') and (trigger.event.data.text | default('', true))
             is match('^\s*(\+|beleg|akte|weiter|seite|rückseite|rueckseite|wappen|(fotos?|bilder?|schadensfotos?)\s+(zu|zum|zur|für|fuer|von|vom)\\b|anh(ä|ae)ngen\\b|(an|zu|dran)\s.{0,60}h(ä|ae)ngen\\b)', ignorecase=True)) }}
    actions:
      - variables:
          chat: "{{ trigger.event.data.chat_id }}"
          pdf: "{{ trigger.event.data.file_mime_type | default('') == 'application/pdf' }}"
          zip: "{{ 'zip' in (trigger.event.data.file_mime_type | default('')) }}"
          name: "{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ range(1000, 9999) | random }}.{{ 'pdf' if pdf else 'zip' if zip else 'jpg' }}"
      - action: telegram_bot.download_file
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          file_id: "{{ trigger.event.data.file_id }}"
          directory_path: /media/akte/_eingang
          file_name: "{{ name }}"
      - action: shell_command.akte
        data:
          aktion: neu
          wert: >-
            {{ {'datei': '/media/akte/_eingang/' ~ name, 'chat': chat, 'von': trigger.event.data.from_first | default('', true),
                'text': trigger.event.data.text | default('', true)} | to_json | base64_encode }}
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          chat_id: "{{ chat }}"
          message: "📁 Kommt in die Akte – ich lese den Beleg, einen Moment …"

  - id: telegram_akte_befehl
    alias: "Akte: Fragen und Befehle per Telegram"
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: telegram_text
    conditions:
      # Familien-Mail (Mail an … / Antwort: / Ändern:) beantwortet packages/mail.yaml
      - condition: template
        value_template: >-
          {{ not ((trigger.event.data.text | default('') | string)
             is match('(?is)^\W*(?:[\wäöüß-]+\s+){0,7}?(?:e-?mail|mail)\w*\s+(?:[\wäöüß-]+\s+){0,4}?an\s+<?[^\s@<>]+@[^\s@<>]+\.[a-z]{2,}|^\W*(?:[\wäöüß-]+\s+){0,5}?an\s+<?[^\s@<>]+@[^\s@<>]+\.[a-z]{2,}.{0,40}\\b(?:e-?mail|mail)\\b|^\s*(?:antwort|ändern|aendern)\s*:')) }}
      - condition: template
        # auch "Die gehören alle zusammen, bitte Kosten addieren …" (mehrere Belege → ein Vorgang mit Kostenaufstellung)
        value_template: >-
          {% set t = trigger.event.data.text | default('') | string %}
          {{ not (t is search('einkaufs?(liste|zettel)', ignorecase=True) and not (t is search('(setz|pack|füg|fueg|schreib|trag|tu|nimm|notier)\w*\\b.{0,60}\\b(auf|zur|in)\s+(die\s+|der\s+|den\s+)?einkaufs', ignorecase=True))) and (t is match('^\s*/?(akte|belege?|steuer\s*(20\d\d)?\s*$|einreichen|eingereicht|fristen|schreiben|brief)\\b', ignorecase=True)
             or t is search('(geh(ö|oe)r\w*\s.{0,40}zusammen|kosten\s*-?\s*aufstellung|(belege|rechnungen|quittungen|kosten|fotos|bilder)\\b.{0,60}(zusammen|addier|summier)|zusammen\s*(zu\s*)?(fass|führ|fuehr)\w*\s.{0,40}(pdf|belege?|rechnung)|nicht\s+(mehr\s+)?zusammen|zusammen\s*(zu\s*)?(ge)?(füg|fueg|heft)|auseinander\s*(nehmen|machen)|\\btrennen\\b|(getrennt|einzeln)\s+ablegen)', ignorecase=True)
             or t is match('^\s*(schick|schicke|sende|sag|sage|schreib|schreibe|richte)\s+(?:bitte\s+)?(?:(?:eine?\s+)?(?:kurze\s+)?(?:test[-\s]?)?(?:nachricht|info|mitteilung)\s+)?(?:an\s+)?(?!(?:mir|mich|uns|mal|bitte|ein|eine|einen|was|das|den|die|der|alle|nachricht|testnachricht)\\b)([a-zäöüß]{2,20})(?:\s+bitte)?(?:\s+(?:eine?\s+)?(?:kurze\s+)?(?:test[-\s]?)?(?:nachricht|info|mitteilung)(?:\s+vo[nm]\s+\w+)?)?\s*(?:[:,]|\s+dass\\b|\s+aus\\b|\s+bescheid\\b|$)', ignorecase=True)
             or t is search('\\b(schick|send|weiterleit|leite|erklär|erklaer|teil|richte|zeig)\w*\\b.{0,80}\\b(mirka|marco|mathilda)\\b|\\b(mirka|marco|mathilda)\\b.{0,80}\\b(schick|send|weiterleit|erklär|erklaer|zeig)\w*', ignorecase=True)
             or t is match('^\s*(ich\s+bin|ich\s+hei(ß|ss)e|mein\s+name\s+ist|hier\s+ist)\s+(mirka|marco|mathilda)\s*[.!]?\s*$', ignorecase=True)
             or t is search('\\b(mach|erstell|setz|schreib|formulier|entw[iu]rf|verfass|brauch|bräucht|braeucht)\w*\\b.{0,50}\\b(schreiben|brief|kündigung|kuendigung|widerspruch|antrag|anschreiben|beschwerde)\\b|^\s*(kündigung|kuendigung|widerspruch)\\b', ignorecase=True)) }}
    actions:
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: befehl
          wert: >-
            {{ {'text': trigger.event.data.text, 'chat': trigger.event.data.chat_id, 'von': trigger.event.data.from_first | default('', true),
                'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list}
               | to_json | base64_encode }}

  - id: akte_erinnerungen
    alias: "Akte: Fristen und offene Arztrechnungen erinnern"
    mode: single
    triggers:
      - trigger: time
        at: "08:50:00"
    actions:
      - variables:
          chats: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
               | select('match', '^-?\d+$') | map('int') | list }}
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: erinnerung
          wert: "{{ {'chats': chats, 'art': 'fristen'} | to_json | base64_encode }}"
      - if: "{{ now().day == 1 }}"
        then:
          - delay: 00:00:30
          - action: shell_command.akte
            continue_on_error: true
            data:
              aktion: erinnerung
              wert: "{{ {'chats': chats, 'art': 'einreichen'} | to_json | base64_encode }}"

  # Sonntags: Claude geht die ganze Akte durch (Mahnungen ↔ Rechnungen, offene Zahlungen, Dubletten, Zuordnung)
  - id: akte_durchsicht
    alias: "Akte: wöchentliche Durchsicht"
    mode: single
    triggers:
      - trigger: time
        at: "18:05:00"
    conditions:
      - condition: time
        weekday: sun
    actions:
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: durchsicht
          wert: >-
            {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
                          | select('match', '^-?\d+$') | list} | to_json | base64_encode }}

  # Ohne Telegram: Dateien in Home Assistant → Medien → Lokale Medien → "Akte-Eingang" hochladen, alle 2 Minuten abholen
  - id: akte_ordner_eingang
    alias: "Akte: Ordner Akte-Eingang abholen"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: ordner
          wert: >-
            {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
                          | select('match', '^-?\d+$') | list} | to_json | base64_encode }}

  # Einmalig nach dem Update auf Unterordner: alle (nicht von Hand zugeordneten) Belege neu einsortieren
  - id: akte_einmalig_neu
    alias: "Akte: einmalig neu einsortieren (Unterordner)"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: 00:03:00
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: einmalig_neu
          wert: >-
            {{ {'chats': []} | to_json | base64_encode }}

  # Einmalig nach dem Update: allen Bot-Nutzern per Telegram erklären, was neu ist (danach nie wieder, Merker in /config)
  - id: akte_ankuendigung
    alias: "Akte: Neuigkeit einmalig per Telegram erklären"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: 00:02:00
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: ankuendigen
          wert: >-
            {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
                          | select('match', '^-?\d+$') | list} | to_json | base64_encode }}
      # Einmalig: Mirka die Akte-Neuigkeiten (Kostenaufstellung, Schreiben mit Wappen, Fotos …) erklären
      - delay: 00:00:20
      - action: shell_command.akte
        continue_on_error: true
        data:
          aktion: neuigkeiten
          wert: >-
            {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
                          | select('match', '^-?\d+$') | list} | to_json | base64_encode }}

script:
  akte_aktion:
    alias: "Akte: Liste / ansehen / eingereicht / löschen (Monitor-Seite)"
    mode: queued
    fields:
      was:
        description: liste, lesen (PDF in Stücken), eingereicht, offen, loeschen, notiz, bezahlt oder unbezahlt; nk_… für die Nebenkostenabrechnung
      text:
        description: Notiz zum Beleg bzw. Antwort auf die Rückfrage
      ordner:
        description: bei einer Rückfrage gewählter Ordner
      wer:
        description: Name der angemeldeten Person (für Telegram-Versand an die richtige Person)
      ab:
        description: beim Lesen ab Byte
      id:
        description: Kennung des Eintrags
    sequence:
      - action: shell_command.akte
        data:
          aktion: seite
          wert: >-
            {{ {'was': was if was in ['liste', 'lesen', 'eingereicht', 'offen', 'loeschen', 'notiz', 'bezahlt', 'unbezahlt', 'einstellungen', 'einstellungen_speichern', 'alle_neu', 'antwort', 'ordner_setzen', 'ordner_umbenennen', 'teilen', 'schreiben', 'wappen', 'wappen_lesen', 'nk_lesen', 'nk_speichern', 'nk_neu', 'nk_auswerten', 'nk_zaehler', 'nk_pdf', 'nk_mieter', 'nk_foto', 'verbinden', 'trennen', 'fehler_weg', 'foto_weg', 'aus_eingang', 'eingang_anhaengen', 'brief_weg'] else 'liste',
                'id': id | default('', true), 'ab': ab | default(0) | int(0), 'text': text | default('', true), 'ordner': ordner | default('', true), 'chat': (states('input_text.telegram_empfaenger') | string).split(';') | first | trim,
                'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | list, 'wer': wer | default('', true)} | to_json | base64_encode }}
        response_variable: ergebnis
      # Antwort direkt zurückgeben (über eine Vorlage wären höchstens 256 000 Zeichen möglich)
      - stop: fertig
        response_variable: ergebnis

  # Knopf „📖 Ins Haus-Handbuch“ auf der Akte-Seite (gleicher Weg wie der Telegram-Knopf oben).
  # Klappt es, wird eine offene Rückfrage als beantwortet vermerkt.
  akte_ins_handbuch:
    alias: "Akte: Dokument ins Haus-Handbuch (Akte-Seite)"
    mode: queued
    fields:
      id:
        description: Kennung des Akte-Eintrags
    sequence:
      - variables:
          schluessel: "{{ states('input_text.github_handbuch_schluessel') | string }}"
      - action: shell_command.anleitung_handbuch
        continue_on_error: true
        data:
          wert: >-
            {{ {'id': id | default('', true) | regex_replace('[^A-Za-z0-9_-]', ''),
                'schluessel': schluessel if schluessel not in ['unknown', 'unavailable'] else '',
                'von': 'der Akte-Seite'} | to_json | base64_encode }}
        response_variable: roh
      - variables:
          a: >-
            {% set t = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ t | from_json if (t | string).startswith('{') else {'ok': false, 'fehler': t or 'keine Antwort'} }}
      - if: "{{ a.ok | default(false) }}"
        then:
          - action: script.akte_aktion
            continue_on_error: true
            data:
              was: antwort
              id: "{{ id }}"
              text: "📖 ins Haus-Handbuch übernommen"
      - stop: fertig
        response_variable: a

  akte_hochladen:
    alias: "Akte: Datei von der Akte-Seite hochladen (in Stücken)"
    mode: queued
    max: 50
    fields:
      kennung:
        description: zufällige Kennung der Datei (a–z, 0–9)
      teil:
        description: Nummer des Stücks (0, 1, 2 …)
      name:
        description: Dateiname (Base64, URL-sicher)
      letzt:
        description: true beim letzten Stück
      daten:
        description: Base64-Stück (höchstens 200 000 Zeichen – Vorlagen in Home Assistant dürfen nicht länger als 256 000 Zeichen werden)
    sequence:
      - action: shell_command.akte_stueck
        data:
          kennung: "{{ kennung | regex_replace('[^a-z0-9]', '') }}"
          teil: "{{ teil | int(0) }}"
          name: "{{ name | regex_replace('[^A-Za-z0-9_-]', '') }}"
          letzt: "{{ 1 if letzt | default(false) else 0 }}"
          daten: >-
            {% set s = daten | regex_replace('[^A-Za-z0-9+/=]', '') %}{% for i in range(0, s | length, 100000) %}{{ s[i:i + 100000] }} {% endfor %}
        response_variable: ergebnis
      # fertig zusammengesetzt → gleich abholen (antwortet per Telegram)
      - if: "{{ letzt | default(false) and '\"fertig\": true' in (ergebnis.stdout | default('')) }}"
        then:
          - action: shell_command.akte
            continue_on_error: true
            data:
              aktion: ordner
              wert: >-
                {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim')
                              | select('match', '^-?\d+$') | list} | to_json | base64_encode }}
      # Antwort direkt zurückgeben (über eine Vorlage wären höchstens 256 000 Zeichen möglich)
      - stop: fertig
        response_variable: ergebnis
