# Live-Bilder der Tapo-Kameras auf dem Touchmonitor.
# Der Browser auf dem Monitor kann kein Live-Video (WebRTC/HLS), aber "MJPEG"
# (laufende Einzelbilder). Das Zusatzprogramm go2rtc (App a889bffc_go2rtc) wandelt
# die Kamerastreams dafür um. Seine Kamera-Liste /config/go2rtc.yaml erzeugt
# claude_tools/go2rtc_einrichten.py aus den Home-Assistant-Kameras (Passwörter
# bleiben lokal, nicht im Repository).
shell_command:
  go2rtc_einrichten: python3 /config/claude_tools/go2rtc_einrichten.py
  go2rtc_passwort: python3 /config/claude_tools/go2rtc_einrichten.py --passwort
  kamera_check: python3 /config/claude_tools/kamera_check.py
  # Verrutschte Kamera-Adressen selbst reparieren (claude_tools/kamera_retten.py) – läuft im Hintergrund,
  # weil es länger als die 60 Sekunden dauern kann, die Home Assistant einem Befehl gibt
  kamera_retten_start: nohup python3 /config/claude_tools/kamera_retten.py > /config/.kamera_retten.json 2>&1 &
  kamera_retten_lesen: cat /config/.kamera_retten.json
  kamera_drehen_befehl: python3 /config/claude_tools/kamera_drehen.py {{ kamera }} {{ richtung }}
  # aktuelles Einzelbild über go2rtc (zuverlässiger als camera.snapshot der Generic-Kameras, die alte Bilder liefern können)
  kamera_foto: python3 /config/claude_tools/kamera_foto.py {{ stream }} {{ datei }}

# Pfeil-Knöpfe in der Großansicht: Tapo-Kamera schwenken/neigen (ONVIF, siehe claude_tools/kamera_drehen.py)
script:
  kamera_drehen:
    alias: Kamera drehen
    mode: queued
    max: 5
    fields:
      kamera:
        description: Entitäts-ID ohne "camera.", z. B. draussen_hof_hinten
        example: draussen_hof_hinten
      richtung:
        description: links, rechts, hoch oder runter
        example: links
    sequence:
      - action: shell_command.kamera_drehen_befehl
        continue_on_error: true
        data:
          kamera: "{{ kamera | regex_replace('[^a-z0-9_]', '') }}"
          richtung: "{{ richtung if richtung in ['links', 'rechts', 'hoch', 'runter'] else 'links' }}"
        response_variable: ergebnis
      - if: "{{ ergebnis is not defined or (ergebnis.stdout | default('') | trim) != 'ok' }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: kamera_drehen
              title: Kamera drehen
              message: "{{ kamera }} {{ richtung }}: {{ ergebnis.stdout if ergebnis is defined else 'keine Antwort' }}"

automation:
  - id: go2rtc_kameras_einrichten
    alias: "Kameras: go2rtc-Kameraliste aktuell halten"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "04:10:00"
      # neu in der go2rtc-Oberfläche hinzugefügte Ring-Klingel schnell übernehmen
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - delay: 20
      - action: shell_command.go2rtc_einrichten
        continue_on_error: true
        response_variable: ergebnis
      - if: "{{ ergebnis is defined and (ergebnis.stdout | default('') | trim) == 'geändert' }}"
        then:
          - action: hassio.app_restart
            continue_on_error: true
            data:
              app: a889bffc_go2rtc

  # Selbsttest nach dem Start und jeden Morgen: alle Kameras einzeln prüfen; nur bei Problemen Bericht
  # (ohne Passwörter) per Telegram an den ersten Empfänger und als Benachrichtigung in Home Assistant
  - id: kamera_selbsttest
    alias: "Kameras: Selbsttest melden"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time
        at: "07:20:00"
    actions:
      - delay: "{{ 90 if trigger.id == 'start' else 0 }}"
      - action: shell_command.kamera_check
        continue_on_error: true
        response_variable: bericht
      - variables:
          text: >-
            {{ bericht.stdout if bericht is defined and bericht is mapping else 'kein Ergebnis' }}
            | Stellplätze: {{ state_attr('sensor.termine_vorschau', 'stellplatz_status') or '?' }}
      # Nur melden, wenn etwas nicht stimmt
      - condition: template
        value_template: >-
          {{ text is search('FEHLER|\\(0 Bytes\\)|nicht erreichbar|fehlt|kaputt|KEINE|kein Ergebnis|Stellplätze: (nicht|unbekannt)') }}
      - action: persistent_notification.create
        data:
          title: Kamera-Selbsttest
          message: "{{ text }}"
      - variables:
          empfaenger: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
      - if: "{{ empfaenger | string | length > 3 }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
              chat_id: "{{ empfaenger }}"
              parse_mode: html
              message: >-
                {% set t %}🔧 Kamera-Selbsttest: {{ 'Eine Kamera fehlt – Home Assistant sucht sie gerade selbst und meldet sich, wenn sie repariert ist. Nur weiterleiten, wenn in 15 Minuten keine Erfolgsmeldung kommt.' if text is search('FEHLER') else 'bitte an Claude weitergeben' }}
                {{ text }}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}

  # Telegram "go2rtc" → Zugangsdaten für die go2rtc-Oberfläche (nur für erlaubte Chats des Bots)
  - id: telegram_go2rtc_passwort
    alias: "Telegram: go2rtc-Zugang schicken"
    mode: single
    triggers:
      - trigger: event
        event_type: telegram_text
    conditions:
      - condition: template
        value_template: >-
          {{ (trigger.event.data.text | default('') | string) is match('^\s*/?go2rtc\s*$', ignorecase=True) }}
    actions:
      - action: shell_command.go2rtc_passwort
        response_variable: pw
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          chat_id: "{{ trigger.event.data.chat_id }}"
          parse_mode: html
          message: >-
            🔑 go2rtc-Oberfläche: Benutzer <code>zuhause</code> · Passwort <code>{{ pw.stdout | trim }}</code>

  # Kamera nicht erreichbar → Home Assistant sucht sie selbst (neue Adresse nach Router-Neustart) und holt sie
  # über den Omada-Controller auf ihre alte Adresse zurück. Telegram an Marco nur, wenn sich etwas geändert hat.
  - id: kamera_selbst_reparieren
    alias: "Kameras: verrutschte Adresse selbst reparieren"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - camera.draussen_giebel_vorne
          - camera.draussen_giebel_hinten
          - camera.draussen_hof_hinten
          - camera.draussen_hot_tor_kamera
        to: unavailable
        for: "00:05:00"
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.platform == 'homeassistant' or
             states.camera | selectattr('entity_id', 'search', '^camera\\.draussen') | selectattr('state', 'eq', 'unavailable') | list | count > 0 }}
    actions:
      - delay: "00:01:00"
      - action: shell_command.kamera_retten_start
        continue_on_error: true
      - delay: "00:04:00"
      - action: shell_command.kamera_retten_lesen
        continue_on_error: true
        response_variable: roh
      - variables:
          a: >-
            {% set t = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ t | from_json if (t | string).startswith('{') else {'ok': false} }}
          melden: "{{ a.kameras | default([]) | selectattr('melden') | list }}"
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - condition: template
        value_template: "{{ melden | count > 0 and marco != '' }}"
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
          chat_id: "{{ marco | int }}"
          message: >-
            {% set ns = namespace(z=['📷 Kameras – selbst repariert:']) %}
            {% for k in melden %}
            {% if k.status == 'repariert' %}{% set ns.z = ns.z + ['✅ ' ~ k.name ~ ': war auf ' ~ k.neu_ip ~ ' verrutscht – jetzt wieder unter ' ~ k.ip ~ ', läuft.'] %}
            {% elif k.status == 'gefunden' %}{% set ns.z = ns.z + ['🔧 ' ~ k.name ~ ': gefunden unter ' ~ k.neu_ip ~ '. ' ~ k.hinweis] %}
            {% elif k.status == 'nicht_gefunden' %}{% set ns.z = ns.z + ['❓ ' ~ k.name ~ ': im Netz nicht gefunden (Strom/WLAN?)' ~ ((' – ' ~ k.hinweis) if k.hinweis else '')] %}
            {% else %}{% set ns.z = ns.z + ['⚠️ ' ~ k.name ~ ': ' ~ k.hinweis] %}{% endif %}
            {% endfor %}
            {{ ns.z | join('\n') }}
