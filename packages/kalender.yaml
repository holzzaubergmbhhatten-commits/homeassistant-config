# Kalender für den Touchmonitor.
# - Der lokale Kalender "Geburtstage" heißt in der Oberfläche jetzt "Termine"
#   (Familientermine, Geburtstage, alles zusammen; die Entität bleibt calendar.geburtstage).
# - Leichte Vorschau für die Startseite: Familientermine der nächsten 3 Wochen und
#   Buchungen der nächsten 4 Monate: Ferienwohnung = Holidu + Portal-Kalender Ferienwohnung,
#   Stellplätze = Portal-Kalender Stellplätze (Entität mit "stellpl" im Namen).
homeassistant:
  customize:
    calendar.geburtstage:
      friendly_name: Termine
      icon: mdi:calendar-heart
    calendar.privat_mit_buchung:
      friendly_name: Ferienwohnung (Portal)
      icon: mdi:home-heart

# Stellplatz-Belegung aus der eigenen Verwaltung (urlaub-wie-zuhause.eu, JSON statt iCal)
rest_command:
  stellplaetze_abrufen:
    url: "https://urlaub-wie-zuhause.eu/admin-api.php?action=list_public"
    method: GET
    timeout: 20

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      # Sofort aktualisieren, wenn ein Termin angelegt wurde (Telegram, Monitor, App)
      - trigger: event
        event_type: call_service
        event_data:
          domain: calendar
          service: create_event
      # ... und wenn der Telegram-Bot einen Termin geändert oder gelöscht hat
      - trigger: event
        event_type: kalender_geaendert
    actions:
      - delay: 2
      - action: calendar.get_events
        target:
          entity_id: calendar.geburtstage
        data:
          duration:
            days: 21
        response_variable: familie
      - action: calendar.get_events
        target:
          # Ferienwohnung: Holidu + Portal (export-ical-ferienwohnung.php = "Privat mit Buchung")
          # Stellplätze: jeder Kalender mit "stellpl" im Namen (Portal-Export Stellplätze)
          entity_id: >-
            {{ ['calendar.holidu', 'calendar.privat_mit_buchung']
               + (states.calendar | map(attribute='entity_id') | select('search', 'stellpl') | list) }}
        data:
          duration:
            days: 120
        response_variable: buchungen
      - action: rest_command.stellplaetze_abrufen
        continue_on_error: true
        response_variable: stellplatz_antwort
    sensor:
      - name: Termine Vorschau
        unique_id: termine_vorschau
        icon: mdi:calendar-month
        state: "{{ familie['calendar.geburtstage'].events | count }}"
        attributes:
          familie: >-
            {% set ns = namespace(l=[]) %}
            {% for e in familie['calendar.geburtstage'].events %}
              {% set ns.l = ns.l + [{'start': e.start, 'ende': e.end, 'titel': e.summary}] %}
            {% endfor %}
            {{ (ns.l | sort(attribute='start'))[:25] }}
          buchungen: >-
            {% set ns = namespace(l=[]) %}
            {% for kalender, inhalt in buchungen.items() %}
              {% for e in inhalt.events %}
                {% set ns.l = ns.l + [{'start': e.start, 'ende': e.end, 'titel': e.summary, 'kalender': kalender}] %}
              {% endfor %}
            {% endfor %}
            {#- Stellplätze aus der Verwaltung: Feldnamen tolerant lesen, Datum auch als TT.MM.JJJJ #}
            {%- set c = stellplatz_antwort.get('content') if stellplatz_antwort is defined and stellplatz_antwort is mapping else none %}
            {%- set ks = namespace(l=c) %}
            {%- if c is mapping %}
              {%- set ks.l = c.values() | list %}
              {%- for k in ['bookings', 'buchungen', 'data', 'items', 'belegung'] %}{% if c.get(k) is iterable and c.get(k) is not string %}{% set ks.l = c.get(k) %}{% endif %}{% endfor %}
            {%- endif %}
            {%- for e in (ks.l if ks.l is iterable and ks.l is not string else []) if e is mapping %}
              {%- set f = namespace(a='', z='', platz='', titel='') %}
              {%- for k in ['start', 'from', 'arrival', 'anreise', 'checkin', 'check_in', 'date_from', 'von', 'startDate', 'start_date'] %}{% if not f.a and e.get(k) %}{% set f.a = (e.get(k) | string)[:10] %}{% endif %}{% endfor %}
              {%- for k in ['end', 'to', 'departure', 'abreise', 'checkout', 'check_out', 'date_to', 'bis', 'endDate', 'end_date'] %}{% if not f.z and e.get(k) %}{% set f.z = (e.get(k) | string)[:10] %}{% endif %}{% endfor %}
              {%- for k in ['spot', 'platz', 'stellplatz', 'pitch', 'place', 'unit'] %}{% if not f.platz and e.get(k) %}{% set f.platz = e.get(k) | string %}{% endif %}{% endfor %}
              {%- for k in ['name', 'guest', 'gast', 'title', 'label'] %}{% if not f.titel and e.get(k) %}{% set f.titel = e.get(k) | string %}{% endif %}{% endfor %}
              {%- if f.a is match('^\d{2}\.\d{2}\.\d{4}$') %}{% set f.a = f.a[6:10] ~ '-' ~ f.a[3:5] ~ '-' ~ f.a[0:2] %}{% endif %}
              {%- if f.z is match('^\d{2}\.\d{2}\.\d{4}$') %}{% set f.z = f.z[6:10] ~ '-' ~ f.z[3:5] ~ '-' ~ f.z[0:2] %}{% endif %}
              {%- if f.a is match('^\d{4}-\d{2}-\d{2}$') %}
                {%- set ns.l = ns.l + [{'start': f.a, 'ende': f.z if f.z is match('^\d{4}-\d{2}-\d{2}$') else f.a,
                    'kalender': 'stellplatz.verwaltung',
                    'titel': (f.titel or 'Belegt') ~ ((' · Platz ' ~ f.platz) if f.platz else '')
                      ~ ((' · ' ~ e.get('anzahl_plaetze') ~ (' Platz' if (e.get('anzahl_plaetze') | string) == '1' else ' Plätze')) if e.get('anzahl_plaetze') else '')}] %}
              {%- endif %}
            {%- endfor %}
            {{ (ns.l | selectattr('ende', '>=', now().strftime('%Y-%m-%d')) | sort(attribute='start') | list)[:40] }}
          # Für die Fehlersuche: erreichbar? wie viele Einträge? welche Feldnamen?
          stellplatz_status: >-
            {%- set c = stellplatz_antwort.get('content') if stellplatz_antwort is defined and stellplatz_antwort is mapping else none %}
            {%- set ks = namespace(l=c) %}
            {%- if c is mapping %}
              {%- set ks.l = c.values() | list %}
              {%- for k in ['bookings', 'buchungen', 'data', 'items', 'belegung'] %}{% if c.get(k) is iterable and c.get(k) is not string %}{% set ks.l = c.get(k) %}{% endif %}{% endfor %}
            {%- endif %}
            {%- if c is none %}nicht erreichbar
            {%- elif ks.l is iterable and ks.l is not string %}ok · {{ ks.l | count }} Einträge
              {%- set erstes = ks.l | first if ks.l | count > 0 else none %}
              {%- if erstes is mapping %} · Felder: {{ erstes.keys() | list | join(', ') }} · Beispiel: {{ erstes.get('start') }} – {{ erstes.get('end') }}{% endif %}
            {%- else %}unbekannt · {{ (c | string)[:120] }}
            {%- endif %}

automation:
  - id: buchungen_aktualisieren
    alias: "Kalender: Buchungen alle 15 Minuten neu laden"
    description: >-
      Holt Holidu, den Portal-Kalender Ferienwohnung und den Stellplatz-Kalender häufiger ab,
      damit neue Buchungen schnell auf dem Monitor erscheinen.
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: >-
            {{ ['calendar.holidu', 'calendar.privat_mit_buchung']
               + (states.calendar | map(attribute='entity_id') | select('search', 'stellpl') | list) }}
