# Mail-Abruf für das Sprachnotiz-Tool (Werkstatt-App auf Vercel): Home Assistant stößt den Abruf an,
# statt eines Zeitplans auf GitHub (der hat die Gratis-Minuten von GitHub Actions aufgebraucht).
# Mo–Fr 5–17 Uhr jede volle Stunde (Wunsch Marco). Die Adresse gibt keine Daten heraus und ist auf der Gegenseite gedrosselt.
# Solange noch Verlauf zu lesen ist ("mehr": true), wird nach gut einer Minute erneut abgerufen (höchstens 8-mal).
rest_command:
  sprachnotiz_mails_abrufen:
    url: https://sprachnotiz-tool.vercel.app/api/mails-abruf
    method: get
    timeout: 75

automation:
  - id: sprachnotiz_mails_abrufen
    alias: "Sprachnotiz-Tool: Mails abrufen"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 0
    conditions:
      - condition: time
        after: "04:59:00"
        before: "17:01:00"
        weekday: [mon, tue, wed, thu, fri]
    actions:
      # vorher anlegen, damit "until" den Wert aus der Schleife sieht
      - variables:
          mehr: false
      - repeat:
          sequence:
            - action: rest_command.sprachnotiz_mails_abrufen
              continue_on_error: true
              response_variable: antwort
            - variables:
                mehr: >-
                  {{ antwort is defined and antwort is mapping and antwort.content is mapping
                     and antwort.content.get('mehr', false) == true }}
            - if: "{{ mehr }}"
              then:
                - delay: 65
          until: "{{ not mehr or repeat.index >= 8 }}"
