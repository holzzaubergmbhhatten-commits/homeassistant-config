# Privater Telegram-Bot "Zuhause".
# 1. Claude prüft, ob die Nachricht einen Termin anlegen, ändern oder löschen will →
#    das passiert direkt im Familienkalender (calendar.geburtstage) und wird bestätigt.
# 2. Alles andere (Licht, Einkaufsliste, Fragen) geht an den Claude-Gesprächsagenten.
# Nur Chat-IDs, die in der Integration "Telegram bot" erlaubt sind, lösen das aus.
# Letzte Nachricht merken ("Chat-ID~Text"), damit Rückfragen wie "als Aufgabe eintragen"
# im Zusammenhang verstanden werden (gilt 15 Minuten).
input_text:
  telegram_vorherige:
    name: Telegram vorherige Nachricht
    max: 255
  telegram_letzte_antwort:
    name: Telegram letzte Antwort
    max: 255

shell_command:
  kalender_bearbeiten: python3 /config/claude_tools/kalender.py {{ auftrag }}

automation:
- id: telegram_an_claude
  alias: 'Telegram: Nachricht an Claude weitergeben'
  mode: queued
  max: 10
  triggers:
  - trigger: event
    event_type: telegram_text
  conditions:
  - condition: template
    value_template: >-
      {{ not (trigger.event.data.text | default('') | string)
         is match('^\s*/?(liste|einkaufsliste|einkauf|aufgaben|todo)\s*\??\s*$', ignorecase=True) }}
  - condition: template
    value_template: >-
      {{ not (trigger.event.data.text | default('') | string)
         is match('^\s*/?(monitor|home|start|zurück|zurueck|dashboard)\s*!?\s*$', ignorecase=True) }}
  - condition: template
    value_template: >-
      {{ not (trigger.event.data.text | default('') | string) is match('^\s*/?go2rtc\s*$', ignorecase=True) }}
  # Akte-Befehle beantwortet packages/akte.yaml
  - condition: template
    value_template: >-
      {{ not (trigger.event.data.text | default('') | string)
         is match('^\s*/?(akte|belege?|steuer\s*(20\d\d)?\s*$|einreichen|eingereicht|fristen|schreiben|brief)\\b', ignorecase=True) }}
  - condition: template
    value_template: >-
      {{ not (trigger.event.data.text | default('') | string) is search('(geh(ö|oe)r\w*\s.{0,40}zusammen|kosten\s*-?\s*aufstellung|(belege|rechnungen|quittungen|kosten|fotos|bilder)\\b.{0,60}(zusammen|addier|summier)|zusammen\s*(zu\s*)?(fass|führ|fuehr)\w*\s.{0,40}(pdf|belege?|rechnung)|nicht\s+(mehr\s+)?zusammen|zusammen\s*(zu\s*)?(ge)?(füg|fueg|heft)|auseinander\s*(nehmen|machen)|\\btrennen\\b|(getrennt|einzeln)\s+ablegen)', ignorecase=True) }}
  # Müll (packages/muell.yaml) und Küche/Essensplan (packages/kueche.yaml) antworten selbst
  - condition: template
    value_template: >-
      {% set t = trigger.event.data.text | default('') | string %}
      {{ not (t is match('^\s*/?(m(ü|ue)ll|abfall|tonnen?)\s*-?\s*(link|kalender|termine)?\s*([:?!.]|$)', ignorecase=True)
              or t is search('^\s*wann\s+(ist|kommt|wird)\s+.{0,20}(m(ü|ue)ll|tonne|abfall|gelbe|papier)', ignorecase=True)
              or t is search('m(ü|ue)ll.{0,20}(webcal|https?)://', ignorecase=True)
              or t is match('^\s*/?(essen|essensplan|wochenplan|speiseplan|rezepte?|ernte|vorrat|kochen|kochplan|arbeitszeiten?)\\b(?!\s+(ist|wird)\s+(fertig|gleich))', ignorecase=True)
              or t is search('was\s+gibt\W{0,2}\s*(e?s\s+)?(heute|morgen|übermorgen|uebermorgen|am\s+\w+|diese\s+woche)?\s*(zu\s+essen|zum\s+(abend|mittag)\w*)|was\s+(essen|kochen)\s+wir|^\s*plan\w*\s+(die\s+|uns\s+)?(nächste|naechste|diese|kommende)\s+woche|(essens|wochen|speise)plan|\\bgeerntet\\b', ignorecase=True)) }}
  # Nachrichten an Familienmitglieder ("Schick Mirka: …") und Schreiben ("Mach ein Schreiben für die Kündigung …") macht die Akte
  - condition: template
    value_template: >-
      {% set t = trigger.event.data.text | default('') | string %}
      {{ not (t is match('^\s*(schick|schicke|sende|sag|sage|schreib|schreibe|richte)\s+(?:bitte\s+)?(?:(?:eine?\s+)?(?:kurze\s+)?(?:test[-\s]?)?(?:nachricht|info|mitteilung)\s+)?(?:an\s+)?(?!(?:mir|mich|uns|mal|bitte|ein|eine|einen|was|das|den|die|der|alle|nachricht|testnachricht)\\b)([a-zäöüß]{2,20})(?:\s+bitte)?(?:\s+(?:eine?\s+)?(?:kurze\s+)?(?:test[-\s]?)?(?:nachricht|info|mitteilung)(?:\s+vo[nm]\s+\w+)?)?\s*(?:[:,]|\s+dass\\b|\s+aus\\b|\s+bescheid\\b|$)', ignorecase=True)
              or t is search('\\b(schick|send|weiterleit|leite|erklär|erklaer|teil|richte|zeig)\w*\\b.{0,80}\\b(mirka|marco|mathilda)\\b|\\b(mirka|marco|mathilda)\\b.{0,80}\\b(schick|send|weiterleit|erklär|erklaer|zeig)\w*', ignorecase=True)
              or t is match('^\s*(ich\s+bin|ich\s+hei(ß|ss)e|mein\s+name\s+ist|hier\s+ist)\s+(mirka|marco|mathilda)\s*[.!]?\s*$', ignorecase=True)
              or t is search('\\b(mach|erstell|setz|schreib|formulier|entw[iu]rf|verfass|brauch|bräucht|braeucht)\w*\\b.{0,50}\\b(schreiben|brief|kündigung|kuendigung|widerspruch|antrag|anschreiben|beschwerde)\\b|^\s*(kündigung|kuendigung|widerspruch)\\b', ignorecase=True)) }}
  actions:
  # Wartet die Akte gerade auf eine Antwort (Rückfrage zu einem Beleg/Vorgang)? Dann geht "Ja" & Co. dorthin, nicht an Claude.
  - action: shell_command.akte
    continue_on_error: true
    data:
      aktion: offen
      wert: "{{ {'chat': trigger.event.data.chat_id, 'von': trigger.event.data.from_first | default('', true)} | to_json | base64_encode }}"
    response_variable: akte_offen
  - if: "{{ akte_offen is defined and akte_offen is mapping and '\"offen\": true' in (akte_offen.stdout | default('') | string) }}"
    then:
    - action: shell_command.akte
      continue_on_error: true
      data:
        aktion: befehl
        wert: "{{ {'text': trigger.event.data.text, 'chat': trigger.event.data.chat_id} | to_json | base64_encode }}"
    - stop: Antwort auf eine Rückfrage der Akte
  # Fragen zuerst im gesammelten Wissen nachschlagen (Haus-Handbuch, Maschinen, Sicherungen, Wartung, Zähler, Eingang, Akte –
  # packages/handbuch.yaml). Steht dort nichts oder geht es um den aktuellen Zustand, geht es unten wie bisher an Claude/Jarvis.
  - if: >-
      {{ (trigger.event.data.text | default('') | string) is search('\?|^\W*(ey\W+|hey\W+|du\W+)?(wo|wie|wann|was|welche\w*|wer|wieviel\w*|womit|warum|wieso|weshalb)\\b|\\b(sag|sage|erklär|erklaer|nenn)\w*\s+(mal|mir|uns|bitte)\\b|\\bwei(ß|ss)t\s+du\\b|\\bkannst\s+du\s+mir\s+sagen\\b', ignorecase=True) }}
    then:
    # aktuelle Werte (Wärmepumpe, PV/Speicher, Raumtemperaturen) mitgeben – „Was macht die PV?“, „Wie warm ist das Warmwasser?“
    - variables:
        live: >-
            {%- set ns = namespace(z=[]) %}
            {%- for e in integration_entities('vicare') | sort if states(e) not in ['unknown', 'unavailable'] %}
            {%- set ns.z = ns.z + [(device_attr(e, 'name_by_user') or device_attr(e, 'name') or 'Viessmann') ~ ' · ' ~ (state_attr(e, 'friendly_name') or e) ~ ': ' ~ states(e) ~ ' ' ~ (state_attr(e, 'unit_of_measurement') or '')] %}
            {%- endfor %}
            {%- for s in states.sensor if s.entity_id is match('sensor\\.(temperatur|luftfeuchte)_') and s.state not in ['unknown', 'unavailable'] %}
            {%- set ns.z = ns.z + ['Raum · ' ~ s.name ~ ': ' ~ s.state ~ ' ' ~ (s.attributes.unit_of_measurement or '')] %}
            {%- endfor %}
            {{ ns.z | join('\n') }}
    - action: shell_command.handbuch
      continue_on_error: true
      data:
        aktion: frage
        wert: >-
          {{ {'frage': trigger.event.data.text, 'von': trigger.event.data.from_first | default('', true),
              'link': states('input_text.zuhause_seite_link') | string, 'live': live} | to_json | base64_encode }}
      response_variable: wissen
    - variables:
        w: >-
          {% set a = wissen.stdout | default('') if wissen is defined and wissen is mapping else '' %}
          {{ a | from_json if (a | string).startswith('{') else {} }}
    - if: "{{ w.gefunden | default(false) }}"
      then:
      - action: telegram_bot.send_message
        data:
          chat_id: "{{ trigger.event.data.chat_id }}"
          message: "🏠 {{ w.antwort }}"
      - stop: aus dem gesammelten Wissen beantwortet
  - variables:
      text: '{{ trigger.event.data.text }}'
      chat: '{{ trigger.event.data.chat_id }}'
      kalender: calendar.geburtstage
      heute: >-
        {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }},
        {{ now().strftime('%Y-%m-%d, %H:%M') }} Uhr
      ai_entity: >-
        {{ states.ai_task | map(attribute='entity_id') | select('search', 'claude|anthropic')
           | first | default('', true) }}
      agent: >-
        {{ states.conversation | map(attribute='entity_id') | select('search', 'claude|anthropic')
           | first | default('conversation.home_assistant', true) }}
  - variables:
      vorher: >-
        {% set v = states('input_text.telegram_vorherige') %}
        {% set frisch = states.input_text.telegram_vorherige is not none and
           (now() - states.input_text.telegram_vorherige.last_changed).total_seconds() < 900 %}
        {{ v.split('~', 1)[1] if frisch and v.startswith(chat ~ '~') else '' }}
      letzte_antwort: >-
        {% set v = states('input_text.telegram_letzte_antwort') %}
        {% set frisch = states.input_text.telegram_letzte_antwort is not none and
           (now() - states.input_text.telegram_letzte_antwort.last_changed).total_seconds() < 900 %}
        {{ v.split('~', 1)[1] if frisch and v.startswith(chat ~ '~') else '' }}
  # Gedächtnis: bisheriger Chat (packages/chatverlauf.yaml)
  - action: shell_command.chatverlauf
    continue_on_error: true
    data:
      aktion: get
      wert: "{{ {'chat': chat | string, 'ohne': text} | to_json | base64_encode }}"
    response_variable: verlauf_roh
  - variables:
      verlauf: >-
        {{ (verlauf_roh.stdout | default('', true) | trim) if verlauf_roh is defined and verlauf_roh is mapping else '' }}
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.telegram_vorherige
    data:
      value: '{{ (chat ~ ''~'' ~ text | replace(''\n'', '' ''))[:250] }}'
  # Aufgabenliste (Lokale To-do-Liste "Aufgaben") und ihre offenen Einträge
  - variables:
      aufgaben_entity: >-
        {{ states.todo | selectattr('name', 'search', '(?i)^aufgaben')
           | map(attribute='entity_id') | first | default('', true) }}
  - if: "{{ aufgaben_entity != '' }}"
    then:
    - action: todo.get_items
      continue_on_error: true
      target:
        entity_id: '{{ aufgaben_entity }}'
      data:
        status: needs_action
      response_variable: aufgaben_offen
  - variables:
      aufgabenliste: >-
        {% set items = aufgaben_offen[aufgaben_entity]['items']
           if aufgaben_offen is defined and aufgaben_entity in aufgaben_offen else [] %}
        {{ items | map(attribute='summary') | join('; ') if items else '(keine)' }}
  # Bestehende Termine mitschicken, damit Claude weiß, welcher geändert/gelöscht werden soll
  - action: calendar.get_events
    continue_on_error: true
    target:
      entity_id: calendar.geburtstage
    data:
      start_date_time: '{{ (now() - timedelta(days=7)).strftime(''%Y-%m-%d 00:00:00'') }}'
      duration:
        days: 120
    response_variable: vorhanden
  - variables:
      terminliste: |-
        {% set ev = vorhanden['calendar.geburtstage'].events
           if vorhanden is defined and 'calendar.geburtstage' in vorhanden else [] %}
        {%- for e in ev[:80] %}
        - {{ e.start[:10] }}{{ ' ' ~ e.start[11:16] ~ '–' ~ e.end[11:16] if 'T' in e.start else ' ganztägig' }}: {{ e.summary }}
        {%- else %}
        (keine)
        {%- endfor %}
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Telegram-Nachricht einordnen
      entity_id: '{{ ai_entity }}'
      instructions: |-
        Heute ist {{ heute }}.
        Entscheide, was die folgende Nachricht mit dem Familienkalender machen möchte, und setze "aktion":
        - "neu": einen neuen Termin eintragen. Dann titel (kurz, sinnvoll), datum (JJJJ-MM-TT),
          uhrzeit (HH:MM, leer bei ganztägigen Terminen wie Geburtstagen oder Urlaub) und dauer_minuten (falls genannt, sonst 60).
        - "aendern": einen vorhandenen Termin verschieben oder umbenennen. Dann alt_titel und alt_datum
          GENAU wie in der Liste unten, und nur die neuen Angaben in titel/datum/uhrzeit/dauer_minuten
          (was gleich bleibt, leer lassen).
        - "loeschen": einen vorhandenen Termin absagen/löschen. Dann alt_titel und alt_datum genau wie in der Liste.
        - "aufgabe": etwas soll auf die Aufgabenliste (To-do ohne feste Uhrzeit, z. B. "Aufgabe: Garage aufräumen",
          "wir müssen noch den Rasen mähen", "erinnere uns an Müll rausbringen").
          WICHTIG: Eine Nachricht ist in der Regel GENAU EINE Aufgabe, auch wenn sie mehrere Schritte beschreibt.
          Fasse sie zu einem kurzen, klaren Titel zusammen (höchstens ca. 60 Zeichen, z. B. "FANi-App: PIN abwarten,
          abheften, anmelden") und schreibe die Einzelheiten in "beschreibung". Mehrere Aufgaben (mit ; getrennt)
          nur, wenn ausdrücklich mehrere verschiedene To-dos aufgezählt werden ("Müll raus, Fenster putzen").
          Ist eine konkrete Frist genannt ("bis Freitag"), setze "faellig" (JJJJ-MM-TT), sonst leer lassen.
          Korrekturen: Sagt die Nachricht, dass die letzte Eintragung falsch war (z. B. "das war als eine Aufgabe
          gedacht", "die anderen entfernen", "nicht so, sondern …"), dann schreibe die falsch angelegten Aufgaben
          GENAU wie in der Liste der offenen Aufgaben in "entfernen" (mit ; getrennt) und die richtige Aufgabe in
          "eintraege". Soll nur etwas von der Aufgabenliste gelöscht werden, bleibt "eintraege" leer.
        - "aufgabe_erledigt": eine oder mehrere offene Aufgaben sind erledigt/abhaken. In "eintraege" die Namen
          GENAU so wie in der Liste der offenen Aufgaben unten, mehrere mit ; getrennt.
        - "erinnerung": jemand möchte zu einer bestimmten Uhrzeit per Nachricht erinnert werden ("erinnere mich
          morgen um 17 Uhr an den Anhänger", "in einer Stunde an die Wäsche erinnern"). Dann titel (woran),
          datum (JJJJ-MM-TT) und uhrzeit (HH:MM). Ohne Uhrzeit ist es eine "aufgabe".
        - "einkauf": etwas soll auf die Einkaufsliste (Lebensmittel, Drogerie, "wir brauchen Milch").
          Die Artikel in "eintraege", mehrere mit ; getrennt.
        - "keine": alles andere (Fragen, Licht, Musik, Sonstiges).
        Frage nie nach, wenn du die Absicht aus Nachricht, vorheriger Nachricht und letzter Antwort erkennen kannst –
        handle einfach. Im Zweifel zwischen Termin und Aufgabe: mit Datum UND Uhrzeit = Termin, sonst Aufgabe.
        AUSNAHME – Bezug auf einen Termin: Knüpft die Nachricht zeitlich an einen vorhandenen oder gerade eingetragenen
        Termin an ("danach", "im Anschluss", "anschließend", "direkt dahinter", "am selben Tag", "davor", "genau wie
        beim …"), ist es ein TERMIN ("neu"), keine Aufgabe: gleiches Datum wie der Bezugstermin; Beginn = Ende des
        Bezugstermins (bei "davor": so, dass er zum Beginn des Bezugstermins endet); ist der Bezugstermin ganztägig,
        dann ebenfalls ganztägig. Titel kurz und passend (z. B. "Citroën wird aufgearbeitet").
        KORREKTUREN der letzten Eintragung (siehe "Letzte Antwort des Bots"):
        - "das ist ein Termin", "als Termin", "keine Aufgabe", "genau wie bei …": aktion "neu" mit den Angaben aus der
          vorherigen Nachricht (Bezugstermin-Regel oben) UND die falsch angelegte Aufgabe GENAU wie in der Liste der
          offenen Aufgaben in "entfernen".
        - "… sollte es heißen", "Titel ist …", "nicht X sondern Y" nach einem eingetragenen Termin: aktion "aendern",
          alt_titel/alt_datum des gerade eingetragenen Termins, neuer Titel in "titel" (sinnvoll eingesetzt, z. B.
          aus "Abschluss" wird "Anschluss" → der Titel wird entsprechend korrigiert, nicht einfach nur dieses Wort).
        Relative Angaben wie "morgen", "übermorgen" oder "nächsten Dienstag" rechnest du in ein Datum um.
        Enthält die Nachricht zusätzlich andere Wünsche (z. B. Einkaufsliste), schreibe diese in das Feld rest.

        Offene Aufgaben: {{ aufgabenliste }}

        Vorhandene Termine (Datum Uhrzeit: Titel):
        {{ terminliste }}

        {% if verlauf %}BISHERIGER CHAT (älteste zuerst, „Bot“ = deine früheren Antworten). Lies ihn, bevor du entscheidest:
        worauf bezieht sich die neue Nachricht? Korrigiert sie etwas, das du gerade eingetragen hast?
        {{ verlauf }}
        {% endif %}
        {% if vorher %}Vorherige Nachricht aus diesem Chat (nur als Zusammenhang, z. B. wenn jetzt
        "als Aufgabe eintragen" oder "ja" kommt – dann gilt der Inhalt der vorherigen Nachricht): {{ vorher }}
        {% endif %}
        {%- if letzte_antwort %}
        Letzte Antwort des Bots in diesem Chat: {{ letzte_antwort }}
        {% endif %}
        Nachricht: {{ text }}
      structure:
        aktion:
          description: 'neu, aendern, loeschen, aufgabe, aufgabe_erledigt, erinnerung, einkauf oder keine'
          required: true
          selector:
            text: null
        eintraege:
          description: Bei aufgabe/aufgabe_erledigt/einkauf die Einträge, mehrere mit ; getrennt
          selector:
            text: null
        entfernen:
          description: Bei aufgabe oder neu (Korrektur/Löschen) die zu entfernenden offenen Aufgaben, genau wie in der Liste, mit ; getrennt
          selector:
            text: null
        beschreibung:
          description: Bei aufgabe die Einzelheiten zur Aufgabe (optional)
          selector:
            text: null
        faellig:
          description: Bei aufgabe die Frist im Format JJJJ-MM-TT, nur wenn konkret genannt
          selector:
            text: null
        alt_titel:
          description: Bei aendern/loeschen der Titel des vorhandenen Termins, genau wie in der Liste
          selector:
            text: null
        alt_datum:
          description: Bei aendern/loeschen das Datum des vorhandenen Termins (JJJJ-MM-TT)
          selector:
            text: null
        titel:
          description: Titel des (neuen) Termins
          selector:
            text: null
        datum:
          description: (Neues) Datum im Format JJJJ-MM-TT
          selector:
            text: null
        uhrzeit:
          description: (Neuer) Beginn im Format HH:MM, leer bei ganztägigen Terminen
          selector:
            text: null
        dauer_minuten:
          description: Dauer in Minuten
          selector:
            text: null
        rest:
          description: Alles aus der Nachricht, was NICHTS mit dem Kalender zu tun hat (z. B. Einkaufsliste, Licht,
            Fragen), als eigene kurze Aufforderung. Leer, wenn es nichts weiter gibt.
          selector:
            text: null
    response_variable: erkannt
  - variables:
      d: '{{ erkannt.data if erkannt is defined and erkannt.data is defined and erkannt.data is mapping else {} }}'
      aktion: >-
        {% set a = (d.aktion | default('keine', true) | string | lower | trim) -%}
        {%- if a == 'neu' and (d.datum | default('') | string) is match('^\d{4}-\d{2}-\d{2}$') %}neu
        {%- elif a in ['aendern', 'ändern', 'loeschen', 'löschen'] and (d.alt_datum | default('') | string) is match('^\d{4}-\d{2}-\d{2}$') %}{{ a | replace('ä','ae') | replace('ö','oe') }}
        {%- elif a == 'erinnerung' and (d.datum | default('') | string) is match('^\d{4}-\d{2}-\d{2}$')
            and (d.uhrzeit | default('') | string) is match('^\d{1,2}:\d{2}') %}erinnerung
        {%- elif a in ['aufgabe', 'aufgabe_erledigt', 'einkauf'] and ((d.eintraege | default('', true) | string | trim) != ''
            or (a == 'aufgabe' and (d.entfernen | default('', true) | string | trim) != '')) %}{{ a }}
        {%- else %}keine{% endif %}
  - choose:
    - conditions: '{{ aktion == ''neu'' }}'
      sequence:
      - variables:
          weg: >-
            {{ (d.entfernen | default('', true) | string).split(';') | map('trim') | reject('eq', '') | list }}
      - if: "{{ weg | count > 0 and aufgaben_entity != '' }}"
        then:
        - action: todo.remove_item
          continue_on_error: true
          target:
            entity_id: '{{ aufgaben_entity }}'
          data:
            item: '{{ weg }}'
        - action: telegram_bot.send_message
          continue_on_error: true
          data:
            chat_id: '{{ chat }}'
            message: "🗑️ Als Aufgabe entfernt: {{ weg | join(', ') }}"
      - variables:
          titel: '{{ d.titel | default(''Termin'', true) }}'
          datum: '{{ d.datum }}'
          uhr: '{{ d.uhrzeit | default('''', true) | string | trim }}'
          mit_uhrzeit: '{{ uhr is match(''^\d{1,2}:\d{2}'') }}'
          minuten: '{{ d.dauer_minuten | default(60, true) | int(60) }}'
          datum_de: '{{ strptime(datum, ''%Y-%m-%d'').strftime(''%d.%m.%Y'') }}'
      - if: '{{ mit_uhrzeit }}'
        then:
        - variables:
            beginn: '{{ datum }} {{ ''%02d'' | format(uhr.split('':'')[0] | int) }}:{{ uhr.split('':'')[1][:2] }}:00'
        - action: calendar.create_event
          target:
            entity_id: '{{ kalender }}'
          data:
            summary: '{{ titel }}'
            start_date_time: '{{ beginn }}'
            end_date_time: >-
              {{ (strptime(beginn, '%Y-%m-%d %H:%M:%S') + timedelta(minutes=minuten)).strftime('%Y-%m-%d %H:%M:%S') }}
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.telegram_letzte_antwort
          data:
            value: "{{ (chat ~ '~📅 Eingetragen: ' ~ titel ~ ' am ' ~ datum ~ ' um ' ~ beginn[11:16] ~ ' Uhr')[:250] }}"
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            message: >-
              {% set t %}📅 Eingetragen: {{ titel }} am {{ datum_de }} um {{ beginn[11:16] }} Uhr{% endset %}{{ t
              | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
            parse_mode: html
        else:
        - action: calendar.create_event
          target:
            entity_id: '{{ kalender }}'
          data:
            summary: '{{ titel }}'
            start_date: '{{ datum }}'
            end_date: '{{ (strptime(datum, ''%Y-%m-%d'') + timedelta(days=1)).strftime(''%Y-%m-%d'') }}'
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.telegram_letzte_antwort
          data:
            value: "{{ (chat ~ '~📅 Eingetragen: ' ~ titel ~ ' am ' ~ datum ~ ' (ganztägig)')[:250] }}"
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            message: >-
              {% set t %}📅 Eingetragen: {{ titel }} am {{ datum_de }} (ganztägig){% endset %}{{ t
              | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
            parse_mode: html
    # Ändern / Löschen: Zusatzprogramm bearbeitet die Kalenderdatei (vorher Sicherheitskopie
    # nach /media/kalender_sicherung), danach wird der Kalender neu geladen.
    - conditions: '{{ aktion in [''aendern'', ''loeschen''] }}'
      sequence:
      - action: shell_command.kalender_bearbeiten
        continue_on_error: true
        data:
          auftrag: >-
            {{ {'aktion': aktion, 'alt_titel': d.alt_titel | default('', true), 'alt_datum': d.alt_datum,
                'titel': d.titel | default('', true), 'datum': d.datum | default('', true),
                'uhrzeit': d.uhrzeit | default('', true), 'dauer_minuten': d.dauer_minuten | default('', true)}
               | to_json | base64_encode }}
        response_variable: ergebnis
      - variables:
          meldung: >-
            {{ (ergebnis.stdout | default('', true) | trim) if ergebnis is defined and ergebnis is mapping else '' }}
      - if: '{{ meldung[:1] in [''✏'', ''🗑''] }}'
        then:
        - action: homeassistant.reload_config_entry
          continue_on_error: true
          target:
            entity_id: '{{ kalender }}'
        - delay: 3
        - event: kalender_geaendert
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat }}'
          message: >-
            {% set t %}{{ meldung or '⚠️ Der Termin konnte nicht bearbeitet werden (Zusatzprogramm hat nicht geantwortet).' }}{% endset %}{{ t
            | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
          parse_mode: html
    # Erinnerung zu einer Uhrzeit (packages/jarvis.yaml) – kommt per Telegram an diesen Chat
    - conditions: "{{ aktion == 'erinnerung' }}"
      sequence:
      - variables:
          uhr: "{{ d.uhrzeit | string | trim }}"
          wann: "{{ d.datum }} {{ '%02d' | format(uhr.split(':')[0] | int) }}:{{ uhr.split(':')[1][:2] }}"
          titel: "{{ d.titel | default('Erinnerung', true) }}"
      - action: script.jarvis_erinnerung
        continue_on_error: true
        data:
          text: '{{ titel }}'
          zeitpunkt: '{{ wann }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat }}'
          parse_mode: html
          message: >-
            {% set t %}⏰ Ich erinnere dich am {{ strptime(d.datum, '%Y-%m-%d').strftime('%d.%m.') }} um {{ wann[11:16] }} Uhr: {{ titel }}{% endset %}{{ t
            | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
    # Aufgaben / Einkauf direkt eintragen (zuverlässiger als über den Gesprächsagenten)
    - conditions: "{{ aktion in ['aufgabe', 'aufgabe_erledigt', 'einkauf'] }}"
      sequence:
      - variables:
          liste: "{{ 'todo.einkaufsliste' if aktion == 'einkauf' else aufgaben_entity }}"
          eintraege: >-
            {{ (d.eintraege | default('', true) | string).split(';') | map('trim') | reject('eq', '') | list }}
          entfernen: >-
            {{ (d.entfernen | default('', true) | string).split(';') | map('trim') | reject('eq', '') | list
               if aktion == 'aufgabe' else [] }}
          beschreibung: "{{ d.beschreibung | default('', true) | string | trim }}"
          faellig: >-
            {{ d.faellig | default('', true) | string | trim
               if (d.faellig | default('', true) | string) is match('^\d{4}-\d{2}-\d{2}$') else '' }}
      - if: "{{ liste == '' }}"
        then:
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            parse_mode: html
            message: >-
              ⚠️ Es gibt noch keine Liste „Aufgaben“. Bitte in Home Assistant unter Einstellungen →
              Geräte &amp; Dienste → „Lokale To-do-Liste“ mit dem Namen Aufgaben anlegen.
        - stop: Keine Aufgabenliste
      - if: "{{ entfernen | count > 0 }}"
        then:
        - action: todo.remove_item
          continue_on_error: true
          target:
            entity_id: '{{ liste }}'
          data:
            item: '{{ entfernen }}'
      - repeat:
          for_each: '{{ eintraege }}'
          sequence:
          - if: "{{ aktion == 'aufgabe_erledigt' }}"
            then:
            - action: todo.update_item
              continue_on_error: true
              target:
                entity_id: '{{ liste }}'
              data:
                item: '{{ repeat.item }}'
                status: completed
            else:
            - action: todo.add_item
              continue_on_error: true
              target:
                entity_id: '{{ liste }}'
              data: >-
                {% set x = {'item': repeat.item} %}
                {% if aktion == 'aufgabe' and eintraege | count == 1 and beschreibung %}{% set x = dict(x, description=beschreibung) %}{% endif %}
                {% if aktion == 'aufgabe' and eintraege | count == 1 and faellig %}{% set x = dict(x, due_date=faellig) %}{% endif %}
                {{ x }}
      - variables:
          antwort_text: >-
            {%- if entfernen %}🗑️ Entfernt: {{ entfernen | join(', ') }}{{ '\n' if eintraege else '' }}{% endif %}
            {%- if eintraege %}{{ {'aufgabe': '✅ Neue Aufgabe', 'aufgabe_erledigt': '☑️ Erledigt',
               'einkauf': '🛒 Auf die Einkaufsliste'}[aktion] }}: {{ eintraege | join(', ') }}{% endif %}
            {%- if eintraege and beschreibung and aktion == 'aufgabe' %}{{ '\n' }}📝 {{ beschreibung }}{% endif %}
            {%- if eintraege and faellig and aktion == 'aufgabe' %}{{ '\n' }}📅 fällig {{ strptime(faellig, '%Y-%m-%d').strftime('%d.%m.%Y') }}{% endif %}
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.telegram_letzte_antwort
        data:
          value: "{{ (chat ~ '~' ~ antwort_text | replace('\n', ' '))[:250] }}"
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat }}'
          parse_mode: html
          message: >-
            {{ antwort_text | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
    default:
    - if: '{{ erkannt is not defined or erkannt.data is not defined }}'
      then:
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat }}'
          message: >-
            {% set t %}⚠️ Terminerkennung nicht verfügbar ({{ ai_entity or 'keine KI-Aufgabe gefunden' }}) – die
            Nachricht geht direkt an Claude.{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}
          parse_mode: html
    - action: conversation.process
      data:
        text: >-
          {% if verlauf %}(Zusammenhang – bisheriger Telegram-Chat, älteste zuerst, „Bot“ = deine Antworten:
          {{ verlauf }}
          )

          Neue Nachricht: {% endif %}{{ text }}
        language: de
        agent_id: '{{ agent }}'
        conversation_id: 'telegram_{{ chat }}'
      response_variable: antwort
    - action: telegram_bot.send_message
      data:
        chat_id: '{{ chat }}'
        message: >-
          {% set t %}{{ antwort.response.speech.plain.speech
             if antwort.response is defined and antwort.response.speech.plain is defined
             else 'Erledigt.' }}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;')
             | regex_replace('\\*\\*(.+?)\\*\\*', '<b>\\1</b>') }}
        parse_mode: html
  # Weitere Wünsche aus derselben Nachricht (z. B. "... und Milch auf die Liste")
  - if: '{{ aktion != ''keine'' and (d.rest | default('''', true) | string | trim) | length > 2 }}'
    then:
    - action: conversation.process
      data:
        text: '{{ d.rest }}'
        language: de
        agent_id: '{{ agent }}'
        conversation_id: 'telegram_{{ chat }}'
      response_variable: antwort_rest
    - action: telegram_bot.send_message
      data:
        chat_id: '{{ chat }}'
        message: >-
          {% set t %}{{ antwort_rest.response.speech.plain.speech
             if antwort_rest.response is defined and antwort_rest.response.speech.plain is defined
             else 'Erledigt.' }}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;')
             | regex_replace('\\*\\*(.+?)\\*\\*', '<b>\\1</b>') }}
        parse_mode: html
- id: telegram_einkaufsliste
  alias: 'Telegram: Einkaufsliste schicken'
  description: Auf "Liste" oder "Einkaufsliste" antwortet der Bot mit allen offenen Einträgen.
  mode: queued
  triggers:
  - trigger: event
    event_type: telegram_text
  conditions:
  - condition: template
    value_template: '{{ (trigger.event.data.text | default('''') | string) is match(''^\s*/?(liste|einkaufsliste|einkauf)\s*\??\s*$'',
      ignorecase=True) }}'
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.einkaufsliste
    data:
      status: needs_action
    response_variable: liste
  - action: telegram_bot.send_message
    data:
      chat_id: '{{ trigger.event.data.chat_id }}'
      parse_mode: html
      message: '{% set items = liste[''todo.einkaufsliste''][''items''] %}{% set t %}🛒 Einkaufsliste{% if items
        | count == 0 %}: alles erledigt ✅{% else %} ({{ items | count }}):

        {% for i in items %}• {{ i.summary }}

        {% endfor %}{% endif %}{% endset %}{{ t | replace(''&'',''&amp;'') | replace(''<'',''&lt;'') | replace(''>'',''&gt;'')
        }}'
- id: telegram_aufgaben
  alias: 'Telegram: Aufgaben schicken'
  description: Auf "Aufgaben" antwortet der Bot mit allen offenen Aufgaben.
  mode: queued
  triggers:
  - trigger: event
    event_type: telegram_text
  conditions:
  - condition: template
    value_template: >-
      {{ (trigger.event.data.text | default('') | string)
         is match('^\s*/?(aufgaben|todo)\s*\??\s*$', ignorecase=True) }}
  actions:
  - action: todo.get_items
    continue_on_error: true
    target:
      entity_id: todo.aufgaben
    data:
      status: needs_action
    response_variable: liste
  - action: telegram_bot.send_message
    data:
      chat_id: '{{ trigger.event.data.chat_id }}'
      parse_mode: html
      message: |-
        {% if liste is not defined or 'todo.aufgaben' not in liste %}⚠️ Die Liste „Aufgaben“ gibt es noch nicht.
        {%- else %}{% set items = liste['todo.aufgaben']['items'] %}{% set t %}✅ Aufgaben
        {%- if items | count == 0 %}: alles erledigt 🎉{% else %} ({{ items | count }}):{% for i in items %}
        • {{ i.summary }}{% endfor %}{% endif %}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}{% endif %}
- id: telegram_monitor_zurueck
  alias: 'Telegram: Monitor zurück zum Dashboard'
  description: Auf "Monitor", "Start" oder "Zurück" springt der Touchmonitor sofort zum Dashboard.
  mode: queued
  triggers:
  - trigger: event
    event_type: telegram_text
  conditions:
  - condition: template
    value_template: '{{ (trigger.event.data.text | default('''') | string) is match(''^\s*/?(monitor|home|start|zurück|zurueck|dashboard)\s*!?\s*$'',
      ignorecase=True) }}'
  actions:
  - action: script.turn_off
    continue_on_error: true
    target:
      entity_id:
      - script.amazon_auf_monitor
      - script.amazon_startseite
      - script.stellplaetze_verwalten
  - action: rest_command.kiosk_dashboard
  - action: telegram_bot.send_message
    data:
      chat_id: '{{ trigger.event.data.chat_id }}'
      parse_mode: html
      message: 🏠 Der Monitor zeigt wieder das Dashboard.
