# Privater Telegram-Bot "Zuhause".
# 1. Claude prüft, ob die Nachricht ein Termin ist → Termin wird direkt in den
#    Familienkalender (calendar.geburtstage) eingetragen und bestätigt.
# 2. Alles andere (Licht, Einkaufsliste, Fragen) geht an den Claude-Gesprächsagenten.
# Nur Chat-IDs, die in der Integration "Telegram bot" erlaubt sind, lösen das aus.
automation:
- id: telegram_an_claude
  alias: 'Telegram: Nachricht an Claude weitergeben'
  mode: queued
  max: 10
  triggers:
  - trigger: event
    event_type: telegram_text
  actions:
  - variables:
      text: '{{ trigger.event.data.text }}'
      chat: '{{ trigger.event.data.chat_id }}'
      kalender: calendar.geburtstage
      heute: '{{ [''Montag'',''Dienstag'',''Mittwoch'',''Donnerstag'',''Freitag'',''Samstag'',''Sonntag''][now().weekday()]
        }}, {{ now().strftime(''%Y-%m-%d, %H:%M'') }} Uhr'
      ai_entity: "{{ states.ai_task | map(attribute='entity_id')\n   | select('search', 'claude|anthropic') | first\
        \ | default('', true) }}"
      agent: "{{ states.conversation | map(attribute='entity_id')\n   | select('search', 'claude|anthropic') | first\n\
        \   | default('conversation.home_assistant', true) }}"
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Telegram-Nachricht einordnen
      entity_id: '{{ ai_entity }}'
      instructions: 'Heute ist {{ heute }}.

        Entscheide, ob die folgende Nachricht einen neuen Termin in den Kalender eintragen möchte.

        Wenn ja: ist_termin = true, dazu ein kurzer, sinnvoller Titel, das Datum im Format JJJJ-MM-TT,

        die Uhrzeit im Format HH:MM (leer lassen bei ganztägigen Terminen wie Geburtstagen oder Urlaub)

        und die Dauer in Minuten, falls genannt (sonst 60).

        Relative Angaben wie "morgen", "übermorgen" oder "nächsten Dienstag" rechnest du in ein Datum um.

        Wenn nein (Frage, Licht, Einkaufsliste, Sonstiges): ist_termin = false.

        Enthält die Nachricht neben dem Termin noch andere Wünsche (z. B. Einkaufsliste),

        schreibe diese in das Feld rest.

        Nachricht: {{ text }}'
      structure:
        ist_termin:
          description: true, wenn ein Termin eingetragen werden soll
          required: true
          selector:
            boolean: null
        titel:
          description: Kurzer Titel des Termins
          selector:
            text: null
        datum:
          description: Datum im Format JJJJ-MM-TT
          selector:
            text: null
        uhrzeit:
          description: Beginn im Format HH:MM, leer bei ganztägigen Terminen
          selector:
            text: null
        dauer_minuten:
          description: Dauer in Minuten
          selector:
            number:
              min: 5
              max: 1440
        rest:
          description: Alles aus der Nachricht, was KEIN Termin ist (z. B. Einkaufsliste, Licht, Fragen), als eigene
            kurze Aufforderung. Leer, wenn es nichts weiter gibt.
          selector:
            text: null
    response_variable: erkannt
  - variables:
      termin: "{{ erkannt is defined and erkannt.data is defined and erkannt.data is mapping\n   and (erkannt.data.ist_termin\
        \ | default(false)) in [true, 'true', 'True']\n   and (erkannt.data.datum | default('') | string) is match('^\\\
        d{4}-\\d{2}-\\d{2}$') }}"
  - choose:
    - conditions: '{{ termin }}'
      sequence:
      - variables:
          titel: '{{ erkannt.data.titel | default(''Termin'', true) }}'
          datum: '{{ erkannt.data.datum }}'
          uhr: '{{ erkannt.data.uhrzeit | default('''', true) | string | trim }}'
          mit_uhrzeit: '{{ uhr is match(''^\d{1,2}:\d{2}'') }}'
          minuten: '{{ erkannt.data.dauer_minuten | default(60, true) | int(60) }}'
          datum_de: '{{ strptime(datum, ''%Y-%m-%d'').strftime(''%d.%m.%Y'') }}'
      - if: '{{ mit_uhrzeit }}'
        then:
        - variables:
            beginn: '{{ datum }} {{ ''%02d'' | format(uhr.split('':'')[0] | int) }}:{{ uhr.split('':'')[1][:2] }}:00'
        - action: calendar.create_event
          target:
            entity_id: '{{ kalender }}'
          data:
            summary: '{{ titel }}'
            start_date_time: '{{ beginn }}'
            end_date_time: '{{ (strptime(beginn, ''%Y-%m-%d %H:%M:%S'') + timedelta(minutes=minuten)).strftime(''%Y-%m-%d
              %H:%M:%S'') }}'
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            message: '{% set t %}📅 Eingetragen: {{ titel }} am {{ datum_de }} um {{ beginn[11:16] }} Uhr{% endset
              %}{{ t | replace(''&'',''&amp;'') | replace(''<'',''&lt;'') | replace(''>'',''&gt;'') }}'
            parse_mode: html
        else:
        - action: calendar.create_event
          target:
            entity_id: '{{ kalender }}'
          data:
            summary: '{{ titel }}'
            start_date: '{{ datum }}'
            end_date: '{{ (strptime(datum, ''%Y-%m-%d'') + timedelta(days=1)).strftime(''%Y-%m-%d'') }}'
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            message: '{% set t %}📅 Eingetragen: {{ titel }} am {{ datum_de }} (ganztägig){% endset %}{{ t | replace(''&'',''&amp;'')
              | replace(''<'',''&lt;'') | replace(''>'',''&gt;'') }}'
            parse_mode: html
      - if: '{{ (erkannt.data.rest | default('''', true) | string | trim) | length > 2 }}'
        then:
        - action: conversation.process
          data:
            text: '{{ erkannt.data.rest }}'
            language: de
            agent_id: '{{ agent }}'
          response_variable: antwort_rest
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ chat }}'
            message: "{% set t %}{{ antwort_rest.response.speech.plain.speech\n   if antwort_rest.response is defined\
              \ and antwort_rest.response.speech.plain is defined\n   else 'Erledigt.' }}{% endset %}{{ t | replace('&','&amp;')\
              \ | replace('<','&lt;') | replace('>','&gt;') }}"
            parse_mode: html
    default:
    - if: '{{ erkannt is not defined or erkannt.data is not defined }}'
      then:
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat }}'
          message: '{% set t %}⚠️ Terminerkennung nicht verfügbar ({{ ai_entity or ''keine KI-Aufgabe gefunden''
            }}) – die Nachricht geht direkt an Claude.{% endset %}{{ t | replace(''&'',''&amp;'') | replace(''<'',''&lt;'')
            | replace(''>'',''&gt;'') }}'
          parse_mode: html
    - action: conversation.process
      data:
        text: '{{ text }}'
        language: de
        agent_id: '{{ agent }}'
      response_variable: antwort
    - action: telegram_bot.send_message
      data:
        chat_id: '{{ chat }}'
        message: "{% set t %}{{ antwort.response.speech.plain.speech\n   if antwort.response is defined and antwort.response.speech.plain\
          \ is defined\n   else 'Erledigt.' }}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;')\
          \ }}"
        parse_mode: html
