# Garten: Pflanzplan für den überdachten Garten (offen, Folien-Dach, Hochbeete) und Gemüsegarten (Erdstreifen) als Reiter "Garten"
# im Flur-Dashboard (www/garten.html) – am Monitor und im Handy-App.
# - Plan, Pflanzenwahl und Fotos liegen lokal in /config/www/garten_daten.json (nicht im Repository).
# - Pflegehinweise rechnet die Seite aus dem Wetter (weather.touchmonitor_home); die wichtigsten davon
#   stehen als "Garten heute" auf dem Start-Dashboard (sensor.garten_aufgaben, claude_tools/garten_aufgaben.py).
# - Foto-Check und Fragen beantwortet Claude über claude_tools/garten_ki.py (Schlüssel aus der
#   Anthropic-Integration, nicht im Repository).
# - Foto an den Telegram-Bot schicken (Text dazu = Frage) → Claude prüft die Pflanze und antwortet im Chat;
#   das Ergebnis erscheint auch unter "Foto-Check" auf der Garten-Seite.
# - Am Monitor (Start-Dashboard, "Garten heute") und im Reiter "Fragen" der Garten-Seite kann man Claude
#   fragen oder melden, was erledigt ist ("Kürbis habe ich geerntet") – dann verschwindet die Aufgabe.
input_text:
  garten_nachricht:
    name: Garten – Frage oder erledigt
    icon: mdi:message-question-outline
    max: 255
    initial: ""

shell_command:
  # lange Texte kommen in Stücken (ein einzelnes Argument darf nicht beliebig lang sein)
  garten_schreiben: python3 /config/claude_tools/garten_speichern.py {{ b64 }}
  garten_ki_befehl: python3 /config/claude_tools/garten_ki.py {{ auftrag }} {{ bild }}
  garten_aufgaben_befehl: python3 /config/claude_tools/garten_aufgaben.py {{ wetter }}

script:
  garten_speichern:
    alias: Gartenplan speichern
    mode: queued
    fields:
      daten:
        description: Inhalt als JSON-Text
    sequence:
      - action: shell_command.garten_schreiben
        data:
          b64: >-
            {% set s = (daten if daten is string else (daten | to_json)) | base64_encode %}
            {% for i in range(0, s | length, 100000) %}{{ s[i:i + 100000] }} {% endfor %}
        response_variable: ergebnis
      - variables:
          antwort:
            ok: "{{ (ergebnis.stdout | default('') | trim).startswith('ok') }}"
            text: "{{ ergebnis.stdout | default('keine Antwort') }}"
      - if: "{{ not antwort.ok }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: garten
              title: Gartenplan speichern
              message: "{{ antwort.text }}"
      # To-dos auf dem Start-Dashboard gleich neu berechnen
      - event: garten_geaendert
      - stop: fertig
        response_variable: antwort

  garten_ki:
    alias: "Garten: Claude fragen / Foto prüfen"
    mode: parallel
    fields:
      auftrag:
        description: JSON mit art (foto/frage), frage, pflanze, beet, wetter …
      bild:
        description: Foto als Base64-JPEG (Stücke mit Leerzeichen getrennt), leer bei reinen Fragen
    sequence:
      - action: shell_command.garten_ki_befehl
        continue_on_error: true
        data:
          auftrag: "{{ (auftrag if auftrag is string else (auftrag | to_json)) | base64_encode }}"
          bild: "{{ bild | default('', true) }}"
        response_variable: ergebnis
      - variables:
          antwort:
            stdout: "{{ ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' }}"
          a: >-
            {% set t = antwort.stdout %}{{ t if t is mapping else (t | from_json if (t | string).startswith('{') else {}) }}
          art: "{{ (auftrag if auftrag is mapping else (auftrag | from_json)).art | default('') }}"
      # Fragen/Meldungen: Aufgaben neu berechnen (Erledigtes verschwindet), Antwort für den Monitor
      - if: "{{ art == 'chat' }}"
        then:
          - event: garten_geaendert
            event_data:
              antwort: "{{ a.text if a.ok | default(false) else 'Das hat leider nicht geklappt – bitte nochmal versuchen.' }}"
              frage: "{{ (auftrag if auftrag is mapping else (auftrag | from_json)).frage | default('') }}"
              quelle: "{{ (auftrag if auftrag is mapping else (auftrag | from_json)).quelle | default('') }}"
      - stop: fertig
        response_variable: antwort

automation:
  # Eingabefeld am Monitor: Frage oder "erledigt" an Claude, danach Feld leeren
  - id: garten_nachricht_monitor
    alias: "Garten: Frage/Meldung vom Monitor an Claude"
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: input_text.garten_nachricht
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state | trim not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - variables:
          frage: "{{ trigger.to_state.state | trim }}"
      - event: garten_geaendert
        event_data:
          antwort: "Claude denkt nach …"
          frage: "{{ frage }}"
          quelle: monitor
      - action: input_text.set_value
        target:
          entity_id: input_text.garten_nachricht
        data:
          value: ""
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.touchmonitor_home
        data:
          type: daily
        response_variable: vorhersage
      - action: script.garten_ki
        continue_on_error: true
        data:
          auftrag: >-
            {% set w = states.weather.touchmonitor_home %}
            {% set fc = (vorhersage['weather.touchmonitor_home'].forecast if vorhersage is defined and vorhersage is mapping
                         and 'weather.touchmonitor_home' in vorhersage else [])[:3] %}
            {% set ns = namespace(t=('jetzt ' ~ w.attributes.temperature ~ ' °C, ' ~ w.state) if w else '') %}
            {% for d in fc %}{% set ns.t = ns.t ~ '; ' ~ (as_timestamp(d.datetime) | timestamp_custom('%d.%m.')) ~ ' '
               ~ d.templow | default('?') ~ '–' ~ d.temperature ~ ' °C, ' ~ d.precipitation | default(0) ~ ' mm' %}{% endfor %}
            {{ {'art': 'chat', 'frage': frage, 'quelle': 'monitor', 'wetter': ns.t, 'plan_laden': true,
                'aufgaben': state_attr('sensor.garten_aufgaben', 'aufgaben') or [],
                'schluessel': state_attr('sensor.garten_aufgaben', 'schluessel') or [],
                'datum': now().strftime('%d.%m.%Y')} | to_json }}

  - id: garten_foto_telegram
    alias: "Garten: Foto per Telegram von Claude prüfen lassen"
    mode: queued
    max: 5
    triggers:
      - trigger: event
        event_type: telegram_attachment
    conditions:
      - condition: template
        value_template: "{{ (trigger.event.data.file_mime_type | default('')).startswith('image/') }}"
    actions:
      - variables:
          chat: "{{ trigger.event.data.chat_id }}"
          frage: "{{ trigger.event.data.text | default('', true) }}"
          datei: "/config/garten_fotos/foto_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: "{{ chat }}"
          message: "🌱 Danke! Ich schaue mir die Pflanze an – einen Moment …"
      - action: telegram_bot.download_file
        continue_on_error: true
        data:
          file_id: "{{ trigger.event.data.file_id }}"
          directory_path: /config/garten_fotos
          file_name: "{{ datei.split('/')[-1] }}"
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.touchmonitor_home
        data:
          type: daily
        response_variable: vorhersage
      - variables:
          wetter: >-
            {% set w = states.weather.touchmonitor_home %}
            {% set fc = (vorhersage['weather.touchmonitor_home'].forecast if vorhersage is defined and vorhersage is mapping
                         and 'weather.touchmonitor_home' in vorhersage else [])[:3] %}
            {{ ('jetzt ' ~ w.attributes.temperature ~ ' °C, ' ~ w.state) if w else '' }}{% for d in fc %};
            {{ as_timestamp(d.datetime) | timestamp_custom('%d.%m.') }} {{ d.templow | default('?') }}–{{ d.temperature }} °C, {{ d.precipitation | default(0) }} mm{% endfor %}
      - action: shell_command.garten_ki_befehl
        continue_on_error: true
        data:
          auftrag: >-
            {{ {'art': 'foto', 'frage': frage, 'datei': datei, 'wetter': wetter | trim, 'plan_laden': true, 'merken': true,
                'datum': now().strftime('%d.%m.%Y')} | to_json | base64_encode }}
          bild: ""
        response_variable: ergebnis
      - variables:
          antwort: >-
            {% set a = ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' %}
            {% set a = a if a is mapping else (a | from_json if (a | string).startswith('{') else {}) %}
            {{ a.text if a.ok | default(false) else '⚠️ Das hat leider nicht geklappt' ~ (': ' ~ a.fehler if a.fehler is defined else ' (keine Antwort – bitte nochmal schicken).') }}
      - action: telegram_bot.send_message
        data:
          chat_id: "{{ chat }}"
          parse_mode: html
          message: >-
            {% set t %}🌱 {{ antwort }}{% endset %}{{ t | replace('&','&amp;') | replace('<','&lt;') | replace('>','&gt;') }}

# To-dos für das Start-Dashboard ("Garten heute"): aus Pflanzplan + Wettervorhersage,
# stündlich, beim Start und gleich nach jedem Speichern auf der Garten-Seite neu berechnet.
template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: 7
      - trigger: event
        event_type: garten_geaendert
        id: geaendert
    actions:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.touchmonitor_home
        data:
          type: daily
        response_variable: vorhersage
      - action: shell_command.garten_aufgaben_befehl
        continue_on_error: true
        data:
          wetter: >-
            {% set fc = vorhersage['weather.touchmonitor_home'].forecast if vorhersage is defined and vorhersage is mapping
                        and 'weather.touchmonitor_home' in vorhersage else [] %}
            {{ {'tage': fc[:5], 'jetzt': state_attr('weather.touchmonitor_home', 'temperature')} | to_json | base64_encode }}
        response_variable: ergebnis
      - variables:
          liste: >-
            {% set a = ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' %}
            {{ a if a is mapping else (a | from_json if (a | string).startswith('{') else {'aufgaben': [], 'bald': []}) }}
    sensor:
      - name: Garten Aufgaben
        unique_id: garten_aufgaben
        icon: mdi:sprout
        state: "{{ liste.aufgaben | default([]) | count }}"
        attributes:
          aufgaben: "{{ liste.aufgaben | default([]) }}"
          bald: "{{ liste.bald | default([]) }}"
          schluessel: "{{ liste.schluessel | default([]) }}"
          fehler: "{{ liste.fehler | default('') }}"
          # letzte Antwort von Claude auf eine Frage/Meldung am Monitor (die Karte zeigt sie ein paar Stunden)
          antwort: >-
            {% set e = trigger.event.data if trigger.id == 'geaendert' else {} %}
            {{ e.antwort if e.antwort is defined and e.quelle | default('') == 'monitor' else this.attributes.get('antwort', '') }}
          frage: >-
            {% set e = trigger.event.data if trigger.id == 'geaendert' else {} %}
            {{ e.frage if e.antwort is defined and e.quelle | default('') == 'monitor' else this.attributes.get('frage', '') }}
          antwort_zeit: >-
            {% set e = trigger.event.data if trigger.id == 'geaendert' else {} %}
            {{ now().isoformat() if e.antwort is defined and e.quelle | default('') == 'monitor' else this.attributes.get('antwort_zeit', '') }}

  # Antwort am Monitor nur ein paar Stunden zeigen
  - binary_sensor:
      - name: Garten Antwort zeigen
        unique_id: garten_antwort_zeigen
        state: >-
          {% set z = state_attr('sensor.garten_aufgaben', 'antwort_zeit') %}
          {{ z not in [none, ''] and as_datetime(z) is not none and (now() - as_datetime(z)).total_seconds() < 6 * 3600
             and state_attr('sensor.garten_aufgaben', 'antwort') not in [none, ''] }}
