# Garten: Pflanzplan für den überdachten Garten (offen, Folien-Dach, Hochbeete) und Gemüsegarten (Erdstreifen) als Reiter "Garten"
# im Flur-Dashboard (www/garten.html) – am Monitor und im Handy-App.
# - Plan, Pflanzenwahl und Fotos liegen lokal in /config/www/garten_daten.json (nicht im Repository).
# - Pflegehinweise rechnet die Seite aus dem Wetter (weather.touchmonitor_home); die wichtigsten davon
#   stehen als "Garten heute" auf dem Start-Dashboard (sensor.garten_aufgaben, claude_tools/garten_aufgaben.py).
# - Foto-Check und Fragen beantwortet Claude über claude_tools/garten_ki.py (Schlüssel aus der
#   Anthropic-Integration, nicht im Repository).
# - Foto einer Pflanze an den Telegram-Bot schicken (Text dazu = Frage) → Claude prüft die Pflanze und antwortet
#   im Chat; das Ergebnis erscheint auch unter "Foto-Check" auf der Garten-Seite (Ablauf in packages/eingang.yaml).
# - Im Reiter "Fragen" der Garten-Seite (am Monitor: Knopf "Claude fragen" bei "Garten heute") kann man
#   Claude fragen oder melden, was erledigt ist ("Kürbis habe ich geerntet") – dann verschwindet die Aufgabe.
shell_command:
  # lange Texte kommen in Stücken (ein einzelnes Argument darf nicht beliebig lang sein)
  garten_schreiben: python3 /config/claude_tools/garten_speichern.py {{ b64 }}
  garten_ki_befehl: python3 /config/claude_tools/garten_ki.py {{ auftrag }} {{ bild }}
  garten_aufgaben_befehl: python3 /config/claude_tools/garten_aufgaben.py {{ wetter }}

script:
  garten_speichern:
    alias: Gartenplan speichern
    mode: queued
    fields:
      daten:
        description: Inhalt als JSON-Text
    sequence:
      - action: shell_command.garten_schreiben
        data:
          b64: >-
            {% set s = (daten if daten is string else (daten | to_json)) | base64_encode %}
            {% for i in range(0, s | length, 100000) %}{{ s[i:i + 100000] }} {% endfor %}
        response_variable: ergebnis
      - variables:
          antwort:
            ok: "{{ (ergebnis.stdout | default('') | trim).startswith('ok') }}"
            text: "{{ ergebnis.stdout | default('keine Antwort') }}"
      - if: "{{ not antwort.ok }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: garten
              title: Gartenplan speichern
              message: "{{ antwort.text }}"
      # To-dos auf dem Start-Dashboard gleich neu berechnen
      - event: garten_geaendert
      - stop: fertig
        response_variable: antwort

  garten_ki:
    alias: "Garten: Claude fragen / Foto prüfen"
    mode: parallel
    fields:
      auftrag:
        description: JSON mit art (foto/frage), frage, pflanze, beet, wetter …
      bild:
        description: Foto als Base64-JPEG (Stücke mit Leerzeichen getrennt), leer bei reinen Fragen
    sequence:
      - action: shell_command.garten_ki_befehl
        continue_on_error: true
        data:
          auftrag: "{{ (auftrag if auftrag is string else (auftrag | to_json)) | base64_encode }}"
          bild: "{{ bild | default('', true) }}"
        response_variable: ergebnis
      - variables:
          antwort:
            stdout: "{{ ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' }}"
          art: "{{ (auftrag if auftrag is mapping else (auftrag | from_json)).art | default('') }}"
      # nach Fragen/Meldungen die Aufgaben neu berechnen (Erledigtes verschwindet auch auf dem Monitor)
      - if: "{{ art == 'chat' }}"
        then:
          - event: garten_geaendert
      - stop: fertig
        response_variable: antwort

# Fotos per Telegram: siehe packages/eingang.yaml (erkennt Pflanze → Garten-Fotocheck, sonst Eingang fürs Haus-Handbuch)

# To-dos für das Start-Dashboard ("Garten heute"): aus Pflanzplan + Wettervorhersage,
# stündlich, beim Start und gleich nach jedem Speichern auf der Garten-Seite neu berechnet.
template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: 7
      - trigger: event
        event_type: garten_geaendert
    actions:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.touchmonitor_home
        data:
          type: daily
        response_variable: vorhersage
      - action: shell_command.garten_aufgaben_befehl
        continue_on_error: true
        data:
          wetter: >-
            {% set fc = vorhersage['weather.touchmonitor_home'].forecast if vorhersage is defined and vorhersage is mapping
                        and 'weather.touchmonitor_home' in vorhersage else [] %}
            {{ {'tage': fc[:5], 'jetzt': state_attr('weather.touchmonitor_home', 'temperature')} | to_json | base64_encode }}
        response_variable: ergebnis
      - variables:
          liste: >-
            {% set a = ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' %}
            {{ a if a is mapping else (a | from_json if (a | string).startswith('{') else {'aufgaben': [], 'bald': []}) }}
    sensor:
      - name: Garten Aufgaben
        unique_id: garten_aufgaben
        icon: mdi:sprout
        state: "{{ liste.aufgaben | default([]) | count }}"
        attributes:
          aufgaben: "{{ liste.aufgaben | default([]) }}"
          bald: "{{ liste.bald | default([]) }}"
          schluessel: "{{ liste.schluessel | default([]) }}"
          fehler: "{{ liste.fehler | default('') }}"
