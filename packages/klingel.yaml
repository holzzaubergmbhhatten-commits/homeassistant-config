# Klingeln (Ring am Hoftor und jede weitere Klingel, z. B. die neue an der Haustür):
# Klingelt es, zeigt der Touchmonitor sofort das Kamerabild mit Knopf "Hoftor öffnen"
# und nach 3 Minuten wieder das Dashboard. Zusätzlich Telegram-Nachricht mit Foto.
# Erkannt wird jede Ereignis-Entität mit Geräteklasse "doorbell" (oder Name mit klingel/doorbell/ding) – neue Klingeln
# funktionieren dadurch ohne Umbau. Foto: Kamera derselben Klingel, am Hoftor zuerst die Tapo Hof-Tor.
# Nachricht geht ausdrücklich an alle Chats aus input_text.telegram_empfaenger (ohne chat_id kam nach Updates nichts mehr an).
# Auf dem Monitor: Ring "Letzte Aufnahme" (camera.hoftor_letzte_aufnahme) + Tapo Hof-Tor.
#
# Foto: Vorher wird das alte Foto gelöscht und danach geprüft, ob ein NEUES Foto da ist – sonst wurde früher
# still das letzte alte Foto verschickt (z. B. vom 4.10.). Reihenfolge: go2rtc-Einzelbild Tapo → Ring,
# dann camera.snapshot; gibt es gar kein neues Foto, kommt die Nachricht ohne Bild.
# mode single: Die Klingel meldet ein Klingeln oft über mehrere Entitäten → nur EINE Nachricht pro Klingeln.
shell_command:
  # Gong-Ton aus dem Repository in den Medien-Ordner (dort finden ihn die HomePods über Music Assistant)
  klingel_gong_bereit: cp -u /config/claude_tools/klingel_gong.mp3 /media/klingel_gong.mp3
  klingel_foto_loeschen: rm -f /media/klingel.jpg
  klingel_foto_pruefen: sh -c 'test -s /media/klingel.jpg && echo ok || echo fehlt'

automation:
  - id: ring_klingel_hoftor
    alias: "Klingel: Kamera auf dem Monitor und Foto per Telegram"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set e = trigger.event.data %}
          {% set bs = e.entity_id is match('binary_sensor\.') and e.entity_id is search('klingel|doorbell|visitor|besucher|_ding')
             and e.old_state is not none and e.new_state is not none and e.old_state.state == 'off' and e.new_state.state == 'on' %}
          {{ bs or e.entity_id is match('event\.')
             and e.old_state is not none and e.new_state is not none
             and e.old_state.state not in ['unavailable', 'unknown']
             and e.new_state.state not in ['unavailable', 'unknown']
             and (e.new_state.attributes.device_class | default('')) not in ['motion']
             and ((e.new_state.attributes.device_class | default('')) == 'doorbell'
                  or e.entity_id is search('(klingel|doorbell)(_(ding|klingeln|klingel|gedrueckt|pressed))?$|_ding$')) }}
    actions:
      - variables:
          eid: "{{ trigger.event.data.entity_id }}"
          hoftor: "{{ 'hoftor' in eid }}"
          geraet: "{{ device_attr(eid, 'name_by_user') or device_attr(eid, 'name') or 'Klingel' }}"
          ort: "{{ 'am Hoftor' if hoftor else ('an der Haustür' if geraet is search('(?i)haus|tür|tuer|front|door') else '– ' ~ geraet) }}"
          eigene: >-
            {% set d = device_id(eid) %}
            {{ (device_entities(d) | select('match', 'camera\.') | reject('is_state', ['unknown', 'unavailable']) | list) if d else [] }}
          kameras: >-
            {% set tapo = ['camera.draussen_hot_tor_kamera'] if hoftor and states('camera.draussen_hot_tor_kamera') not in ['unknown', 'unavailable'] else [] %}
            {% set hof = (states.camera | rejectattr('state', 'in', ['unknown', 'unavailable']) | map(attribute='entity_id') | select('search', 'hoftor') | list) if hoftor else [] %}
            {{ (tapo + eigene + hof) | unique | list }}
          streams: >-
            {{ (['draussen_hot_tor_kamera', 'hoftor_klingel'] if hoftor else []) + (eigene | map('replace', 'camera.', '') | list) }}
          chats: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list }}
          uhrzeit: "{{ now().strftime('%H:%M') }}"
      # Gong + Ansage auf allen HomePods/Lautsprechern – läuft nebenher, damit Monitor und Telegram nicht warten
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.klingel_gong
        data:
          variables:
            ort: "{{ ort }}"
      # Bildschirm wecken (nachts bleibt die 1-Minuten-Abschaltung, aber erst nach 3 Minuten)
      - action: script.monitor_an
        continue_on_error: true
        data:
          timeout: "{{ 180 if is_state('binary_sensor.monitor_nachtmodus', 'on') else 0 }}"
      - action: rest_command.kiosk_url_oeffnen
        continue_on_error: true
        data:
          url: http://localhost:8123/flur-display/klingel
      # altes Foto weg, dann der Reihe nach versuchen, bis ein neues Foto da ist
      - action: shell_command.klingel_foto_loeschen
        continue_on_error: true
      - variables:
          foto_ok: false
      # 1. Wahl: aktuelles Einzelbild über go2rtc (dieselbe Quelle wie das Livebild auf dem Monitor)
      - repeat:
          for_each: "{{ streams }}"
          sequence:
            - if: "{{ not foto_ok }}"
              then:
                - action: shell_command.kamera_foto
                  continue_on_error: true
                  data:
                    stream: "{{ repeat.item }}"
                    datei: /media/klingel.jpg
                  response_variable: go2rtc
                - variables:
                    foto_ok: "{{ go2rtc is defined and go2rtc is mapping and (go2rtc.stdout | default('') | trim) == 'ok' }}"
      # 2. Wahl: Schnappschuss der Home-Assistant-Kamera
      - repeat:
          for_each: "{{ kameras if not foto_ok else [] }}"
          sequence:
            - if: "{{ not foto_ok }}"
              then:
                - action: camera.snapshot
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    filename: /media/klingel.jpg
                - action: shell_command.klingel_foto_pruefen
                  continue_on_error: true
                  response_variable: pruefung
                - variables:
                    foto_ok: "{{ pruefung is defined and pruefung is mapping and (pruefung.stdout | default('') | trim) == 'ok' }}"
      # an jeden Empfänger einzeln (mit Foto, sonst als Text)
      - repeat:
          for_each: "{{ chats }}"
          sequence:
            - if: "{{ foto_ok }}"
              then:
                - action: telegram_bot.send_photo
                  continue_on_error: true
                  data:
                    config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
                    chat_id: "{{ repeat.item | int }}"
                    file: /media/klingel.jpg
                    caption: "🔔 Es klingelt {{ ort }} ({{ uhrzeit }} Uhr)"
              else:
                - action: telegram_bot.send_message
                  continue_on_error: true
                  data:
                    config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
                    chat_id: "{{ repeat.item | int }}"
                    message: "🔔 Es klingelt {{ ort }} ({{ uhrzeit }} Uhr){{ '' if foto_ok else ' – kein aktuelles Kamerabild verfügbar.' }}"
      - delay: "00:03:00"
      - action: rest_command.kiosk_dashboard
        continue_on_error: true
      - action: script.monitor_an
        continue_on_error: true
        data:
          timeout: "{{ 60 if is_state('binary_sensor.monitor_nachtmodus', 'on') else 0 }}"

input_boolean:
  # Einschalten = Gong auf den HomePods aus (z. B. wenn das Baby schläft). Telegram und Monitor laufen weiter.
  klingel_gong_pause:
    name: Klingel-Gong auf den HomePods pausieren
    icon: mdi:bell-sleep

script:
  klingel_gong:
    alias: "Klingel: Gong und Ansage auf allen Lautsprechern"
    mode: single
    max_exceeded: silent
    fields:
      ort:
        description: z. B. „am Hoftor“ oder „an der Haustür“
    sequence:
      - condition: state
        entity_id: input_boolean.klingel_gong_pause
        state: "off"
      - variables:
          ziel: "{{ integration_entities('music_assistant') | select('match', 'media_player\\.') | reject('is_state', 'unavailable') | list }}"
      - action: shell_command.klingel_gong_bereit
        continue_on_error: true
      - action: media_player.play_media
        continue_on_error: true
        target:
          entity_id: "{{ ziel }}"
        data:
          media_content_id: media-source://media_source/local/klingel_gong.mp3
          media_content_type: music
          announce: true
      - delay: "00:00:04"
      - action: script.jarvis_durchsage
        continue_on_error: true
        data:
          text: "Es klingelt {{ ort | default('an der Tür', true) }}."
          lautstaerke: 50
