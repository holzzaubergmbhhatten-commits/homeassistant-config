# Taschengeld-Plan (Seite "Schule & Taschengeld" auf dem Flur-Monitor).
# Pro erledigter Haushaltsaufgabe gibt es 50 Cent extra. Antippen zählt mit,
# "Ausgezahlt" setzt die Woche zurück. Aufteilung wie auf der Magnettafel.
counter:
  taschengeld_extra:
    name: Taschengeld – erledigte Aufgaben
    icon: mdi:piggy-bank
    initial: 0
    step: 1
    minimum: 0
    restore: true

input_text:
  taschengeld_liste:
    name: Taschengeld – diese Woche erledigt
    icon: mdi:format-list-checks
    max: 255

script:
  taschengeld_aufgabe:
    alias: "Taschengeld: Aufgabe erledigt (+50 Cent)"
    icon: mdi:hand-coin
    mode: queued
    fields:
      aufgabe:
        name: Aufgabe
        selector:
          text:
    sequence:
      - action: counter.increment
        target:
          entity_id: counter.taschengeld_extra
      - action: input_text.set_value
        target:
          entity_id: input_text.taschengeld_liste
        data:
          value: >-
            {% set alt = states('input_text.taschengeld_liste') %}
            {{ ((aufgabe ~ ((' · ' ~ alt) if alt not in ['', 'unknown', 'unavailable'] else '')))[:250] }}

  taschengeld_rueckgaengig:
    alias: "Taschengeld: letzte Aufgabe zurücknehmen"
    icon: mdi:undo
    sequence:
      - action: counter.decrement
        target:
          entity_id: counter.taschengeld_extra
      - action: input_text.set_value
        target:
          entity_id: input_text.taschengeld_liste
        data:
          value: >-
            {% set teile = states('input_text.taschengeld_liste').split(' · ') %}
            {{ teile[1:] | join(' · ') if teile | count > 1 else '' }}

  taschengeld_ausgezahlt:
    alias: "Taschengeld: ausgezahlt – neue Woche"
    icon: mdi:cash-check
    sequence:
      - action: counter.reset
        target:
          entity_id: counter.taschengeld_extra
      - action: input_text.set_value
        target:
          entity_id: input_text.taschengeld_liste
        data:
          value: ""
