# Heizung smarter (Vitocal 200-A + wasserführender Kamin Spartherm Varia 1V H2O XL am Pufferspeicher)
#
# 1) Sonnen-Warmwasser: Bei Sonnenüberschuss (Einspeisung, Speicher voll) heizt die Wärmepumpe das Warmwasser auf 60 °C
#    („Einmalige Ladung“), statt den Strom für 7,9 ct einzuspeisen. Abends geht die Solltemperatur wieder zurück.
#    Wärmepumpe zuerst, weil sie aus 1 kWh Strom ca. 3,3 kWh Wärme macht (Heizstab nur 1 kWh).
# 2) Kamin erkennen: gemessen am Kamin-Vorlauf (Shelly „Kamin“ mit Fühlern an Rohr 1 = Vorlauf, Rohr 3 = Rücklauf);
#    ohne Fühlerwert geschätzt (Puffer wird schnell wärmer, obwohl der Kompressor aus ist).
#    Später genauer über ein Relais der Kamin-Steuerung S-Thermatik NEO (Funktion „Combustion“/„Abbrand“) an einem Shelly-Eingang.
# 3) Wärme abladen: Ist der Puffer durch den Kamin sehr heiß, wird die Raum-Solltemperatur des Fußbodenheizkreises (Heizkreis 2)
#    der Vitocal für eine Weile angehoben, damit die Wärme ins Haus geht statt im Puffer zu stehen. Danach zurück.
#    Wirkt erst voll, wenn die Berker-Raumregler die Ventile nicht schließen (dafür später Shellys parallel an der Regelbasis).
#
# Alles abschaltbar über die Schalter „Sonnen-Warmwasser“ und „Kamin-Wärme ins Haus“.

input_boolean:
  pv_warmwasser:
    name: Sonnen-Warmwasser
    icon: mdi:solar-power-variant
  pv_warmwasser_laeuft:
    name: Sonnen-Warmwasser läuft gerade
    icon: mdi:water-boiler
  kamin_waerme_abladen:
    name: Kamin-Wärme ins Haus
    icon: mdi:fireplace
  kamin_waerme_laeuft:
    name: Kamin-Wärme wird gerade abgegeben
    icon: mdi:heat-wave
  # Knopf „Kamin-Modus“ auf dem Monitor: beim Anheizen einschalten (geht auch von selbst an, wenn der Kamin erkannt wird)
  kamin_modus:
    name: Kamin-Modus
    icon: mdi:fireplace

input_number:
  ww_soll_gemerkt:
    name: Warmwasser-Soll vorher (gemerkt)
    min: 10
    max: 60
    step: 1
    unit_of_measurement: °C
    mode: box
  ww_soll_kamin_gemerkt:
    name: Warmwasser-Soll vor dem Kamin-Modus (gemerkt)
    min: 10
    max: 60
    step: 1
    unit_of_measurement: °C
    mode: box
  hk2_soll_gemerkt:
    name: Heizkreis 2 Raum-Soll vorher (gemerkt)
    min: 10
    max: 30
    step: 1
    unit_of_measurement: °C
    mode: box

sensor:
  # Kamin-Laufzeit (aus „Kamin heizt“) – für die Kamin-Seite am Monitor
  - platform: history_stats
    name: Kamin Laufzeit heute
    unique_id: kamin_laufzeit_heute
    entity_id: binary_sensor.kamin_heizt
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Kamin Laufzeit Woche
    unique_id: kamin_laufzeit_woche
    entity_id: binary_sensor.kamin_heizt
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(days=now().weekday()) }}"
    end: "{{ now() }}"
  # wie schnell sich der Puffer gerade ändert (K pro Stunde)
  - platform: derivative
    name: Puffer Änderung
    unique_id: puffer_aenderung
    source: sensor.hwr_warmepumpe_puffertemperatur_oben
    unit_time: h
    time_window: "00:30:00"
    round: 1

template:
  - binary_sensor:
      - name: Kamin heizt
        unique_id: kamin_heizt
        icon: mdi:fireplace
        # Gemessen: Fühler am Kamin-Vorlauf (Shelly „Kamin“, Rohr 1 oben am Puffer) ist heiß und wärmer als der Puffer oben.
        # Ist der Ofen aus, hat das Rohr höchstens Puffertemperatur. Fällt der Fühler aus: Schätzung wie bisher.
        state: >-
          {% set vl = states('sensor.kamin_vorlauf') | float(none) %}
          {% set po = states('sensor.hwr_warmepumpe_puffertemperatur_oben') | float(none) %}
          {% if vl is not none %}
            {{ vl > 55 and (po is none or vl > po + 3) }}
          {% else %}
            {{ states('sensor.puffer_anderung') | float(0) > 2
               and is_state('binary_sensor.hwr_warmepumpe_kompressor', 'off') }}
          {% endif %}
        delay_on: "00:03:00"
        delay_off: "00:20:00"
        attributes:
          hinweis: >-
            {{ 'gemessen am Kamin-Vorlauf' if states('sensor.kamin_vorlauf') | float(none) is not none
               else 'geschätzt aus Pufferanstieg bei ausgeschaltetem Kompressor' }}
          vorlauf: "{{ states('sensor.kamin_vorlauf') }}"
          ruecklauf: "{{ states('sensor.kamin_rucklauf') }}"
  - sensor:
      # Temperaturunterschied Kamin-Vorlauf zu Puffer-Mitte (Rohr 3) – groß = der Kamin lädt kräftig
      - name: Kamin Spreizung
        unique_id: kamin_spreizung
        unit_of_measurement: K
        icon: mdi:thermometer-lines
        state: >-
          {% set vl = states('sensor.kamin_vorlauf') | float(none) %}
          {% set rl = states('sensor.kamin_rucklauf') | float(none) %}
          {{ (vl - rl) | round(1) if vl is not none and rl is not none else none }}
      # Geschätzte Wärme vom Kamin: Laufzeit × 5 kW (Spartherm Varia 1V H2O XL gibt bis 6 kW ans Wasser).
      # Echte Messung nur mit Wärmemengenzähler im Kamin-Kreis.
      - name: Kamin Wärme heute
        unique_id: kamin_waerme_heute
        unit_of_measurement: kWh
        icon: mdi:fire
        state: "{{ (states('sensor.kamin_laufzeit_heute') | float(0) * 5) | round(1) }}"
        attributes:
          hinweis: geschätzt (Laufzeit × 5 kW)
      - name: Kamin Wärme Woche
        unique_id: kamin_waerme_woche
        unit_of_measurement: kWh
        icon: mdi:fire
        state: "{{ (states('sensor.kamin_laufzeit_woche') | float(0) * 5) | round(1) }}"
        attributes:
          hinweis: geschätzt (Laufzeit × 5 kW)
  - sensor:
      - name: Sonnenüberschuss
        unique_id: sonnen_ueberschuss
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # Einspeisung als positive Zahl (der Zähler zeigt Einspeisung mit Minus)
        state: "{{ [0, -(states('sensor.dachboden_wechselrichter_mit_speicher_netzbezug_und_einspeisung') | float(0))] | max | round(0) }}"

automation:
  # ---------- 1) Sonnen-Warmwasser ----------
  - id: pv_warmwasser_start
    alias: "Heizung: Sonnen-Warmwasser starten"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.sonnenuberschuss
        above: 2000
        for: "00:10:00"
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.pv_warmwasser
        state: "on"
      - condition: state
        entity_id: input_boolean.pv_warmwasser_laeuft
        state: "off"
      - condition: state
        entity_id: input_boolean.kamin_modus
        state: "off"
      - condition: time
        after: "09:00:00"
        before: "16:30:00"
      - condition: numeric_state
        entity_id: sensor.sonnenuberschuss
        above: 2000
      - condition: numeric_state
        entity_id: sensor.dachboden_wechselrichter_mit_speicher_batterie
        above: 89
      # Warmwasser noch nicht heiß (z. B. vom Kamin)
      - condition: numeric_state
        entity_id: sensor.hwr_warmepumpe_ww_speichertemperatur
        below: 56
      - condition: state
        entity_id: binary_sensor.hwr_warmepumpe_kompressor
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.ww_soll_gemerkt
        data:
          value: "{{ [states('number.hwr_warmepumpe_ww_temperatur') | float(50), 59] | min }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pv_warmwasser_laeuft
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.hwr_warmepumpe_ww_temperatur
        data:
          value: 60
      - delay: "00:00:20"
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.hwr_warmepumpe_einmalige_ladung_aktivieren
      - action: logbook.log
        data:
          name: Sonnen-Warmwasser
          message: >-
            gestartet: {{ states('sensor.sonnenuberschuss') }} W Überschuss, Speicher {{ states('sensor.dachboden_wechselrichter_mit_speicher_batterie') }} %,
            Warmwasser {{ states('sensor.hwr_warmepumpe_ww_speichertemperatur') }} °C → Ziel 60 °C

  - id: pv_warmwasser_ende
    alias: "Heizung: Sonnen-Warmwasser beenden"
    mode: single
    triggers:
      - trigger: time
        at: "17:30:00"
      - trigger: numeric_state
        entity_id: sensor.hwr_warmepumpe_ww_speichertemperatur
        above: 58.5
        for: "00:05:00"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pv_warmwasser_laeuft
        state: "on"
    actions:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.hwr_warmepumpe_ww_temperatur
        data:
          value: "{{ states('input_number.ww_soll_gemerkt') | int(50) if states('input_number.ww_soll_gemerkt') | int(0) >= 40 else 50 }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pv_warmwasser_laeuft
      - action: logbook.log
        data:
          name: Sonnen-Warmwasser
          message: "beendet, Warmwasser {{ states('sensor.hwr_warmepumpe_ww_speichertemperatur') }} °C, Soll wieder {{ states('input_number.ww_soll_gemerkt') | int(50) }} °C"

  # ---------- 3) Kamin-Wärme ins Haus ----------
  - id: kamin_waerme_start
    alias: "Heizung: Kamin-Wärme ins Haus abgeben"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.hwr_warmepumpe_puffertemperatur_oben
        above: 62
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.kamin_waerme_abladen
        state: "on"
      - condition: state
        entity_id: input_boolean.kamin_waerme_laeuft
        state: "off"
      - condition: state
        entity_id: binary_sensor.hwr_warmepumpe_kompressor
        state: "off"
      # nur in der Heizzeit und nicht, wenn es draußen warm ist
      - condition: numeric_state
        entity_id: sensor.hwr_warmepumpe_aussentemperatur
        below: 15
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.hk2_soll_gemerkt
        data:
          value: "{{ states('number.hwr_warmepumpe_normaltemperatur_2') | float(22) }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kamin_waerme_laeuft
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.hwr_warmepumpe_normaltemperatur_2
        data:
          value: "{{ [states('number.hwr_warmepumpe_normaltemperatur_2') | int(22) + 2, 25] | min }}"
      # Stellantriebe der Fußbodenheizung aufmachen: Shelly 1 Mini parallel zum Berker, in HA „switch.zone_…“ (z. B. switch.zone_schlafen)
      - variables:
          zonen: "{{ states.switch | selectattr('entity_id', 'match', 'switch\\.zone_') | map(attribute='entity_id') | list }}"
      - if: "{{ zonen | count > 0 }}"
        then:
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ zonen }}"
      - action: logbook.log
        data:
          name: Kamin-Wärme
          message: "Puffer {{ states('sensor.hwr_warmepumpe_puffertemperatur_oben') }} °C – Fußbodenheizung kurz 2 °C höher, damit die Wärme ins Haus geht"

  - id: kamin_waerme_ende
    alias: "Heizung: Kamin-Wärme abgegeben, zurückstellen"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.hwr_warmepumpe_puffertemperatur_oben
        below: 50
        for: "00:10:00"
      - trigger: state
        entity_id: binary_sensor.hwr_warmepumpe_kompressor
        to: "on"
        for: "00:05:00"
      - trigger: state
        entity_id: input_boolean.kamin_waerme_abladen
        to: "off"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.kamin_waerme_laeuft
        state: "on"
    actions:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.hwr_warmepumpe_normaltemperatur_2
        data:
          value: "{{ states('input_number.hk2_soll_gemerkt') | int(22) if states('input_number.hk2_soll_gemerkt') | int(0) >= 15 else 22 }}"
      # Stellantriebe wieder den Berker-Reglern überlassen
      - variables:
          zonen: "{{ states.switch | selectattr('entity_id', 'match', 'switch\\.zone_') | map(attribute='entity_id') | list }}"
      - if: "{{ zonen | count > 0 }}"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ zonen }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kamin_waerme_laeuft
      - action: logbook.log
        data:
          name: Kamin-Wärme
          message: "zurückgestellt auf {{ states('input_number.hk2_soll_gemerkt') | int(22) }} °C (Puffer {{ states('sensor.hwr_warmepumpe_puffertemperatur_oben') }} °C)"

  # ---------- Puffer voll: nicht mehr nachlegen ----------
  # Fühler „Kamin Rücklauf“ sitzt an Rohr 3 (Mitte des Puffers). Ist der beim Heizen über 65 °C, ist der Puffer fast voll –
  # dann kann der Kamin seine Wärme nicht mehr loswerden. Oder der Puffer oben ist über 80 °C.
  - id: kamin_puffer_voll
    alias: "Heizung: Puffer voll – nicht mehr nachlegen"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.kamin_rucklauf
        above: 65
        for: "00:05:00"
      - trigger: numeric_state
        entity_id: sensor.hwr_warmepumpe_puffertemperatur_oben
        above: 80
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.kamin_heizt
        state: "on"
      # höchstens alle 3 Stunden
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 10800 }}
    actions:
      - variables:
          text: >-
            🔥 Puffer ist fast voll – bitte kein Holz mehr nachlegen.
            Puffer oben {{ states('sensor.hwr_warmepumpe_puffertemperatur_oben') | float(0) | round(0) | int }} °C,
            Mitte {{ states('sensor.kamin_rucklauf') | float(0) | round(0) | int }} °C,
            Kamin-Vorlauf {{ states('sensor.kamin_vorlauf') | float(0) | round(0) | int }} °C.
      # an alle Empfänger (Marco und Mirka)
      - repeat:
          for_each: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list }}
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
                chat_id: "{{ repeat.item | int }}"
                message: "{{ text }}"
      - action: script.jarvis_monitor_nachricht
        continue_on_error: true
        data:
          text: "{{ text }}"
          minuten: 120

  # ---------- Kamin-Modus ----------
  # AN: Warmwasser-Soll der Wärmepumpe auf 45 °C, damit sie nicht kurz vorher selbst aufheizt – das macht gleich der Kamin.
  - id: kamin_modus_an
    alias: "Heizung: Kamin-Modus an"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.kamin_modus
        to: "on"
      - trigger: state
        entity_id: binary_sensor.kamin_heizt
        to: "on"
    actions:
      - if: "{{ trigger.entity_id == 'binary_sensor.kamin_heizt' and is_state('input_boolean.kamin_modus', 'on') }}"
        then:
          - stop: läuft schon
      - action: input_number.set_value
        target:
          entity_id: input_number.ww_soll_kamin_gemerkt
        data:
          value: >-
            {% set v = states('number.hwr_warmepumpe_ww_temperatur') | int(50) %}
            {{ v if 45 < v <= 58 else (states('input_number.ww_soll_gemerkt') | int(50) if states('input_number.ww_soll_gemerkt') | int(0) >= 40 else 50) }}
      - if: "{{ is_state('input_boolean.kamin_modus', 'off') }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kamin_modus
      - if: "{{ states('number.hwr_warmepumpe_ww_temperatur') | int(50) > 45 }}"
        then:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.hwr_warmepumpe_ww_temperatur
            data:
              value: 45
      - action: logbook.log
        data:
          name: Kamin-Modus
          message: "an – Wärmepumpe hält sich mit dem Warmwasser zurück (Soll 45 °C), der Kamin übernimmt"

  - id: kamin_modus_aus
    alias: "Heizung: Kamin-Modus aus"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.kamin_modus
        to: "off"
        id: knopf
      - trigger: state
        entity_id: binary_sensor.kamin_heizt
        to: "off"
        for: "01:00:00"
        id: auto
      - trigger: state
        entity_id: input_boolean.kamin_modus
        to: "on"
        for: "08:00:00"
        id: auto
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'knopf' or is_state('input_boolean.kamin_modus', 'on')
             or (trigger.id == 'start' and states('number.hwr_warmepumpe_ww_temperatur') | int(50) == 45 and is_state('input_boolean.kamin_modus', 'off')) }}
    actions:
      - if: "{{ trigger.id == 'start' and is_state('input_boolean.kamin_modus', 'on') and not is_state('binary_sensor.kamin_heizt', 'on') }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kamin_modus
      - if: "{{ trigger.id == 'auto' }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kamin_modus
      - if: "{{ is_state('input_boolean.kamin_modus', 'off') }}"
        then:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.hwr_warmepumpe_ww_temperatur
            data:
              value: "{{ states('input_number.ww_soll_kamin_gemerkt') | int(50) if states('input_number.ww_soll_kamin_gemerkt') | int(0) >= 40 else 50 }}"
          - action: logbook.log
            data:
              name: Kamin-Modus
              message: "aus – Warmwasser-Soll wieder {{ states('input_number.ww_soll_kamin_gemerkt') | int(50) }} °C"

  # Schalter beim ersten Einrichten einmal einschalten (danach bestimmt Marco)
  - id: heizung_smart_einrichten
    alias: "Heizung: smarte Funktionen einmalig einschalten"
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: template
        value_template: "{{ states('input_number.ww_soll_gemerkt') | int(0) < 40 and is_state('input_boolean.pv_warmwasser_laeuft', 'off') }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.ww_soll_gemerkt
        data:
          value: "{{ states('number.hwr_warmepumpe_ww_temperatur') | int(50) if states('number.hwr_warmepumpe_ww_temperatur') | int(0) >= 40 else 50 }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hk2_soll_gemerkt
        data:
          value: "{{ states('number.hwr_warmepumpe_normaltemperatur_2') | int(22) }}"
      - action: input_boolean.turn_on
        target:
          entity_id: [input_boolean.pv_warmwasser, input_boolean.kamin_waerme_abladen]
