# Ruhezeiten des Touchmonitors (Kiosk-App REST-API):
# In der Ruhezeit geht der Bildschirm nach 1 Minute ohne Berührung aus, ein Antippen weckt ihn wieder.
# Sonst bleibt er an. Klingelt es, geht er sofort an (siehe klingel.yaml).
# Ruhezeiten: jede Nacht 22:30–6:30, zusätzlich Montag bis Freitag 8:00–14:00 (Strom sparen).
# Am Wochenende tagsüber durchgehend an.
rest_command:
  kiosk_display_on:
    url: "http://localhost:8080/display_on"
    method: POST
    content_type: "application/json"
    # Achtung: die Kiosk-App lehnt "timeout": 0 ab (Fehler 400) → für "nie aus" script.monitor_an nehmen
    payload: >-
      {% if timeout | default(0) | int > 0 %}{"timeout": {{ timeout | int }}}{% else %}{}{% endif %}
  kiosk_xset:
    url: "http://localhost:8080/xset"
    method: POST
    content_type: "application/json"
    payload: '{{ {"args": args} | to_json }}'

script:
  monitor_an:
    alias: Monitor einschalten und Abschaltzeit setzen
    description: timeout 0 = nie ausschalten, sonst Sekunden ohne Berührung bis zum Ausschalten.
    mode: queued
    fields:
      timeout:
        description: Sekunden bis zum Ausschalten, 0 = nie
        example: 60
    sequence:
      - action: rest_command.kiosk_display_on
        continue_on_error: true
        data:
          timeout: "{{ timeout | default(0) | int }}"
      - if: "{{ timeout | default(0) | int == 0 }}"
        then:
          - action: rest_command.kiosk_xset
            continue_on_error: true
            data:
              args: "s off -dpms"

template:
  - binary_sensor:
      # Name bleibt "Nachtmodus" (wird an mehreren Stellen benutzt), gilt aber für alle Ruhezeiten
      - name: Monitor Nachtmodus
        unique_id: monitor_nachtmodus
        icon: mdi:weather-night
        state: >-
          {% set t = now().strftime('%H:%M') %}
          {{ t >= '22:30' or t < '06:30'
             or (now().weekday() < 5 and '08:00' <= t < '14:00') }}

automation:
  - id: monitor_nachtmodus
    alias: "Monitor: in Ruhezeiten nach 1 Minute ausschalten, sonst an"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "22:30:00"
      - trigger: time
        at: "06:30:00"
      - trigger: time
        at: "08:00:00"
      - trigger: time
        at: "14:00:00"
      # Tagsüber regelmäßig nachstellen: die Kiosk-App fällt nach einem Neustart auf
      # ihre eigene Abschaltzeit zurück (Standard 10 Minuten)
      - trigger: time_pattern
        minutes: "/5"
        id: tagsueber
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id != 'tagsueber' or is_state('binary_sensor.monitor_nachtmodus', 'off') }}
    actions:
      - delay: 5
      - action: script.monitor_an
        continue_on_error: true
        data:
          timeout: "{{ 60 if is_state('binary_sensor.monitor_nachtmodus', 'on') else 0 }}"
