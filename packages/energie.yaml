# Rückblick von Viessmann für die Energie-Seite (www/energie.html): claude_tools/viessmann_verlauf.py holt einmal am Tag
# die Tages-, Monats- und Jahreslisten der Anlage (Strom und Wärme der Wärmepumpe …) und archiviert sie in
# /config/viessmann_verlauf.json. So zeigt die Seite auch Monate vor der Einrichtung.
shell_command:
  viessmann_verlauf: python3 /config/claude_tools/viessmann_verlauf.py {{ aktion }} {{ daten | default('') }}

script:
  energie_verlauf:
    alias: Energie Rückblick von Viessmann
    icon: mdi:chart-bar
    mode: queued
    fields:
      aktion:
        description: "lesen (Archiv), holen (jetzt bei Viessmann abrufen) oder import (Export aus dem Energieportal)"
      daten:
        description: "nur bei import: Werte als JSON-Text {monat: {JJJJ-MM: {pv, bezug, …}}, tag: {…}}"
    sequence:
      - action: shell_command.viessmann_verlauf
        continue_on_error: true
        data:
          aktion: "{{ aktion | default('lesen') if aktion | default('lesen') in ['holen', 'import'] else 'lesen' }}"
          daten: >-
            {% if aktion | default('') == 'import' %}{% set s = (daten if daten is string else (daten | to_json)) | base64_encode %}
            {% for i in range(0, s | length, 100000) %}{{ s[i:i + 100000] }} {% endfor %}{% endif %}
        response_variable: antwort
      - variables:
          ergebnis: >-
            {% set a = antwort.stdout | default('') if antwort is defined and antwort is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': 'keine Antwort'} }}
      - stop: fertig
        response_variable: ergebnis

automation:
  - id: energie_viessmann_rueckblick_holen
    alias: "Energie: Rückblick von Viessmann holen"
    mode: single
    triggers:
      - trigger: time
        at: "03:17:00"
      - trigger: homeassistant
        event: start
    actions:
      - if: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: "00:05:00"
      - action: shell_command.viessmann_verlauf
        continue_on_error: true
        data:
          aktion: holen

  # Einmalige Erinnerung an Marco: Home Assistant Cloud (Nabu Casa) bezahlen – Testphase endet am 31.10.2026.
  # Kommt am 29. und 30.10. abends (kann danach gelöscht werden).
  - id: erinnerung_nabu_casa_2026
    alias: "Erinnerung: Home Assistant Cloud aktivieren"
    mode: single
    triggers:
      - trigger: time
        at: "18:31:00"
    conditions:
      - condition: template
        value_template: "{{ now().strftime('%Y-%m-%d') in ['2026-10-29', '2026-10-30'] }}"
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
          message: >-
            ☁️ Erinnerung: Die Testphase von Home Assistant Cloud (Nabu Casa) endet am 31.10.
            Bitte in Home Assistant unter Einstellungen → Home Assistant Cloud das Abo abschließen (Jahresabo ist günstiger).
            Wichtig auch für den Umzug auf den neuen Rechner (Sicherung über die Cloud).
