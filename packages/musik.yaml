# Musik über Music Assistant (Apple Music → HomePods/Sonos).
# Die Music-Assistant-Lautsprecher werden über ihren Namen gefunden (wie in Music Assistant:
# "Küche", "Terrasse", "Badezimmer", "Schlafzimmer", "Muckis Zimmer", …).
script:
  musik_playlist:
    alias: "Musik: Playlist in einem Raum abspielen"
    icon: mdi:playlist-music
    mode: parallel
    fields:
      raum:
        name: Raum
        description: Name des Lautsprechers in Music Assistant, z. B. Küche
        required: true
        selector:
          text:
      playlist:
        name: Playlist
        description: Name der Playlist in Apple Music / Music Assistant
        default: Favoriten
        selector:
          text:
    sequence:
      - variables:
          ziel: >-
            {{ integration_entities('music_assistant')
               | select('match', 'media_player\.')
               | select('is_state_attr', 'friendly_name', raum) | list }}
      - if:
          - condition: template
            value_template: "{{ ziel | count > 0 }}"
        then:
          - action: music_assistant.play_media
            target:
              entity_id: "{{ ziel }}"
            data:
              media_id: "{{ playlist | default('Favoriten', true) }}"
              media_type: playlist
              enqueue: replace
        else:
          - action: persistent_notification.create
            data:
              title: Musik
              message: "Lautsprecher „{{ raum }}“ wurde in Music Assistant nicht gefunden."

  musik_dazuholen:
    alias: "Musik: laufende Musik zusätzlich in diesem Raum spielen"
    icon: mdi:speaker-multiple
    mode: parallel
    fields:
      raum:
        name: Raum
        description: Name des Lautsprechers in Music Assistant, z. B. Terrasse
        required: true
        selector:
          text:
    sequence:
      - variables:
          ma: >-
            {{ integration_entities('music_assistant') | select('match', 'media_player\.') | list }}
          ziel: >-
            {{ ma | select('is_state_attr', 'friendly_name', raum) | first | default('', true) }}
          quelle: >-
            {{ ma | select('is_state', 'playing') | reject('eq', ziel) | first | default('', true) }}
      - if:
          - condition: template
            value_template: "{{ ziel != '' and quelle != '' }}"
        then:
          - action: media_player.join
            target:
              entity_id: "{{ quelle }}"
            data:
              group_members:
                - "{{ ziel }}"
        else:
          - action: persistent_notification.create
            data:
              title: Musik
              message: >-
                {{ 'Gerade läuft nirgends Musik über Music Assistant.' if quelle == ''
                   else 'Lautsprecher „' ~ raum ~ '“ wurde in Music Assistant nicht gefunden.' }}

  musik_hier_aus:
    alias: "Musik: nur in diesem Raum ausschalten"
    icon: mdi:speaker-off
    mode: parallel
    fields:
      raum:
        name: Raum
        required: true
        selector:
          text:
    sequence:
      - variables:
          ziel: >-
            {{ integration_entities('music_assistant') | select('match', 'media_player\.')
               | select('is_state_attr', 'friendly_name', raum) | first | default('', true) }}
      - condition: template
        value_template: "{{ ziel != '' }}"
      - action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: "{{ ziel }}"
      - delay: 2
      - if:
          - condition: template
            value_template: "{{ is_state(ziel, 'playing') }}"
        then:
          - action: media_player.media_pause
            continue_on_error: true
            target:
              entity_id: "{{ ziel }}"
