# Jarvis – gemeinsame Werkzeuge für den Sprachassistenten (Handy / Voice PE) UND den Telegram-Bot.
# Beide benutzen denselben Claude-Gesprächsagenten. Alles, was hier als Skript steht, kann Claude
# aufrufen, sobald das Skript unter Einstellungen → Sprachassistenten → Entitäten freigeben
# für Assist freigegeben ist. So gibt es jede Funktion nur einmal.
# Datenschutz: Buchungen nur als Zeiträume, ohne Gästenamen (keine Kundendaten an die KI).
# Telegram-Empfänger kommen aus input_text.telegram_empfaenger (keine Chat-IDs im Repository).

input_text:
  flur_nachricht:
    name: Nachricht auf dem Flur-Monitor
    icon: mdi:message-text
    max: 255

# Welche Stimme Durchsagen und Morgen-Ansage benutzen (ElevenLabs kostet Credits)
input_select:
  jarvis_ansage_stimme:
    name: Stimme für Durchsagen
    icon: mdi:account-voice
    options:
      - Home Assistant Cloud
      - ElevenLabs
      - OpenAI

input_boolean:
  # Einschalten = pausieren (neue Schalter starten ausgeschaltet, also ist alles zuerst aktiv)
  morgen_homepod_pause:
    name: Morgen-Ansage HomePods pausieren
    icon: mdi:speaker-off
  abend_check_pause:
    name: Abend-Check Licht pausieren
    icon: mdi:lightbulb-night

timer:
  flur_nachricht:
    name: Nachricht auf dem Monitor – Restzeit
    restore: true

template:
  - sensor:
      # Wer hat zuletzt (vor weniger als 3 Minuten) dem Bot geschrieben? Sonst der erste Empfänger.
      # Damit landen Fotos/Erinnerungen bei der Person, die gefragt hat.
      - name: Jarvis Telegram Ziel
        unique_id: jarvis_telegram_ziel
        icon: mdi:send
        state: >-
          {% set v = states('input_text.telegram_vorherige') | string %}
          {% set s = states.input_text.telegram_vorherige %}
          {% set frisch = s is not none and (now() - s.last_changed).total_seconds() < 180 %}
          {% set erster = (states('input_text.telegram_empfaenger') | string).split(';')
             | reject('in', ['', 'unknown', 'unavailable']) | first | default('') %}
          {{ ('x' ~ v.split('~', 1)[0]) if frisch and '~' in v else ('x' ~ erster if erster else 'keiner') }}

script:
  jarvis_kamerabild:
    alias: Jarvis Kamerabild schicken
    description: >-
      Macht ein aktuelles Foto mit einer oder allen Außenkameras und schickt es per Telegram aufs Handy.
      Nutze das, wenn jemand sehen möchte, was draußen los ist ("Zeig mir den Hof", "Wer ist am Tor?",
      "Schick mir alle Kamerabilder"). Antworte danach kurz, dass das Bild geschickt wurde.
    icon: mdi:cctv
    mode: queued
    fields:
      kamera:
        name: Kamera
        description: >-
          Welche Kamera, z. B. "Tor", "Hof hinten", "Giebel vorne", "Giebel hinten" – oder "alle".
        selector:
          text:
    sequence:
      - variables:
          wunsch: "{{ kamera | default('alle', true) | string | lower | trim }}"
          verfuegbar: >-
            {{ states.camera | rejectattr('state', 'in', ['unavailable', 'unknown'])
               | rejectattr('entity_id', 'search', 'aufnahme') | map(attribute='entity_id') | list }}
          auswahl: >-
            {% if wunsch in ['', 'alle', 'all', 'alle kameras'] %}{{ verfuegbar }}
            {% else %}
              {% set woerter = wunsch.replace('-', ' ').replace('_', ' ').split()
                 | reject('in', ['kamera', 'die', 'der', 'das', 'am', 'vom', 'von', 'im', 'an', 'beim', 'zum']) | list %}
              {% set ns = namespace(l=[]) %}
              {% for e in verfuegbar %}
                {% set n = (e ~ ' ' ~ state_attr(e, 'friendly_name')) | lower | replace('_', ' ') %}
                {% if woerter and (woerter | select('in', n) | list | count) == (woerter | count) %}
                  {% set ns.l = ns.l + [e] %}
                {% endif %}
              {% endfor %}
              {{ ns.l }}
            {% endif %}
          ziel: "{{ states('sensor.jarvis_telegram_ziel')[1:] if states('sensor.jarvis_telegram_ziel').startswith('x') else '' }}"
      - if: "{{ auswahl | count == 0 }}"
        then:
          - variables:
              fehler:
                ergebnis: keine passende Kamera gefunden
                vorhandene_kameras: "{{ verfuegbar | map('state_attr', 'friendly_name') | list }}"
          - stop: keine Kamera
            response_variable: fehler
      - repeat:
          for_each: "{{ auswahl }}"
          sequence:
            - variables:
                datei: "/media/jarvis_{{ repeat.item.split('.', 1)[1] }}.jpg"
            - action: camera.snapshot
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
              data:
                filename: "{{ datei }}"
            - action: telegram_bot.send_photo
              continue_on_error: true
              data: >-
                {% set x = {'file': datei, 'caption': '📷 ' ~ state_attr(repeat.item, 'friendly_name')
                   ~ ' · ' ~ now().strftime('%H:%M') ~ ' Uhr'} %}
                {% if ziel %}{% set x = dict(x, chat_id=ziel | int) %}{% endif %}{{ x }}
      - variables:
          ok:
            ergebnis: per Telegram geschickt
            kameras: "{{ auswahl | map('state_attr', 'friendly_name') | list }}"
      - stop: fertig
        response_variable: ok

  jarvis_tagesueberblick:
    alias: Jarvis Tagesüberblick
    description: >-
      Liefert alles für einen Tag: Termine, offene und fällige Aufgaben, Erinnerungen, Wetter,
      Ferienwohnung (Anreise/Abreise/belegt/frei) und Stellplätze. Nutze das IMMER bei Fragen wie
      "Was liegt heute an?", "Was steht morgen an?", "Was habe ich heute für Termine?", "Guten Morgen".
      Fasse das Ergebnis dann in natürlicher gesprochener Sprache zusammen: erst die Termine mit Uhrzeit,
      dann die wichtigsten Aufgaben (fällige zuerst, höchstens fünf nennen), dann kurz das Wetter und die
      Ferienwohnung. Keine Aufzählungszeichen, weil es vorgelesen wird.
    icon: mdi:calendar-today
    mode: parallel
    fields:
      tag:
        name: Tag
        description: Datum im Format JJJJ-MM-TT (Standard heute). Für "morgen" das Datum von morgen.
        selector:
          date:
    sequence:
      - variables:
          datum: >-
            {{ tag if (tag | default('', true) | string) is match('^\d{4}-\d{2}-\d{2}$') else now().strftime('%Y-%m-%d') }}
          aufgaben_entity: >-
            {{ states.todo | selectattr('name', 'search', '(?i)^aufgaben')
               | map(attribute='entity_id') | first | default('', true) }}
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: calendar.geburtstage
        data:
          start_date_time: "{{ datum }} 00:00:00"
          end_date_time: "{{ datum }} 23:59:59"
        response_variable: kal
      - if: "{{ aufgaben_entity != '' }}"
        then:
          - action: todo.get_items
            continue_on_error: true
            target:
              entity_id: "{{ aufgaben_entity }}"
            data:
              status: needs_action
            response_variable: aufg
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.touchmonitor_home
        data:
          type: daily
        response_variable: wetter
      - variables:
          antwort:
            datum: "{{ datum }}"
            wochentag: "{{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][strptime(datum, '%Y-%m-%d').weekday()] }}"
            termine: >-
              {% set ev = kal['calendar.geburtstage'].events if kal is defined and 'calendar.geburtstage' in kal else [] %}
              {% set ns = namespace(l=[]) %}
              {% for e in ev | sort(attribute='start') %}
                {% set ns.l = ns.l + [{'uhrzeit': e.start[11:16] if 'T' in e.start else 'ganztägig', 'titel': e.summary}] %}
              {% endfor %}
              {{ ns.l }}
            aufgaben: >-
              {% set items = aufg[aufgaben_entity]['items'] if aufg is defined and aufgaben_entity in aufg else [] %}
              {% set ns = namespace(l=[]) %}
              {% for x in items if not x.summary.startswith('⏰') %}
                {% set f = (x.due | default('', true) | string)[:10] %}
                {% set ns.l = ns.l + [{'titel': x.summary, 'faellig': f, 'ueberfaellig_oder_heute': f != '' and f <= datum}] %}
              {% endfor %}
              {{ ns.l | sort(attribute='ueberfaellig_oder_heute', reverse=true) }}
            erinnerungen: >-
              {% set items = aufg[aufgaben_entity]['items'] if aufg is defined and aufgaben_entity in aufg else [] %}
              {{ items | selectattr('summary', 'match', '⏰') | selectattr('due', 'defined')
                 | selectattr('due', 'search', '^' ~ datum) | map(attribute='summary') | list }}
            wetter: >-
              {% set fc = wetter['weather.touchmonitor_home'].forecast if wetter is defined and 'weather.touchmonitor_home' in wetter else [] %}
              {% set f = fc | selectattr('datetime', 'search', '^' ~ datum) | first | default(fc | first if fc and datum == now().strftime('%Y-%m-%d') else none) %}
              {{ {'zustand': f.condition, 'max_grad': f.temperature, 'min_grad': f.templow | default(none),
                  'regenwahrscheinlichkeit': f.precipitation_probability | default(none)} if f else 'unbekannt' }}
            ferienwohnung: >-
              {% set b = (state_attr('sensor.termine_vorschau', 'buchungen') or []) | rejectattr('kalender', 'search', 'stellpl') | list %}
              {% set an = b | selectattr('start', 'search', '^' ~ datum) | list | count > 0 %}
              {% set ab = b | selectattr('ende', 'search', '^' ~ datum) | list | count > 0 %}
              {% set belegt = b | selectattr('start', 'le', datum) | selectattr('ende', 'gt', datum) | list | count > 0 %}
              {{ 'Anreise und Abreise' if an and ab else ('Anreise' if an else ('Abreise' if ab else ('belegt' if belegt else 'frei'))) }}
            stellplatz_buchungen: >-
              {{ (state_attr('sensor.termine_vorschau', 'buchungen') or []) | selectattr('kalender', 'search', 'stellpl')
                 | selectattr('start', 'le', datum) | selectattr('ende', 'ge', datum) | list | count }}
      - stop: fertig
        response_variable: antwort

  jarvis_haustuer_abschliessen:
    alias: Jarvis Haustür abschließen
    description: >-
      Schließt alle Türschlösser ab (z. B. Nuki Haustür) und sagt, welche vorher offen waren. Kann NUR
      abschließen, niemals aufschließen – Aufschließen per Sprache ist aus Sicherheitsgründen nicht möglich.
      Nutze das bei "Schließ die Haustür ab", "Ist die Tür zu?" (dann nur abschließen, wenn ausdrücklich gewünscht:
      bei der Frage reicht das Feld nur_pruefen).
    icon: mdi:lock
    mode: queued
    fields:
      nur_pruefen:
        name: Nur prüfen
        description: true = nur sagen, ob abgeschlossen ist, nichts verändern.
        selector:
          boolean:
    sequence:
      - variables:
          schloesser: "{{ states.lock | map(attribute='entity_id') | list }}"
          offen: "{{ states.lock | selectattr('state', 'in', ['unlocked', 'open', 'jammed']) | map(attribute='entity_id') | list }}"
      - if: "{{ not (nur_pruefen | default(false)) and offen | count > 0 }}"
        then:
          - action: lock.lock
            continue_on_error: true
            target:
              entity_id: "{{ offen }}"
      - variables:
          antwort:
            schloesser: "{{ schloesser | map('state_attr', 'friendly_name') | list }}"
            waren_offen: "{{ offen | map('state_attr', 'friendly_name') | list }}"
            aktion: "{{ 'nur geprüft' if nur_pruefen | default(false) else ('wird abgeschlossen' if offen else 'war schon alles abgeschlossen') }}"
      - stop: fertig
        response_variable: antwort

  jarvis_morgen_ansage:
    alias: Jarvis Morgen-Ansage
    description: Jarvis sagt den Tagesüberblick auf den HomePods Badezimmer, Schlafzimmer und Küche an (auch zum Testen von Hand).
    icon: mdi:account-voice
    mode: single
    fields:
      lautsprecher:
        name: Lautsprecher
        description: Namen in Music Assistant, mit Komma getrennt (Standard Badezimmer, Schlafzimmer, Küche).
        selector:
          text:
    sequence:
      - variables:
          raeume: "{{ lautsprecher | default('Badezimmer, Schlafzimmer, Küche', true) }}"
          agent: >-
            {{ states.conversation | map(attribute='entity_id') | select('search', 'claude|anthropic')
               | first | default('conversation.home_assistant', true) }}
          beginn: "{{ now().timestamp() }}"
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: "{{ agent }}"
          language: de
          text: >-
            Es ist {{ now().strftime('%H:%M') }} Uhr. Schreib den Tagesüberblick für heute als kurze, freundliche
            Morgenansage zum Vorlesen, höchstens sechs Sätze: Termine, wichtige Aufgaben, Wetter, Ferienwohnung.
            Die ganze Familie hört zu: beginne mit "Guten Morgen zusammen" und sag NICHT "Sir".
            Benutze KEIN Werkzeug für Durchsagen oder Nachrichten – antworte nur mit dem Text, die Durchsage mache ich selbst.
        response_variable: antwort
      # Falls Claude nicht antwortet: einfache Ansage ohne KI
      - variables:
          ki_text: >-
            {{ (antwort.response.speech.plain.speech if antwort is defined and antwort is mapping
               and antwort.response is defined and antwort.response.speech is defined
               and antwort.response.speech.plain is defined else '')
               | regex_replace('(?i),?\\s*\\bSir\\b', '') }}
          einfach: >-
            {%- set tage = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'] %}
            {%- set heute = now().strftime('%Y-%m-%d') %}
            {%- set t = (state_attr('sensor.termine_vorschau', 'familie') or []) | selectattr('start', 'search', '^' ~ heute) | list %}
            {%- set w = {'sunny': 'sonnig', 'clear-night': 'klar', 'partlycloudy': 'teils bewölkt', 'cloudy': 'bewölkt',
                'rainy': 'regnerisch', 'pouring': 'mit Starkregen', 'fog': 'neblig', 'snowy': 'verschneit', 'windy': 'windig'} %}
            Guten Morgen zusammen. Heute ist {{ tage[now().weekday()] }}.
            {%- if t %} Heute stehen {{ t | count }} Termine an: {% for x in t %}{{ x.titel }}{{ ' um ' ~ x.start[11:16] ~ ' Uhr' if 'T' in x.start else '' }}{{ ', ' if not loop.last else '.' }}{% endfor %}
            {%- else %} Heute stehen keine Termine an.{% endif %}
            {%- if states('weather.touchmonitor_home') not in ['unknown', 'unavailable'] %} Das Wetter ist {{ w.get(states('weather.touchmonitor_home'), states('weather.touchmonitor_home')) }} bei {{ state_attr('weather.touchmonitor_home', 'temperature') | round(0) | int }} Grad.{% endif %}
            Einen schönen Tag.
          text: "{{ ki_text if ki_text | length > 5 else einfach }}"
          # Hat Claude trotzdem schon selbst eine Durchsage gemacht? Dann nicht ein zweites Mal ansagen.
          schon_angesagt: "{{ as_timestamp(state_attr('script.jarvis_durchsage', 'last_triggered'), 0) > beginn | float(0) }}"
      - if: "{{ schon_angesagt }}"
        then:
          - stop: Claude hat die Ansage schon gemacht
      - action: script.jarvis_durchsage
        continue_on_error: true
        data:
          text: "{{ text }}"
          raeume: "{{ raeume }}"
        response_variable: ergebnis
      # Kein Lautsprecher erreicht → Text wenigstens per Telegram
      - if: "{{ not (ergebnis is defined and ergebnis is mapping and ergebnis.ergebnis | default('') == 'Durchsage gemacht') }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              message: >-
                ☀️ Morgen-Ansage – die Lautsprecher haben nicht abgespielt
                ({{ ergebnis.ergebnis | default('keine Antwort') if ergebnis is defined and ergebnis is mapping else 'Skript-Fehler' }},
                Stimme {{ ergebnis.stimme | default('?') if ergebnis is defined and ergebnis is mapping else '?' }}).
                Text: {{ text }}

  jarvis_durchsage:
    alias: Jarvis Durchsage
    description: >-
      Macht eine Durchsage über die HomePods/Lautsprecher im Haus ("Sag im ganzen Haus: Essen ist fertig",
      "Durchsage in der Küche: …"). Nutze IMMER dieses Werkzeug für Durchsagen und Ansagen, nicht die
      eingebaute Broadcast-Funktion (dafür gibt es keine Satelliten). Laufende Musik wird kurz leiser und läuft danach weiter.
    icon: mdi:bullhorn
    mode: queued
    fields:
      text:
        name: Text
        description: Was angesagt werden soll.
        required: true
        selector:
          text:
      lautstaerke:
        name: Lautstärke in Prozent
        description: Lautstärke für die Ansage (Standard 30). Nur angeben, wenn ausdrücklich gewünscht.
        selector:
          number:
            min: 10
            max: 100
      raeume:
        name: Räume
        description: >-
          Lautsprecher-Namen mit Komma getrennt, z. B. "Küche, Schlafzimmer". Leer oder "alle" = alle Lautsprecher.
          Nimm genau den Namen, den der Nutzer sagt (z. B. "Badezimmer" = nur der HomePod im Bad, nicht auch andere
          Bad-Lautsprecher). Vorhandene: Küche, Terrasse, Badezimmer, Schlafzimmer, Muckis Zimmer.
        selector:
          text:
    sequence:
      - variables:
          alle: "{{ integration_entities('music_assistant') | select('match', 'media_player\\.') | list }}"
          wunsch: >-
            {{ (raeume | default('', true) | string).lower().replace(' und ', ',').split(',')
               | map('trim') | reject('in', ['', 'alle', 'überall', 'ganzes haus', 'haus']) | list }}
          ziel: >-
            {% if not wunsch %}{{ alle }}{% else %}
              {#- pro Wunsch: erst genau gleicher Name ("Badezimmer" ≠ "Badezimmer 2"), nur sonst Teil des Namens #}
              {% set ns = namespace(l=[]) %}
              {% for w in wunsch %}
                {% set genau = namespace(l=[]) %}
                {% for e in alle %}{% if (state_attr(e, 'friendly_name') or '') | lower == w %}{% set genau.l = genau.l + [e] %}{% endif %}{% endfor %}
                {% if genau.l %}{% set ns.l = ns.l + genau.l %}
                {% else %}
                  {% for e in alle %}{% if w in (state_attr(e, 'friendly_name') or '') | lower %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}
                {% endif %}
              {% endfor %}{{ ns.l | unique | list }}
            {% endif %}
          stimme: >-
            {% set t = states.tts | map(attribute='entity_id') | list %}
            {% set wahl = {'ElevenLabs': 'elevenlabs', 'OpenAI': 'openai'}.get(states('input_select.jarvis_ansage_stimme'), 'cloud') %}
            {{ (t | select('search', wahl) | list + t | select('search', 'cloud') | list + t) | first | default('', true) }}
      - if: "{{ ziel | count == 0 or stimme == '' }}"
        then:
          - variables:
              fehler:
                ergebnis: kein passender Lautsprecher gefunden
                vorhandene: "{{ alle | map('state_attr', 'friendly_name') | list }}"
          - stop: nichts gefunden
            response_variable: fehler
      # Ansage immer mit derselben Lautstärke (Standard 30 %), danach wieder wie vorher
      - variables:
          laut: "{{ ((lautstaerke | default(30, true) | int(30)) / 100) | round(2) }}"
          vorher: >-
            {% set ns = namespace(l=[]) %}
            {% for e in ziel %}{% set ns.l = ns.l + [{'e': e, 'v': state_attr(e, 'volume_level')}] %}{% endfor %}
            {{ ns.l }}
      - repeat:
          for_each: "{{ ziel }}"
          sequence:
            - if: "{{ ((vorher | selectattr('e', 'eq', repeat.item) | first).v | float(-1)) != laut }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: "{{ laut }}"
      # Weg 1: als Ansage über Music Assistant (Musik wird kurz leiser und läuft danach weiter).
      # Läuft in einem eigenen Skript: das meldet nur dann "ok", wenn Music Assistant die Ansage angenommen hat.
      - action: script.jarvis_durchsage_abspielen
        continue_on_error: true
        data:
          ziel: "{{ ziel }}"
          stimme: "{{ stimme }}"
          text: "{{ text }}"
        response_variable: weg1
      - variables:
          angenommen: "{{ weg1 is defined and weg1 is mapping and weg1.ok | default(false) }}"
      - wait_template: "{{ ziel | select('is_state', 'playing') | list | count > 0 }}"
        timeout: "00:00:15"
        continue_on_timeout: true
      - variables:
          gespielt: "{{ angenommen or wait.completed }}"
      # Weg 2 NUR wenn Music Assistant die Ansage abgelehnt hat (früher auch bei "spielt nicht sichtbar" –
      # dann kam die Ansage doppelt, weil die HomePods während einer Ansage nicht immer "playing" melden)
      - if: "{{ not angenommen }}"
        then:
          - action: tts.speak
            continue_on_error: true
            target:
              entity_id: "{{ stimme }}"
            data:
              media_player_entity_id: "{{ ziel }}"
              message: "{{ text }}"
          - wait_template: "{{ ziel | select('is_state', 'playing') | list | count > 0 }}"
            timeout: "00:00:15"
            continue_on_timeout: true
          - variables:
              gespielt: "{{ wait.completed }}"
      # grob abwarten, bis die Ansage gesprochen ist (ca. 12 Zeichen pro Sekunde + Puffer)
      - delay:
          seconds: "{{ ((text | length) / 12 + 4) | int if gespielt else 1 }}"
      - repeat:
          for_each: "{{ ziel }}"
          sequence:
            - variables:
                alt: "{{ (vorher | selectattr('e', 'eq', repeat.item) | first).v }}"
            - if: "{{ alt is number and (alt | float(-1)) != laut }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: "{{ alt }}"
      - variables:
          ok:
            ergebnis: "{{ 'Durchsage gemacht' if gespielt else 'Lautsprecher haben nicht abgespielt' }}"
            lautsprecher: "{{ ziel | map('state_attr', 'friendly_name') | list }}"
            stimme: "{{ stimme }}"
      - stop: fertig
        response_variable: ok

  jarvis_durchsage_abspielen:
    alias: Jarvis Durchsage abspielen (intern)
    description: Nur intern für "Jarvis Durchsage" – nicht direkt benutzen.
    mode: parallel
    fields:
      ziel:
        description: Lautsprecher-Entitäten
      stimme:
        description: TTS-Entität
      text:
        description: Text
    sequence:
      - action: media_player.play_media
        target:
          entity_id: "{{ ziel }}"
        data:
          media_content_id: "media-source://tts/{{ stimme }}?message={{ text | urlencode }}"
          media_content_type: music
          announce: true
      - variables:
          ergebnis:
            ok: true
      - stop: angenommen
        response_variable: ergebnis

  jarvis_telegram_nachricht:
    alias: Jarvis Nachricht per Telegram
    description: >-
      Schickt Marco eine Nachricht per Telegram aufs Handy. Nutze das, wenn jemand sagt "schick mir das per
      Telegram / aufs Handy", und AUCH VON DIR AUS, wenn etwas nicht geklappt hat (z. B. ein Werkzeug meldet einen
      Fehler oder ein Gerät reagiert nicht): Dann schick eine kurze, sachliche Problembeschreibung mit dem, was
      gewünscht war, was passiert ist und der Fehlermeldung, damit Marco sie an Claude weiterleiten kann.
    icon: mdi:send
    mode: queued
    fields:
      text:
        name: Text
        required: true
        selector:
          text:
            multiline: true
      ist_problem:
        name: Ist ein Problem
        description: true, wenn es eine Problem-/Fehlerbeschreibung ist.
        selector:
          boolean:
    sequence:
      - variables:
          ziel: "{{ states('sensor.jarvis_telegram_ziel')[1:] if states('sensor.jarvis_telegram_ziel').startswith('x') else '' }}"
          nachricht: >-
            {{ ('🛠 Problem-Bericht von Jarvis (' ~ now().strftime('%d.%m. %H:%M') ~ '):\n' ~ text ~ '\n\n👉 Zum Beheben an Claude weiterleiten.')
               if ist_problem | default(false) else ('🤖 Jarvis: ' ~ text) }}
      - action: telegram_bot.send_message
        continue_on_error: true
        data: >-
          {% set x = {'message': nachricht} %}
          {% if ziel %}{% set x = dict(x, chat_id=ziel | int) %}{% endif %}{{ x }}
      - variables:
          ok:
            ergebnis: per Telegram geschickt
      - stop: fertig
        response_variable: ok

  jarvis_belegung:
    alias: Jarvis Belegung Ferienwohnung und Stellplätze
    description: >-
      Liefert, wann die Ferienwohnung belegt ist und wie viele Stellplätze an welchen Tagen gebucht sind
      (nur Zeiträume, keine Gästenamen). Nutze das bei Fragen wie "Wer kommt diese Woche in die
      Ferienwohnung?", "Ist die Ferienwohnung am Wochenende frei?", "Sind Stellplätze belegt?".
    icon: mdi:home-clock
    mode: parallel
    fields:
      tage:
        name: Zeitraum in Tagen
        description: Wie viele Tage ab heute (Standard 30).
        selector:
          number:
            min: 1
            max: 120
    sequence:
      - variables:
          bis: "{{ (now() + timedelta(days=(tage | default(30, true) | int(30)))).strftime('%Y-%m-%d') }}"
          alle: "{{ state_attr('sensor.termine_vorschau', 'buchungen') or [] }}"
          antwort:
            heute: "{{ now().strftime('%Y-%m-%d') }}"
            ferienwohnung: >-
              {% set ns = namespace(l=[]) %}
              {% for b in alle if b.kalender != 'stellplatz.verwaltung' and 'stellpl' not in b.kalender and b.start[:10] <= bis %}
                {% set ns.l = ns.l + [{'anreise': b.start[:10], 'abreise': b.ende[:10]}] %}
              {% endfor %}
              {{ ns.l | unique(attribute='anreise') | list }}
            stellplaetze: >-
              {% set ns = namespace(l=[]) %}
              {% for b in alle if (b.kalender == 'stellplatz.verwaltung' or 'stellpl' in b.kalender) and b.start[:10] <= bis %}
                {% set anzahl = (b.titel | regex_findall_index('(\\d+) Pl', 0) if b.titel is search('\\d+ Pl') else 1) | int(1) %}
                {% set ns.l = ns.l + [{'von': b.start[:10], 'bis': b.ende[:10], 'plaetze': anzahl}] %}
              {% endfor %}
              {{ ns.l }}
      - stop: fertig
        response_variable: antwort

  jarvis_monitor_nachricht:
    alias: Jarvis Nachricht auf den Flur-Monitor
    description: >-
      Zeigt eine kurze Nachricht groß auf dem Touchmonitor im Flur an ("Schreib auf den Monitor: Essen um
      19 Uhr"). Mit leerem Text wird die Nachricht wieder entfernt.
    icon: mdi:message-text
    mode: queued
    fields:
      text:
        name: Text
        description: Die Nachricht (kurz, höchstens ca. 200 Zeichen).
        selector:
          text:
      minuten:
        name: Anzeigedauer in Minuten
        description: Wie lange die Nachricht stehen bleibt (Standard 120).
        selector:
          number:
            min: 1
            max: 1440
    sequence:
      - variables:
          t: "{{ (text | default('', true) | string | trim)[:250] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.flur_nachricht
        data:
          value: "{{ t }}"
      - if: "{{ t == '' }}"
        then:
          - action: timer.cancel
            target:
              entity_id: timer.flur_nachricht
        else:
          - action: timer.start
            target:
              entity_id: timer.flur_nachricht
            data:
              duration: "{{ (minuten | default(120, true) | int(120)) * 60 }}"
          - action: script.monitor_an
            continue_on_error: true
            data:
              timeout: "{{ 300 if is_state('binary_sensor.monitor_nachtmodus', 'on') else 0 }}"

  jarvis_erinnerung:
    alias: Jarvis Erinnerung
    description: >-
      Erinnert zu einer bestimmten Uhrzeit per Telegram an etwas ("Erinner mich morgen um 17 Uhr an den
      Anhänger"). Die Erinnerung steht bis dahin auch auf der Aufgabenliste. Relative Angaben wie
      "in einer Stunde" oder "morgen früh" rechnest du vorher in Datum und Uhrzeit um.
    icon: mdi:alarm
    mode: queued
    fields:
      text:
        name: Woran erinnern
        required: true
        selector:
          text:
      zeitpunkt:
        name: Zeitpunkt
        description: Datum und Uhrzeit im Format JJJJ-MM-TT HH:MM.
        required: true
        selector:
          datetime:
    sequence:
      - variables:
          liste: >-
            {{ states.todo | selectattr('name', 'search', '(?i)^aufgaben')
               | map(attribute='entity_id') | first | default('todo.einkaufsliste', true) }}
          wann: "{{ (zeitpunkt | string)[:16] | replace('T', ' ') }}"
          ziel: "{{ states('sensor.jarvis_telegram_ziel')[1:] if states('sensor.jarvis_telegram_ziel').startswith('x') else '' }}"
      - action: todo.add_item
        target:
          entity_id: "{{ liste }}"
        data:
          item: "⏰ {{ text }}"
          due_datetime: "{{ wann }}:00"
          description: "{{ 'telegram:' ~ ziel if ziel else '' }}"
      - variables:
          antwort:
            ergebnis: Erinnerung gespeichert
            wann: "{{ wann }}"
      - stop: fertig
        response_variable: antwort

automation:
  - id: flur_nachricht_ablaufen
    alias: "Jarvis: Monitor-Nachricht nach Ablauf entfernen"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.flur_nachricht
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.flur_nachricht
        data:
          value: ""

  # Fällige Erinnerungen (Aufgaben mit ⏰ und Uhrzeit) per Telegram schicken und abhaken.
  # Läuft jede Minute – verpasste Erinnerungen (z. B. während eines Neustarts) kommen nachträglich.
  - id: jarvis_erinnerung_faellig
    alias: "Jarvis: Erinnerungen verschicken"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    variables:
      liste: >-
        {{ states.todo | selectattr('name', 'search', '(?i)^aufgaben')
           | map(attribute='entity_id') | first | default('', true) }}
    conditions:
      - condition: template
        value_template: "{{ liste != '' and states(liste) | int(0) > 0 }}"
    actions:
      - action: todo.get_items
        target:
          entity_id: "{{ liste }}"
        data:
          status: needs_action
        response_variable: offen
      - variables:
          faellig: >-
            {{ offen[liste]['items']
               | selectattr('summary', 'match', '⏰')
               | selectattr('due', 'defined') | selectattr('due', 'search', 'T')
               | selectattr('due', 'le', now().isoformat()) | list }}
      - repeat:
          for_each: "{{ faellig }}"
          sequence:
            - variables:
                an: >-
                  {% set d = repeat.item.description | default('', true) | string %}
                  {% set alle = (states('input_text.telegram_empfaenger') | string).split(';')
                     | reject('in', ['', 'unknown', 'unavailable']) | list %}
                  {{ ('x' ~ d.split(':', 1)[1]) if d.startswith('telegram:') and d | length > 9
                     else ('x' ~ alle[0] if alle else '') }}
            - action: telegram_bot.send_message
              continue_on_error: true
              data: >-
                {% set x = {'message': '⏰ Erinnerung: ' ~ (repeat.item.summary | replace('⏰', '') | trim)} %}
                {% if an | length > 1 %}{% set x = dict(x, chat_id=an[1:] | int) %}{% endif %}{{ x }}
            - action: todo.update_item
              continue_on_error: true
              target:
                entity_id: "{{ liste }}"
              data:
                item: "{{ repeat.item.uid }}"
                status: completed

  # (Die Telegram-Morgenübersicht um 07:00 ist entfernt – die Morgen-Ansage über die HomePods ersetzt sie.)

  # 22:30 – nur wenn noch Lampen an sind: Nachricht mit Knöpfen
  - id: jarvis_abend_check
    alias: "Jarvis: Abend-Check Licht"
    triggers:
      - trigger: time
        at: "22:30:00"
    conditions:
      - condition: state
        entity_id: input_boolean.abend_check_pause
        state: "off"
      - condition: template
        value_template: "{{ states('sensor.lichter_an') | int(0) > 0 }}"
    actions:
      - variables:
          an: >-
            {{ states.light | selectattr('state', 'eq', 'on')
               | rejectattr('attributes.entity_id', 'defined') | map(attribute='name') | list }}
      - condition: template
        value_template: "{{ an | count > 0 }}"
      - repeat:
          for_each: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';')
               | reject('in', ['', 'unknown', 'unavailable']) | list }}
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: "{{ repeat.item | int }}"
                message: "💡 Noch an: {{ an | join(', ') }}"
                inline_keyboard:
                  - "Alle ausschalten:/licht_aus, Anlassen:/licht_lassen"

  - id: jarvis_abend_check_knopf
    alias: "Jarvis: Abend-Check Knopf gedrückt"
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.data in ['/licht_aus', '/licht_lassen'] }}"
    actions:
      - variables:
          an: >-
            {{ states.light | selectattr('state', 'eq', 'on')
               | rejectattr('attributes.entity_id', 'defined') | list }}
      - if: "{{ trigger.event.data.data == '/licht_aus' and an | count > 0 }}"
        then:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ an | map(attribute='entity_id') | list }}"
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "{{ 'Ausgeschaltet' if trigger.event.data.data == '/licht_aus' else 'OK' }}"
      - action: telegram_bot.edit_message
        continue_on_error: true
        data:
          chat_id: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id }}"
          message: >-
            {% if trigger.event.data.data == '/licht_aus' %}✅ Ausgeschaltet: {{ an | map(attribute='name') | join(', ') if an else 'war schon alles aus' }}
            {% else %}👍 Licht bleibt an{% endif %}

  # 22:30 – Türschlösser (z. B. Nuki Haustür): nur wenn eins nicht abgeschlossen ist
  - id: jarvis_abend_schloss
    alias: "Jarvis: Abend-Check Haustür"
    triggers:
      - trigger: time
        at: "22:30:00"
    conditions:
      - condition: state
        entity_id: input_boolean.abend_check_pause
        state: "off"
    actions:
      - variables:
          offen: >-
            {{ states.lock | selectattr('state', 'in', ['unlocked', 'open', 'jammed']) | map(attribute='name') | list }}
      - condition: template
        value_template: "{{ offen | count > 0 }}"
      - repeat:
          for_each: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';')
               | reject('in', ['', 'unknown', 'unavailable']) | list }}
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: "{{ repeat.item | int }}"
                message: "🔓 Nicht abgeschlossen: {{ offen | join(', ') }}"
                inline_keyboard:
                  - "🔒 Abschließen:/abschliessen, Offen lassen:/schloss_lassen"

  - id: jarvis_abend_schloss_knopf
    alias: "Jarvis: Abend-Check Haustür Knopf"
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.data in ['/abschliessen', '/schloss_lassen'] }}"
    actions:
      - variables:
          offen: "{{ states.lock | selectattr('state', 'in', ['unlocked', 'open']) | list }}"
      - if: "{{ trigger.event.data.data == '/abschliessen' and offen | count > 0 }}"
        then:
          - action: lock.lock
            continue_on_error: true
            target:
              entity_id: "{{ offen | map(attribute='entity_id') | list }}"
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "{{ 'Wird abgeschlossen' if trigger.event.data.data == '/abschliessen' else 'OK' }}"
      - action: telegram_bot.edit_message
        continue_on_error: true
        data:
          chat_id: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id }}"
          message: >-
            {% if trigger.event.data.data == '/abschliessen' %}🔒 Abgeschlossen: {{ offen | map(attribute='name') | join(', ') if offen else 'war schon zu' }}
            {% else %}👍 Bleibt offen{% endif %}

  # Mo–Fr 06:30, Sa/So 08:00 – Jarvis sagt den Tag auf den HomePods Bad, Schlafzimmer und Küche an (über Music Assistant)
  - id: jarvis_morgen_ansage_schlafzimmer
    alias: "Jarvis: Morgen-Ansage HomePods"
    # Montag–Freitag 6:30, Samstag/Sonntag 8:00
    triggers:
      - trigger: time
        at: "06:30:00"
        id: werktag
      - trigger: time
        at: "08:00:00"
        id: wochenende
    conditions:
      - condition: template
        value_template: "{{ (now().weekday() < 5) == (trigger.id == 'werktag') }}"
      - condition: state
        entity_id: input_boolean.morgen_homepod_pause
        state: "off"
    actions:
      - action: script.jarvis_morgen_ansage
        data:
          lautsprecher: Badezimmer, Schlafzimmer, Küche
