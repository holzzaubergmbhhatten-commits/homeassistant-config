# Wärmepumpe sperren, solange der Kamin brennt (Smart-Grid-Kontakt 1 der Vitocal 200-A).
# Shelly 1 Gen3 „Wärmepumpe Kamin-Sperre“ in der Wärmepumpe: L + I an X3.1 (L′), N an X2, O an Stecker 216 Pin 1.
# Relais an = Smart Grid „EVU-Sperre“ = Verdichter aus; Heizkreise laufen weiter aus dem Puffer.
# Wirkt nur, wenn an der Vitocal „Freigabe Smart Grid 7E80“ = 4 steht (Serviceanleitung WO1C S. 31–32).
#
# Gesperrt wird nur, wenn sich das lohnt und nichts kalt wird:
#   - Kamin brennt seit 10 Minuten (binary_sensor.kamin_brennt vom Kamin-Signal-Mini)
#   - Puffer oben mind. 45 °C (läuft die Sperre schon: bis 40 °C). Das Warmwasser kommt über die Frischwasser-Station
#     oben aus dem Puffer – der WW-Fühler der Wärmepumpe sitzt tiefer und schwankt stark (25–59 °C), er zählt nicht mehr
#     (14.11.2026: er fiel immer wieder unter 38 °C → Sperre kurz weg → Wärmepumpe lud sofort Warmwasser).
# Sonst und sobald der Kamin aus ist: Sperre sofort weg. Spätestens nach 12 Stunden ebenfalls (Sicherheitsnetz).
# Abschaltbar über den Schalter „Wärmepumpe bei Kamin sperren“.

input_boolean:
  kamin_sperre_erlaubt:
    name: Wärmepumpe bei Kamin sperren
    icon: mdi:fire-off

template:
  - binary_sensor:
      - name: Wärmepumpe Kamin-Sperre soll
        unique_id: wp_kamin_sperre_soll
        icon: mdi:fire-off
        delay_on: "00:10:00"
        state: >-
          {% set an = this.state == 'on' %}
          {% set p = states('sensor.hwr_warmepumpe_puffertemperatur_oben') | float(0) %}
          {{ is_state('input_boolean.kamin_sperre_erlaubt', 'on')
             and is_state('binary_sensor.kamin_brennt', 'on')
             and p >= (40 if an else 45) }}

automation:
  - id: wp_kamin_sperre_schalten
    alias: "Heizung: Wärmepumpe sperren, solange der Kamin brennt"
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.warmepumpe_kamin_sperre_soll
      - trigger: state
        entity_id: switch.warmepumpe_kamin_sperre
        to: "on"
        for: "12:00:00"
        id: zu_lange
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - variables:
          soll: >-
            {{ trigger.id != 'zu_lange' and is_state('binary_sensor.warmepumpe_kamin_sperre_soll', 'on') }}
      - if: "{{ soll and not is_state('switch.warmepumpe_kamin_sperre', 'on') }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.warmepumpe_kamin_sperre
          # Zusätzlich über die Viessmann-Cloud: Warmwasser-Soll auf 20 °C, damit die Wärmepumpe nicht fürs
          # Warmwasser anspringt (falls der Smart-Grid-Kontakt nicht wirkt). Das Warmwasser kommt in der Zeit vom Kamin
          # über den Puffer. Zurück auf 45 °C (Kamin-Modus) bzw. den gemerkten Wert beim Freigeben.
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.hwr_warmepumpe_ww_temperatur
            data:
              value: 20
          - action: logbook.log
            data:
              name: Wärmepumpe
              message: >-
                gesperrt – Kamin heizt (Puffer {{ states('sensor.hwr_warmepumpe_puffertemperatur_oben') | float(0) | round(0) | int }} °C,
                Warmwasser {{ states('sensor.hwr_warmepumpe_ww_speichertemperatur') | float(0) | round(0) | int }} °C)
      # Sperre läuft schon: Warmwasser-Soll niedrig halten (z. B. nach Neustart oder wenn eine andere Automation ihn hochgesetzt hat)
      - if: "{{ soll and is_state('switch.warmepumpe_kamin_sperre', 'on') and states('number.hwr_warmepumpe_ww_temperatur') | int(0) > 20 }}"
        then:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.hwr_warmepumpe_ww_temperatur
            data:
              value: 20
      - if: "{{ not soll and not is_state('switch.warmepumpe_kamin_sperre', 'off') }}"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.warmepumpe_kamin_sperre
          - if: "{{ states('number.hwr_warmepumpe_ww_temperatur') | int(0) < 45 }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.hwr_warmepumpe_ww_temperatur
                data:
                  value: >-
                    {{ 45 if is_state('input_boolean.kamin_modus', 'on')
                       else (states('input_number.ww_soll_kamin_gemerkt') | int(48) if states('input_number.ww_soll_kamin_gemerkt') | int(0) >= 40 else 48) }}
          - if: "{{ trigger.id == 'zu_lange' }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.kamin_sperre_erlaubt
          - action: logbook.log
            data:
              name: Wärmepumpe
              message: >-
                {{ 'nach 12 Stunden Sperre wieder frei – Schalter „Wärmepumpe bei Kamin sperren“ ausgeschaltet, bitte prüfen'
                   if trigger.id == 'zu_lange' else 'wieder frei' }}

  # Beim ersten Einrichten einmal einschalten (danach bestimmt Marco)
  - id: wp_kamin_sperre_einrichten
    alias: "Heizung: Kamin-Sperre einmalig einschalten"
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: template
        value_template: "{{ states('input_boolean.kamin_sperre_erlaubt') in ['unknown', 'unavailable'] or this.attributes.last_triggered is none }}"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kamin_sperre_erlaubt
