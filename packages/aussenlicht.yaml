# Haustür-Licht per Bewegungsmelder (ersetzt die kaputte Apple-Home-Automation "(null)").
# Bewegung am Eve-Motion-Sensor an der Haustür + draußen dunkel → Lampe an,
# 3 Minuten nach der letzten Bewegung → wieder aus (nur wenn die Automation sie eingeschaltet hat).
# Sensor und Lampe werden über den Namen gefunden ("Haustür" oder "Eingang"), so funktioniert es,
# sobald der Sensor (per Matter aus Apple Home geteilt) in Home Assistant auftaucht.
# sensor.haustuer_licht_status zeigt, was gefunden wurde.

input_boolean:
  haustuer_licht_auto:
    name: Haustür-Licht – von der Automation eingeschaltet
    icon: mdi:robot

template:
  - sensor:
      - name: Haustür Licht Status
        unique_id: haustuer_licht_status
        icon: mdi:motion-sensor
        state: >-
          {% set m = states.binary_sensor | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
             | selectattr('name', 'search', '(?i)haust(ü|ue)r|eingang') | list %}
          {% set l = states.light | selectattr('name', 'search', '(?i)haust(ü|ue)r|eingang')
             | rejectattr('attributes.entity_id', 'defined') | list %}
          {{ 'bereit' if m and l else ('Sensor fehlt' if not m else 'Lampe fehlt') }}
        attributes:
          bewegung: >-
            {{ states.binary_sensor | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
               | selectattr('name', 'search', '(?i)haust(ü|ue)r|eingang') | map(attribute='entity_id') | list }}
          helligkeit: >-
            {{ states.sensor | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'eq', 'illuminance')
               | selectattr('name', 'search', '(?i)haust(ü|ue)r|eingang') | map(attribute='entity_id') | list }}
          lampen: >-
            {{ states.light | selectattr('name', 'search', '(?i)haust(ü|ue)r|eingang')
               | rejectattr('attributes.entity_id', 'defined') | map(attribute='entity_id') | list }}

automation:
  - id: haustuer_licht_bewegung
    alias: "Haustür-Licht: an bei Bewegung im Dunkeln, 3 Minuten danach aus"
    mode: restart
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.entity_id in (state_attr('sensor.haustuer_licht_status', 'bewegung') or [])
             and trigger.event.data.new_state is not none and trigger.event.data.new_state.state == 'on' }}
    actions:
      - variables:
          lampen: "{{ state_attr('sensor.haustuer_licht_status', 'lampen') or [] }}"
          bewegung: "{{ state_attr('sensor.haustuer_licht_status', 'bewegung') or [] }}"
          lux: >-
            {% set h = state_attr('sensor.haustuer_licht_status', 'helligkeit') or [] %}
            {{ (h | map('states') | map('float', 9999) | min) if h else 9999 }}
          dunkel: >-
            {{ lux < 30 if lux < 9999 else (state_attr('sun.sun', 'elevation') | float(0) < -2) }}
          schon_an: "{{ lampen | select('is_state', 'on') | list | count > 0 }}"
      - condition: template
        value_template: "{{ lampen | count > 0 and (dunkel or is_state('input_boolean.haustuer_licht_auto', 'on')) }}"
      - if: "{{ not schon_an }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ lampen }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.haustuer_licht_auto
      # warten bis keine Bewegung mehr, dann noch 3 Minuten (neue Bewegung startet alles neu)
      - wait_template: "{{ bewegung | select('is_state', 'on') | list | count == 0 }}"
        timeout: "00:30:00"
      - delay: "00:03:00"
      - condition: state
        entity_id: input_boolean.haustuer_licht_auto
        state: "on"
      - action: light.turn_off
        target:
          entity_id: "{{ lampen }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.haustuer_licht_auto
