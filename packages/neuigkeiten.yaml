# Einmalig: Übersicht der Neuerungen (31.10.2026) per Telegram an Mirka (claude_tools/neuigkeiten.py, Markierungsdatei
# /config/.neuigkeiten_2026_10_31_b verhindert Wiederholungen). Klappt es nicht, bekommt Marco nach dem Start einen Hinweis.
shell_command:
  neuigkeiten: python3 /config/claude_tools/neuigkeiten.py {{ wert }}

automation:
  - id: neuigkeiten_an_mirka
    alias: "Neuigkeiten 31.10.: Übersicht an Mirka"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time_pattern
        hours: "/2"
        minutes: 17
      # „Ich bin Mirka“ an den Bot → gleich danach senden
      - trigger: event
        event_type: telegram_text
        id: ichbin
    actions:
      - if: >-
          {{ trigger.id == 'ichbin' and not ((trigger.event.data.text | default('') | string)
             is match('^\s*(ich\s+bin|ich\s+hei(ß|ss)e|mein\s+name\s+ist|hier\s+ist)\s+(mirka|mika)', ignorecase=True)) }}
        then:
          - stop: keine Vorstellung
      - delay: "{{ '00:00:15' if trigger.id == 'ichbin' else '00:03:00' }}"
      - action: shell_command.neuigkeiten
        continue_on_error: true
        data:
          wert: >-
            {{ {'chats': (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list}
               | to_json | base64_encode }}
        response_variable: roh
      - variables:
          r: >-
            {% set a = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': 'keine Antwort'} }}
      - if: "{{ trigger.id in ['start', 'ichbin'] and not r.ok | default(false) }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
              message: "⚠️ Die Übersicht an Mirka ging noch nicht raus: {{ r.fehler | default('?') }}. Lösung: Mirka schreibt dem Bot einmal genau „Ich bin Mirka“ – danach kommt die Übersicht von selbst (spätestens nach 2 Stunden)."
