# Werkzeugkasten = Seite „Links“ am Monitor (www/werkzeugkasten.html): alle Seiten und Werkzeuge der Familie
# (Haus-Handbuch, Bauplaner, Umbau-Lotse, Verein, Vermietung …) zum Öffnen, Kopieren und Verschicken
# (Telegram, WhatsApp, Mail). Die Liste kommt aus dem privaten Repository (claude_tools/werkzeugkasten.py).
shell_command:
  werkzeugkasten: python3 /config/claude_tools/werkzeugkasten.py {{ aktion }} {{ wert | default('') }}

script:
  werkzeugkasten_lesen:
    alias: "Werkzeugkasten: Liste lesen"
    mode: queued
    fields:
      neu:
        description: true = vorher frisch aus dem Repository holen
    sequence:
      - action: shell_command.werkzeugkasten
        data:
          aktion: "{{ 'holen' if neu | default(false) else 'lesen' }}"
          wert: "{{ (states('input_text.github_handbuch_schluessel') | string | replace('unknown', '') | replace('unavailable', '')) | base64_encode if neu | default(false) else '' }}"
        response_variable: roh
      - variables:
          a: >-
            {% set t = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ t | from_json if (t | string).startswith('{') else {'ok': false, 'fehler': t or 'keine Antwort'} }}
      - stop: fertig
        response_variable: a

  # Link(s) per Telegram schicken – an Marco (erster Empfänger) oder an alle freigegebenen Chats
  werkzeugkasten_schicken:
    alias: "Werkzeugkasten: per Telegram schicken"
    mode: queued
    fields:
      text:
        description: Nachricht mit dem Link
      an:
        description: ich (Marco) oder alle
    sequence:
      - variables:
          chats: >-
            {% set l = (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | list %}
            {{ l if an | default('ich') == 'alle' else l[:1] }}
      - repeat:
          for_each: "{{ chats }}"
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
                chat_id: "{{ repeat.item | int }}"
                message: "{{ text[:3800] }}"
                disable_web_page_preview: true

automation:
  - id: werkzeugkasten_aktualisieren
    alias: "Werkzeugkasten: Liste aktualisieren"
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "17"
      - trigger: state
        entity_id: input_text.github_handbuch_schluessel
    actions:
      - delay: 30
      - action: script.werkzeugkasten_lesen
        continue_on_error: true
        data:
          neu: true

  # Einmalige Erinnerung (Wunsch Marco, 1.11.2026): GitHub-Schlüssel einrichten – Aufgabe auf die Liste und
  # um 17:30 Uhr eine Telegram-Nachricht, nur solange der Schlüssel noch fehlt.
  - id: erinnerung_github_schluessel
    alias: "Erinnerung: GitHub-Schlüssel einrichten"
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time
        at: "17:30:00"
        id: zeit
    conditions:
      - condition: template
        value_template: >-
          {{ now().strftime('%Y-%m-%d') == '2026-11-01'
             and (states('input_text.github_handbuch_schluessel') | string | length) < 20 }}
    actions:
      - if: "{{ trigger.id == 'start' }}"
        then:
          - action: todo.get_items
            continue_on_error: true
            target:
              entity_id: todo.aufgaben
            data:
              status: needs_action
            response_variable: offen
          - if: "{{ offen is defined and 'todo.aufgaben' in offen and not (offen['todo.aufgaben']['items'] | selectattr('summary', 'search', 'GitHub') | list) }}"
            then:
              - action: todo.add_item
                continue_on_error: true
                target:
                  entity_id: todo.aufgaben
                data:
                  item: "GitHub-Schlüssel einrichten (Anleitung am Monitor unter „Links“)"
        else:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              config_entry_id: 01M3HM1R6DDKSC07MG87X4YEVB
              chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | int(0) }}"
              message: >-
                ⏰ Erinnerung: GitHub-Schlüssel einrichten (ca. 5 Minuten am Laptop) – dann gehen die Links-Seite
                und „Anleitung ins Haus-Handbuch“.{{ '\n\n' }}1. github.com → Profilbild → Settings → Developer settings →
                Personal access tokens → Fine-grained tokens → Generate new token{{ '\n' }}2. Name „Home Assistant Handbuch“,
                Ablauf 1 Jahr, Repository access: Only select repositories → webseiten, Permissions → Contents: Read and write
                → Generate{{ '\n' }}3. Schlüssel kopieren → Home Assistant: Einstellungen → Geräte & Dienste → Helfer →
                „GitHub-Schlüssel Haus-Handbuch“ → einfügen{{ '\n\n' }}Den Schlüssel bitte nirgends sonst hinschicken.
