# Netzwerk (TP-Link Omada, Integration „TP-Link Omada“ in Home Assistant):
# - Seite www/netzwerk.html (Reiter „Netzwerk“): Switches mit allen Ports (PoE an/aus, eigene Beschriftung „was hängt dran“),
#   Access Points und Router, online/offline. PoE-Neustart eines Ports mit Rückfrage.
# - Telegram, wenn ein Omada-Gerät länger als 5 Minuten nicht erreichbar ist – und wenn es wieder da ist.
# - Firmware-Updates der Omada-Geräte: werden automatisch nachts um 2:30 eingespielt (nicht im Urlaub, nicht bei
#   „Updates pausieren“). Telegram kündigt es an (Knöpfe: jetzt / diesmal nicht). Knopf auch auf der Seite.
#   Reihenfolge: erst Access Points, dann Switch, Router zuletzt – immer eins nach dem anderen.
# - Geräte umbenennen direkt auf der Seite (Name in Home Assistant).
# Beschriftungen lokal in /config/www/netzwerk_daten.json (nicht im Repository). Keine IP-/MAC-Adressen.
shell_command:
  netzwerk: python3 /config/claude_tools/netzwerk.py {{ aktion }} {{ wert | default('') }}
  omada_finden: python3 /config/claude_tools/omada_finden.py
  ip_liste: python3 /config/claude_tools/ip_liste.py {{ modus | default('') }}
  omada_fest: python3 /config/claude_tools/omada_fest.py {{ modus }}

script:
  netzwerk_speichern:
    alias: "Netzwerk: Beschriftungen speichern"
    mode: queued
    fields:
      daten:
        description: Inhalt als JSON-Text
    sequence:
      - action: shell_command.netzwerk
        data:
          aktion: speichern
          wert: >-
            {% set s = (daten if daten is string else (daten | to_json)) | base64_encode %}
            {% for i in range(0, s | length, 100000) %}{{ s[i:i + 100000] }} {% endfor %}
        response_variable: ergebnis
      - variables:
          antwort: >-
            {% set a = ergebnis.stdout | default('') if ergebnis is defined and ergebnis is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': a or 'keine Antwort'} }}
      - stop: fertig
        response_variable: antwort

  # Sucht die Adresse des Omada-Controllers (OC200) im Heimnetz – Ergebnis auf der Seite und per Telegram an Marco
  netzwerk_controller_suchen:
    alias: "Netzwerk: Omada-Controller suchen"
    icon: mdi:magnify
    mode: single
    sequence:
      - action: shell_command.omada_finden
        response_variable: roh
      - variables:
          antwort: >-
            {% set a = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': a or 'keine Antwort'} }}
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - if: "{{ marco != '' }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              chat_id: "{{ marco | int }}"
              message: >-
                {% if antwort.gefunden | default([]) %}📡 Omada-Controller gefunden: {{ antwort.gefunden | map(attribute='url') | join(' oder ') }}
                – diese Adresse bei der Integration „TP-Link Omada“ als Host eintragen (SSL prüfen: aus).
                {% for t in antwort.gefunden %}
                🔎 {{ t.url }} (Version {{ t.version }}): {{ t.test | default('') }}{% endfor %}
                {% if antwort.log | default([]) %}
                📄 Letzte Omada-Meldungen im Protokoll:
                {{ antwort.log | join('\n') }}{% endif %}
                {%- else %}📡 Kein Omada-Controller im Netz {{ antwort.netz | default('') }} gefunden{{ (': ' ~ antwort.fehler) if antwort.fehler is defined else '' }}.{% endif %}
      - stop: fertig
        response_variable: antwort

  # Liste der Geräte, die Home Assistant über ihre Adresse anspricht → per Telegram an Marco (zum Festmachen im Router)
  netzwerk_ip_liste:
    alias: "Netzwerk: Geräte mit Adresse auflisten"
    icon: mdi:ip-network
    mode: single
    fields:
      modus:
        description: '"einmal" = nur, wenn die Liste noch nie geschickt wurde'
    sequence:
      - action: shell_command.ip_liste
        data:
          modus: "{{ 'einmal' if modus | default('') == 'einmal' else '' }}"
        response_variable: roh
      - variables:
          antwort: >-
            {% set a = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': a or 'keine Antwort'} }}
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - if: "{{ marco != '' and not antwort.schon | default(false) }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              chat_id: "{{ marco | int }}"
              message: >-
                {% if antwort.ok | default(false) %}📌 Diese Geräte spricht Home Assistant über ihre Adresse an – bitte in der Omada-App
                (Clients → Gerät → „Feste IP-Adresse verwenden“) festmachen:
                {% for g in antwort.geraete %}
                • {{ g.adresse }} – {{ g.name }} ({{ g.art }}){% endfor %}
                {%- else %}📌 Liste ging nicht: {{ antwort.fehler | default('?') }}{% endif %}
      - stop: fertig
        response_variable: antwort

  # Feste Adressen im Omada-Controller eintragen (jetzige Adresse bleibt, wird nur festgehalten).
  # modus: plan = Telegram zeigt, was gemacht würde (mit Knopf „Ja, festmachen“); ausfuehren = eintragen
  netzwerk_adressen_festmachen:
    alias: "Netzwerk: feste Adressen eintragen"
    icon: mdi:pin
    mode: single
    fields:
      modus:
        description: plan oder ausfuehren
    sequence:
      - action: shell_command.omada_fest
        data:
          modus: "{{ modus if modus | default('') in ['ausfuehren', 'plan_einmal'] else 'plan' }}"
        response_variable: roh
      - variables:
          a: >-
            {% set t = roh.stdout | default('') if roh is defined and roh is mapping else '' %}
            {{ t | from_json if (t | string).startswith('{') else {'ok': false, 'fehler_text': t or 'keine Antwort'} }}
          plan: "{{ modus | default('plan') != 'ausfuehren' }}"
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - if: "{{ marco != '' and not a.still | default(false) }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              chat_id: "{{ marco | int }}"
              message: >-
                {% if not a.ok | default(false) %}📌 Feste Adressen: ging nicht – {{ a.fehler_text | default('?') }}{% else %}
                {% set ns = namespace(z=['📌 Feste Adressen im Router' ~ (' – Vorschlag:' if plan else ' – erledigt:')]) %}
                {% for g in a.neu %}{% set ns.z = ns.z + [('➕ ' if plan else '✅ ') ~ g.ip ~ ' – ' ~ g.name] %}{% endfor %}
                {% for g in a.schon %}{% set ns.z = ns.z + ['✔️ ' ~ g.ip ~ ' – ' ~ g.name ~ ' (war schon fest)'] %}{% endfor %}
                {% for g in a.fehlt %}{% set ns.z = ns.z + ['❓ ' ~ g.ip ~ ' – ' ~ g.name ~ ' (gerade nicht im Netz)'] %}{% endfor %}
                {% for g in a.fehler %}{% set ns.z = ns.z + ['⚠️ ' ~ g.ip ~ ' – ' ~ g.name ~ ': ' ~ g.fehler] %}{% endfor %}
                {% if plan and a.neu %}{% set ns.z = ns.z + ['', 'Die Adressen bleiben, wie sie sind – sie werden nur festgehalten, damit nach einem Router-Neustart nichts mehr verrutscht.'] %}
                {% elif not a.neu %}{% set ns.z = ns.z + ['Nichts zu tun.'] %}{% endif %}
                {{ ns.z | join('\n') }}{% endif %}
          - if: "{{ plan and a.ok | default(false) and a.neu | default([]) | count > 0 }}"
            then:
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  chat_id: "{{ marco | int }}"
                  message: "Soll ich diese {{ a.neu | count }} Adressen im Router festmachen?"
                  inline_keyboard:
                    - "Ja, festmachen:/omada_fest_ja, Nein:/omada_fest_nein"
      - stop: fertig
        response_variable: a

  netzwerk_poe_neustart:
    alias: "Netzwerk: Gerät per PoE neu starten"
    icon: mdi:restart
    mode: parallel
    fields:
      schalter:
        description: PoE-Schalter des Ports (switch.…)
    sequence:
      - condition: template
        value_template: "{{ schalter is string and schalter.startswith('switch.') and schalter in integration_entities('tplink_omada') }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ schalter }}"
      - delay: "00:00:10"
      - action: switch.turn_on
        target:
          entity_id: "{{ schalter }}"

  # Firmware einspielen – nacheinander: Access Points, dann Switch, Router zuletzt (sonst ist das Netz zu lange weg)
  netzwerk_firmware:
    alias: "Netzwerk: Firmware einspielen"
    icon: mdi:update
    mode: single
    fields:
      geraete:
        description: Update-Entitäten (leer = alle Omada-Geräte mit Update)
    sequence:
      - variables:
          alle: "{{ integration_entities('tplink_omada') | select('match', 'update\\.') | select('is_state', 'on') | list }}"
          liste: >-
            {% set w = geraete if (geraete is defined and geraete) else alle %}
            {% set w = [w] if w is string else w %}
            {% set ns = namespace(a=[], s=[], r=[]) %}
            {% for e in w if e in alle %}
              {% set m = (device_attr(device_id(e), 'model') or '') | upper %}
              {% if m.startswith('ER') %}{% set ns.r = ns.r + [e] %}{% elif m.startswith('EAP') %}{% set ns.a = ns.a + [e] %}{% else %}{% set ns.s = ns.s + [e] %}{% endif %}
            {% endfor %}
            {{ ns.a + ns.s + ns.r }}
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - condition: template
        value_template: "{{ liste | count > 0 }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.netzwerk_update_nachts
      - repeat:
          for_each: "{{ liste }}"
          sequence:
            - action: update.install
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
            - wait_template: "{{ not is_state(repeat.item, 'on') }}"
              timeout: "00:15:00"
            - delay: "00:01:00"
      - variables:
          offen_namen: >-
            {% set ns = namespace(l=[]) %}
            {% for e in liste if is_state(e, 'on') %}{% set d = device_id(e) %}{% set ns.l = ns.l + [device_attr(d, 'name_by_user') or device_attr(d, 'name') or e] %}{% endfor %}
            {{ ns.l }}
      - if: "{{ marco != '' }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              chat_id: "{{ marco | int }}"
              message: >-
                {% if offen_namen %}⚠️ Netzwerk-Firmware: {{ liste | count - offen_namen | count }} von {{ liste | count }} fertig.
                Nicht geklappt: {{ offen_namen | join(', ') }} – bitte im Omada-Controller nachsehen.
                {%- else %}✅ Netzwerk-Firmware: alle {{ liste | count }} Geräte sind aktuell.{% endif %}

input_boolean:
  netzwerk_update_nachts:
    name: Netzwerk-Firmware heute Nacht einspielen
    icon: mdi:weather-night

template:
  - sensor:
      # Omada-Geräte, bei denen gerade ALLE Werte „nicht verfügbar“ sind (= Gerät offline)
      - name: Netzwerk offline
        unique_id: netzwerk_offline
        icon: mdi:lan-disconnect
        state: >-
          {% set ns = namespace(d={}) %}
          {% for e in integration_entities('tplink_omada') if not e.startswith('device_tracker.') %}
            {% set d = device_id(e) %}
            {% if d %}{% set ns.d = dict(ns.d, **{d: (ns.d.get(d, true) and states(e) == 'unavailable')}) %}{% endif %}
          {% endfor %}
          {{ ns.d.values() | select('eq', true) | list | count }}
        attributes:
          geraete: >-
            {% set ns = namespace(d={}, namen=[]) %}
            {% for e in integration_entities('tplink_omada') if not e.startswith('device_tracker.') %}
              {% set d = device_id(e) %}
              {% if d %}{% set ns.d = dict(ns.d, **{d: (ns.d.get(d, true) and states(e) == 'unavailable')}) %}{% endif %}
            {% endfor %}
            {% for d, weg in ns.d.items() if weg %}{% set ns.namen = ns.namen + [device_attr(d, 'name_by_user') or device_attr(d, 'name') or 'Omada-Gerät'] %}{% endfor %}
            {{ ns.namen }}

automation:
  - id: netzwerk_offline_melden
    alias: "Netzwerk: Omada-Gerät offline / wieder da"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.netzwerk_offline
        for: "00:05:00"
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable'] and trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - variables:
          jetzt: "{{ trigger.to_state.attributes.geraete | default([]) }}"
          vorher: "{{ trigger.from_state.attributes.geraete | default([]) }}"
          neu_weg: "{{ jetzt | reject('in', vorher) | list }}"
          wieder_da: "{{ vorher | reject('in', jetzt) | list }}"
      - condition: template
        value_template: "{{ neu_weg | count > 0 or wieder_da | count > 0 }}"
      - repeat:
          for_each: >-
            {{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list }}
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: "{{ repeat.item | int }}"
                message: >-
                  {% if neu_weg %}📡 Netzwerk: {{ neu_weg | join(', ') }} ist seit 5 Minuten nicht erreichbar
                  (Strom/PoE, Kabel oder Absturz?). Neu starten geht am Monitor unter „Netzwerk“.{% endif %}
                  {% if wieder_da %}✅ Netzwerk: {{ wieder_da | join(', ') }} ist wieder erreichbar.{% endif %}

  # Neue Firmware für Omada-Geräte → Marco fragen (gesammelt, eine Nachricht)
  - id: netzwerk_firmware_fragen
    alias: "Netzwerk: neue Firmware – per Telegram ankündigen"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set e = trigger.event.data %}
          {{ e.entity_id is match('update\\.') and e.new_state is not none and e.new_state.state == 'on'
             and e.old_state is not none and e.old_state.state == 'off'
             and e.entity_id in integration_entities('tplink_omada') }}
    actions:
      - delay: "00:03:00"
      - variables:
          liste: >-
            {% set ns = namespace(l=[]) %}
            {% for e in integration_entities('tplink_omada') | select('match', 'update\\.') | select('is_state', 'on') %}
              {% set d = device_id(e) %}{% set ns.l = ns.l + [(device_attr(d, 'name_by_user') or device_attr(d, 'name') or e) ~ ' (' ~ state_attr(e, 'latest_version') ~ ')'] %}
            {% endfor %}
            {{ ns.l }}
          marco: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\\d+$') | first | default('') }}"
      - condition: template
        value_template: "{{ liste | count > 0 and marco != '' }}"
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: "{{ marco | int }}"
          message: >-
            📡 Neue Firmware fürs Netzwerk: {{ liste | join(', ') }}.
            Wird heute Nacht um 2:30 Uhr automatisch eingespielt (eins nach dem anderen, Router zuletzt) – du musst nichts tun.
          inline_keyboard:
            - "Lieber jetzt:/omada_jetzt, Diesmal nicht:/omada_spaeter"

  - id: netzwerk_firmware_knopf
    alias: "Netzwerk: Firmware-Knopf in Telegram"
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.data in ['/omada_jetzt', '/omada_nachts', '/omada_spaeter'] }}"
    actions:
      - variables:
          wahl: "{{ trigger.event.data.data }}"
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "OK"
      - action: telegram_bot.edit_message
        continue_on_error: true
        data:
          chat_id: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id }}"
          message: >-
            {% if wahl == '/omada_jetzt' %}🔄 Firmware wird jetzt eingespielt – erst die Access Points, dann Switch, Router zuletzt. Ich melde mich, wenn alles fertig ist.
            {%- elif wahl == '/omada_nachts' %}🌙 Wird heute Nacht um 2:30 Uhr eingespielt.
            {%- else %}👍 Diese Version wird übersprungen. Die nächste kommt wieder automatisch nachts.{% endif %}
      - if: "{{ wahl == '/omada_spaeter' }}"
        then:
          - action: update.skip
            continue_on_error: true
            target:
              entity_id: "{{ integration_entities('tplink_omada') | select('match', 'update\\.') | select('is_state', 'on') | list }}"
      - if: "{{ wahl == '/omada_nachts' }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.netzwerk_update_nachts
      - if: "{{ wahl == '/omada_jetzt' }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.netzwerk_firmware

  - id: netzwerk_firmware_nachts
    alias: "Netzwerk: Firmware nachts einspielen"
    triggers:
      - trigger: time
        at: "02:30:00"
    conditions:
      - condition: template
        value_template: >-
          {{ integration_entities('tplink_omada') | select('match', 'update\\.') | select('is_state', 'on') | list | count > 0
             and not is_state('input_boolean.urlaubsmodus', 'on') and not is_state('input_boolean.updates_pause', 'on') }}
    actions:
      - action: script.turn_on
        target:
          entity_id: script.netzwerk_firmware

  # Einmalig nach dem Start vorschlagen, die Adressen festzumachen (danach jederzeit über das Skript)
  - id: netzwerk_ip_liste_einmal
    alias: "Netzwerk: feste Adressen einmalig vorschlagen"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ integration_entities('tplink_omada') | count > 0 }}"
    actions:
      - delay: "00:03:00"
      - action: script.netzwerk_adressen_festmachen
        data:
          modus: plan_einmal

  - id: netzwerk_adressen_knopf
    alias: "Netzwerk: Knopf feste Adressen"
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.data in ['/omada_fest_ja', '/omada_fest_nein'] }}"
    actions:
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "OK"
      - action: telegram_bot.edit_replymarkup
        continue_on_error: true
        data:
          chat_id: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id }}"
          inline_keyboard: []
      - if: "{{ trigger.event.data.data == '/omada_fest_ja' }}"
        then:
          - action: script.netzwerk_adressen_festmachen
            data:
              modus: ausfuehren
