# Fehlermeldungen rund um Telegram, Claude, Kalender und Skripte an den
# Telegram-Bot schicken (an die erste freigegebene Chat-ID).
# So lassen sich Probleme ohne Laptop erkennen. Höchstens eine Meldung pro Minute.
automation:
- id: fehler_an_telegram
  alias: Fehler an Telegram melden
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: event
    event_type: system_log_event
    event_data:
      level: ERROR
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.name is search(''ai_task|anthropic|script|automation|calendar|telegram|template|rest_command'',
      ignorecase=True) }}'
  actions:
  - action: telegram_bot.send_message
    continue_on_error: true
    data:
      message: '{% set t %}⚠️ Fehler in Home Assistant ({{ trigger.event.data.name }}): {{ (trigger.event.data.message
        | join('' ''))[:700] }}{% endset %}{{ t | replace(''&'',''&amp;'') | replace(''<'',''&lt;'') | replace(''>'',''&gt;'')
        }}'
      parse_mode: html
  - delay: 00:01:00
- id: telegram_unbekannter_chat
  alias: 'Telegram: unbekannte Chat-ID melden'
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: event
    event_type: system_log_event
  conditions:
  - condition: template
    value_template: "{{ 'telegram' in (trigger.event.data.name | lower)\n   and (trigger.event.data.message | join('\
      \ ')) is search('unauthorized|not in allowed|nicht erlaubt', ignorecase=True) }}"
  actions:
  - variables:
      text: '{{ trigger.event.data.message | join('' '') }}'
      ids: '{{ text | regex_findall(''-?\d{6,}'') | unique | list }}'
  - action: telegram_bot.send_message
    continue_on_error: true
    data:
      message: '{% set t %}👋 Jemand Unbekanntes hat dem Bot geschrieben. Chat-ID: {{ ids | join('', '') if ids else
        ''(nicht erkannt)'' }} Zum Freigeben in Home Assistant: Telegram bot → „Zulässige Chat-ID hinzufügen“.{%
        endset %}{{ t | replace(''&'',''&amp;'') | replace(''<'',''&lt;'') | replace(''>'',''&gt;'') }}'
      parse_mode: html
  - delay: 00:01:00
