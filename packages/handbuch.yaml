# Fragen zum Haus (Sicherungen, Haupthahn, Geräte, Anleitungen, Wo ist was) mit dem Haus-Handbuch beantworten:
# claude_tools/handbuch.py liest das Handbuch (Link nur in input_text.zuhause_seite_link), die Fotos im Eingang und passende
# Dokumente der Akte und antwortet konkret (z. B. „Hager-Verteiler Nebengebäude, Platz 7, Waschmaschinenschiene B16“).
# - Telegram: jede Frage („?“, „wo/wie/was/welche …“, „sag mal …“) wird zuerst hier nachgeschlagen (packages/telegram.yaml);
#   steht nichts in den Unterlagen oder geht es um den aktuellen Zustand, antwortet wie bisher Jarvis mit den Live-Daten
# - Sprache/Jarvis: Werkzeug „Jarvis Frage zum Haus“ (in den Sprachassistenten freigeben)
shell_command:
  handbuch: python3 /config/claude_tools/handbuch.py {{ aktion }} {{ wert }}

script:
  jarvis_haus_frage:
    alias: Jarvis Frage zum Haus
    description: >-
      Schlägt im gesammelten Wissen der Familie nach: Haus-Handbuch (Sicherungsplan, Haustechnik, Geräte, Maschinen mit
      Betriebsstoffen wie Sprit/Öl und Anleitungen, Wo ist was, Netzwerk, Wohnwagen), Wartung, Zählerstände, Fotos und Akte.
      Nutze das IMMER bei Fragen wie "welche Sicherung …", "wo ist …", "welchen Sprit braucht die Motorsäge", "wie oft
      Filter wechseln" statt selbst zu raten. Ist "gefunden" true, gib "antwort" sinngemäß weiter, sonst antworte selbst.
    icon: mdi:home-search
    mode: queued
    fields:
      frage:
        name: Frage
        required: true
        selector:
          text:
    sequence:
      - variables:
          live: >-
            {%- set ns = namespace(z=[]) %}
            {%- for e in integration_entities('vicare') | sort if states(e) not in ['unknown', 'unavailable'] %}
            {%- set ns.z = ns.z + [(device_attr(e, 'name_by_user') or device_attr(e, 'name') or 'Viessmann') ~ ' · ' ~ (state_attr(e, 'friendly_name') or e) ~ ': ' ~ states(e) ~ ' ' ~ (state_attr(e, 'unit_of_measurement') or '')] %}
            {%- endfor %}
            {%- for s in states.sensor if s.entity_id is match('sensor\\.(temperatur|luftfeuchte)_') and s.state not in ['unknown', 'unavailable'] %}
            {%- set ns.z = ns.z + ['Raum · ' ~ s.name ~ ': ' ~ s.state ~ ' ' ~ (s.attributes.unit_of_measurement or '')] %}
            {%- endfor %}
            {{ ns.z | join('\n') }}
      - action: shell_command.handbuch
        continue_on_error: true
        data:
          aktion: frage
          wert: "{{ {'frage': frage, 'link': states('input_text.zuhause_seite_link') | string, 'live': live} | to_json | base64_encode }}"
        response_variable: antwort
      - variables:
          ergebnis: >-
            {% set a = antwort.stdout | default('') if antwort is defined and antwort is mapping else '' %}
            {{ a | from_json if (a | string).startswith('{') else {'ok': false, 'fehler': 'keine Antwort'} }}
      - stop: fertig
        response_variable: ergebnis

