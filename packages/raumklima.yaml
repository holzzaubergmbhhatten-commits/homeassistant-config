# Raumklima aus den HomePods (Temperatur und Luftfeuchte) – Apple gibt die HomePod-Sensoren nur in der Home-App heraus.
# Ablauf: Home Assistant schaltet alle 15 Minuten den Schalter "HomePod-Abfrage" ein (über die HomeKit-Bridge in der
# Home-App sichtbar). Eine Automation in der Home-App ("Wenn HomePod-Abfrage eingeschaltet wird") liest die HomePods und
# schickt je Raum einen Aufruf an den Webhook unten:
#   POST http://192.168.0.191:8123/api/webhook/raumklima_homepod?raum=kueche&t=<Temperatur>&h=<Luftfeuchte>
# Der Webhook ist nur aus dem Heimnetz erreichbar (local_only). Raumnamen: siehe Liste der Sensoren unten; andere Namen
# landen trotzdem im Sensor "Raumklima HomePods" (Attribut raeume).

# HomeKit-Bridge nur für diesen einen Schalter (Kopplungscode erscheint in Home Assistant unter Benachrichtigungen)
homekit:
  - name: HA Raumklima
    filter:
      include_entities:
        - input_boolean.homepod_abfrage

input_boolean:
  homepod_abfrage:
    name: HomePod-Abfrage
    icon: mdi:home-thermometer-outline

automation:
  - id: raumklima_homepod_anstossen
    alias: "Raumklima: HomePods alle 15 Minuten abfragen"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.homepod_abfrage
      - delay: "00:00:30"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.homepod_abfrage

template:
  - triggers:
      - trigger: webhook
        webhook_id: raumklima_homepod
        allowed_methods: [POST, GET]
        local_only: true
    variables:
      # Werte direkt aus der Adresse lesen (?raum=…&t=…&h=…). Zahlen kommen je nach Sprache als "21,5", "21.5" oder "21,5 °C".
      raum: "{{ (trigger.query.raum | default('') | string | lower | trim).replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss').replace(' ','_') }}"
      t_text: "{{ (trigger.query.t | default('') | string).replace(',', '.') }}"
      h_text: "{{ (trigger.query.h | default('') | string).replace(',', '.') }}"
      t: "{{ (t_text | string | regex_findall_index('-?[0-9]+(?:[.][0-9]+)?')) | float if t_text is search('[0-9]') else none }}"
      h: "{{ (h_text | string | regex_findall_index('[0-9]+(?:[.][0-9]+)?')) | float if h_text is search('[0-9]') else none }}"
    sensor:
      - name: Raumklima HomePods
        unique_id: raumklima_homepods_letzte
        icon: mdi:home-thermometer
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          raeume: >-
            {% set alt = (this.attributes.raeume if this is defined and this.attributes is defined and this.attributes.raeume is mapping else {}) %}
            {% if raum %}{{ dict(alt.items() | list + [(raum, {'t': t, 'h': h, 'zeit': now().strftime('%H:%M')})]) }}{% else %}{{ alt }}{% endif %}
      - name: "Temperatur Badezimmer"
        unique_id: raumklima_badezimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (t | float(0) | round(1)) if raum == 'badezimmer' and t not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Badezimmer"
        unique_id: raumklima_badezimmer_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (h | float(0) | round(0)) if raum == 'badezimmer' and h not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Badezimmer 2"
        unique_id: raumklima_badezimmer_2_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
