        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (hq['muckis_zimmer'] | float(0) | round(0)) if hq is mapping and 'muckis_zimmer' in hq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Küche"
