# Raumklima aus den HomePods (Temperatur und Luftfeuchte) – Apple gibt die HomePod-Sensoren nur in der Home-App heraus.
# Ablauf: Home Assistant schaltet alle 15 Minuten den Schalter "HomePod-Abfrage" ein (über die HomeKit-Bridge in der
# Home-App sichtbar). Eine Automation in der Home-App ("Wenn HomePod-Abfrage eingeschaltet wird") liest die HomePods und
# schickt je Raum einen Aufruf an den Webhook unten:
#   POST http://192.168.0.191:8123/api/webhook/raumklima_homepod?raum=kueche&t=<Temperatur>&h=<Luftfeuchte>
# Der Webhook ist nur aus dem Heimnetz erreichbar (local_only). Raumnamen: siehe Liste der Sensoren unten; andere Namen
# landen trotzdem im Sensor "Raumklima HomePods" (Attribut raeume).

# HomeKit-Bridge nur für diesen einen Schalter (Kopplungscode erscheint in Home Assistant unter Benachrichtigungen)
homekit:
  - name: HA Raumklima
    filter:
      include_entities:
        - input_boolean.homepod_abfrage

input_number:
  # Unter dieser Temperatur (2 Stunden lang, tagsüber in der Heizzeit) meldet sich der Bot: „Raum wird nicht warm“
  raumklima_mindesttemperatur:
    name: Raumklima Mindesttemperatur
    icon: mdi:thermometer-alert
    min: 15
    max: 23
    step: 0.5
    initial: 19
    unit_of_measurement: "°C"
    mode: box

input_boolean:
  homepod_abfrage:
    name: HomePod-Abfrage
    icon: mdi:home-thermometer-outline

automation:
  # Raum wird nicht warm: 2 Stunden unter der Mindesttemperatur (Oktober–April, 7–22 Uhr) → Telegram mit Außentemperatur,
  # Vorlauf und Kompressor aus der Wärmepumpe (Viessmann ViCare), damit man sieht, ob es an der Anlage oder am Raum liegt.
  # Meldet sich je Raum erst wieder, nachdem der Raum zwischendurch warm war.
  - id: raumklima_raum_wird_nicht_warm
    alias: "Raumklima: Raum wird nicht warm"
    mode: queued
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.temperatur_kuche
          - sensor.temperatur_wohnzimmer
          - sensor.temperatur_muckis_zimmer
          - sensor.temperatur_buro
          - sensor.temperatur_badezimmer
          - sensor.temperatur_badezimmer_2
          - sensor.temperatur_diele
          - sensor.temperatur_flur
        below: input_number.raumklima_mindesttemperatur
        for: "02:00:00"
    conditions:
      - condition: time
        after: "07:00:00"
        before: "22:00:00"
      - condition: template
        value_template: "{{ now().month in [10, 11, 12, 1, 2, 3, 4] }}"
    actions:
      - variables:
          raum: "{{ state_attr(trigger.entity_id, 'friendly_name') | replace('Temperatur ', '') }}"
          wp: >-
            {% set ns = namespace(t=[]) %}
            {% for e in integration_entities('vicare') | select('match', '^(sensor|binary_sensor)\\.') %}
              {% set n = (state_attr(e, 'friendly_name') or '') | lower %}
              {% if states(e) not in ['unknown', 'unavailable'] and not (n is search('soll|min|max|offset|hysterese|target')) %}
                {% if n is search('au(ß|ss)en|outside') and 'außen' not in ns.t | join %}{% set ns.t = ns.t + ['außen ' ~ states(e) ~ ' °C'] %}{% endif %}
                {% if n is search('vorlauf|supply') and 'Vorlauf' not in ns.t | join %}{% set ns.t = ns.t + ['Vorlauf ' ~ states(e) ~ ' °C'] %}{% endif %}
                {% if n is search('kompressor|verdichter|compressor') and 'Kompressor' not in ns.t | join %}{% set ns.t = ns.t + ['Kompressor ' ~ state_translated(e)] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.t | join(', ') }}
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
          message: >-
            🌡 {{ raum }} wird nicht warm: seit 2 Stunden unter {{ states('input_number.raumklima_mindesttemperatur') }} °C
            (jetzt {{ states(trigger.entity_id) }} °C).
            {{ ('Wärmepumpe: ' ~ wp ~ '.') if wp | trim else '' }}
            Prüfen: Berker-Regler im Raum hochgedreht? Stellmotor am Heizkreisverteiler offen? Fenster auf?
  # Bad lüften: über 70 % Luftfeuchte länger als 20 Minuten (z. B. nach dem Duschen) → Telegram an alle, die dem Bot
  # schreiben (Marco, Mirka …). Solange es feucht bleibt, alle 20 Minuten nochmal (höchstens 4-mal), dann Ruhe, bis die
  # Feuchte wieder gefallen ist. Schlafzimmer (Fenster abends offen) und Terrasse (draußen) sind bewusst nicht dabei.
  - id: raumklima_bad_lueften
    alias: "Raumklima: Bad lüften"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.luftfeuchte_badezimmer
        above: 70
        for: "00:20:00"
    conditions:
      - condition: time
        after: "07:00:00"
        before: "22:00:00"
    actions:
      - repeat:
          while:
            - condition: numeric_state
              entity_id: sensor.luftfeuchte_badezimmer
              above: 70
            - condition: template
              value_template: "{{ repeat.index <= 4 and now().hour < 22 }}"
          sequence:
            - repeat:
                for_each: >-
                  {{ (states('input_text.telegram_empfaenger') | string).split(';') | map('trim') | select('match', '^-?\d+$') | list }}
                sequence:
                  - action: telegram_bot.send_message
                    continue_on_error: true
                    data:
                      chat_id: "{{ repeat.item | int }}"
                      message: >-
                        💧 Bad lüften: Die Luftfeuchte liegt bei {{ states('sensor.luftfeuchte_badezimmer') | float(0) | round(0) | int }} %.
                        Bitte 5–10 Minuten Fenster ganz auf (Stoßlüften), Tür zum Flur dabei zu.
            - delay: "00:20:00"
  - id: raumklima_homepod_anstossen
    alias: "Raumklima: HomePods alle 15 Minuten abfragen"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.homepod_abfrage
      - delay: "00:00:30"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.homepod_abfrage

template:
  - triggers:
      - trigger: webhook
        webhook_id: raumklima_homepod
        allowed_methods: [POST, GET]
        local_only: true
    variables:
      # Werte direkt aus der Adresse lesen (?raum=…&t=…&h=…). Zahlen kommen je nach Sprache als "21,5", "21.5" oder "21,5 °C".
      raum: "{{ (trigger.query.raum | default('') | string | lower | trim).replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss').replace(' ','_') }}"
      t_text: "{{ (trigger.query.t | default('') | string).replace(',', '.') }}"
      h_text: "{{ (trigger.query.h | default('') | string).replace(',', '.') }}"
      t: "{{ (t_text | string | regex_findall_index('-?[0-9]+(?:[.][0-9]+)?')) | float if t_text is search('[0-9]') else none }}"
      h: "{{ (h_text | string | regex_findall_index('[0-9]+(?:[.][0-9]+)?')) | float if h_text is search('[0-9]') else none }}"
      # Am einfachsten: ?w=Wert/Wert/Wert/… – die Werte in der Reihenfolge der Aktionen im Kurzbefehl der Home-App,
      # getrennt durch "/" (keine Raumnamen nötig). Reihenfolge der Aktionen dort:
      reihenfolge: >-
        {{ [['badezimmer', 'h'], ['badezimmer', 't'], ['kueche', 'h'], ['kueche', 't'], ['muckis_zimmer', 'h'], ['muckis_zimmer', 't'],
            ['schlafzimmer', 'h'], ['schlafzimmer', 't'], ['terrasse', 'h'], ['terrasse', 't']] }}
      w_teile: "{{ (trigger.query.w | default('') | string).replace('|', '/').replace(';', '/').split('/') if trigger.query.w is defined else [] }}"
      # Alle Räume in EINEM Aufruf (eine Automation in der Home-App für alle HomePods):
      # ?kueche_t=21,5&kueche_h=48&wohnzimmer_t=…&wohnzimmer_h=… – Raumname vor _t/_h wie oben (Küche → kueche)
      tq: >-
        {% set ns = namespace(d={}) %}
        {% if raum and t is not none %}{% set ns.d = dict(ns.d, **{raum: t}) %}{% endif %}
        {% for r, a in reihenfolge if a == 't' %}
        {% set i = reihenfolge.index([r, a]) %}
        {% if i < w_teile | length and w_teile[i] is search('[0-9]') %}
        {% set ns.d = dict(ns.d, **{r: (w_teile[i] | string).replace(',', '.') | regex_findall_index('-?[0-9]+(?:[.][0-9]+)?') | float}) %}
        {% endif %}
        {% endfor %}
        {% for k, v in trigger.query.items() if k[-2:] | lower == '_t' and v | string is search('[0-9]') %}
        {% set r = (k[:-2] | lower | trim).replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss').replace(' ','_') %}
        {% set ns.d = dict(ns.d, **{r: (v | string).replace(',', '.') | regex_findall_index('-?[0-9]+(?:[.][0-9]+)?') | float}) %}
        {% endfor %}
        {{ ns.d }}
      hq: >-
        {% set ns = namespace(d={}) %}
        {% if raum and h is not none %}{% set ns.d = dict(ns.d, **{raum: h}) %}{% endif %}
        {% for r, a in reihenfolge if a == 'h' %}
        {% set i = reihenfolge.index([r, a]) %}
        {% if i < w_teile | length and w_teile[i] is search('[0-9]') %}
        {% set ns.d = dict(ns.d, **{r: (w_teile[i] | string).replace(',', '.') | regex_findall_index('[0-9]+(?:[.][0-9]+)?') | float}) %}
        {% endif %}
        {% endfor %}
        {% for k, v in trigger.query.items() if k[-2:] | lower == '_h' and v | string is search('[0-9]') %}
        {% set r = (k[:-2] | lower | trim).replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss').replace(' ','_') %}
        {% set ns.d = dict(ns.d, **{r: (v | string).replace(',', '.') | regex_findall_index('[0-9]+(?:[.][0-9]+)?') | float}) %}
        {% endfor %}
        {{ ns.d }}
    sensor:
      - name: Raumklima HomePods
        unique_id: raumklima_homepods_letzte
        icon: mdi:home-thermometer
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          # So kam der letzte Aufruf an (zum Nachsehen, ob jeder Raum seinen eigenen Wert schickt)
          letzte_anfrage: >-
            {% set ns = namespace(t=[]) %}
            {% for k, v in trigger.query.items() %}{% set ns.t = ns.t + [k ~ '=' ~ v] %}{% endfor %}
            {{ ns.t | join('&') }}
          raeume: >-
            {% set alt = (this.attributes.raeume if this is defined and this.attributes is defined and this.attributes.raeume is mapping else {}) %}
            {% set ns = namespace(d=alt) %}
            {% for r in (((tq.keys() | list) if tq is mapping else []) + ((hq.keys() | list) if hq is mapping else [])) | unique %}
            {% set ns.d = dict(ns.d.items() | list + [(r, {'t': tq.get(r) if tq is mapping else none, 'h': hq.get(r) if hq is mapping else none, 'zeit': now().strftime('%H:%M')})]) %}
            {% endfor %}
            {{ ns.d }}
      - name: "Temperatur Badezimmer"
        unique_id: raumklima_badezimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (tq['badezimmer'] | float(0) | round(1)) if tq is mapping and 'badezimmer' in tq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Badezimmer"
        unique_id: raumklima_badezimmer_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (hq['badezimmer'] | float(0) | round(0)) if hq is mapping and 'badezimmer' in hq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Badezimmer 2"
        unique_id: raumklima_badezimmer_2_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (tq['badezimmer_2'] | float(0) | round(1)) if tq is mapping and 'badezimmer_2' in tq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Badezimmer 2"
        unique_id: raumklima_badezimmer_2_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (hq['badezimmer_2'] | float(0) | round(0)) if hq is mapping and 'badezimmer_2' in hq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Schlafzimmer"
        unique_id: raumklima_schlafzimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (tq['schlafzimmer'] | float(0) | round(1)) if tq is mapping and 'schlafzimmer' in tq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Schlafzimmer"
        unique_id: raumklima_schlafzimmer_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (hq['schlafzimmer'] | float(0) | round(0)) if hq is mapping and 'schlafzimmer' in hq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Muckis Zimmer"
        unique_id: raumklima_muckis_zimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (tq['muckis_zimmer'] | float(0) | round(1)) if tq is mapping and 'muckis_zimmer' in tq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Muckis Zimmer"
        unique_id: raumklima_muckis_zimmer_feuchte
