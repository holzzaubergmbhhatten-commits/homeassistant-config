        state: "{{ (tq['buero'] | float(0) | round(1)) if tq is mapping and 'buero' in tq else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Büro"
