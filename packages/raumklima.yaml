# Raumklima aus den HomePods (Temperatur und Luftfeuchte) – Apple gibt die HomePod-Sensoren nur in der Home-App heraus.
# Ablauf: Home Assistant schaltet alle 15 Minuten den Schalter "HomePod-Abfrage" ein (über die HomeKit-Bridge in der
# Home-App sichtbar). Eine Automation in der Home-App ("Wenn HomePod-Abfrage eingeschaltet wird") liest die HomePods und
# schickt je Raum einen Aufruf an den Webhook unten:
#   POST http://192.168.0.191:8123/api/webhook/raumklima_homepod?raum=kueche&t=<Temperatur>&h=<Luftfeuchte>
# Der Webhook ist nur aus dem Heimnetz erreichbar (local_only). Raumnamen: siehe Liste der Sensoren unten; andere Namen
# landen trotzdem im Sensor "Raumklima HomePods" (Attribut raeume).

# HomeKit-Bridge nur für diesen einen Schalter (Kopplungscode erscheint in Home Assistant unter Benachrichtigungen)
homekit:
  - name: HA Raumklima
    filter:
      include_entities:
        - input_boolean.homepod_abfrage

input_number:
  # Unter dieser Temperatur (2 Stunden lang, tagsüber in der Heizzeit) meldet sich der Bot: „Raum wird nicht warm“
  raumklima_mindesttemperatur:
    name: Raumklima Mindesttemperatur
    icon: mdi:thermometer-alert
    min: 15
    max: 23
    step: 0.5
    initial: 19
    unit_of_measurement: "°C"
    mode: box

input_boolean:
  homepod_abfrage:
    name: HomePod-Abfrage
    icon: mdi:home-thermometer-outline

automation:
  # Raum wird nicht warm: 2 Stunden unter der Mindesttemperatur (Oktober–April, 7–22 Uhr) → Telegram mit Außentemperatur,
  # Vorlauf und Kompressor aus der Wärmepumpe (Viessmann ViCare), damit man sieht, ob es an der Anlage oder am Raum liegt.
  # Meldet sich je Raum erst wieder, nachdem der Raum zwischendurch warm war.
  - id: raumklima_raum_wird_nicht_warm
    alias: "Raumklima: Raum wird nicht warm"
    mode: queued
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.temperatur_kuche
          - sensor.temperatur_wohnzimmer
          - sensor.temperatur_schlafzimmer
          - sensor.temperatur_muckis_zimmer
          - sensor.temperatur_buro
          - sensor.temperatur_badezimmer
          - sensor.temperatur_badezimmer_2
          - sensor.temperatur_diele
          - sensor.temperatur_flur
        below: input_number.raumklima_mindesttemperatur
        for: "02:00:00"
    conditions:
      - condition: time
        after: "07:00:00"
        before: "22:00:00"
      - condition: template
        value_template: "{{ now().month in [10, 11, 12, 1, 2, 3, 4] }}"
    actions:
      - variables:
          raum: "{{ state_attr(trigger.entity_id, 'friendly_name') | replace('Temperatur ', '') }}"
          wp: >-
            {% set ns = namespace(t=[]) %}
            {% for e in integration_entities('vicare') | select('match', '^(sensor|binary_sensor)\\.') %}
              {% set n = (state_attr(e, 'friendly_name') or '') | lower %}
              {% if states(e) not in ['unknown', 'unavailable'] and not (n is search('soll|min|max|offset|hysterese|target')) %}
                {% if n is search('au(ß|ss)en|outside') and 'außen' not in ns.t | join %}{% set ns.t = ns.t + ['außen ' ~ states(e) ~ ' °C'] %}{% endif %}
                {% if n is search('vorlauf|supply') and 'Vorlauf' not in ns.t | join %}{% set ns.t = ns.t + ['Vorlauf ' ~ states(e) ~ ' °C'] %}{% endif %}
                {% if n is search('kompressor|verdichter|compressor') and 'Kompressor' not in ns.t | join %}{% set ns.t = ns.t + ['Kompressor ' ~ state_translated(e)] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.t | join(', ') }}
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: "{{ (states('input_text.telegram_empfaenger') | string).split(';') | first | trim }}"
          message: >-
            🌡 {{ raum }} wird nicht warm: seit 2 Stunden unter {{ states('input_number.raumklima_mindesttemperatur') }} °C
            (jetzt {{ states(trigger.entity_id) }} °C).
            {{ ('Wärmepumpe: ' ~ wp ~ '.') if wp | trim else '' }}
            Prüfen: Berker-Regler im Raum hochgedreht? Stellmotor am Heizkreisverteiler offen? Fenster auf?
  - id: raumklima_homepod_anstossen
    alias: "Raumklima: HomePods alle 15 Minuten abfragen"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.homepod_abfrage
      - delay: "00:00:30"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.homepod_abfrage

template:
  - triggers:
      - trigger: webhook
        webhook_id: raumklima_homepod
        allowed_methods: [POST, GET]
        local_only: true
    variables:
      # Werte direkt aus der Adresse lesen (?raum=…&t=…&h=…). Zahlen kommen je nach Sprache als "21,5", "21.5" oder "21,5 °C".
      raum: "{{ (trigger.query.raum | default('') | string | lower | trim).replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss').replace(' ','_') }}"
      t_text: "{{ (trigger.query.t | default('') | string).replace(',', '.') }}"
      h_text: "{{ (trigger.query.h | default('') | string).replace(',', '.') }}"
      t: "{{ (t_text | string | regex_findall_index('-?[0-9]+(?:[.][0-9]+)?')) | float if t_text is search('[0-9]') else none }}"
      h: "{{ (h_text | string | regex_findall_index('[0-9]+(?:[.][0-9]+)?')) | float if h_text is search('[0-9]') else none }}"
    sensor:
      - name: Raumklima HomePods
        unique_id: raumklima_homepods_letzte
        icon: mdi:home-thermometer
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          raeume: >-
            {% set alt = (this.attributes.raeume if this is defined and this.attributes is defined and this.attributes.raeume is mapping else {}) %}
            {% if raum %}{{ dict(alt.items() | list + [(raum, {'t': t, 'h': h, 'zeit': now().strftime('%H:%M')})]) }}{% else %}{{ alt }}{% endif %}
      - name: "Temperatur Badezimmer"
        unique_id: raumklima_badezimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (t | float(0) | round(1)) if raum == 'badezimmer' and t not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Badezimmer"
        unique_id: raumklima_badezimmer_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (h | float(0) | round(0)) if raum == 'badezimmer' and h not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Badezimmer 2"
        unique_id: raumklima_badezimmer_2_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (t | float(0) | round(1)) if raum == 'badezimmer_2' and t not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Badezimmer 2"
        unique_id: raumklima_badezimmer_2_feuchte
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (h | float(0) | round(0)) if raum == 'badezimmer_2' and h not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Schlafzimmer"
        unique_id: raumklima_schlafzimmer_temperatur
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (t | float(0) | round(1)) if raum == 'schlafzimmer' and t not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Luftfeuchte Schlafzimmer"
