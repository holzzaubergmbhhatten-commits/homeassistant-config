        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (h | float(0) | round(0)) if raum == 'badezimmer_2' and h not in (none, '') else (this.state if this is defined and this.state not in ('unknown', 'unavailable', none, '') else none) }}"
      - name: "Temperatur Schlafzimmer"
