# Steuerung des Touchmonitors über die App "HAOS Kiosk Display" (REST-API, Port 8080).
# Zurück zum Dashboard von jeder Seite (auch Amazon): mit 2 Fingern 3x tippen.
# (Neustart ausgelöst am 01.10. – Monitor und Jarvis-Stimme hingen)
rest_command:
  kiosk_url_oeffnen:
    url: "http://localhost:8080/launch_url"
    method: POST
    content_type: "application/json"
    payload: '{"url": "{{ url }}"}'
  # Zurück zum neuen Start-Dashboard
  kiosk_dashboard:
    url: "http://localhost:8080/launch_url"
    method: POST
    content_type: "application/json"
    payload: '{"url": "http://localhost:8123/flur-display/start"}'

script:
  monitor_neu_laden:
    alias: Monitor neu laden
    description: >-
      Lädt die Startseite auf dem Touchmonitor im Flur neu und schaltet den Bildschirm ein.
      Nutze das, wenn jemand sagt "der Monitor hängt", "lade den Monitor neu" oder "Monitor neu starten".
    icon: mdi:monitor-shimmer
    sequence:
      - action: script.monitor_an
        continue_on_error: true
        data:
          timeout: "{{ 60 if is_state('binary_sensor.monitor_nachtmodus', 'on') else 0 }}"
      - action: rest_command.kiosk_dashboard
        continue_on_error: true

  stellplaetze_verwalten:
    alias: Stellplätze verwalten (Homepage) auf dem Flur-Monitor
    description: >-
      Öffnet den Verwaltungsbereich von urlaub-wie-zuhause.eu auf dem Touchmonitor und
      springt nach 10 Minuten zurück zum Dashboard (sofort zurück: mit 2 Fingern 3x tippen).
    icon: mdi:rv-truck
    mode: restart
    sequence:
      - action: rest_command.kiosk_url_oeffnen
        data:
          url: https://urlaub-wie-zuhause.eu/verwaltung.html
      - delay: "00:10:00"
      - action: rest_command.kiosk_dashboard
      # Neue Buchungen gleich abholen
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: >-
            {{ ['calendar.privat_mit_buchung']
               + (states.calendar | map(attribute='entity_id') | select('search', 'stellpl') | list) }}

  amazon_startseite:
    alias: Amazon-Startseite auf dem Flur-Monitor
    description: >-
      Öffnet amazon.de auf dem Touchmonitor und springt nach 5 Minuten automatisch
      zurück zum Dashboard (sofort zurück: mit 2 Fingern 3x tippen).
    icon: mdi:cart
    mode: restart
    sequence:
      - action: rest_command.kiosk_url_oeffnen
        data:
          url: https://www.amazon.de/
      - delay: "00:05:00"
      - action: rest_command.kiosk_dashboard

  amazon_auf_monitor:
    alias: Amazon-Bestellungen auf dem Flur-Monitor
    description: >-
      Öffnet die Amazon-Bestellübersicht auf dem Touchmonitor und springt nach
      2 Minuten automatisch zurück zum Dashboard.
    icon: mdi:package-variant
    mode: restart
    sequence:
      - action: rest_command.kiosk_url_oeffnen
        data:
          url: https://www.amazon.de/gp/css/order-history
      - delay: "00:02:00"
      - action: rest_command.kiosk_dashboard

input_boolean:
  kiosk_sprache_eingestellt:
    name: Monitor-Sprache eingestellt
    icon: mdi:translate

automation:
  - id: kiosk_nach_start
    alias: "Monitor: nach dem Start das neue Dashboard anzeigen"
    description: >-
      Zeigt nach jedem Start von Home Assistant das Dashboard "Flur" auf dem Monitor.
      Einmalig wird vorher die Profilseite geöffnet, damit dort die Sprache auf Deutsch
      gestellt werden kann (die Sprache speichert der Browser des Monitors selbst).
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:01:30"
      - if:
          - condition: state
            entity_id: input_boolean.kiosk_sprache_eingestellt
            state: "off"
        then:
          - action: rest_command.kiosk_url_oeffnen
            data:
              url: http://localhost:8123/profile/general
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kiosk_sprache_eingestellt
          - delay: "00:10:00"
      - action: rest_command.kiosk_dashboard
