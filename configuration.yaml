# Wird aus GitHub eingespielt (Repository homeassistant-config).
# Änderungen bitte dort machen – lokale Änderungen werden beim nächsten Abgleich überschrieben.

# Standard-Integrationen. Nicht entfernen.
default_config:

homeassistant:
  # Alle Dateien im Ordner packages/ (Skripte, Sensoren, Automationen von Claude)
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

# Über die Oberfläche erstellte Automationen/Skripte/Szenen bleiben wie bisher.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    flur-display:
      mode: yaml
      filename: dashboards/flur.yaml
      title: Flur
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      require_admin: false
