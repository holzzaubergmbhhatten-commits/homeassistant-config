# Wird aus GitHub eingespielt (Repository homeassistant-config).
# Änderungen bitte dort machen – lokale Änderungen werden beim nächsten Abgleich überschrieben.

# Standard-Integrationen. Nicht entfernen.
default_config:

homeassistant:
  # Alle Dateien im Ordner packages/ (Skripte, Sensoren, Automationen von Claude)
  packages: !include_dir_named packages
  # Für Klingel-Fotos (packages/klingel.yaml → Telegram)
  allowlist_external_dirs:
    - /media

frontend:
  themes: !include_dir_merge_named themes
  # Ruhemodus am Flur-Monitor (nur im Kiosk-Browser): nach 7 Minuten ohne Berührung das Ruhebild
  extra_module_url:
    - /local/ruhemodus.js?v=2

# Über die Oberfläche erstellte Automationen/Skripte/Szenen bleiben wie bisher.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    flur-display:
      mode: yaml
      filename: dashboards/flur.yaml
      title: Flur
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      require_admin: false
