<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausflug</title>
<!--
  Ausflugsplaner (im Dashboard als Vollbild-iframe, am Monitor und im Handy-App):
  Wie (Rad, Auto, zu Fuß, Bahn), wann, wie lange, wer, was mögt ihr, wie weit → Claude sucht Ziele (script.ausflug_ki,
  Hintergrund, Fortschritt /local/ausflug_status.json), Ergebnis /local/ausflug_daten.json: Bilder, Ablauf, Tipps, Route.
  Route als Google-Maps-Link (Start = Zone „Zuhause“ aus Home Assistant), „Aufs Handy“ per Telegram, „In den Kalender“.
  Gemerkt/Erlebt werden über script.ausflug_speichern gespeichert. Keine Emojis auf der Seite (Monitor hat keine Emoji-Schrift).
-->
<style>
  :root { --bg: #f7f4ed; --karte: #fff; --text: #2d3329; --grau: #6b7266; --linie: #eee8d9; --gruen: #536b45; --dunkel: #33442b;
    --sand: #d8c7a3; --sand2: #efe8d8; --terra: #c96f4a; }
  .dunkel { --bg: #161a13; --karte: #232a1f; --text: #efe9dc; --grau: #a9a493; --linie: #343d2e; --gruen: #a9be8f; --dunkel: #c9d8b4;
    --sand: #4a4636; --sand2: #2c3326; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Montserrat, -apple-system, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  a { color: inherit; }
  .ic { width: 20px; height: 20px; fill: currentColor; flex: none; vertical-align: -4px; }
  .kopf { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; flex-wrap: wrap; }
  .kopf h1 { margin: 0; font-size: 26px; }
  .reiter { display: flex; background: var(--sand2); border-radius: 14px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; }
  .reiter button { padding: 9px 14px; border-radius: 11px; font-size: 15px; font-weight: 600; white-space: nowrap; color: var(--gruen); }
  .reiter button.an { background: var(--karte); color: var(--dunkel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  main { flex: 1; overflow: auto; padding: 12px 14px 90px; -webkit-overflow-scrolling: touch; }
  .karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(51,68,43,.08); }
  .karte h2 { margin: 0 0 8px; font-size: 22px; }
  .klein { font-size: 13px; color: var(--grau); line-height: 1.45; }
  .zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .knopf { padding: 12px 16px; border-radius: 14px; background: var(--sand2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; color: var(--dunkel); text-decoration: none; }
  .knopf.voll { background: var(--dunkel); color: #fff; }
  .dunkel .knopf.voll { color: #161a13; }
  .knopf.klein-k { padding: 8px 11px; font-size: 13px; border-radius: 11px; }
  .knopf:disabled { opacity: .45; }
  .gross { width: 100%; justify-content: center; padding: 17px; font-size: 18px; border-radius: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 11px 15px; border-radius: 14px; border: 2px solid var(--linie); background: var(--karte); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .chip.an { border-color: var(--dunkel); background: var(--sand2); }
  .chip svg { width: 26px; height: 26px; }
  label.f { display: block; font-size: 13px; color: var(--grau); font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=date] { width: 100%; font: inherit; font-size: 16px; padding: 11px 13px; border: 1px solid var(--linie); border-radius: 14px; background: var(--bg); color: var(--text); }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  @media (max-width: 760px) { .zwei { grid-template-columns: 1fr; } }
  /* Ideen */
  .ideen { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .idee { background: var(--karte); border: 1px solid var(--linie); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(51,68,43,.08); }
  .idee .bild { height: 190px; background: var(--sand2); position: relative; display: flex; align-items: center; justify-content: center; }
  .idee .bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .idee .bild svg { width: 150px; height: 110px; }
  .idee .art { position: absolute; left: 10px; top: 10px; background: rgba(51,68,43,.88); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 10px; }
  .idee .inhalt { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .idee h3 { margin: 0; font-size: 23px; font-family: "Cormorant Garamond", Georgia, serif; }
  .marken { display: flex; flex-wrap: wrap; gap: 5px; }
  .marke { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--sand2); color: var(--gruen); }
  .marke.terra { background: #f6e3da; color: #9a4f31; }
  .ablauf { margin: 4px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .ablauf li { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--linie); }
  .ablauf b { min-width: 46px; color: var(--gruen); }
  .hinweis { background: #f3ecdc; color: #5a4a30; border-left: 4px solid var(--terra); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  .dunkel .hinweis { background: #2f2a1c; color: #e8d7a8; }
  .arbeit { display: flex; align-items: center; gap: 12px; background: var(--dunkel); color: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; font-weight: 600; }
  .dunkel .arbeit { color: #161a13; }
  .fehler { background: #fde8e6; color: #b3412e; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .warten { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: dreh .8s linear infinite; flex: none; }
  @keyframes dreh { to { transform: rotate(360deg); } }
  .rad { animation: dreh 1.4s linear infinite; transform-box: fill-box; transform-origin: center; }
  .leerbild { text-align: center; padding: 30px 10px; color: var(--grau); }
  .meldung { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(45,51,41,.94); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 15px; display: none; z-index: 30; max-width: 92%; text-align: center; }
</style>

<body>
<div class="kopf">
  <h1 class="serif">Ausflug</h1>
  <div class="reiter" id="reiter">
    <button data-a="reiter" data-r="planen">Planen</button>
    <button data-a="reiter" data-r="ideen">Ideen</button>
    <button data-a="reiter" data-r="gemerkt">Gemerkt</button>
    <button data-a="reiter" data-r="erlebt">Erlebt</button>

<main id="inhalt"><div class="leerbild">Wird geladen …</div></main>
<div class="meldung" id="meldung"></div>
<script>
"use strict";
const DATEN_URL = "/local/ausflug_daten.json", STATUS_URL = "/local/ausflug_status.json";
const $ = id => document.getElementById(id);
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function meldung(t) { const m = $("meldung"); m.textContent = t; m.style.display = "block"; clearTimeout(meldung.t); meldung.t = setTimeout(() => m.style.display = "none", 4500); }
const TAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const P = {
  pfeil: "M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z",
  stern: "M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z",
  haken: "M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z",
  karte: "M15,19L9,16.89V5L15,7.11M20.5,3C20.44,3 20.39,3 20.34,3L15,5.1L9,3L3.36,4.9C3.15,4.97 3,5.15 3,5.38V20.5A0.5,0.5 0 0,0 3.5,21C3.55,21 3.61,21 3.66,20.97L9,18.9L15,21L20.64,19.1C20.85,19 21,18.85 21,18.62V3.5A0.5,0.5 0 0,0 20.5,3Z",
  senden: "M2,21L23,12L2,3V10L17,12L2,14V21Z",
  kalender: "M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H18V1M17,12H12V17H17V12Z",
  zauber: "M7.5,5.6L5,7L6.4,4.5L5,2L7.5,3.4L10,2L8.6,4.5L10,7L7.5,5.6M19.5,15.4L22,14L20.6,16.5L22,19L19.5,17.6L17,19L18.4,16.5L17,14L19.5,15.4M22,2L20.6,4.5L22,7L19.5,5.6L17,7L18.4,4.5L17,2L19.5,3.4L22,2M13.34,12.78L15.78,10.34L13.66,8.22L11.22,10.66L13.34,12.78M14.37,7.29L16.71,9.63C17.1,10 17.1,10.65 16.71,11.04L5.04,22.71C4.65,23.1 4,23.1 3.63,22.71L1.29,20.37C0.9,20 0.9,19.35 1.29,18.96L12.96,7.29C13.35,6.9 14,6.9 14.37,7.29Z",
  muell: "M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z",
  web: "M16.36,14C16.44,13.34 16.5,12.68 16.5,12C16.5,11.32 16.44,10.66 16.36,10H19.74C19.9,10.64 20,11.31 20,12C20,12.69 19.9,13.36 19.74,14M14.59,19.56C15.19,18.45 15.65,17.25 15.97,16H18.92C17.96,17.65 16.43,18.93 14.59,19.56M14.34,14H9.66C9.56,13.34 9.5,12.68 9.5,12C9.5,11.32 9.56,10.65 9.66,10H14.34C14.43,10.65 14.5,11.32 14.5,12C14.5,12.68 14.43,13.34 14.34,14M12,19.96C11.17,18.76 10.5,17.43 10.09,16H13.91C13.5,17.43 12.83,18.76 12,19.96M8,8H5.08C6.03,6.34 7.57,5.06 9.4,4.44C8.8,5.55 8.35,6.75 8,8M5.08,16H8C8.35,17.25 8.8,18.45 9.4,19.56C7.57,18.93 6.03,17.65 5.08,16M4.26,14C4.1,13.36 4,12.69 4,12C4,11.31 4.1,10.64 4.26,10H7.64C7.56,10.66 7.5,11.32 7.5,12C7.5,12.68 7.56,13.34 7.64,14M12,4.03C12.83,5.23 13.5,6.57 13.91,8H10.09C10.5,6.57 11.17,5.23 12,4.03M18.92,8H15.97C15.65,6.75 15.19,5.55 14.59,4.44C16.43,5.07 17.96,6.34 18.92,8M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z",
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
// gezeichnete Symbole (statt Emojis) für Verkehrsmittel und Arten von Zielen
const ZEICHNUNG = {
  Fahrrad: `<circle class="rad" cx="18" cy="36" r="11" fill="none" stroke="#33442b" stroke-width="3"/><circle class="rad" cx="54" cy="36" r="11" fill="none" stroke="#33442b" stroke-width="3"/>
    <path d="M18 36 L30 18 L46 18 L54 36 M30 18 L36 36 L46 18 M27 12 h8 M44 14 l4 -4 h6" stroke="#c96f4a" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  Auto: `<path d="M8 34 v-8 l8 -12 h30 l10 12 h6 v8z" fill="#536b45"/><rect x="20" y="16" width="12" height="9" rx="2" fill="#efe8d8"/><rect x="35" y="16" width="12" height="9" rx="2" fill="#efe8d8"/>
    <circle cx="20" cy="36" r="7" fill="#2d3329"/><circle cx="50" cy="36" r="7" fill="#2d3329"/>`,
  "Zu Fuß": `<circle cx="36" cy="10" r="6" fill="#c96f4a"/><path d="M36 18 v14 l-8 14 M36 32 l8 14 M36 22 l-10 8 M36 22 l10 6" stroke="#33442b" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  Bahn: `<rect x="14" y="6" width="44" height="34" rx="8" fill="#536b45"/><rect x="20" y="12" width="32" height="12" rx="3" fill="#efe8d8"/><circle cx="24" cy="32" r="3" fill="#efe8d8"/>
    <circle cx="48" cy="32" r="3" fill="#efe8d8"/><path d="M20 40 l-6 8 M52 40 l6 8" stroke="#33442b" stroke-width="3"/>`,
  Natur: `<circle cx="54" cy="12" r="7" fill="#e2b44b"/><path d="M22 44 V30" stroke="#765c3d" stroke-width="5"/><circle cx="22" cy="22" r="13" fill="#536b45"/><path d="M0 46 Q36 34 72 46" fill="#a9be8f"/>`,
  Tiere: `<ellipse cx="36" cy="32" rx="12" ry="10" fill="#c96f4a"/><circle cx="20" cy="18" r="5" fill="#c96f4a"/><circle cx="31" cy="12" r="5" fill="#c96f4a"/><circle cx="43" cy="12" r="5" fill="#c96f4a"/><circle cx="53" cy="18" r="5" fill="#c96f4a"/>`,
  Wasser: `<path d="M0 22 q9 -8 18 0 t18 0 t18 0 t18 0 M0 34 q9 -8 18 0 t18 0 t18 0 t18 0" stroke="#4f8fb8" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="56" cy="8" r="6" fill="#e2b44b"/>`,
  Wellness: `<path d="M36 6 C24 22 22 30 36 38 C50 30 48 22 36 6z" fill="#7fb3d5"/><path d="M12 44 q24 -12 48 0" stroke="#536b45" stroke-width="4" fill="none"/>`,
  Museum: `<path d="M8 16 L36 4 L64 16z" fill="#765c3d"/><rect x="12" y="18" width="6" height="22" fill="#d8c7a3"/><rect x="26" y="18" width="6" height="22" fill="#d8c7a3"/><rect x="40" y="18" width="6" height="22" fill="#d8c7a3"/><rect x="54" y="18" width="6" height="22" fill="#d8c7a3"/><rect x="8" y="40" width="56" height="6" fill="#765c3d"/>`,
  Stadt: `<rect x="6" y="20" width="16" height="26" fill="#c96f4a"/><rect x="26" y="8" width="18" height="38" fill="#536b45"/><rect x="48" y="16" width="18" height="30" fill="#765c3d"/>`,
  Essen: `<path d="M14 18 h34 v10 a17 17 0 0 1 -34 0z" fill="#c96f4a"/><path d="M48 22 h6 a6 6 0 0 1 0 12 h-6" stroke="#c96f4a" stroke-width="4" fill="none"/><path d="M24 4 q4 5 0 10 M34 4 q4 5 0 10" stroke="#b9b2a2" stroke-width="3" fill="none"/>`,
};
const zeichnung = (n, w = 72, h = 48) => `<svg viewBox="0 0 72 48" width="${w}" height="${h}">${ZEICHNUNG[n] || ZEICHNUNG.Natur}</svg>`;
const ART_BILD = { Natur: "Natur", Tiere: "Tiere", Spielplatz: "Natur", Wellness: "Wellness", Baden: "Wasser", Strand: "Wasser", Museum: "Museum",
  Stadt: "Stadt", Essen: "Essen", Abenteuer: "Natur", Drinnen: "Museum" };

const WIE = ["Fahrrad", "Auto", "Zu Fuß", "Bahn"];
const DAUER = ["2 Stunden", "Halber Tag", "Ganzer Tag", "Wochenende mit Übernachtung"];
const WER = ["Familie mit Mathilda", "Nur wir zwei", "Mit Freunden / Oma und Opa"];
const INTERESSEN = ["Natur & Deich", "Tiere & Zoo", "Spielplatz & Toben", "Wellness & Spa", "Therme & Baden", "Strand & Nordsee", "Museum & Kultur",
  "Stadt & Bummeln", "Café & Essen", "Abenteuer & Action", "Bei Regen drinnen", "Geheimtipp"];
const WEITE = { Fahrrad: ["bis 15 km", "bis 30 km", "bis 50 km"], "Zu Fuß": ["bis 5 km", "bis 10 km", "bis 15 km"],
  Auto: ["bis 30 Minuten", "bis 1 Stunde", "bis 2 Stunden", "weiter weg"], Bahn: ["bis 1 Stunde", "bis 2 Stunden", "weiter weg"] };

let daten = { gemerkt: [], erlebt: [], ideen: [], wunsch: {} }, reiter = "planen", arbeit = null, fehlerText = "", offen = {};
let w = { wie: "Fahrrad", wann: iso(new Date()), dauer: "Halber Tag", wer: "Familie mit Mathilda", interessen: ["Natur & Deich", "Café & Essen"], weite: "bis 30 km", wunsch: "" };

// ---------- Tippen (Monitor meldet Finger doppelt) ----------
let letzterFingertipp = 0, start = null;
document.addEventListener("touchstart", ev => { const t = ev.touches[0]; start = { x: t.clientX, y: t.clientY, el: ev.target.closest("[data-a]") }; }, { passive: true });
document.addEventListener("touchmove", ev => { const t = ev.touches[0]; if (start && Math.hypot(t.clientX - start.x, t.clientY - start.y) > 12) start = null; }, { passive: true });
document.addEventListener("touchend", ev => { letzterFingertipp = Date.now(); const s = start; start = null; if (!s || !s.el || s.el.tagName === "A") return; ev.preventDefault(); aktion(s.el); }, { passive: false });
document.addEventListener("click", ev => { if (Date.now() - letzterFingertipp < 1000) return; const el = ev.target.closest("[data-a]"); if (el && el.tagName !== "A") aktion(el); });

async function laden() {
  try { const r = await fetch(DATEN_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) daten = Object.assign(daten, await r.json()); } catch (e) { /* noch leer */ }
  daten.gemerkt = daten.gemerkt || []; daten.erlebt = daten.erlebt || []; daten.ideen = daten.ideen || [];
  if (daten.wunsch && daten.wunsch.wie) w = Object.assign(w, daten.wunsch, { wann: iso(new Date()) });
}
async function speichern() {
  const h = hass(); if (!h) return;
  daten.wunsch = Object.assign({}, w);
  try { await h.callWS({ type: "call_service", domain: "script", service: "ausflug_speichern", service_data: { daten: JSON.stringify(daten) }, return_response: true }); }
  catch (e) { meldung("Nicht gespeichert: " + (e.message || e)); }
}
async function beobachten() {
  clearTimeout(beobachten.t);
  let s = {};
  try { const r = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) s = await r.json(); } catch (e) { /* gleich nochmal */ }
  if (s.laeuft) { arbeit = { text: s.text || "Claude sucht …" }; zeichnen(); beobachten.t = setTimeout(beobachten, 3000); return; }
  if (arbeit) { arbeit = null; if (s.fehler) fehlerText = s.fehler; await laden(); reiter = s.fehler ? reiter : "ideen"; zeichnen(); }
}

// ---------- Route & Text ----------
// Zuhause aus Home Assistant – aber nicht, wenn dort noch der Werks-Standort (Amsterdam) steht oder er weit weg vom Ziel liegt.
// Dann ohne Startpunkt: Google Maps nimmt den aktuellen Standort des Handys.
function heim(i) {
  const h = hass(), la = h && h.config && +h.config.latitude, lo = h && h.config && +h.config.longitude;
  if (!la || !lo || (Math.abs(la - 52.3731) < 0.01 && Math.abs(lo - 4.8903) < 0.01)) return "";
  if (i && i.lat && i.lon) {
    const km = 111 * Math.hypot(la - i.lat, (lo - i.lon) * Math.cos(la * Math.PI / 180));
    if (km > 250) return "";
  }
  return `${la},${lo}`;
}
function mapsLink(i, wie) {
  const zuhause = heim(i);
  const modus = { Fahrrad: "bicycling", Auto: "driving", "Zu Fuß": "walking", Bahn: "transit" }[wie] || "driving";
  // Claudes Koordinaten sind oft nur grob (z. B. 53.35, 8.47) → Ziel lieber über die Adresse, die findet Google genau.
  // Zwischenstopps nur mit genauen Koordinaten (mind. 3 Nachkommastellen), sonst weglassen statt Umweg.
  const genau = v => (String(v).split(".")[1] || "").length >= 3;
  const ziel = i.adresse ? i.adresse : (i.lat && i.lon && genau(i.lat) && genau(i.lon) ? `${i.lat},${i.lon}` : i.name);
  const stopps = (i.zwischenstopps || []).filter(z => genau(z.lat) && genau(z.lon)).map(z => `${z.lat},${z.lon}`);
  let u = `https://www.google.com/maps/dir/?api=1&travelmode=${modus}`;
  if (zuhause) u += `&origin=${zuhause}`;
  if ((wie === "Fahrrad" || wie === "Zu Fuß") && zuhause) {   // Rundtour: über die Stopps zum Ziel und zurück nach Hause
    u += `&destination=${zuhause}&waypoints=${encodeURIComponent([...stopps, ziel].join("|"))}`;
  } else {
    u += `&destination=${encodeURIComponent(ziel)}` + (stopps.length && modus !== "transit" ? `&waypoints=${encodeURIComponent(stopps.join("|"))}` : "");
  }
  return u;
}
function planText(i, a) {
  const d = new Date(a.wann || iso(new Date()));
  return [`Ausflug: ${i.name} (${TAGE[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.) – ${a.wie || ""}`, i.kurz,
    i.adresse ? `Adresse: ${i.adresse}` : "", i.oeffnung ? `Geöffnet: ${i.oeffnung}` : "", i.preis ? `Preis: ${i.preis}` : "",
    (i.ablauf || []).length ? "Ablauf:\n" + i.ablauf.map(x => `• ${x.zeit} ${x.was}`).join("\n") : "",
    (i.mitnehmen || []).length ? `Mitnehmen: ${i.mitnehmen.join(", ")}` : "", i.einkehr ? `Einkehren: ${i.einkehr}` : "",
    (i.tipps || []).length ? "Tipps:\n" + i.tipps.map(x => `• ${x}`).join("\n") : "",
    `Route (Google Maps): ${mapsLink(i, a.wie)}`, i.webseite ? `Webseite: ${i.webseite}` : ""].filter(Boolean).join("\n");
}

// ---------- Zeichnen ----------
function zeichnen() {
  for (const b of document.querySelectorAll("#reiter button")) b.classList.toggle("an", b.dataset.r === reiter);
  const kopf = (arbeit ? `<div class="arbeit"><span class="warten"></span>${esc(arbeit.text)}</div>` : "")
    + (fehlerText ? `<div class="fehler">${esc(fehlerText)} <button class="knopf klein-k" data-a="fehlerweg">OK</button></div>` : "");
  const sc = $("inhalt").scrollTop;
  $("inhalt").innerHTML = kopf + ({ planen: planenSeite, ideen: ideenSeite, gemerkt: () => liste(daten.gemerkt, "gemerkt"), erlebt: () => liste(daten.erlebt, "erlebt") })[reiter]();
  $("inhalt").scrollTop = sc;
}
const chips = (liste, wert, feld, mehr, bild) => `<div class="chips">` + liste.map(x => {
  const an = mehr ? (wert || []).includes(x) : wert === x;
  return `<button class="chip ${an ? "an" : ""}" data-a="wahl" data-f="${feld}" data-w="${esc(x)}" data-m="${mehr ? 1 : 0}">${bild ? zeichnung(x, 36, 24) : ""}${esc(x)}</button>`;
}).join("") + `</div>`;
function planenSeite() {
  const heute = new Date(), tage = [0, 1, 2, 3, 4, 5, 6].map(n => { const d = new Date(heute); d.setDate(d.getDate() + n); return d; });
  return `<div class="karte"><h2 class="serif">Wohin soll es gehen?</h2><div class="klein">Ihr wählt, Claude sucht passende Ziele in der Nähe oder weiter weg –
      mit Öffnungszeiten, Preisen, Bildern, Ablauf und Route für Google Maps.</div>
    <label class="f">Womit?</label>${chips(WIE, w.wie, "wie", false, true)}
    <div class="zwei"><div><label class="f">Wann?</label><div class="chips">${tage.map(d => `<button class="chip ${w.wann === iso(d) ? "an" : ""}" data-a="wahl" data-f="wann" data-w="${iso(d)}" data-m="0">${["heute", "morgen"][tage.indexOf(d)] || TAGE[d.getDay()] + " " + d.getDate() + "."}</button>`).join("")}</div></div>
    <div><label class="f">Wie lange?</label>${chips(DAUER, w.dauer, "dauer")}</div></div>
    <div class="zwei"><div><label class="f">Wer kommt mit?</label>${chips(WER, w.wer, "wer")}</div>
    <div><label class="f">Wie weit höchstens?</label>${chips(WEITE[w.wie] || WEITE.Auto, w.weite, "weite")}</div></div>
    <label class="f">Was mögt ihr? (mehrere)</label>${chips(INTERESSEN, w.interessen, "interessen", true)}
    <label class="f">Besonderer Wunsch (optional)</label><input type="text" id="wunsch" value="${esc(w.wunsch)}" placeholder="z. B. mit Eis essen, Hund darf mit, Spa nur für Mirka …"></div>
    <button class="knopf voll gross" data-a="suchen" ${arbeit ? "disabled" : ""}>${ic("zauber")} Ideen finden</button>`;
}
function ideeKarte(i, idx, quelle) {
  const a = quelle === "ideen" ? (daten.anfrage || w) : (i.anfrage || w);
  const bildArt = ART_BILD[i.kategorie] || (a.wie === "Fahrrad" ? "Fahrrad" : "Natur");
  const auf = offen[quelle + idx];
  return `<div class="idee"><div class="bild">${i.bild ? `<img src="${esc(i.bild)}" alt="" loading="lazy" onerror="this.nextElementSibling.style.display='';this.remove()"><span style="display:none">${zeichnung(bildArt, 150, 100)}</span>` : zeichnung(bildArt, 150, 100)}
      <span class="art">${esc(i.kategorie || a.wie || "")}</span></div>
    <div class="inhalt"><h3>${esc(i.name)}</h3><div class="klein">${esc(i.kurz)}</div>
      <div class="marken">${i.entfernung_km ? `<span class="marke">${Math.round(i.entfernung_km)} km</span>` : ""}${i.fahrzeit_min ? `<span class="marke">${Math.round(i.fahrzeit_min)} min ${a.wie === "Fahrrad" ? "Rad" : "Fahrt"}</span>` : ""}
        <span class="marke ${i.drinnen ? "terra" : ""}">${i.drinnen ? "drinnen" : "draußen"}</span>${i.preis ? `<span class="marke">${esc(i.preis.slice(0, 40))}</span>` : ""}</div>
      <div>${esc(i.beschreibung)}</div>${i.warum ? `<div class="klein"><b>Passt, weil:</b> ${esc(i.warum)}</div>` : ""}
      ${auf ? `${i.oeffnung ? `<div class="klein"><b>Geöffnet:</b> ${esc(i.oeffnung)}</div>` : ""}${i.adresse ? `<div class="klein"><b>Adresse:</b> ${esc(i.adresse)}</div>` : ""}
        ${(i.ablauf || []).length ? `<ul class="ablauf">${i.ablauf.map(x => `<li><b>${esc(x.zeit)}</b><span>${esc(x.was)}</span></li>`).join("")}</ul>` : ""}
        ${(i.mitnehmen || []).length ? `<div class="klein"><b>Mitnehmen:</b> ${esc(i.mitnehmen.join(", "))}</div>` : ""}
        ${i.einkehr ? `<div class="klein"><b>Einkehren:</b> ${esc(i.einkehr)}</div>` : ""}
        ${(i.tipps || []).length ? `<div class="klein"><b>Tipps:</b> ${esc(i.tipps.join(" · "))}</div>` : ""}` : ""}
      <div class="zeile" style="margin-top:auto;padding-top:6px">
        <button class="knopf klein-k" data-a="auf" data-k="${quelle + idx}">${auf ? "Weniger" : "Ablauf & Tipps"}</button>
        <a class="knopf klein-k" href="${esc(mapsLink(i, a.wie))}" target="_blank" rel="noopener">${ic("karte")} Route</a>
        <button class="knopf klein-k voll" data-a="senden" data-q="${quelle}" data-i="${idx}">${ic("senden")} Aufs Handy</button>
        <button class="knopf klein-k" data-a="kalender" data-q="${quelle}" data-i="${idx}">${ic("kalender")} Kalender</button>
        ${quelle !== "gemerkt" ? `<button class="knopf klein-k" data-a="merken" data-q="${quelle}" data-i="${idx}">${ic("stern")} Merken</button>` : ""}
        ${quelle !== "erlebt" ? `<button class="knopf klein-k" data-a="erlebt" data-q="${quelle}" data-i="${idx}">${ic("haken")} Waren wir</button>` : ""}
        ${quelle !== "ideen" ? `<button class="knopf klein-k" data-a="weg" data-q="${quelle}" data-i="${idx}">${ic("muell")}</button>` : ""}
        ${i.webseite ? `<a class="knopf klein-k" href="${esc(i.webseite)}" target="_blank" rel="noopener">${ic("web")}</a>` : ""}
      </div></div></div>`;
}
function ideenSeite() {
  if (!daten.ideen.length) return `<div class="leerbild">${zeichnung("Fahrrad", 150, 100)}<p>Noch keine Ideen – unter „Planen“ auswählen und „Ideen finden“ antippen.</p></div>`;
  const a = daten.anfrage || {};
  return `${daten.hinweis ? `<div class="hinweis">${esc(daten.hinweis)}</div>` : ""}
    <div class="klein" style="margin-bottom:10px">${esc([a.wie, a.dauer, a.wer, (a.interessen || []).join(", ")].filter(Boolean).join(" · "))}</div>
    <div class="ideen">${daten.ideen.map((i, n) => ideeKarte(i, n, "ideen")).join("")}</div>`;
}
function liste(l, quelle) {
  if (!l.length) return `<div class="leerbild">${quelle === "gemerkt" ? "Noch nichts gemerkt – bei einer Idee auf „Merken“ tippen." : "Noch nichts eingetragen – nach einem Ausflug „Waren wir“ antippen, dann schlägt Claude ihn nicht wieder vor."}</div>`;
  return `<div class="ideen">${l.map((i, n) => ideeKarte(i, n, quelle)).join("")}</div>`;
}

// ---------- Aktionen ----------
async function aktion(el) {
  if (el.disabled) return;
  const a = el.dataset.a;
  if (a === "reiter") { leseWunsch(); reiter = el.dataset.r; zeichnen(); $("inhalt").scrollTop = 0; return; }
  if (a === "fehlerweg") { fehlerText = ""; zeichnen(); return; }
  if (a === "wahl") {
    leseWunsch();
    const f = el.dataset.f, v = el.dataset.w;
    if (el.dataset.m === "1") { const s = new Set(w[f] || []); s.has(v) ? s.delete(v) : s.add(v); w[f] = [...s]; }
    else { w[f] = v; if (f === "wie") w.weite = (WEITE[v] || WEITE.Auto)[1] || (WEITE[v] || WEITE.Auto)[0]; }
    zeichnen(); return;
  }
  if (a === "suchen") {
    leseWunsch();
    const h = hass(); if (!h) return;
    const d = new Date(w.wann);
    const auftrag = Object.assign({}, w, { wann: `${["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"][d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.`,
      erlebt: daten.erlebt.map(x => x.name).slice(-30) });
    arbeit = { text: "Claude sucht Ausflugsziele – das dauert etwa eine Minute …" }; fehlerText = ""; zeichnen(); speichern();
    try {
      const r = await h.callWS({ type: "call_service", domain: "script", service: "ausflug_ki", service_data: { auftrag: JSON.stringify(auftrag) }, return_response: true });
      const x = (r && r.response) || {};
      if (x.ok === false) { arbeit = null; fehlerText = x.fehler || "Hat nicht geklappt"; zeichnen(); return; }
      beobachten();
    } catch (e) { arbeit = null; fehlerText = String(e.message || e); zeichnen(); }
    return;
  }
  const q = el.dataset.q, i = q ? daten[q][+el.dataset.i] : null;
  const anfrage = q === "ideen" ? Object.assign({}, daten.anfrage || w, { wann: w.wann }) : Object.assign({}, i && i.anfrage || w, { wann: w.wann });
  if (a === "auf") { offen[el.dataset.k] = !offen[el.dataset.k]; zeichnen(); return; }
  if (a === "senden") {
    const h = hass(); if (!h) return;
    try { await h.callService("script", "ausflug_senden", { text: planText(i, anfrage), an: "alle" }); meldung("Plan per Telegram an alle geschickt"); }
    catch (e) { meldung("Hat nicht geklappt: " + (e.message || e)); }
    return;
  }
  if (a === "kalender") {
    const h = hass(); if (!h) return;
    const erst = (i.ablauf || [])[0], letzt = (i.ablauf || []).slice(-1)[0];
    const zeit = s => /^\d{1,2}:\d{2}$/.test((s && s.zeit) || "") ? s.zeit.padStart(5, "0") : "";
    const daten2 = { summary: `Ausflug: ${i.name}`, description: planText(i, anfrage) };
    if (zeit(erst) && zeit(letzt) && zeit(letzt) > zeit(erst)) { daten2.start_date_time = `${w.wann} ${zeit(erst)}:00`; daten2.end_date_time = `${w.wann} ${zeit(letzt)}:00`; }
    else { daten2.start_date = w.wann; const e = new Date(w.wann); e.setDate(e.getDate() + 1); daten2.end_date = iso(e); }
    try { await h.callService("calendar", "create_event", daten2, { entity_id: "calendar.geburtstage" }); meldung(`Im Kalender eingetragen (${w.wann.split("-").reverse().join(".")})`); }
    catch (e) { meldung("Kalender: " + (e.message || e)); }
    return;
  }
  if (a === "merken") { daten.gemerkt.push(Object.assign({}, i, { anfrage })); speichern(); meldung("Gemerkt"); return; }
  if (a === "erlebt") { daten.erlebt.push(Object.assign({}, i, { anfrage, datum: iso(new Date()) })); if (q === "gemerkt") daten.gemerkt.splice(+el.dataset.i, 1); speichern(); zeichnen(); meldung("Schön! Steht jetzt unter „Erlebt“"); return; }
  if (a === "weg") { daten[q].splice(+el.dataset.i, 1); speichern(); zeichnen(); return; }
}
function leseWunsch() { if ($("wunsch")) w.wunsch = $("wunsch").value; }

function design() { const h = hass(); document.documentElement.classList.toggle("dunkel", !!(h && h.themes && h.themes.darkMode)); }
let versuche = 0;
async function anfang() {
  if (!hass()) { if (++versuche === 15) $("inhalt").innerHTML = `<div class="leerbild">Die Seite funktioniert nur im Dashboard (Reiter „Ausflug“).</div>`; setTimeout(anfang, 400); return; }
  design(); setInterval(design, 30000);
  await laden(); if (daten.ideen.length && daten.stand && daten.stand.slice(0, 10) === iso(new Date())) reiter = "ideen";
  zeichnen(); beobachten();
}
anfang();
</script>
</body>
</html>
