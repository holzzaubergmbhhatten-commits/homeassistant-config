<!doctype html>
<html lang="de">

<title>Klima &amp; Energie</title>
<!--
  Energie & Heizung (Reiter "Energie & Heizung" im Flur-Dashboard) – aufgebaut wie das Energiecockpit der ViCare-App:
  Energiefluss jetzt (PV, Speicher, Netz, Haus), darunter Tag / Woche / Monat / Jahr mit Blättern, Wärmepumpe und alle Werte.
  Die Werte kommen aus der Viessmann-Integration (ViCare). Die Entitäten werden über ihre Viessmann-Kennung gesucht,
  feste Entitäts-IDs gibt es hier nicht. Verlauf aus der Langzeit-Statistik von Home Assistant (bleibt für immer).
-->
<style>
  :root { --bg: #F2F2F7; --karte: #fff; --text: #1C1C1E; --grau: #8E8E93; --linie: rgba(0,0,0,.08);
    --gruen: #34C759; --rot: #FF3B30; --orange: #FF9500; --blau: #536b45;
    --pv: #F5B400; --akku: #34C759; --netz: #8E8E93; --einsp: #FF9500; --haus: #536b45; --wp: #AF52DE; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", system-ui, sans-serif; }
  body { overflow: auto; touch-action: manipulation; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  .ic { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; flex: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
  .kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .kopf h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; flex: 1; }
  .reiter, .zeitraum { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--bg); border-radius: 12px; padding: 3px; gap: 2px; }
  .reiter button, .zeitraum button { padding: 7px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--grau); }
  .reiter button.an, .zeitraum button.an { background: var(--fuellung-an, #fff); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .karte { background: var(--karte); border-radius: 18px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
  .karte h2 { margin: 0 0 8px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .klein { font-size: 13px; color: var(--grau); line-height: 1.4; }
  .zwei { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
  @media (max-width: 820px) { .zwei { grid-template-columns: 1fr; } }
  /* Energiefluss */
  .fluss #fluss > svg { width: 100%; height: auto; display: block; }
  .fluss .knoten circle { fill: var(--karte); stroke-width: 3; }
  .fluss text { font-family: inherit; fill: var(--text); text-anchor: middle; }
  .fluss .wert { font-size: 15px; font-weight: 700; }
  .fluss .name { font-size: 11px; fill: var(--grau); }
  .fluss .bahn { fill: none; stroke: var(--linie); stroke-width: 4; stroke-linecap: round; }
  .fluss .strom { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 10; animation: fliessen 0.9s linear infinite; }
  @keyframes fliessen { to { stroke-dashoffset: -12; } }
  /* Kacheln */
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .kachel { background: var(--bg); border-radius: 14px; padding: 9px 12px; }
  .kachel b { display: block; font-size: 21px; letter-spacing: -0.2px; }
  .kachel span { font-size: 12.5px; color: var(--grau); }
  .kachel .balken { height: 6px; border-radius: 3px; background: var(--linie); margin-top: 6px; overflow: hidden; }
  .kachel .balken i { display: block; height: 100%; background: var(--gruen); }
  /* Zeitraum */
  .navi { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .navi .titel { flex: 1; text-align: center; font-weight: 700; font-size: 16px; min-width: 150px; }
  .pfeil { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
  .pfeil:disabled { opacity: .3; }
  .pfeil .ic { width: 24px; height: 24px; }
  .heute { padding: 7px 12px; border-radius: 10px; background: var(--bg); font-size: 13px; font-weight: 600; }
  .diagramm svg { width: 100%; height: auto; display: block; overflow: visible; }
  .diagramm text { font-family: inherit; font-size: 11px; fill: var(--grau); }
  .legende { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--grau); margin-top: 6px; }
  .legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .auswahl { min-height: 20px; font-size: 13.5px; margin-top: 6px; }
  .hinweis { background: #FFF4E5; color: #8A5300; border-radius: 12px; padding: 9px 12px; font-size: 13.5px; margin: 8px 0; line-height: 1.4; }
  .dunkel .hinweis { background: rgba(255,159,10,.16); color: #FFD08A; }
  table.werte { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.werte td { padding: 6px 2px; border-bottom: 1px solid var(--linie); }
  table.werte.raum td { text-align: left; font-weight: 400; } table.werte.raum td:nth-child(2), table.werte.raum td:nth-child(3) { text-align: right; font-weight: 600; }
  table.werte td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
  .lueften { border-radius: 12px; padding: 9px 12px; font-size: 13.5px; line-height: 1.45; margin-bottom: 8px; background: var(--bg); }
  .lueften.gut { background: rgba(52,199,89,.14); }
  .leer { text-align: center; padding: 30px 10px; color: var(--grau); }
</style>

<body>
<main id="inhalt"><div class="leer">Lade Werte …</div></main>
<script>
const SEITEN_VERSION = 1;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const ICON = {
  pv: "M3.33 16H11V13H4L3.33 16M13 16H20.67L20 13H13V16M21.11 18H13V22H22L21.11 18M2 22H11V18H2.89L2 22M11 8H13V11H11V8M15.76 7.21L17.18 5.79L19.3 7.91L17.89 9.33L15.76 7.21M4.71 7.91L6.83 5.79L8.24 7.21L6.12 9.33L4.71 7.91M3 2H6V4H3V2M18 2H21V4H18V2M12 7C14.76 7 17 4.76 17 2H7C7 4.76 9.24 7 12 7Z",
  akku: "M16 20H8V6H16M16.67 4H15V2H9V4H7.33C6.6 4 6 4.6 6 5.33V20.67C6 21.4 6.6 22 7.33 22H16.67C17.410 22 18 21.41 18 20.67V5.33C18 4.6 17.4 4 16.67 4M15 16H9V19H15V16M15 7H9V10H15V7M15 11.5H9V14.5H15V11.5Z",
  netz: "M8.28,5.45L6.5,4.55L7.76,2H16.23L17.5,4.55L15.72,5.44L15,4H9L8.28,5.45M18.62,8H14.09L13.3,5H10.7L9.91,8H5.38L4.1,10.55L5.89,11.44L6.62,10H17.38L18.1,11.45L19.89,10.56L18.62,8M17.77,22H15.7L15.46,21.1L12,15.9L8.53,21.1L8.3,22H6.23L9.12,11H11.19L10.83,12.350L12,14.1L13.16,12.35L12.81,11H14.88L17.77,22M11.4,15L10.5,13.65L9.32,18.13L11.4,15M14.68,18.12L13.5,13.64L12.6,15L14.68,18.12Z",
  haus: "M12 3L2 12H5V20H19V12H22L12 3M11.5 18V14H9L12.5 7V11H15L11.5 18Z",
  wp: "M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M12.75 7.08C13.57 7.2 14.32 7.5 14.95 8L12.75 10.19V7.08M11.25 7.08V10.19L9.05 8C9.68 7.5 10.43 7.2 11.25 7.08M8 9.05L10.19 11.25H7.08C7.2 10.43 7.5 9.68 8 9.05M7.08 12.75H10.19L8 14.95C7.5 14.32 7.2 13.57 7.08 12.75M11.25 16.92C10.43 16.8 9.680 16.5 9.05 16L11.25 13.81V16.92M12 13C11.45 13 11 12.55 11 12S11.45 11 12 11 13 11.45 13 12 12.55 13 12 13M12.75 16.92V13.81L14.95 16C14.32 16.5 13.57 16.8 12.75 16.92M16 14.95L13.81 12.75H16.92C16.8 13.57 16.5 14.32 16 14.95M13.81 11.25L16 9.05C16.5 9.69 16.8 10.44 16.92 11.25H13.81Z",
  links: "M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z",
  rechts: "M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z",
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;

// Viessmann-Kennungen (Schlüssel der ViCare-Sensoren); mehrere Schreibweisen, weil Home Assistant beide benutzt
const K = {
  pvLeistung: ["photovoltaic_power_production_current"],
  pvTag: ["photovoltaic_energy_production_today"], pvWoche: ["photovoltaic_energy_production_this_week"],
  pvMonat: ["photovoltaic_energy_production_this_month"], pvJahr: ["photovoltaic_energy_production_this_year"],
  pvGesamt: ["photovoltaic_energy_production_total"],
  akkuStand: ["ess_state_of_charge"], akkuLeistung: ["ess_power_current"], akkuZustand: ["ess_state"],
  laden: ["ess_charge_total"], entladen: ["ess_discharge_total"],
  entladenTag: ["ess_discharge_today"], entladenWoche: ["ess_discharge_this_week"],
  entladenMonat: ["ess_discharge_this_month"], entladenJahr: ["ess_discharge_this_year"],
  netz: ["pcc_transfer_power_exchange"], bezug: ["pcc_energy_consumption"], einsp: ["pcc_energy_feed_in"],
  wpTag: ["power_consumption_today", "power consumption today"], wpWoche: ["power_consumption_this_week", "power consumption this week"],
  wpMonat: ["power_consumption_this_month", "power consumption this month"], wpJahr: ["power_consumption_this_year", "power consumption this year"],
  heizenTag: ["energy_summary_consumption_heating_currentday"], heizenMonat: ["energy_summary_consumption_heating_currentmonth"],
  heizenJahr: ["energy_summary_consumption_heating_currentyear"], heizen7: ["energy_summary_consumption_heating_lastsevendays"],
  wwTag: ["energy_dhw_summary_consumption_heating_currentday"], wwMonat: ["energy_dhw_summary_consumption_heating_currentmonth"],
  wwJahr: ["energy_dhw_summary_consumption_heating_currentyear"], ww7: ["energy_summary_dhw_consumption_heating_lastsevendays"],
  aussen: ["outside_temperature"], vorlauf: ["supply_temperature"], ruecklauf: ["return_temperature"],
  warmwasser: ["dhw_storage_temperature", "dhw_storage_top_temperature", "hotwater_out_temperature"],
  puffer: ["buffer_main_temperature", "buffer_top_temperature"],
  modulation: ["compressor_modulation"], starts: ["compressor_starts"], stunden: ["compressor_hours"],
  jaz: ["spf_total"], jazHeizen: ["spf_heating"], jazWw: ["spf_dhw"], cop: ["cop_total"], druck: ["supply_pressure"],
};
// Wasser: Conel CLEAR PRO über die Integration „SYR Connect“ (Kennungen = Gerätebefehle)
const KW = { gesamt: ["getvol", "getcof"], durchfluss: ["getflo", "getavo"], druck: ["getprs", "getbar"], temperatur: ["getcel"],
  alarm: ["getala"], warnung: ["getwrn"], ventil: ["getvlv", "getab"], profil: ["getprf"], batterie: ["getbap", "getbat"],
  zuletzt: ["getltv"], verbindung: ["dst"] };
const EW = {};           // Wasser: Schlüssel → entity_id
const E = {};            // Schlüssel → entity_id
let REG = [], REG_W = [], GERAETE = {}, NETZ_VZ = 1, AKKU_VZ = 1, ERSTER = null, ERSTER_W = null;
let reiter = "raeume", art = "tag", ref = new Date(), STAT = null, AUSWAHL = null;

const svgBreite = () => (window.innerWidth < 600 ? 380 : 640);   // schmal: weniger Breite = größere Schrift im Diagramm
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
const st = id => { const h = hass(); return id && h && h.states[id]; };
function zahl(id) { const s = st(id); if (!s) return null; const v = parseFloat(s.state); return isFinite(v) ? v : null; }
function kw(id) {        // Leistung in kW
  const v = zahl(id); if (v == null) return null;
  const u = (st(id).attributes.unit_of_measurement || "").toLowerCase();
  return u === "w" ? v / 1000 : u === "mw" ? v * 1000 : v;
}
function kwh(id) {       // Energie in kWh
  const v = zahl(id); if (v == null) return null;
  const u = (st(id).attributes.unit_of_measurement || "").toLowerCase();
  return u === "wh" ? v / 1000 : u === "mwh" ? v * 1000 : v;
}
const fmt = (v, st = 1) => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: st, maximumFractionDigits: st });
const kwT = v => v == null ? "–" : Math.abs(v) < 1 ? fmt(v * 1000, 0) + " W" : fmt(v, 2) + " kW";
const kwhT = v => v == null ? "–" : fmt(v, v >= 100 ? 0 : 1) + " kWh";
const gradT = id => { const v = zahl(id); return v == null ? "–" : fmt(v, 1) + " °C"; };

async function finden() {
  const h = hass();
  const alle = await h.callWS({ type: "config/entity_registry/list" });
  REG = alle.filter(e => e.platform === "vicare" && !e.disabled_by);
  REG_W = alle.filter(e => e.platform === "syr_connect" && !e.disabled_by);
  for (const [k, namen] of Object.entries(KW)) {
    // Schlüssel heißen bei SYR „getVOL“ (unique_id …_getVOL, entity_id …_getvol) – Groß/klein egal
    // bei mehreren Treffern (alter Eintrag „nicht verfügbar“ + neuer) den mit echtem Wert nehmen
    const passt = (e, n) => (e.translation_key || "").toLowerCase() === n
      || new RegExp("[-_.]" + n + "$", "i").test(e.unique_id || "") || new RegExp("_" + n + "(_\\d+)?$", "i").test(e.entity_id || "");
    const da = e => { const x = st(e.entity_id); return x && !["unavailable", "unknown"].includes(x.state); };
    const t = namen.map(n => REG_W.filter(e => passt(e, n)).sort((x, y) => da(y) - da(x))[0]).find(Boolean);
    if (t) EW[k] = t.entity_id;
  }
  try { (await h.callWS({ type: "config/device_registry/list" })).forEach(d => { GERAETE[d.id] = d.name_by_user || d.name; }); } catch (e) { /* egal */ }
  for (const [k, namen] of Object.entries(K)) {
    for (const n of namen) {
      const t = REG.find(e => e.translation_key === n.replace(/ /g, "_") || (e.unique_id || "").endsWith("-" + n)
        || new RegExp("-" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "-\\d+$").test(e.unique_id || ""));
      if (t) { E[k] = t.entity_id; break; }
    }
  }
  // Warmwasser: es gibt mehrere Speicherfühler (oben/unten) – den wärmsten nehmen, so zeigt es auch die ViCare-App
  const ww = REG.filter(e => /dhw_storage|hotwater_out|dhw.*temperature/.test((e.translation_key || "") + " " + (e.unique_id || ""))
    && !/target|soll|hysteresis|min|max/i.test((e.translation_key || "") + (e.unique_id || "")) && zahl(e.entity_id) != null);
  if (ww.length) E.warmwasser = ww.sort((x, y) => zahl(y.entity_id) - zahl(x.entity_id))[0].entity_id;
}

// Vorzeichen von Netz und Speicher aus den Zählern der letzten zwei Tage ableiten (Viessmann sagt es nicht dazu)
async function vorzeichen() {
  const ids = [E.netz, E.bezug, E.einsp, E.akkuLeistung, E.laden, E.entladen].filter(Boolean);
  if (!ids.length) return;
  const r = await stats(new Date(Date.now() - 48 * 3600e3), new Date(), "hour", ids, ["mean", "change"]);
  const paar = (leistung, plus, minus) => {
    const a = r[leistung] || [], p = idx(r[plus]), m = idx(r[minus]); let s = 0;
    a.forEach(x => { const d = ((p[x.start] || {}).change || 0) - ((m[x.start] || {}).change || 0); s += (x.mean || 0) * d; });
    return s < 0 ? -1 : 1;
  };
  if (E.netz) NETZ_VZ = paar(E.netz, E.bezug, E.einsp);
  if (E.akkuLeistung) AKKU_VZ = paar(E.akkuLeistung, E.laden, E.entladen);
}
const zeit = s => typeof s === "number" ? s : Date.parse(s);
const idx = liste => { const o = {}; (liste || []).forEach(x => { o[x.start] = x; }); return o; };
async function stats(von, bis, periode, ids, typen) {
  return hass().callWS({ type: "recorder/statistics_during_period", start_time: von.toISOString(), end_time: bis.toISOString(),
    statistic_ids: ids, period: periode, types: typen, units: { energy: "kWh", power: "W", temperature: "°C", volume: "L" } });
}

/* ---------- Zeitraum ---------- */
const MONATE = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONATE_LANG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const TAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
function bereich() {
  const r = new Date(ref); r.setHours(0, 0, 0, 0);
  if (art === "tag") { const b = new Date(r); b.setDate(b.getDate() + 1); return { von: r, bis: b, periode: "hour", n: 24, feiner: "5minute" }; }
  if (art === "woche") { const v = new Date(r); v.setDate(v.getDate() - (v.getDay() + 6) % 7); const b = new Date(v); b.setDate(b.getDate() + 7);
    return { von: v, bis: b, periode: "day", n: 7, feiner: "hour" }; }
  if (art === "monat") { const v = new Date(r.getFullYear(), r.getMonth(), 1), b = new Date(r.getFullYear(), r.getMonth() + 1, 1);
    return { von: v, bis: b, periode: "day", n: Math.round((b - v) / 864e5), feiner: "hour" }; }
  const v = new Date(r.getFullYear(), 0, 1), b = new Date(r.getFullYear() + 1, 0, 1);
  return { von: v, bis: b, periode: "month", n: 12, feiner: "day" };
}
function fach(b, t) {    // Stelle im Diagramm für einen Zeitstempel
  const d = new Date(t);
  if (art === "tag") return d.getHours();
  if (art === "jahr") return d.getMonth();
  const tag = new Date(d); tag.setHours(0, 0, 0, 0);
  return Math.round((tag - b.von) / 864e5);
}
function fachName(b, i, lang) {
  if (art === "tag") return lang ? `${i}–${i + 1} Uhr` : String(i);
  if (art === "jahr") return lang ? MONATE_LANG[i] : MONATE[i];
  const d = new Date(b.von); d.setDate(d.getDate() + i);
  if (art === "woche") return lang ? `${TAGE[i]}, ${d.toLocaleDateString("de-DE")}` : TAGE[i];
  return lang ? d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" }) : String(i + 1);
}
function titel(b) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  if (art === "tag") { const g = new Date(heute); g.setDate(g.getDate() - 1);
    return +b.von === +heute ? "Heute" : +b.von === +g ? "Gestern" : b.von.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
  if (art === "woche") { const e = new Date(b.bis); e.setDate(e.getDate() - 1);
    const kw = (() => { const d = new Date(b.von); d.setDate(d.getDate() + 3); const j = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - j) / 864e5 - 3 + (j.getDay() + 6) % 7) / 7); })();
    return `KW ${kw} · ${b.von.toLocaleDateString("de-DE", { day: "numeric", month: "numeric" })} – ${e.toLocaleDateString("de-DE")}`; }
  if (art === "monat") return `${MONATE_LANG[b.von.getMonth()]} ${b.von.getFullYear()}`;
  return String(b.von.getFullYear());
}
const istJetzt = b => Date.now() >= b.von && Date.now() < b.bis;
function blaettern(r) {
  const d = new Date(ref);
  if (art === "tag") d.setDate(d.getDate() + r);
  else if (art === "woche") d.setDate(d.getDate() + 7 * r);
  else if (art === "monat") { d.setDate(1); d.setMonth(d.getMonth() + r); }
  else d.setFullYear(d.getFullYear() + r);
  if (d > new Date()) return;
  ref = d; AUSWAHL = null; ladeStat();
}

async function ladeStat() {
  const b = bereich(), h = hass(); if (!h) return;
  const ids = ["pvGesamt", "bezug", "einsp", "laden", "entladen", "wpTag"].map(k => E[k]).filter(Boolean);
  const temp = ["aussen", "vorlauf", "ruecklauf", "warmwasser"].map(k => E[k]).filter(Boolean)
    .concat(raeume().flatMap(x => [x.t, x.h]).filter(Boolean));
  if (!E.pvGesamt && E.pvTag) ids.push(E.pvTag);
  if (EW.gesamt) ids.push(EW.gesamt);
  const schluessel = `${art}|${+b.von}`;
  STAT = { schluessel, b, laedt: true }; zeichnen();
  try {
    const [r, t] = await Promise.all([ids.length ? stats(b.von, b.bis, b.periode, ids, ["change"]) : {},
      temp.length ? stats(b.von, b.bis, b.feiner, temp, ["mean"]) : {}]);
    if (STAT.schluessel !== schluessel) return;
    const reihe = (id, ab) => { const a = new Array(b.n).fill(null);

function fluss() {

  const netz = netzRoh == null ? 0 : netzRoh * NETZ_VZ;      // + Bezug, − Einspeisung

  const linie = (a, b, wert, farbe, rueck) => {
    const [x1, y1] = P[a], [x2, y2] = P[b], d = `M${x1},${y1} Q${210},${150} ${x2},${y2}`, dr = `M${x2},${y2} Q${210},${150} ${x1},${y1}`;
    return `<path class="bahn" d="${d}"/>` + (Math.abs(wert) > 0.02 ? `<path class="strom" stroke="${farbe}" d="${(wert > 0) !== !!rueck ? d : dr}"/>` : "");

function balken(werte, farben, hoehe = 190) {

  const b = STAT.b, n = b.n, W = svgBreite(), L = 34, R = 6, T = 20, U = 22, breit = (W - L - R) / n;

  const stufe = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find(x => max / x <= 4) || 1000, oben = Math.max(stufe, Math.ceil(max / stufe) * stufe);
  const y = v => T + (hoehe - T - U) * (1 - v / oben);

function rueckblick(nurWp) {

  });
  const liste = Object.values(reihen).sort((x, y) => R_NAMEN.findIndex(([re]) => re.test(x.f)) - R_NAMEN.findIndex(([re]) => re.test(y.f)));

  if (!liste.length) return `<div class="karte"><h2>Rückblick von Viessmann</h2><div class="klein">${RUECK.ok === false ? esc(RUECK.fehler) :
    "Noch nichts abgeholt. Das passiert jede Nacht von selbst."}</div><div style="margin-top:8px">${knopf}</div></div>`;
  const jetzt = new Date(), monate = [];
  for (let i = 12; i >= 0; i--) { const d = new Date(jetzt.getFullYear(), jetzt.getMonth() - i, 1); monate.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`); }
  const W = svgBreite(), H = 190, L = 34, R = 6, T = 20, U = 22, breit = (W - L - R) / monate.length;
  let max = 0; liste.forEach(x => monate.forEach(m => { max = Math.max(max, (x.a.monat || {})[m] || 0); }));
  const stufe = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000].find(v => max / v <= 4) || 5000, oben = Math.max(stufe, Math.ceil(max / stufe) * stufe);
  const y = v => T + (H - T - U) * (1 - v / oben), sb = Math.min(12, (breit - 4) / liste.length);
  let svg = "";
  for (let v = 0; v <= oben + 1e-9; v += stufe) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linie)"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`;
  monate.forEach((m, i) => {
    const x0 = L + i * breit + (breit - sb * liste.length) / 2;
    liste.forEach((x, j) => { const v = (x.a.monat || {})[m]; if (v == null) return;
      svg += `<rect x="${x0 + j * sb + 0.5}" y="${y(v)}" width="${sb - 1}" height="${Math.max(0.5, y(0) - y(v))}" fill="${x.farbe}" rx="1.5"/>`; });
    svg += `<text x="${L + i * breit + breit / 2}" y="${H - 6}" text-anchor="middle">${MONATE[+m.slice(5) - 1]}</text>`;
  });
  const jahre = [...new Set(liste.flatMap(x => Object.keys(x.a.jahr || {})))].sort().reverse().slice(0, 3);
  const tabelle = `<table class="werte" style="margin-top:10px"><tr><td></td>${jahre.map(j => `<td>${j}</td>`).join("")}</tr>${liste.map(x =>
    `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${x.farbe};margin-right:6px"></i>${esc(x.n)}</td>${
      jahre.map(j => `<td>${(x.a.jahr || {})[j] == null ? "–" : fmt(x.a.jahr[j], 0) + " " + esc(x.a.einheit || "")}</td>`).join("")}</tr>`).join("")}</table>`;
  // Jahresarbeitszahl je Monat, wenn Viessmann Strom und Wärme liefert
  const strom = reihen["Wärmepumpe Strom gesamt"], waerme = reihen["Wärme erzeugt gesamt"];
  let jaz = "";

    const z = monate.filter(m => (strom.a.monat || {})[m] > 0 && (waerme.a.monat || {})[m] != null).slice(-6)
      .map(m => `${MONATE[+m.slice(5) - 1]} ${fmt(waerme.a.monat[m] / strom.a.monat[m], 1)}`);
    if (z.length) jaz = `<div class="klein" style="margin-top:6px">Arbeitszahl je Monat (Wärme ÷ Strom): ${z.join(" · ")}</div>`;
  }
  return `<div class="karte"><h2>Rückblick von Viessmann · letzte 13 Monate</h2>
    <div class="diagramm"><svg viewBox="0 0 ${W} ${H}">${svg}<text x="2" y="10">${esc(liste[0].a.einheit || "kWh")}</text></svg></div>
    <div class="legende">${liste.map(x => `<span><i style="background:${x.farbe}"></i>${esc(x.n)}</span>`).join("")}</div>
    ${tabelle}${jaz}
    <div class="klein" style="margin-top:8px">Diese Werte speichert Viessmann selbst, auch aus der Zeit vor Home Assistant. Für PV, Speicher und Netz gibt Viessmann leider keine alten Monate heraus.
      ${(RUECK.geraete || []).length ? "Geräte: " + esc(RUECK.geraete.join(", ")) + ". " : ""}Abgeholt ${RUECK.stand ? esc(new Date(RUECK.stand).toLocaleString("de-DE", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" })) : "–"}, danach jede Nacht.</div>
    <div style="margin-top:8px">${knopf}</div></div>`;
}

/* ---------- Export aus dem Viessmann-Energieportal (gridX, CSV) einlesen ---------- */
let HIST = null, IMPORT_TEXT = "";
const pad2 = n => String(n).padStart(2, "0");
const tagKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function histFuellen(st) {      // dort, wo Home Assistant noch nichts hat, die Werte aus dem Portal einsetzen
  if (!HIST || !st || !st.pv) return;
  const quelle = art === "jahr" ? HIST.monat : (art === "woche" || art === "monat") ? HIST.tag : null;
  st.importiert = false;
  if (!quelle) return;
  for (let i = 0; i < st.b.n; i++) {
    let k, beginn;
    if (art === "jahr") { k = `${st.b.von.getFullYear()}-${pad2(i + 1)}`; beginn = new Date(st.b.von.getFullYear(), i, 1); }
    else { beginn = new Date(st.b.von); beginn.setDate(beginn.getDate() + i); k = tagKey(beginn); }
    const h = quelle[k]; if (!h) continue;
    // Home Assistant hat den Zeitraum ganz aufgezeichnet → dessen Werte behalten; hat es erst mittendrin angefangen → Portal
    const haVoll = ERSTER && ERSTER <= beginn;
    if (haVoll && ["pv", "bezug", "einsp"].some(f => (st[f][i] || 0) > 0.05)) continue;
    ["pv", "bezug", "einsp", "laden", "entladen", "wp"].forEach(f => { if (h[f] != null) st[f][i] = h[f]; });
    st.importiert = true;
  }
}
function csvZeilen(text) {
  return text.split(/\r?\n/).filter(z => z.trim()).map(z => {
    const teile = []; let feld = "", inQ = false;
    for (const c of z) { if (c === '"') inQ = !inQ; else if (c === "," && !inQ) { teile.push(feld); feld = ""; } else feld += c; }
    teile.push(feld); return teile.map(x => x.trim());
  });
}
function csvLesen(text) {
  const anfang = text.search(/measuredAt|^\s*(zeit|datum|date)\b/im);   // z. B. „blob:https://…“ davor beim Kopieren
  if (anfang > 0) text = text.slice(anfang);
  // eingefügter Text kann in einer Zeile ankommen: vor jedem Zeitstempel umbrechen
  text = text.replace(/\s+(?=\d{4}-\d{2}-\d{2}T)/g, "\n");
  const z = csvZeilen(text); if (z.length < 2) throw new Error("Datei ist leer");
  const kopf = z[0].map(x => x.toLowerCase());
  const spalte = re => kopf.findIndex(k => re.test(k));
  const sp = { pv: spalte(/^pv/), bezug: spalte(/netzbezug|bezug/), einsp: spalte(/einspeis/), laden: spalte(/batterieladung|ladung/),
    entladen: spalte(/entladung/), wp: spalte(/w(ä|ae)rmepumpe/), haus: spalte(/haushalt/) };
  const zeitSp = spalte(/measured|zeit|date|datum/);
  if (zeitSp < 0 || sp.pv < 0) throw new Error("Das sieht nicht wie ein Export aus dem Energieportal aus (Spalten PV, Netzbezug … fehlen).");
  const faktor = i => /\(kwh\)/.test(kopf[i]) ? 1 : /\(mwh\)/.test(kopf[i]) ? 1000 : 0.001;   // Wh → kWh
  const zeilen = z.slice(1).map(r => ({ t: new Date(r[zeitSp]), r })).filter(x => !isNaN(x.t)).sort((a, b) => a.t - b.t);
  const schritt = zeilen.length > 1 ? (zeilen[1].t - zeilen[0].t) / 3600e3 : 24;
  const art = schritt >= 24 * 27 ? "monat" : "tag";
  const erg = { monat: {}, tag: {} };
  zeilen.forEach(({ t, r }) => {
    const k = art === "monat" ? `${t.getFullYear()}-${pad2(t.getMonth() + 1)}` : tagKey(t);   // Zeitpunkt = Beginn des Zeitraums
    const ziel = erg[art][k] = erg[art][k] || {};
    let leer = true;
    Object.entries(sp).forEach(([f, i]) => { if (i < 0) return; const roh = String(r[i] || ""), v = parseFloat(roh.includes(",") ? roh.replace(/\./g, "").replace(",", ".") : roh);
      if (isFinite(v)) { ziel[f] = (ziel[f] || 0) + v * faktor(i); leer = false; } });
    if (leer) delete erg[art][k];
  });
  if (art === "tag") Object.entries(erg.tag).forEach(([k, w]) => {     // Tageswerte auch zu Monaten zusammenzählen
    const m = k.slice(0, 7), z = erg.monat[m] = erg.monat[m] || {};
    Object.entries(w).forEach(([f, v]) => { z[f] = (z[f] || 0) + v; });
  });

}
async function importDatei(datei) { return importText(await datei.text()); }
async function importText(inhalt) {

    if (!anzahl) throw new Error("Keine Werte in der Datei gefunden.");
    const r = await hass().callWS({ type: "call_service", domain: "script", service: "energie_verlauf",
      service_data: { aktion: "import", daten: JSON.stringify(erg) }, return_response: true });

    if (!res.ok) throw new Error(res.fehler || "Speichern hat nicht geklappt");
    IMPORT_TEXT = `Eingelesen: ${anzahl} ${a === "monat" ? "Monate" : "Tage"}. Zum Ansehen oben „Monat“ oder „Jahr“ wählen und zurückblättern.`;
    RUECK_LAEDT = false; await ladeRueck(false);

      ${kachel(kwhT(kwh(E.heizen7)), "Heizen letzte 7 Tage")}${kachel(kwhT(kwh(E.ww7)), "Warmwasser letzte 7 Tage")}
    </div><div class="klein" style="margin-top:6px">JAZ = Jahresarbeitszahl: aus 1 kWh Strom werden so viele kWh Wärme. Über 3,5 ist gut, über 4 sehr gut.</div></div>
    <div class="karte">${navi()}${unten}</div>${rueckblick(true)}`;
}
function wasser() {
  if (!Object.keys(EW).length) return REG_W.length
    ? `<div class="karte"><h2>Wasser (Conel)</h2><table class="werte">${REG_W.filter(e => st(e.entity_id)).map(e =>
        `<tr><td>${esc(st(e.entity_id).attributes.friendly_name || e.entity_id)}</td><td>${esc(st_text(e.entity_id))}</td></tr>`).join("")}</table></div>`
    : `<div class="karte leer">Kein Wasserzähler gefunden. Ist „SYR Connect“ (Conel) eingerichtet?</div>`;
  const z = (k, n) => EW[k] ? kachel(esc(st_text(EW[k])), n) : "";
  let unten = `<div class="leer">Lade Verlauf …</div>`;
  if (STAT && STAT.fehler) unten = `<div class="hinweis">Verlauf nicht lesbar: ${esc(STAT.fehler)}</div>`;
  else if (STAT && STAT.wasser) {
    const summe = STAT.wasser.reduce((x, y) => x + (y || 0), 0), f = STAT.wasser.map(v => [[[(v || 0), "#5AC8FA"]]]);
    const leer = !STAT.wasser.some(v => v != null);
    unten = `<div class="kacheln">${kachel(fmt(summe, 0) + " Liter", "Verbrauch im Zeitraum")}${summe >= 1000 ? kachel(fmt(summe / 1000, 2) + " m³", "in Kubikmeter") : ""}</div>
      <div class="diagramm" style="margin-top:12px">${balken(f, null, 170).replace("kWh</text>", "Liter</text>")}</div>
      <div class="auswahl">${AUSWAHL != null ? `<b>${esc(fachName(STAT.b, AUSWAHL, true))}:</b> ${fmt(STAT.wasser[AUSWAHL] || 0, 0)} Liter` : "Auf eine Säule tippen für die genauen Werte."}</div>
      ${leer ? `<div class="hinweis">Für diesen Zeitraum ist noch nichts aufgezeichnet. Der Wasserzähler läuft in Home Assistant erst seit der Einrichtung.</div>` : ""}`;
  }
  return `<div class="karte"><h2>Wasser jetzt (Conel)</h2><div class="kacheln">
      ${z("durchfluss", "Durchfluss")}${z("druck", "Wasserdruck")}${z("temperatur", "Wassertemperatur")}${z("zuletzt", "Letzte Zapfung")}
      ${z("gesamt", "Zählerstand")}${z("alarm", "Alarm")}${z("warnung", "Warnung")}${z("ventil", "Ventil")}${z("profil", "Profil")}${z("batterie", "Batterie")}
    </div></div>
    <div class="karte">${navi()}${unten}</div>`;
}
function st_text(id) { const s = st(id); if (!s) return "–"; const h = hass();
  try { return h.formatEntityState ? h.formatEntityState(s) : s.state; } catch (e) { return s.state; } }

function alleWerte() {
  const gruppen = {};
  REG.forEach(e => { const s = st(e.entity_id); if (!s || ["unknown", "unavailable"].includes(s.state)) return;
    const g = GERAETE[e.device_id] || "Viessmann"; (gruppen[g] = gruppen[g] || []).push(e.entity_id); });
  const namen = Object.keys(gruppen).sort();
  if (!namen.length) return `<div class="karte leer">Noch keine Werte von Viessmann.</div>`;
  return namen.map(g => `<div class="karte"><h2>${ic(/wechsel|speicher|charge/i.test(g) ? "pv" : "wp")} ${esc(g)}</h2><table class="werte">${
    gruppen[g].map(id => [String(st(id).attributes.friendly_name || id).replace(g + " ", ""), id]).sort((a, b) => a[0].localeCompare(b[0], "de"))
      .map(([n, id]) => `<tr><td>${esc(n)}</td><td>${esc(st_text(id))}</td></tr>`).join("")}</table></div>`).join("");
}

function zeichnen() {
  const csvAlt = ($("csvtext") || {}).value;
  zeichnenInnen();
  if (csvAlt && $("csvtext")) $("csvtext").value = csvAlt;
}
function zeichnenInnen() {
  const inhalt = { raeume: raeumeSeite, uebersicht, waermepumpe, wasser, alle: alleWerte }[reiter]();
  $("inhalt").innerHTML = `<div class="kopf"><h1>Klima &amp; Energie</h1>
    <div class="reiter">${[["raeume", "Räume"], ["uebersicht", "Energie"], ["waermepumpe", "Wärmepumpe"], ["wasser", "Wasser"], ["alle", "Alle Werte"]].map(([k, n]) =>
      `<button data-reiter="${k}" class="${reiter === k ? "an" : ""}">${n}</button>`).join("")}</div></div>
    ${Object.keys(E).length || REG.length ? "" : `<div class="hinweis">Keine Viessmann-Werte gefunden. Ist die Viessmann-Integration eingerichtet?</div>`}
    ${inhalt}`;
}
function live() {     // nur die Live-Teile neu, damit Antippen und Blättern nicht flackern
  if (reiter === "uebersicht" && $("fluss")) { $("fluss").innerHTML = fluss(); }
  else if (reiter !== "uebersicht") zeichnen();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-reiter],[data-art],[data-blaettern],[data-heute],[data-fach],[data-rueck],[data-csvtext]"); if (!t) return;
  if (t.dataset.rueck) { ladeRueck(true); return; }
  if (t.dataset.csvtext) { const v = ($("csvtext") || {}).value || ""; if (v.trim()) importText(v); return; }
  if (t.dataset.reiter) { reiter = t.dataset.reiter; zeichnen(); }
  else if (t.dataset.art) { art = t.dataset.art; AUSWAHL = null; ladeStat(); }
  else if (t.dataset.blaettern) blaettern(+t.dataset.blaettern);
  else if (t.dataset.heute) { ref = new Date(); AUSWAHL = null; ladeStat(); }
  else if (t.dataset.fach) { AUSWAHL = AUSWAHL === +t.dataset.fach ? null : +t.dataset.fach; zeichnen(); }
});
let breiteAlt = svgBreite();
window.addEventListener("resize", () => { if (svgBreite() !== breiteAlt) { breiteAlt = svgBreite(); zeichnen(); } });
function design() { const h = hass(); document.documentElement.classList.toggle("dunkel", !!(h && h.themes && h.themes.darkMode)); }
let versuche = 0;
async function start() {
  if (!hass()) {
    if (++versuche === 15) $("inhalt").innerHTML = `<div class="hinweis">Die Seite ist da, findet aber Home Assistant nicht.
      Sie funktioniert nur im Dashboard (Reiter „Energie &amp; Heizung“).</div>`;
    setTimeout(start, 400); return;
  }
  design();
  try { await finden(); } catch (e) { $("inhalt").innerHTML = `<div class="hinweis">Viessmann-Werte nicht lesbar: ${esc(e.message || e)}</div>`; return; }
  zeichnen();
  ladeRueck(false);
  await Promise.all([vorzeichen().catch(() => {}), ersterTag(), ersterWasser()]);
  ladeStat();
  setInterval(() => { design(); live(); }, 5000);
  setInterval(() => { if (istJetzt(bereich())) ladeStat(); }, 5 * 60e3);
}
start();
</script>
</body>
</html>
