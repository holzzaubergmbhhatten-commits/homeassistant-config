  Energiefluss jetzt (PV, Speicher, Netz, Haus), darunter Tag / Woche / Monat / Jahr mit Blättern, Wärmepumpe und alle Werte.
  Die Werte kommen aus der Viessmann-Integration (ViCare). Die Entitäten werden über ihre Viessmann-Kennung gesucht,

<style>

  .karte h2 { margin: 0 0 8px; font-size: 17px; display: flex; align-items: center; gap: 8px; }

  @keyframes flackern { from { transform: scaleY(.86) scaleX(1.04); } to { transform: scaleY(1.1) scaleX(.95); } }
  .anlage .luefter { transform-origin: center; transform-box: fill-box; animation: drehen 1.2s linear infinite; }

  .gskala { height: 8px; border-radius: 4px; background: var(--linie); overflow: hidden; }
  .gskala i { display: block; height: 100%; background: var(--gruen); border-radius: 4px; transition: width 1s; }

  .g-eis { transform-origin: 43px 46px; transform-box: view-box; }
  .lauf .g-eis { animation: g-dreh 6s linear infinite; }
  .g-kalt { opacity: 0; } .lauf .g-kalt { animation: g-kalt 2.4s ease-in infinite; }
  .lauf .g-kalt.b { animation-delay: .8s; } .lauf .g-kalt.c { animation-delay: 1.6s; }
  .g-arm { transform-origin: 43px 50px; transform-box: view-box; } .lauf .g-arm { animation: g-dreh 1.2s linear infinite; }
  .g-tropfen { opacity: 0; } .lauf .g-tropfen { animation: g-tropfen 1s ease-in infinite; } .lauf .g-tropfen.b { animation-delay: .35s; } .lauf .g-tropfen.c { animation-delay: .7s; }
  .g-glut { fill: #c96f4a; opacity: .25; } .lauf .g-glut { animation: g-glut 1.6s ease-in-out infinite alternate; }
  .g-ring { opacity: .2; } .lauf .g-ring { animation: g-glut 1.4s ease-in-out infinite alternate; } .lauf .g-ring.b { animation-delay: .5s; } .lauf .g-ring.c { animation-delay: .9s; }
  .g-dampf { opacity: 0; stroke-dasharray: 60; } .lauf .g-dampf { animation: g-dampf 2.2s linear infinite; }
  @keyframes g-dampf { 0% { opacity: 0; stroke-dashoffset: 60; } 30% { opacity: .9; } 100% { opacity: 0; stroke-dashoffset: 0; } }
  .g-welle { opacity: 0; } .lauf .g-welle { animation: g-welle 2s ease-out infinite; } .lauf .g-welle.b { animation-delay: 1s; }
  @keyframes g-dreh { to { transform: rotate(360deg); } }
  @keyframes g-kalt { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(14px); } }
  @keyframes g-tropfen { 0% { opacity: 0; transform: translateY(-4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(12px); } }
  @keyframes g-glut { from { opacity: .35; } to { opacity: 1; } }
  @keyframes g-welle { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.4); } }
  .g-welle { transform-origin: 43px 43px; transform-box: view-box; }
  @media (prefers-reduced-motion: reduce) { .lauf * { animation: none !important; } }
</style>

<script>

  rechts: "M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z",
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;

// Viessmann-Kennungen (Schlüssel der ViCare-Sensoren); mehrere Schreibweisen, weil Home Assistant beide benutzt
const K = {
  pvLeistung: ["photovoltaic_power_production_current"],
  pvTag: ["photovoltaic_energy_production_today"], pvWoche: ["photovoltaic_energy_production_this_week"],
  pvMonat: ["photovoltaic_energy_production_this_month"], pvJahr: ["photovoltaic_energy_production_this_year"],
  pvGesamt: ["photovoltaic_energy_production_total"],
  akkuStand: ["ess_state_of_charge"], akkuLeistung: ["ess_power_current"], akkuZustand: ["ess_state"],
  laden: ["ess_charge_total"], entladen: ["ess_discharge_total"],
  entladenTag: ["ess_discharge_today"], entladenWoche: ["ess_discharge_this_week"],
  entladenMonat: ["ess_discharge_this_month"], entladenJahr: ["ess_discharge_this_year"],
  netz: ["pcc_transfer_power_exchange"], bezug: ["pcc_energy_consumption"], einsp: ["pcc_energy_feed_in"],
  wpTag: ["power_consumption_today", "power consumption today"], wpWoche: ["power_consumption_this_week", "power consumption this week"],
  wpMonat: ["power_consumption_this_month", "power consumption this month"], wpJahr: ["power_consumption_this_year", "power consumption this year"],
  heizenTag: ["energy_summary_consumption_heating_currentday"], heizenMonat: ["energy_summary_consumption_heating_currentmonth"],
  heizenJahr: ["energy_summary_consumption_heating_currentyear"], heizen7: ["energy_summary_consumption_heating_lastsevendays"],
  wwTag: ["energy_dhw_summary_consumption_heating_currentday"], wwMonat: ["energy_dhw_summary_consumption_heating_currentmonth"],
  wwJahr: ["energy_dhw_summary_consumption_heating_currentyear"], ww7: ["energy_summary_dhw_consumption_heating_lastsevendays"],
  aussen: ["outside_temperature"], vorlauf: ["supply_temperature"], ruecklauf: ["return_temperature"],
  warmwasser: ["dhw_storage_temperature", "dhw_storage_top_temperature", "hotwater_out_temperature"],
  puffer: ["buffer_main_temperature", "buffer_top_temperature"],
  modulation: ["compressor_modulation"], starts: ["compressor_starts"], stunden: ["compressor_hours"],
  jaz: ["spf_total"], jazHeizen: ["spf_heating"], jazWw: ["spf_dhw"], cop: ["cop_total"], druck: ["supply_pressure"],
};
// Wasser: Conel CLEAR PRO über die Integration „SYR Connect“ (Kennungen = Gerätebefehle)
const KW = { gesamt: ["getvol", "getcof"], durchfluss: ["getflo", "getavo"], druck: ["getprs", "getbar"], temperatur: ["getcel"],
  alarm: ["getala"], warnung: ["getwrn"], ventil: ["getvlv", "getab"], profil: ["getprf"], batterie: ["getbap", "getbat"],
  zuletzt: ["getltv"], verbindung: ["dst"] };
const EW = {};           // Wasser: Schlüssel → entity_id
const E = {};            // Schlüssel → entity_id
let REG = [], REG_W = [], GERAETE = {}, NETZ_VZ = 1, AKKU_VZ = 1, ERSTER = null, ERSTER_W = null;
let reiter = (new URLSearchParams(location.search).get("reiter")) || "raeume", art = "tag", ref = new Date(), STAT = null, AUSWAHL = null;
let GER = [], GSTAT = {}, GSTAT_ZEIT = 0;
// Preise (brutto) aus den Helfern in packages/kosten.yaml – Ausweichwerte = Rechnungen aus der Akte (EWE 2026, OOWV 2026)
const PREIS_STANDARD = { strom: 0.2715, grund: 233.27, einsp: 0.0793, wasser: 1.70, wasserGrund: 8.66 };
function preise() {
  const p = (id, std) => { const v = zahl(id); return v != null && v > 0 ? v : std; };
  return { strom: p("input_number.strom_arbeitspreis", PREIS_STANDARD.strom), grund: p("input_number.strom_grundpreis_jahr", PREIS_STANDARD.grund),
    einsp: p("input_number.strom_einspeiseverguetung", PREIS_STANDARD.einsp), wasser: p("input_number.wasser_preis", PREIS_STANDARD.wasser),
    wasserGrund: p("input_number.wasser_grundpreis_monat", PREIS_STANDARD.wasserGrund) };
}
let PREIS = PREIS_STANDARD.strom;
const euroT = v => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
// Tage im Zeitraum, beim laufenden Zeitraum nur bis jetzt (für den Grundpreis)
function tageBisher(b) { return Math.max(0, (Math.min(+b.bis, Date.now()) - +b.von) / 864e5); }
// Warmwasser: 1 Liter von 10 auf 40 °C = 30 K × 1,163 Wh ≈ 0,035 kWh Wärme; die Wärmepumpe braucht dafür Wärme ÷ JAZ Warmwasser an Strom
function warmwasserStromJeLiter(grad = 40) { const jaz = zahl(E.jazWw) || 2.8; return (Math.max(0, grad - 10) * 1.163 / 1000) / jaz; }

const svgBreite = () => (window.innerWidth < 600 ? 380 : 640);   // schmal: weniger Breite = größere Schrift im Diagramm
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
const st = id => { const h = hass(); return id && h && h.states[id]; };
function zahl(id) { const s = st(id); if (!s) return null; const v = parseFloat(s.state); return isFinite(v) ? v : null; }
function kw(id) {        // Leistung in kW
  const v = zahl(id); if (v == null) return null;
  const u = (st(id).attributes.unit_of_measurement || "").toLowerCase();
  return u === "w" ? v / 1000 : u === "mw" ? v * 1000 : v;
}
function kwh(id) {       // Energie in kWh
  const v = zahl(id); if (v == null) return null;
  const u = (st(id).attributes.unit_of_measurement || "").toLowerCase();
  return u === "wh" ? v / 1000 : u === "mwh" ? v * 1000 : v;

const fmt = (v, st = 1) => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: st, maximumFractionDigits: st });
const kwT = v => v == null ? "–" : Math.abs(v) < 1 ? fmt(v * 1000, 0) + " W" : fmt(v, 2) + " kW";
const kwhT = v => v == null ? "–" : fmt(v, v >= 100 ? 0 : 1) + " kWh";
const gradT = id => { const v = zahl(id); return v == null ? "–" : fmt(v, 1) + " °C"; };

async function finden() {
  const h = hass();
  const alle = await h.callWS({ type: "config/entity_registry/list" });
  REG = alle.filter(e => e.platform === "vicare" && !e.disabled_by);
  REG_W = alle.filter(e => e.platform === "syr_connect" && !e.disabled_by);
  for (const [k, namen] of Object.entries(KW)) {
    // Schlüssel heißen bei SYR „getVOL“ (unique_id …_getVOL, entity_id …_getvol) – Groß/klein egal

    const passt = (e, n) => (e.translation_key || "").toLowerCase() === n

let HIST = null, IMPORT_TEXT = "";
const pad2 = n => String(n).padStart(2, "0");

function histFuellen(st) {      // dort, wo Home Assistant noch nichts hat, die Werte aus dem Portal einsetzen

  st.importiert = false;

  for (let i = 0; i < st.b.n; i++) {
    let k, beginn;
    if (art === "jahr") { k = `${st.b.von.getFullYear()}-${pad2(i + 1)}`; beginn = new Date(st.b.von.getFullYear(), i, 1); }
    else { beginn = new Date(st.b.von); beginn.setDate(beginn.getDate() + i); k = tagKey(beginn); }
    const h = quelle[k]; if (!h) continue;
    // Home Assistant hat den Zeitraum ganz aufgezeichnet → dessen Werte behalten; hat es erst mittendrin angefangen → Portal
    const haVoll = ERSTER && ERSTER <= beginn;
    if (haVoll && ["pv", "bezug", "einsp"].some(f => (st[f][i] || 0) > 0.05)) continue;
    ["pv", "bezug", "einsp", "laden", "entladen", "wp"].forEach(f => { if (h[f] != null) st[f][i] = h[f]; });
    st.importiert = true;

}
function csvZeilen(text) {
  return text.split(/\r?\n/).filter(z => z.trim()).map(z => {
    const teile = []; let feld = "", inQ = false;
    for (const c of z) { if (c === '"') inQ = !inQ; else if (c === "," && !inQ) { teile.push(feld); feld = ""; } else feld += c; }
    teile.push(feld); return teile.map(x => x.trim());

}
function csvLesen(text) {
  const anfang = text.search(/measuredAt|^\s*(zeit|datum|date)\b/im);   // z. B. „blob:https://…“ davor beim Kopieren
  if (anfang > 0) text = text.slice(anfang);
  // eingefügter Text kann in einer Zeile ankommen: vor jedem Zeitstempel umbrechen
  text = text.replace(/\s+(?=\d{4}-\d{2}-\d{2}T)/g, "\n");
  const z = csvZeilen(text); if (z.length < 2) throw new Error("Datei ist leer");
  const kopf = z[0].map(x => x.toLowerCase());
  const spalte = re => kopf.findIndex(k => re.test(k));
  const sp = { pv: spalte(/^pv/), bezug: spalte(/netzbezug|bezug/), einsp: spalte(/einspeis/), laden: spalte(/batterieladung|ladung/),
    entladen: spalte(/entladung/), wp: spalte(/w(ä|ae)rmepumpe/), haus: spalte(/haushalt/) };
  const zeitSp = spalte(/measured|zeit|date|datum/);
  if (zeitSp < 0 || sp.pv < 0) throw new Error("Das sieht nicht wie ein Export aus dem Energieportal aus (Spalten PV, Netzbezug … fehlen).");
  const faktor = i => /\(kwh\)/.test(kopf[i]) ? 1 : /\(mwh\)/.test(kopf[i]) ? 1000 : 0.001;   // Wh → kWh
  const zeilen = z.slice(1).map(r => ({ t: new Date(r[zeitSp]), r })).filter(x => !isNaN(x.t)).sort((a, b) => a.t - b.t);
  const schritt = zeilen.length > 1 ? (zeilen[1].t - zeilen[0].t) / 3600e3 : 24;
  const art = schritt >= 24 * 27 ? "monat" : "tag";
  const erg = { monat: {}, tag: {} };
  zeilen.forEach(({ t, r }) => {
    const k = art === "monat" ? `${t.getFullYear()}-${pad2(t.getMonth() + 1)}` : tagKey(t);   // Zeitpunkt = Beginn des Zeitraums
    const ziel = erg[art][k] = erg[art][k] || {};
    let leer = true;
    Object.entries(sp).forEach(([f, i]) => { if (i < 0) return; const roh = String(r[i] || ""), v = parseFloat(roh.includes(",") ? roh.replace(/\./g, "").replace(",", ".") : roh);
      if (isFinite(v)) { ziel[f] = (ziel[f] || 0) + v * faktor(i); leer = false; } });
    if (leer) delete erg[art][k];
  });
  if (art === "tag") Object.entries(erg.tag).forEach(([k, w]) => {     // Tageswerte auch zu Monaten zusammenzählen
    const m = k.slice(0, 7), z = erg.monat[m] = erg.monat[m] || {};
    Object.entries(w).forEach(([f, v]) => { z[f] = (z[f] || 0) + v; });
  });

}

async function ladeKosten() {
  if (!E.bezug) return;
  const jetzt = new Date(), heute = new Date(jetzt); heute.setHours(0, 0, 0, 0);
  const wo = new Date(heute); wo.setDate(wo.getDate() - (wo.getDay() + 6) % 7);

  const ids = [E.bezug, E.einsp, E.wpTag, EW.gesamt].filter(Boolean);
  try {
    const r = await stats(ab, jetzt, "day", ids, ["change"]);
    const tage = {};   // Tag (Zeitstempel) → Werte
    const merke = (id, k, max) => ((id && r[id]) || []).forEach(x => { const v = Math.max(0, x.change || 0); if (max && v > max) return;
      const t = zeit(x.start); (tage[t] = tage[t] || {})[k] = (tage[t][k] || 0) + v; });

      Object.entries(tage).forEach(([t, w]) => { if (+t >= +von && +t < +bis) ["bezug", "einsp", "wp", "wasser"].forEach(k => { z[k] += w[k] || 0; }); });

      `<button data-reiter="${k}" class="${reiter === k ? "an" : ""}">${n}</button>`).join("")}</div></div>
    ${kostenLeiste()}
    ${Object.keys(E).length || REG.length ? "" : `<div class="hinweis">Keine Viessmann-Werte gefunden. Ist die Viessmann-Integration eingerichtet?</div>`}
    ${inhalt}`;
}
function live() {     // nur die Live-Teile neu, damit Antippen und Blättern nicht flackern
  if (reiter === "uebersicht" && $("fluss")) { $("fluss").innerHTML = fluss(); }
  else if (reiter === "anlage" && $("anlage")) zeichnen();
  else if (reiter === "geraete" && $("geraete")) geraeteLive();
  // nicht neu zeichnen, während jemand gerade in der Badewannen-Rechnung tippt
  else if (reiter !== "uebersicht" && !/^(wliter|wgrad|grundlast)$/.test((document.activeElement || {}).id || "")) zeichnen();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-reiter],[data-art],[data-blaettern],[data-heute],[data-fach],[data-rueck],[data-csvtext]"); if (!t) return;
  if (t.dataset.rueck) { ladeRueck(true); return; }
  if (t.dataset.csvtext) { const v = ($("csvtext") || {}).value || ""; if (v.trim()) importText(v); return; }
  if (t.dataset.reiter) { reiter = t.dataset.reiter; zeichnen(); }
  else if (t.dataset.art) { art = t.dataset.art; AUSWAHL = null; ladeStat(); }
  else if (t.dataset.blaettern) blaettern(+t.dataset.blaettern);
  else if (t.dataset.heute) { ref = new Date(); AUSWAHL = null; ladeStat(); }
  else if (t.dataset.fach) { AUSWAHL = AUSWAHL === +t.dataset.fach ? null : +t.dataset.fach; zeichnen(); }
});
let breiteAlt = svgBreite();
window.addEventListener("resize", () => { if (svgBreite() !== breiteAlt) { breiteAlt = svgBreite(); zeichnen(); } });
function design() { const h = hass(); document.documentElement.classList.toggle("dunkel", !!(h && h.themes && h.themes.darkMode)); }
let versuche = 0;
async function start() {
  if (!hass()) {
    if (++versuche === 15) $("inhalt").innerHTML = `<div class="hinweis">Die Seite ist da, findet aber Home Assistant nicht.
      Sie funktioniert nur im Dashboard (Reiter „Energie &amp; Heizung“).</div>`;
    setTimeout(start, 400); return;
  }
  design();
  try { await finden(); } catch (e) { $("inhalt").innerHTML = `<div class="hinweis">Viessmann-Werte nicht lesbar: ${esc(e.message || e)}</div>`; return; }
  zeichnen();
  ladeRueck(false);
  await Promise.all([vorzeichen().catch(() => {}), ersterTag(), ersterWasser()]);
  ladeStat();
  ladeWoche7().then(zeichnen);
  ladeKosten().then(zeichnen);
  setInterval(() => ladeKosten(), 15 * 60e3);
  setInterval(() => { design(); live(); }, 5000);
  setInterval(() => { if (istJetzt(bereich())) ladeStat(); }, 5 * 60e3);
  setInterval(() => ladeWoche7(), 60 * 60e3);
}
start();
</script>
