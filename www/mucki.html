<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mucki</title>
<!--
  Muckis Seite (im Dashboard "Flur" als Vollbild eingebettet).
  Links: Stundenplan wie auf dem Papier, über "Bearbeiten" jederzeit änderbar.
  Rechts: Taschengeld-Tafel – Magnet antippen = kommt ins nächste freie der 6 Felder (je 50 Cent),
  Feld antippen = wieder raus, "Neue Woche" leert alle Felder.
  Daten: /local/mucki_daten.json (lokal, nicht im Repository), Felder: input_text.mucki_felder.
-->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  img.emoji { height: 1.1em; width: 1.1em; vertical-align: -0.15em; margin: 0 0.05em; }
  :root { --blau: #007AFF; --gruen: #34C759; --rot: #FF3B30; --grau: #8E8E93; --trenn: #E5E5EA; --hell: #F2F2F7; --text: #1C1C1E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: grid; grid-template-columns: 50fr 50fr; gap: 1.4vw; padding: 1.2vw; color: var(--text); }
  .karte { background: #fff; border-radius: 1.6vw; padding: 1.3vw 1.5vw; position: relative; overflow: hidden;
    box-shadow: 0 0.2vw 1.4vw rgba(0,0,0,.12); display: flex; flex-direction: column; min-height: 0; }
  h1, h2 { font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  /* ---------- Stundenplan ---------- */
  .kopf { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.8vw; }
  .kopf h1 { font-size: 1.55vw; }
  .kopf .klasse { font-size: 1vw; color: var(--grau); font-weight: 600; background: var(--hell); padding: 0.25vw 0.7vw; border-radius: 1vw; }
  .tabelle { flex: 1 1 auto; display: grid; grid-template-columns: 1.25fr repeat(5, 1fr); grid-auto-rows: auto; align-content: stretch;
    border-radius: 1vw; overflow: hidden; background: var(--hell); gap: 0.1vw; }
  .tabelle > div { background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 0.22vw 0.3vw; min-height: 0; }
  .tabelle .tag { background: var(--hell); font-weight: 600; font-size: 0.95vw; color: #3C3C43; padding: 0.5vw 0.2vw; }
  .tabelle .tag.heute { background: var(--blau); color: #fff; }
  .tabelle .zeit { font-size: 0.8vw; font-weight: 600; color: #3C3C43; white-space: pre-line; line-height: 1.25; align-items: flex-start; text-align: left; padding-left: 0.6vw; }
  .tabelle .zeit b { color: var(--text); font-size: 0.9vw; }
  .tabelle .info { grid-column: 1 / -1; background: #FAFAFC; font-size: 0.68vw; color: var(--grau); padding: 0.12vw; white-space: normal; }
  .tabelle .fach .f { font-weight: 600; font-size: 0.95vw; line-height: 1.15; }
  .tabelle .fach .l { font-size: 0.7vw; color: var(--grau); margin-top: 0.15vw; min-height: 0.8vw; }
  .tabelle .fach.heute { background: rgba(0,122,255,.08); }
  .tabelle .fach.heute .f { color: var(--blau); }
  /* ---------- Taschengeld ---------- */
  .tg-kopf { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7vw; }
  .tg-kopf h2 { font-size: 1.55vw; }
  .rechnung { display: grid; grid-template-columns: 1fr auto; gap: 0.35vw 1vw; background: var(--hell); border-radius: 1vw; padding: 0.7vw 1vw; font-size: 1vw; }
  .rechnung .minus { color: var(--rot); } .rechnung .plus { color: var(--gruen); }
  .rechnung .linie { grid-column: 1 / -1; height: 0.08vw; background: #D1D1D6; }
  .rechnung .gesamt { font-weight: 700; font-size: 1.2vw; }
  .rechnung .betrag { text-align: right; font-variant-numeric: tabular-nums; }
  .punkt { display: inline-block; width: 0.75vw; height: 0.75vw; border-radius: 50%; margin-right: 0.5vw; vertical-align: middle; }
  .balken { grid-column: 1 / -1; height: 0.6vw; border-radius: 0.3vw; background: #E5E5EA; overflow: hidden; margin-top: 0.2vw; }
  .balken > div { height: 100%; background: var(--gruen); border-radius: 0.3vw; transition: width .4s; }
  .satz { font-size: 1vw; color: #3C3C43; margin: 0.8vw 0 0.5vw; font-weight: 600; }
  .felder { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 2.9vw; gap: 0.5vw; }
  .feld { border-radius: 0.9vw; border: 0.12vw dashed #C7C7CC; display: flex; align-items: center; justify-content: center;
    color: #C7C7CC; font-size: 0.85vw; position: relative; }
  .feld.voll { border: 0; }
  .feld .magnet { width: 100%; height: 100%; }
  .feld .weg { position: absolute; top: -0.45vw; right: -0.45vw; width: 1.6vw; height: 1.6vw; border-radius: 50%; background: #fff;
    color: var(--rot); font-size: 1vw; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0.1vw 0.4vw rgba(0,0,0,.25); }
  .magnet { border-radius: 0.9vw; padding: 0.3vw 0.6vw; font-size: 0.95vw; font-weight: 600; line-height: 1.15; text-align: center;
    color: #1C1C1E; display: flex; align-items: center; justify-content: center; min-height: 2.6vw; cursor: pointer;
    box-shadow: 0 0.08vw 0.25vw rgba(0,0,0,.12); transition: transform .12s, opacity .2s; }
  .magnet:active, .magnet.gedrueckt { transform: scale(0.94); }
  .verlauf { display: flex; gap: 0.4vw; align-items: stretch; }
  .verlauf .woche { flex: 1; background: var(--hell); border-radius: 0.8vw; padding: 0.35vw 0.3vw; text-align: center; font-size: 0.75vw; color: #3C3C43; }
  .verlauf .woche b { display: block; font-size: 0.95vw; color: var(--text); }
  .verlauf .woche.voll { background: rgba(52,199,89,.15); }
  .verlauf .woche.jetzt { box-shadow: inset 0 0 0 0.12vw var(--blau); }
  .verlauf .serie { flex: 1.3; background: rgba(255,149,0,.14); color: #9a5b00; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; }
  .lernen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45vw; }
  .lern { border-radius: 0.9vw; padding: 0.4vw 0.6vw; background: #EEF4FF; cursor: pointer; position: relative; min-height: 3.6vw; }
  .lern .art { font-size: 0.75vw; font-weight: 700; color: var(--blau); text-transform: uppercase; letter-spacing: 0.04em; }
  .lern .was { font-size: 0.85vw; font-weight: 600; line-height: 1.2; margin-top: 0.15vw; white-space: pre-line; }
  .lern.fertig { background: rgba(52,199,89,.16); }
  .lern.fertig .art { color: #1f9d3a; }
  .lern .haken { position: absolute; top: 0.4vw; right: 0.5vw; font-size: 1.1vw; }
  .vorrat-titel { font-size: 0.85vw; color: var(--grau); font-weight: 600; margin: 0.8vw 0 0.4vw; text-transform: uppercase; letter-spacing: 0.04em; }
  .vorrat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45vw; overflow: auto; flex: 1; align-content: start; padding: 0.2vw; }
  .vorrat .magnet { font-size: 0.85vw; min-height: 2.3vw; }
  .knopf { font: inherit; font-size: 0.95vw; font-weight: 600; border: 0; border-radius: 2vw; padding: 0.5vw 1.1vw; cursor: pointer;
    background: var(--hell); color: var(--blau); }
  .knopf.rot { background: rgba(255,59,48,.12); color: var(--rot); }
  .knopf.rot.scharf { background: var(--rot); color: #fff; }
  .knopf.blau { background: var(--blau); color: #fff; }
  .unten { display: flex; justify-content: space-between; align-items: center; margin-top: 0.6vw; gap: 0.6vw; }
  /* ---------- Bearbeiten ---------- */
  body.bearbeiten .tabelle .fach, body.bearbeiten .tabelle .zeit, body.bearbeiten .tabelle .info, body.bearbeiten .kopf h1,
  body.bearbeiten .kopf .klasse, body.bearbeiten .vorrat .magnet, body.bearbeiten .rechnung { outline: 0.12vw dashed var(--blau); outline-offset: -0.2vw; }
  #panel { position: fixed; left: 50%; top: 1.5vw; transform: translateX(-50%); background: #fff; color: var(--text); z-index: 10;
    border-radius: 1.4vw; padding: 1.4vw; width: 38vw; box-shadow: 0 1vw 4vw rgba(0,0,0,.35); display: none; }
  #panel h3 { margin: 0 0 0.6vw; font-size: 1.3vw; }
  #panel label { display: block; font-size: 0.9vw; color: var(--grau); margin-top: 0.6vw; }
  #panel input, #panel textarea { width: 100%; font: inherit; font-size: 1.2vw; padding: 0.55vw 0.7vw; border: 0; background: var(--hell); border-radius: 0.7vw; }
  #panel textarea { height: 4.5vw; resize: none; }
  #panel .zeile { display: flex; gap: 0.6vw; margin-top: 1vw; flex-wrap: wrap; }
  #panel .farben { display: flex; gap: 0.5vw; margin-top: 0.4vw; }
  #panel .farben span { width: 2.2vw; height: 2.2vw; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 0.1vw rgba(0,0,0,.1); }
  #panel .farben span.an { box-shadow: 0 0 0 0.25vw #fff, 0 0 0 0.4vw var(--blau); }
  #schleier { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 9; display: none; }
  #meldung { position: fixed; left: 50%; bottom: 2vw; transform: translateX(-50%); background: rgba(28,28,30,.9); color: #fff;
    padding: 0.7vw 1.3vw; border-radius: 2vw; font-size: 1.05vw; z-index: 20; display: none; }
</style>
</head>
<body>
  <div class="karte" id="plan">
    <div class="kopf"><h1 id="titel"></h1><span class="klasse" id="klasse"></span></div>
    <div class="tabelle" id="tabelle"></div>
    <div class="vorrat-titel" id="lern-titel">Lern-Challenge der Woche</div>
    <div class="lernen" id="lernen"></div>
    <div class="vorrat-titel">Wochen</div>
    <div class="verlauf" id="verlauf"></div>
  </div>
  <div class="karte" id="tafel">
    <div class="tg-kopf"><h2>💰 Taschengeld <span id="kw" style="font-size:1vw;color:#8E8E93;font-weight:600"></span></h2>
      <div><button class="knopf" id="b-bearbeiten">Bearbeiten</button>
      <button class="knopf" id="b-abbrechen" style="display:none">Abbrechen</button>
      <button class="knopf blau" id="b-speichern" style="display:none">Speichern</button></div></div>
    <div class="rechnung" id="rechnung"></div>
    <div class="satz" id="satz"></div>
    <div class="felder" id="felder"></div>
    <div class="unten"><span style="font-size:0.85vw;color:#8E8E93">Falsch getippt? Auf das ✕ tippen.</span><button class="knopf rot" id="b-woche">Neue Woche</button></div>
    <div class="vorrat-titel">Aufgaben – antippen, wenn erledigt</div>
    <div class="vorrat" id="vorrat"></div>
  </div>
  <div id="schleier"></div>
  <div id="panel"></div>
  <div id="meldung"></div>

<script>
const DATEN_URL = "/local/mucki_daten.json";
const FELDER = "input_text.mucki_felder";
const ANZAHL_FELDER = 6;
const FARBEN = { gelb: "#FFD60A", rot: "#FF6B5E", gruen: "#8CD867", orange: "#FFA94D", blau: "#7DCBEB", weiss: "#F2F2F7", lila: "#C7A6F5" };
const TAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];

// Vorlage nach dem Papier-Stundenplan (Lehrer leer – die trägt man auf dem Monitor selbst ein, sie bleiben lokal)
function f(fach) { return { fach, lehrer: "" }; }
const VORLAGE = {
  version: 1,
  titel: "Stundenplan ab 17.08.2026",
  klasse: "Klasse 2",
  zeilen: [
    { zeit: "Frühbetreuung 7.00 - 7.45 Uhr\nGleitzeit 8.00 - 8.10 Uhr", info: true },
    { zeit: "1. Stunde\n8.10 - 9.05 Uhr", faecher: [f("Deutsch"), f("Religion / WN?"), f("Schwimmen"), f("Deutsch"), f("Deutsch")] },
    { zeit: "Kurze Pause 9.05 - 9.10 Uhr", info: true },
    { zeit: "2. Stunde\n9.10 - 9.55 Uhr", faecher: [f("Mathematik"), f("Religion / WN?"), f("Schwimmen"), f("Mathematik"), f("Mathematik")] },
    { zeit: "Frühstück 9.55 - 10.05 Uhr und\nPause 10.05 - 10.25 Uhr", info: true },
    { zeit: "3. Stunde\n10.25 - 11.10 Uhr", faecher: [f("Sachunterricht"), f("Deutsch"), f("Deutsch"), f("Kunst"), f("Sachunterricht")] },
    { zeit: "4. Stunde\n11.10 - 11.55 Uhr", faecher: [f("Mathematik"), f("Mathematik"), f("Mathematik"), f("Kunst"), f("Musik")] },
    { zeit: "Schulschluss bzw.\nPause 11.55 - 12.15 Uhr", info: true },
    { zeit: "5. Stunde\n12.15 - 13.00 Uhr", faecher: [f("Betreuung"), f("Sachunterricht"), f("Betreuung"), f("SB"), f("Betreuung")] },
    { zeit: "Schulschluss bzw.\n13.00 - 13.30 Uhr Mittagessen\n13.30 - 14.15 Uhr Hausaufgaben", info: true },
    { zeit: "Schulschluss bzw.\n14.15 - 15.45 Uhr\nSpielen und Angebote", info: true },
  ],
  taschengeld: {
    woche: "Taschengeld wöchentl. 5 €",
    posten: [{ name: "Miete / Strom", betrag: "2,- € wöchentl.", farbe: "blau" }, { name: "Essen, usw.", betrag: "1,- € wöchentl.", farbe: "rot" }],
    satz: "Helfe ich im Haushalt, bekomme ich 50 Cent",
    cent: 50,
  },
  aufgaben: [
    { name: "Leergut wegbringen", farbe: "gruen" }, { name: "Fahrrad putzen", farbe: "rot" },
    { name: "Geschirrspüler einräumen", farbe: "orange" }, { name: "Beim Kochen helfen", farbe: "weiss" },
    { name: "Laub harken", farbe: "orange" }, { name: "Blumen gießen", farbe: "blau" },
    { name: "Werkstatt helfen", farbe: "blau" }, { name: "Pakete holen", farbe: "weiss" },
    { name: "Badezimmer putzen", farbe: "gelb" }, { name: "Wäsche zusammenlegen", farbe: "gruen" },
    { name: "Rasenmähen", farbe: "gelb" }, { name: "Müll wegbringen", farbe: "blau" },
    { name: "Hausbau helfen", farbe: "weiss" }, { name: "Zimmer aufräumen", farbe: "gelb" },
    { name: "Gartenarbeit", farbe: "rot" }, { name: "Fegen", farbe: "gruen" },
    { name: "Tisch decken", farbe: "lila" }, { name: "Tisch abräumen", farbe: "lila" },
    { name: "Geschirrspüler ausräumen", farbe: "orange" }, { name: "Staubsaugen", farbe: "gelb" },
    { name: "Schuhe aufräumen", farbe: "weiss" }, { name: "Auto aussaugen helfen", farbe: "blau" },
  ],
};

let daten = null, gesichert = null, bearbeiten = false, letzteFelder = null, letzterTag = null;
const $ = id => document.getElementById(id);
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function meldung(t) { const m = $("meldung"); m.textContent = t; emoji(m); m.style.display = "block"; clearTimeout(meldung.t); meldung.t = setTimeout(() => m.style.display = "none", 3500); }
// Tippen: am Kiosk-Monitor kommen Finger als Touch-Events, am Laptop als Klick
function tippen(el, fn) {
  let touch = 0;
  el.addEventListener("touchend", ev => { ev.preventDefault(); touch = Date.now(); fn(ev); }, { passive: false });
  el.addEventListener("click", ev => { if (Date.now() - touch > 700) fn(ev); });
}
function farbe(name) { return FARBEN[name] || FARBEN.weiss; }
function aufgabeFarbe(name) { const a = daten.aufgaben.find(x => x.name === name); return a ? a.farbe : "weiss"; }

// ---------- Felder (gemeinsam für alle Geräte) ----------
function felderLesen() {
  const h = hass(); const s = h && h.states[FELDER];
  const v = s ? s.state : "";
  return (!v || v === "unknown" || v === "unavailable") ? [] : v.split("|").filter(Boolean).slice(0, ANZAHL_FELDER);
}
function felderSchreiben(liste) {
  const h = hass(); if (!h) return;
  const wert = liste.join("|").slice(0, 255);
  // leeren über das Skript (läuft auf dem Server), sonst direkt
  const auftrag = wert === "" ? h.callService("script", "mucki_neue_woche", {})
                              : h.callService("input_text", "set_value", { entity_id: FELDER, value: wert });
  Promise.resolve(auftrag).catch(e => meldung("⚠️ Hat nicht geklappt: " + (e && e.message || e)));
}
// Zahl aus Text wie "2,- € wöchentl." oder "Taschengeld wöchentl. 5 €"
function zahl(t) { const m = String(t || "").match(/(\d+(?:[.,]\d+)?)/); return m ? parseFloat(m[1].replace(",", ".")) : 0; }
const VERLAUF_URL = "/local/mucki_verlauf.json";
const LERNEN = "input_text.mucki_lernen";
// Lern-Challenge 2. Klasse: jede Kalenderwoche andere Aufgaben (fest aus der KW berechnet)
function zufall(seed) { let x = seed >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
function lernAufgaben(kw) {
  const r = zufall(Number(kw.replace(/\D/g, ""))), z = (a, b) => a + Math.floor(r() * (b - a + 1)), w = l => l[Math.floor(r() * l.length)];
  const rechnen = [];
  for (let i = 0; i < 3; i++) {
    const art = z(0, 3);
    if (art === 0) { const a = z(12, 68), b = z(5, 99 - a); rechnen.push(`${a} + ${b} = ?`); }
    else if (art === 1) { const a = z(30, 99), b = z(5, a - 5); rechnen.push(`${a} − ${b} = ?`); }
    else if (art === 2) { const a = w([2, 5, 10, 3, 4]), b = z(2, 10); rechnen.push(`${b} · ${a} = ?`); }
    else { const a = z(15, 60), b = z(8, 35); rechnen.push(`${a} + ? = ${a + b}`); }
  }
  const lesen = w(["Lies Mama oder Papa 5 Minuten aus deinem Lieblingsbuch vor.", "Lies eine Seite vor und erzähle danach, was passiert ist.",
    "Lies das Wetter für morgen vom Monitor vor.", "Lies den Einkaufszettel vor.", "Lies ein Gedicht oder einen Witz vor.",
    "Lies eine Seite aus deinem Lesebuch ganz ohne Fehler vor.", "Lies die Termine dieser Woche vom Monitor vor."]);
  const schreiben = w(["Schreibe 5 Wörter mit „ie“.", "Schreibe 3 Sätze über dein Wochenende.", "Schreibe 5 Tiere auf – groß am Anfang!",
    "Schreibe den Einkaufszettel für 3 Sachen.", "Schreibe 5 Wörter mit „sch“.", "Schreibe alle Wochentage auf.",
    "Schreibe eine kleine Karte an Oma oder Opa.", "Schreibe 5 Wörter, die sich reimen."]);
  return [{ art: "Rechnen", was: rechnen.join("\n") }, { art: "Lesen", was: lesen }, { art: "Schreiben", was: schreiben }];
}
function lernenLesen(kw) {
  const h = hass(), st = h && h.states[LERNEN], v = st ? st.state : "";
  return v && v.startsWith(kw + ":") ? v.split(":")[1].padEnd(3, "0").slice(0, 3).split("").map(c => c === "1") : [false, false, false];
}
function lernenSchreiben(kw, liste) {
  const h = hass(); if (!h) return;
  Promise.resolve(h.callService("input_text", "set_value", { entity_id: LERNEN, value: kw + ":" + liste.map(b => b ? "1" : "0").join("") }))
    .catch(e => meldung("⚠️ Hat nicht geklappt: " + (e && e.message || e)));
}
let verlauf = { wochen: {} };
function isoWoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - tag);
  const jahr = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(jahr, 0, 1)) / 864e5 + 1) / 7);
  return `${jahr}-W${String(w).padStart(2, "0")}`;
}
function wocheDavor(kw, n) { const [j, w] = kw.split("-W").map(Number); const d = new Date(j, 0, 4 + (w - 1) * 7); d.setDate(d.getDate() - 7 * n); return isoWoche(d); }
async function verlaufLaden() {
  try { const r = await fetch(VERLAUF_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) verlauf = await r.json(); } catch (e) { /* noch leer */ }
  if (!verlauf || typeof verlauf.wochen !== "object") verlauf = { wochen: {} };
}
function emoji(el) { try { if (window.twemoji) twemoji.parse(el || document.body, { folder: "svg", ext: ".svg" }); } catch (e) { /* ohne Bilder */ } }
function euro(x) { return x.toFixed(2).replace(".", ",") + " €"; }

function zeichnePlan() {
  const heute = new Date().getDay() - 1; // Montag = 0
  $("titel").textContent = daten.titel; $("klasse").textContent = daten.klasse;
  let html = `<div class="tag">Zeit</div>` + TAGE.map((t, i) => `<div class="tag ${i === heute ? "heute" : ""}">${t}</div>`).join("");
  daten.zeilen.forEach((z, zi) => {
    if (z.info) {
      html += `<div class="info" data-zeit="${zi}">${esc(z.zeit.replace(/\n/g, " · "))}</div>`;
    } else {
      const [kopf, ...rest] = z.zeit.split("\n");
      html += `<div class="zeit" data-zeit="${zi}"><b>${esc(kopf)}</b>${esc(rest.join("\n"))}</div>` + z.faecher.map((x, i) =>
        `<div class="fach ${i === heute ? "heute" : ""}" data-zelle="${zi}:${i}"><div class="f">${esc(x.fach)}</div><div class="l">${esc(x.lehrer)}</div></div>`).join("");
    }
  });
  $("tabelle").innerHTML = html;
  $("tabelle").querySelectorAll("[data-zelle]").forEach(el => tippen(el, () => { if (bearbeiten) zelleBearbeiten(el.dataset.zelle); }));
  $("tabelle").querySelectorAll("[data-zeit]").forEach(el => tippen(el, () => { if (bearbeiten) zeitBearbeiten(+el.dataset.zeit); }));
  letzterTag = heute;
}
function zeichneTafel() {
  const tg = daten.taschengeld, felder = felderLesen(), cent = tg.cent || 50;
  // Rechnung: 5 € − Miete/Strom − Essen = bleibt, dazu bis zu 6 × 50 Cent
  const grund = zahl(tg.woche), abzug = tg.posten.reduce((s, p) => s + zahl(p.betrag), 0);
  const jetzt = isoWoche(new Date()), vorher = wocheDavor(jetzt, 1);
  const voll = kw => ((verlauf.wochen || {})[kw] || []).length >= ANZAHL_FELDER;
  const bonusBetrag = tg.bonus == null ? 1 : Number(tg.bonus);
  // Bonus: diese Woche alles geschafft UND letzte Woche auch
  const bonusMoeglich = voll(vorher) && bonusBetrag > 0, bonus = bonusMoeglich && felder.length >= ANZAHL_FELDER ? bonusBetrag : 0;
  const lernBonus = tg.lernBonus == null ? 1 : Number(tg.lernBonus), lern = lernenLesen(jetzt), lernAnz = lern.filter(Boolean).length;
  const lernGeld = lernAnz === 3 ? lernBonus : 0;
  const bleibt = grund - abzug, extra = felder.length * cent / 100 + lernGeld;
  const max = bleibt + ANZAHL_FELDER * cent / 100 + (bonusMoeglich ? bonusBetrag : 0) + lernBonus;
  $("kw").textContent = "· KW " + Number(jetzt.split("-W")[1]);
  $("rechnung").innerHTML =
    `<span>Taschengeld pro Woche</span><span class="betrag">${euro(grund)}</span>`
    + tg.posten.map(p => `<span><span class="punkt" style="background:${farbe(p.farbe)}"></span>${esc(p.name)}</span><span class="betrag minus">− ${euro(zahl(p.betrag))}</span>`).join("")
    + `<span>Verdient diese Woche (${felder.length} × ${cent} Cent)</span><span class="betrag plus">+ ${euro(felder.length * cent / 100)}</span>`
    + (lernBonus > 0 ? `<span>📚 Lern-Challenge (${lernAnz} von 3)</span><span class="betrag plus">${lernGeld ? "+ " + euro(lernGeld) : "noch offen"}</span>` : "")
    + (bonusMoeglich ? `<span>🎁 Bonus: 2 Wochen hintereinander alles geschafft</span><span class="betrag plus">${bonus ? "+ " + euro(bonus) : "noch offen"}</span>` : "")
    + `<div class="linie"></div><span class="gesamt">Bekommst du diese Woche</span><span class="betrag gesamt">${euro(bleibt + extra + bonus)}</span>`
    + `<span style="color:#8E8E93">höchstens möglich</span><span class="betrag" style="color:#8E8E93">${euro(max)}</span>`
    + `<div class="balken"><div style="width:${Math.round(felder.length / ANZAHL_FELDER * 100)}%"></div></div>`;
  $("satz").textContent = tg.satz;
  // Verlauf: die letzten 4 Wochen + diese Woche, dazu die Serie "alles geschafft"
  let serie = felder.length >= ANZAHL_FELDER ? 1 : 0;
  for (let n = 1; n < 60 && voll(wocheDavor(jetzt, n)); n++) serie++;
  let vh = "";
  for (let n = 4; n >= 0; n--) {
    const kw = wocheDavor(jetzt, n), anz = n === 0 ? felder.length : ((verlauf.wochen || {})[kw] || []).length;
    const geld = bleibt + anz * cent / 100 + (anz >= ANZAHL_FELDER && voll(wocheDavor(kw, 1)) ? bonusBetrag : 0);
    vh += `<div class="woche ${anz >= ANZAHL_FELDER ? "voll" : ""} ${n === 0 ? "jetzt" : ""}">KW ${Number(kw.split("-W")[1])}<b>${anz}/${ANZAHL_FELDER}${anz >= ANZAHL_FELDER ? " ⭐" : ""}</b>${n === 0 ? "läuft" : euro(geld)}</div>`;
  }
  vh += `<div class="woche serie">${serie >= 2 ? `🔥 ${serie} Wochen alles geschafft!` : serie === 1 ? "⭐ Noch 1 Woche voll = Bonus!" : "6 Felder voll = ⭐"}</div>`;
  $("verlauf").innerHTML = vh;
  const la = lernAufgaben(jetzt);
  $("lern-titel").textContent = `Lern-Challenge der Woche – alle 3 geschafft = + ${euro(lernBonus)}`;
  $("lernen").innerHTML = la.map((a, i) => `<div class="lern ${lern[i] ? "fertig" : ""}" data-lern="${i}"><div class="art">${a.art}</div>`
    + `<div class="was">${esc(a.was)}</div><div class="haken">${lern[i] ? "✅" : "⬜"}</div></div>`).join("");
  $("lernen").querySelectorAll("[data-lern]").forEach(el => tippen(el, () => {
    const i = +el.dataset.lern, l = lernenLesen(jetzt); l[i] = !l[i]; lernenSchreiben(jetzt, l);
    meldung(l[i] ? (l.every(Boolean) ? `🎉 Alle 3 Lernaufgaben geschafft – + ${euro(lernBonus)}!` : `✅ ${la[i].art} geschafft!`) : `${la[i].art} wieder offen`);
  }));
  let fh = "";
  for (let i = 0; i < ANZAHL_FELDER; i++) {
    const a = felder[i];
    fh += a ? `<div class="feld voll" data-feld="${i}"><div class="magnet" style="background:${farbe(aufgabeFarbe(a))}">${esc(a)}</div><div class="weg">✕</div></div>`
            : `<div class="feld">${i + 1}</div>`;
  }
  $("felder").innerHTML = fh;
  $("vorrat").innerHTML = daten.aufgaben.map((a, i) =>
    `<div class="magnet" data-aufgabe="${i}" style="background:${farbe(a.farbe)}">${esc(a.name)}</div>`).join("")
    + (bearbeiten ? `<div class="magnet" data-neu="1" style="background:#fff;border:0.12vw dashed #C7C7CC;color:#007AFF">＋ Neue Aufgabe</div>` : "");
  // Feld antippen (oder das ✕) = falsch getippt, wieder raus
  $("felder").querySelectorAll("[data-feld]").forEach(el => tippen(el, () => {
    const i = +el.dataset.feld, l = felderLesen();
    if (i < l.length) { const weg = l.splice(i, 1)[0]; felderSchreiben(l); meldung(`„${weg}“ wieder entfernt`); }
  }));
  $("vorrat").querySelectorAll("[data-aufgabe]").forEach(el => tippen(el, () => {
    const a = daten.aufgaben[+el.dataset.aufgabe];
    if (bearbeiten) return aufgabeBearbeiten(+el.dataset.aufgabe);
    const l = felderLesen();
    if (l.length >= ANZAHL_FELDER) return meldung("Alle 6 Felder sind voll – super gemacht! 🎉");
    l.push(a.name); felderSchreiben(l);
    el.classList.add("gedrueckt"); setTimeout(() => el.classList.remove("gedrueckt"), 200);
    meldung(`👍 ${a.name} – ${cent} Cent verdient!`);
  }));
  const neu = $("vorrat").querySelector("[data-neu]"); if (neu) tippen(neu, () => aufgabeBearbeiten(-1));
  letzteFelder = felder.join("|");
  emoji($("tafel"));
}
function zeichnen() { zeichnePlan(); zeichneTafel(); emoji(document.body); }

// ---------- Bearbeiten ----------
function panel(html, ok) {
  $("panel").innerHTML = html + `<div class="zeile"><button class="knopf blau" id="p-ok">Übernehmen</button><button class="knopf grau" id="p-zu">Abbrechen</button></div>`;
  $("panel").style.display = "block"; $("schleier").style.display = "block";
  tippen($("p-ok"), () => { ok(); panelZu(); zeichnen(); });
  tippen($("p-zu"), panelZu);
  const erstes = $("panel").querySelector("input, textarea"); if (erstes) setTimeout(() => erstes.focus(), 50);
}
function panelZu() { $("panel").style.display = "none"; $("schleier").style.display = "none"; }
function zelleBearbeiten(k) {
  const [zi, ti] = k.split(":").map(Number), x = daten.zeilen[zi].faecher[ti];
  panel(`<h3>${TAGE[ti]} · ${esc(daten.zeilen[zi].zeit.split("\n")[0])}</h3>
    <label>Fach</label><input id="p-fach" value="${esc(x.fach)}">
    <label>Lehrer/in</label><input id="p-lehrer" value="${esc(x.lehrer)}">`,
    () => { x.fach = $("p-fach").value.trim(); x.lehrer = $("p-lehrer").value.trim(); });
}
function zeitBearbeiten(zi) {
  const z = daten.zeilen[zi];
  panel(`<h3>Zeile bearbeiten</h3><label>Text (Zeilenumbruch mit Enter)</label><textarea id="p-zeit">${esc(z.zeit)}</textarea>
    <div class="zeile"><button class="knopf grau" id="p-hoch">⬆ Zeile darüber einfügen</button><button class="knopf" id="p-weg">Zeile löschen</button></div>`,
    () => { z.zeit = $("p-zeit").value; });
  tippen($("p-hoch"), () => { daten.zeilen.splice(zi, 0, { zeit: "Neue Stunde\n00.00 - 00.00 Uhr", faecher: TAGE.map(() => f("")) }); panelZu(); zeichnen(); });
  tippen($("p-weg"), () => { daten.zeilen.splice(zi, 1); panelZu(); zeichnen(); });
}
function kopfBearbeiten() {
  panel(`<h3>Überschrift</h3><label>Titel</label><input id="p-titel" value="${esc(daten.titel)}">
    <label>Klasse</label><input id="p-klasse" value="${esc(daten.klasse)}">`,
    () => { daten.titel = $("p-titel").value; daten.klasse = $("p-klasse").value; });
}
function farbAuswahl(aktuell) {
  return `<div class="farben" id="p-farben">${Object.keys(FARBEN).map(k => `<span data-farbe="${k}" class="${k === aktuell ? "an" : ""}" style="background:${FARBEN[k]}"></span>`).join("")}</div>`;
}
function farbeVerdrahten() {
  $("p-farben").querySelectorAll("span").forEach(s => tippen(s, () => {
    $("p-farben").querySelectorAll("span").forEach(x => x.classList.remove("an")); s.classList.add("an");
  }));
}
function gewaehlteFarbe() { const s = $("p-farben").querySelector(".an"); return s ? s.dataset.farbe : "weiss"; }
function aufgabeBearbeiten(i) {
  const a = i >= 0 ? daten.aufgaben[i] : { name: "", farbe: "gelb" };
  panel(`<h3>${i >= 0 ? "Aufgabe bearbeiten" : "Neue Aufgabe"}</h3><label>Name</label><input id="p-name" value="${esc(a.name)}">
    <label>Farbe</label>${farbAuswahl(a.farbe)}
    ${i >= 0 ? `<div class="zeile"><button class="knopf" id="p-loeschen">Aufgabe löschen</button></div>` : ""}`,
    () => { const n = $("p-name").value.trim(); if (!n) return; a.name = n; a.farbe = gewaehlteFarbe(); if (i < 0) daten.aufgaben.push(a); });
  farbeVerdrahten();
  if (i >= 0) tippen($("p-loeschen"), () => { daten.aufgaben.splice(i, 1); panelZu(); zeichnen(); });
}
function postenBearbeiten() {
  const tg = daten.taschengeld;
  panel(`<h3>Taschengeld</h3>
    <label>Taschengeld pro Woche</label><input id="p-woche" value="${esc(tg.woche)}">
    ${tg.posten.map((p, i) => `<label>Abzug ${i + 1}</label><div style="display:flex;gap:0.5vw"><input id="p-n${i}" value="${esc(p.name)}"><input id="p-b${i}" value="${esc(p.betrag)}" style="width:40%"></div>`).join("")}
    <label>Pro erledigter Aufgabe (Cent)</label><input id="p-cent" value="${tg.cent || 50}" inputmode="numeric">
    <label>Satz über den Feldern</label><input id="p-satz" value="${esc(tg.satz)}">
    <label>Bonus in € bei 2 Wochen hintereinander alles geschafft (0 = kein Bonus)</label><input id="p-bonus" value="${tg.bonus == null ? 1 : tg.bonus}" inputmode="decimal">
    <label>Extra in € wenn alle 3 Lernaufgaben geschafft (0 = aus)</label><input id="p-lern" value="${tg.lernBonus == null ? 1 : tg.lernBonus}" inputmode="decimal">`,
    () => {
      tg.woche = $("p-woche").value;
      tg.posten.forEach((p, i) => { p.name = $("p-n" + i).value; p.betrag = $("p-b" + i).value; });
      tg.cent = parseInt($("p-cent").value, 10) || 50; tg.satz = $("p-satz").value;
      tg.bonus = parseFloat(String($("p-bonus").value).replace(",", ".")) || 0;
      tg.lernBonus = parseFloat(String($("p-lern").value).replace(",", ".")) || 0;
    });
}
function modus(an) {
  bearbeiten = an; document.body.classList.toggle("bearbeiten", an);
  $("b-bearbeiten").style.display = an ? "none" : ""; $("b-abbrechen").style.display = an ? "" : "none"; $("b-speichern").style.display = an ? "" : "none";
  $("b-woche").parentNode.style.display = an ? "none" : "";
  zeichnen();
  if (an) meldung("Bearbeiten: Fach, Zeit, Überschrift oder Magnet antippen");
}
tippen($("b-bearbeiten"), () => { gesichert = JSON.stringify(daten); modus(true); });
tippen($("b-abbrechen"), () => { daten = JSON.parse(gesichert); modus(false); });
tippen($("b-speichern"), async () => {
  const h = hass(); if (!h) return;
  const marke = Date.now(); daten.gespeichert = marke;
  meldung("Speichere …");
  try {
    await h.callService("script", "mucki_speichern", { daten: JSON.stringify(daten) });
    let ok = false;
    for (let i = 0; i < 6 && !ok; i++) {
      await new Promise(r => setTimeout(r, 700));
      try { const r = await fetch(DATEN_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) ok = (await r.json()).gespeichert === marke; } catch (e) { /* weiter */ }
    }
    if (ok) { meldung("Gespeichert ✓"); modus(false); }
    else meldung("⚠️ Nicht gespeichert – bitte nochmal auf Speichern tippen");
  } catch (e) { meldung("⚠️ Speichern fehlgeschlagen: " + (e && e.message || e)); }
});
// Neue Woche: zur Sicherheit zweimal tippen (kein Dialog – der Kiosk-Browser zeigt die nicht zuverlässig)
let wocheScharf = 0;
tippen($("b-woche"), () => {
  const k = $("b-woche");
  if (!felderLesen().length) return meldung("Die Felder sind schon leer");
  if (Date.now() - wocheScharf > 4000) {
    wocheScharf = Date.now(); k.textContent = "Wirklich leeren? Nochmal tippen"; k.classList.add("scharf");
    setTimeout(() => { if (Date.now() - wocheScharf >= 4000) { k.textContent = "Neue Woche"; k.classList.remove("scharf"); } }, 4100);
    return;
  }
  wocheScharf = 0; k.textContent = "Neue Woche"; k.classList.remove("scharf");
  const h = hass(); if (!h) return;
  Promise.resolve(h.callService("script", "mucki_woche_abschliessen", {}))
    .then(() => { meldung("Woche gespeichert – viel Erfolg in der neuen! 💪"); setTimeout(async () => { await verlaufLaden(); zeichneTafel(); }, 1500); })
    .catch(e => meldung("⚠️ Hat nicht geklappt: " + (e && e.message || e)));
});
tippen($("rechnung"), () => { if (bearbeiten) postenBearbeiten(); });
tippen($("schleier"), panelZu);
tippen($("titel"), () => { if (bearbeiten) kopfBearbeiten(); });
tippen($("klasse"), () => { if (bearbeiten) kopfBearbeiten(); });

// ---------- Start ----------
async function laden() {
  if (!hass()) { setTimeout(laden, 500); return; }
  try { const r = await fetch(DATEN_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) daten = await r.json(); } catch (e) { /* noch nichts gespeichert */ }
  if (!daten || !Array.isArray(daten.zeilen)) daten = JSON.parse(JSON.stringify(VORLAGE));
  await verlaufLaden();
  zeichnen();
  setInterval(async () => { if (!bearbeiten) { await verlaufLaden(); zeichneTafel(); } }, 60000);
  // Felder live halten (Handy/Laptop), um Mitternacht den neuen Tag markieren
  setInterval(() => {
    if (bearbeiten) return;
    const lk = JSON.stringify(lernenLesen(isoWoche(new Date())));
    if (felderLesen().join("|") !== letzteFelder || lk !== zeichneTafel.lern) { zeichneTafel.lern = lk; zeichneTafel(); }
    if (new Date().getDay() - 1 !== letzterTag) zeichnePlan();
  }, 800);
}
laden();
</script>
</body>
