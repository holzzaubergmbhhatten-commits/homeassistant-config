<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garten</title>
<!--
  Garten-Seite (im Flur-Dashboard als Vollbild-iframe, am Monitor und im Handy-App):
  - Plan: überdachter Garten (offen, Holzzaun + Folien-Dach, Hochbeete) und Gemüsegarten (Erdstreifen) in cm
  - Pflanzen: auswählen, was wachsen soll → Pflanzplan nach Mischkultur, Höhe (Schatten), Fruchtfolge, Platz
  - Heute: Gießen, Lüften, Frost, Düngen nach Wetter (weather.touchmonitor_home) und Pflanzkalender
  - Foto-Check / Fragen: Claude (script.garten_ki)
  Daten: /local/garten_daten.json, gespeichert über script.garten_speichern.
  Der Monitor-Browser hat keine Emoji-Schrift → nur eingebaute SVG-Symbole und Farbpunkte.
-->
<style>
  :root {
    --bg: #F2F2F7; --karte: #FFFFFF; --text: #1C1C1E; --grau: #8E8E93; --linie: #E5E5EA; --akzent: #34A853; --blau: #007AFF;
    --rot: #FF3B30; --orange: #FF9500; --holz: #D9B98C; --holz-rand: #A8834F; --erde: #6B4A2E; --erde-hell: #8A6644;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  .ic { width: 20px; height: 20px; fill: currentColor; flex: none; vertical-align: -4px; }
  .kopf { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; flex-wrap: wrap; }
  .kopf h1 { margin: 0; font-size: 24px; letter-spacing: -0.3px; }
  .reiter { display: flex; background: #E3E3E8; border-radius: 12px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; }
  .reiter button { padding: 8px 14px; border-radius: 9px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .reiter button.an { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .luecke { flex: 1; }
  .speicher { font-size: 12px; color: var(--grau); }
  main { flex: 1; overflow: auto; padding: 12px 14px 90px; -webkit-overflow-scrolling: touch; }
  .karte { background: var(--karte); border-radius: 16px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
  .karte h2 { margin: 0 0 8px; font-size: 18px; }
  .karte h3 { margin: 12px 0 6px; font-size: 15px; }
  .klein { font-size: 13px; color: var(--grau); line-height: 1.4; }
  .zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .knopf { padding: 10px 14px; border-radius: 12px; background: var(--bg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
  .knopf.voll { background: var(--akzent); color: #fff; }
  .knopf.blau { background: var(--blau); color: #fff; }
  .knopf.rot { color: var(--rot); }
  .knopf.klein-k { padding: 7px 10px; font-size: 13px; }
  .segment { display: inline-flex; background: #E3E3E8; border-radius: 10px; padding: 2px; }
  .segment button { padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .segment button.an { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  /* Plan */
  .planbox { background: transparent; border-radius: 14px; overflow: hidden; position: relative; touch-action: none; }
  .planbox svg { width: 100%; display: block; max-height: calc(100vh - 150px); }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 13px; }
  .legende span { display: inline-flex; align-items: center; gap: 5px; }
  .punkt { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .planlayout { position: relative; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .planlayout .spalte { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; align-content: start; }
  .planlayout .spalte:first-child { order: 2; } .planlayout .spalte:nth-child(3) { order: 3; }
  @media (min-width: 900px) {
    .planlayout:not(.ohne) { grid-template-columns: minmax(190px, 250px) 1fr minmax(190px, 250px); gap: 26px; align-items: center; }
    .planlayout .spalte { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; order: initial !important; }
  }
  .linien { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .schild { display: flex; gap: 9px; align-items: flex-start; background: #fff; border-radius: 14px; padding: 9px 11px; box-shadow: 0 1px 4px rgba(0,0,0,.12); cursor: pointer; position: relative; z-index: 1; }
  .schild .nr { width: 26px; height: 26px; border-radius: 50%; border: 3px solid; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none; background: #fff; }
  .schild b { font-size: 15px; } .schild .anz { color: var(--grau); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tags span { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 7px; }
  .pflanzen-liste { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 13px; margin-top: 3px; }
  .pflanzen-liste span { display: inline-flex; align-items: center; gap: 4px; }
  .pflanzen-liste .punkt { width: 9px; height: 9px; }
  .vorschlaege { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .vorschlag { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 7px 8px; }
  .vorschlag .mitte { flex: 1; min-width: 0; }
  .pflanzen-wahl { display: flex; flex-wrap: wrap; gap: 6px; }
  .pflanzen-wahl .knopf.voll .punkt { box-shadow: 0 0 0 2px #fff; }
  .familien { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 8px; }
  .familie { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .familie .kopf-f { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .punkt.gross { width: 18px; height: 18px; }
  .familie .info-f { font-size: 13px; margin-top: 5px; line-height: 1.4; }
  .folge { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
  .folge > div { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .nrf { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--akzent); color: #fff; font-weight: 800; font-size: 13px; align-items: center; justify-content: center; margin-right: 6px; }
  .farben-link { font-size: 12px; font-weight: 700; color: var(--blau); padding: 4px 9px; border-radius: 8px; background: #E8F1FF; }
  .tipp-waerme { border: 2px solid #FFD08A; }
  .liste-tipps { padding-left: 18px; margin: 6px 0; line-height: 1.5; font-size: 14px; }
  /* Pflanzenliste */
  .pliste { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .pflanze { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--bg); }
  .pflanze.gewaehlt { background: #E3F4E6; box-shadow: inset 0 0 0 2px var(--akzent); }
  .pflanze .name { font-weight: 600; font-size: 15px; }
  .pflanze .info { font-size: 12px; color: var(--grau); }
  .pflanze .mitte { flex: 1; min-width: 0; }
  .zahl { display: inline-flex; align-items: center; gap: 4px; }
  .zahl button { width: 32px; height: 32px; border-radius: 9px; background: #fff; font-size: 20px; font-weight: 700; color: var(--akzent); }
  .zahl b { min-width: 26px; text-align: center; }
  .marke { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #FFF3D6; color: #9A6200; white-space: nowrap; }
  .marke.gruen { background: #E3F4E6; color: #1E7A35; }
  /* Aufgaben */
  .aufgabe { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linie); }
  .aufgabe:last-child { border-bottom: 0; }
  .aufgabe .sym { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; color: #fff; }
  .aufgabe b { display: block; font-size: 15px; }
  .aufgabe span { font-size: 14px; color: #3C3C43; line-height: 1.4; }
  .wetter { display: flex; gap: 8px; overflow-x: auto; }
  .tag { min-width: 74px; text-align: center; background: var(--bg); border-radius: 12px; padding: 8px 6px; font-size: 13px; }
  .tag b { display: block; font-size: 16px; }
  /* Foto */
  .vorschau { max-width: 100%; max-height: 320px; border-radius: 12px; display: block; margin: 8px 0; }
  .antwort { white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
  .verlauf-foto { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linie); }
  .verlauf-foto img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; }
  textarea, input[type=text], input[type=number], select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--linie); border-radius: 12px; background: var(--bg); color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: block; font-size: 13px; color: var(--grau); font-weight: 600; margin: 10px 0 4px; }
  /* Fenster */
  .schleier { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; z-index: 10; }
  .schleier.offen { display: block; }
  .blatt { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(640px, 100%); background: #fff; border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow: auto; box-shadow: 0 -6px 30px rgba(0,0,0,.2); }
  .blatt h3 { margin: 0 0 6px; font-size: 19px; }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .meldung { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(28,28,30,.92); color: #fff; padding: 9px 16px;
    border-radius: 12px; font-size: 14px; display: none; z-index: 20; max-width: 92%; text-align: center; }
  .warten { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: dreh 0.8s linear infinite; vertical-align: -3px; }
  @keyframes dreh { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="kopf">
  <h1>Garten</h1>
  <div class="reiter" id="reiter">
    <button data-a="reiter" data-w="plan" class="an">Plan</button>
    <button data-a="reiter" data-w="pflanzen">Pflanzen</button>
    <button data-a="reiter" data-w="heute">Heute</button>
    <button data-a="reiter" data-w="foto">Foto-Check</button>
    <button data-a="reiter" data-w="wissen">Wissen</button>
  </div>
  <span class="luecke"></span>
  <span class="speicher" id="speicher"></span>
</div>
<main id="inhalt"></main>
<div class="schleier" id="schleier"><div class="blatt" id="blatt"></div></div>
<div class="meldung" id="meldung"></div>

  wind: "M4,10A1,1 0 0,1 3,9A1,1 0 0,1 4,8H12A2,2 0 0,0 14,6A2,2 0 0,0 12,4C11.45,4 10.95,4.22 10.59,4.59C10.2,5 9.56,5 9.17,4.59C8.78,4.2 8.78,3.56 9.17,3.17C9.9,2.45 10.9,2 12,2A4,4 0 0,1 16,6A4,4 0 0,1 12,10H4M19,12A1,1 0 0,0 20,11A1,1 0 0,0 19,10C18.72,10 18.47,10.11 18.29,10.29C17.9,10.68 17.27,10.68 16.88,10.29C16.5,9.9 16.5,9.27 16.88,8.88C17.42,8.34 18.17,8 19,8A3,3 0 0,1 22,11A3,3 0 0,1 19,14H5A1,1 0 0,1 4,13A1,1 0 0,1 5,12H19M18,18H4A1,1 0 0,1 3,17A1,1 0 0,1 4,16H18A3,3 0 0,1 21,19A3,3 0 0,1 18,22C17.17,22 16.42,21.66 15.88,21.12C15.5,20.73 15.5,20.1 15.88,19.71C16.27,19.32 16.9,19.32 17.29,19.71C17.47,19.89 17.72,20 18,20A1,1 0 0,0 19,19A1,1 0 0,0 18,18Z",

};
const ic = (n, f) => `<svg class="ic" viewBox="0 0 24 24"><path fill="${f || "currentColor"}" d="${ICON[n]}"/></svg>`;

// ================= Pflanzen-Wissen (Norddeutschland) =================
// fam = Familie (Fruchtfolge), zehrer = Nährstoffbedarf, reihe/abstand = cm, hoehe = cm,
// gh: "bevorzugt" (gehört unters Dach – Regenschutz) | "geeignet" (beides) | "draussen",

// vorziehen/draussen/gh = Monate (Aussaat/Pflanzung), ernte = Monate, wasser 1–3, frost = frostempfindlich
const P = (id, name, fam, zehrer, reihe, abstand, hoehe, gh, vorziehen, draussen, ghm, ernte, wasser, frost, gut, schlecht, duenger, tipp) =>
  ({ id, name, fam, zehrer, reihe, abstand, hoehe, gh, vorziehen, draussen, ghm, ernte, wasser, frost, gut, schlecht, duenger, tipp });

    ["kartoffel", "erbse", "fenchel", "gurke"], "Beim Pflanzen 3 l Kompost je Pflanze, ab der ersten Blüte alle 2 Wochen Tomatendünger oder Brennnesseljauche (1:10).",

// Platzbedarf: Reihen quer zum Beet, Länge entlang des Beets
function bedarf(pf, anzahl, b) {
  const reihen = Math.max(1, Math.floor(breit(b) / pf.reihe));
  return Math.ceil(anzahl / reihen) * pf.abstand;
}
// Norden = oben im Plan (wie Google Earth): hohe Pflanzen nach Norden, damit sie nichts beschatten
function nordWert(b) {
  const alle = alleBeete().flatMap(x => x.linie), ys = alle.map(q => q[1]), y1 = Math.min(...ys), y2 = Math.max(...ys);
  const cy = b.linie.reduce((s, q) => s + q[1], 0) / b.linie.length;
  return y2 > y1 ? (y2 - cy) / (y2 - y1) : 0.5;
}
function passtInsBeet(pf, b, m) {
  const ber = b.bereich === "gh";
  if (pf.gh === "bevorzugt") return ber ? 3 : (pf.draussen.length ? -1 : -9);
  if (pf.gh === "draussen") return ber ? -6 : 2;
  // große Pflanzen (Kürbis, Zucchini) lieber draußen – sie nehmen unter dem Dach zu viel Platz weg
  if (pf.abstand >= 80) return ber ? -1 : 2;
  // geeignet: im Winterhalbjahr lieber unters Dach (trocken), im Sommer lieber draußen
  const winter = m >= 9 || m <= 3;
  return ber ? (winter ? 2 : 0) : (winter ? 0 : 1);
}
// Fruchtfolge: dieselbe Familie wie im Vorjahr (oder vor 2 Jahren) im selben Beet vermeiden,
// nach Starkzehrern lieber Mittel-/Schwachzehrer
function fruchtfolge(pf, b, jahr) {
  const h1 = daten.historie.filter(h => h.beet === b.id && h.saison === jahr - 1), h2 = daten.historie.filter(h => h.beet === b.id && h.saison === jahr - 2);
  let wert = 0, grund = "";
  if (h1.some(h => h.fam === pf.fam)) { wert -= 6; grund = `${FAMILIE[pf.fam]} stand ${jahr - 1} schon hier`; }
  else if (h2.some(h => h.fam === pf.fam)) { wert -= 2; grund = `${FAMILIE[pf.fam]} stand ${jahr - 2} hier`; }
  else if (h1.length) { wert += 1; grund = "Fruchtfolge passt"; }
  const vorherStark = h1.some(h => PF[h.pflanze]?.zehrer === "stark" || ["nacht", "kuerbis"].includes(h.fam));
  if (vorherStark && pf.zehrer === "stark") { wert -= 2; if (!grund.includes("stand")) grund = "vorher schon Starkzehrer"; }
  if (vorherStark && pf.zehrer !== "stark" && !grund.includes("stand")) { wert += 1; grund = "nach Starkzehrern gut"; }
  return { wert, grund };
}
function planErstellen() {
  const m = monat(), jahr = planSaison();
  const wunsch = Object.entries(daten.wunsch).filter(([id, n]) => PF[id] && n > 0);
  if (!wunsch.length) { meldung("Erst unter „Pflanzen“ auswählen, was wachsen soll"); return; }
  // vorherige Saison merken (Fruchtfolge)
  for (const p of daten.pflanzungen) {
    if (p.saison && p.saison < jahr && !daten.historie.some(h => h.saison === p.saison && h.beet === p.beet && h.fam === PF[p.pflanze]?.fam))
      daten.historie.push({ saison: p.saison, beet: p.beet, fam: PF[p.pflanze]?.fam, pflanze: p.pflanze });
  }
  const beete = alleBeete().filter(b => PFLANZBAR.includes(b.art));
  const frei = Object.fromEntries(beete.map(b => [b.id, lang(b)]));
  const inhalt = Object.fromEntries(beete.map(b => [b.id, []]));
  const hinweise = [];
  // große/hohe und anspruchsvolle zuerst verteilen
  const liste = wunsch.map(([id, n]) => ({ pf: PF[id], n })).sort((a, b) => (b.pf.hoehe * (b.pf.gh === "bevorzugt" ? 2 : 1)) - (a.pf.hoehe * (a.pf.gh === "bevorzugt" ? 2 : 1)));
  for (const { pf, n } of liste) {
    let rest = n;
    while (rest > 0) {
      let best = null;
      for (const b of beete) {
        const lage = passtInsBeet(pf, b, m); if (lage < -5) continue;
        const braucht = bedarf(pf, rest, b);
        const platz = frei[b.id]; if (platz < pf.abstand) continue;
        let s = lage * 3;
        const drin = inhalt[b.id];
        if (drin.length) s += nachbarn(pf.id, drin[drin.length - 1].pflanze) * 4;
        for (const x of drin) if (nachbarn(pf.id, x.pflanze) < 0) s -= 3;
        // hohe Pflanzen an die Nordseite, niedrige nach Süden
        const nw = nordWert(b); s += (pf.hoehe >= 100 ? nw : pf.hoehe <= 40 ? 1 - nw : 0.5) * 3;
        s += fruchtfolge(pf, b, jahr).wert;
        if (pf.zehrer === "stark" && b.art === "hochbeet") s += 1;
        if (pf.wasser === 3 && b.wasser) s += 1;
        // wärmeliebend: in die Wärme-Ecke und an die sonnige Südseite
        if (WAERME[pf.id]) s += (b.warm ? 5 : 0) + (1 - nw) * 2;

        if (!best || s > best.s) best = { b, s };

      const reihen = Math.max(1, Math.floor(breit(best.b) / pf.reihe));
      const passen = Math.min(rest, Math.floor(frei[best.b.id] / pf.abstand) * reihen);
      if (passen <= 0) { hinweise.push(`${pf.name}: ${rest} Stück passen nicht mehr`); break; }
      const laenge = Math.ceil(passen / reihen) * pf.abstand;
      inhalt[best.b.id].push({ pflanze: pf.id, anzahl: passen, laenge });
      frei[best.b.id] -= laenge; rest -= passen;

  }

  const neu = [];
  for (const b of beete) {
    let r = ordnen(inhalt[b.id]);

// Linien von den Kärtchen zu den Pflanzen (nur wenn die Kärtchen links/rechts neben dem Plan stehen)
function linienZeichnen() {
  const lay = $("planlayout"), lin = $("linien"), svg = $("plansvg");
  if (!lay || !lin || !svg) return;
  lin.innerHTML = "";
  const box = lay.getBoundingClientRect(), pb = $("planbox").getBoundingClientRect();
  lin.setAttribute("width", box.width); lin.setAttribute("height", box.height); lin.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  if (getComputedStyle(lay).gridTemplateColumns.split(" ").length < 3) return;
  let html = "";
  lay.querySelectorAll(".schild").forEach(k => {
    const g = svg.querySelector(`circle[data-nr="${k.dataset.nr}"]`);
    if (!g) return;
    const kr = k.getBoundingClientRect(), gr = g.getBoundingClientRect();
    const links = kr.right <= pb.left + 2;
    const ax = (links ? kr.right : kr.left) - box.left, ay = kr.top + kr.height / 2 - box.top;
    const zx = gr.left + gr.width / 2 - box.left, zy = gr.top + gr.height / 2 - box.top;
    const kx = (links ? pb.left + 8 : pb.right - 8) - box.left;
    html += `<polyline points="${ax},${ay} ${kx},${ay} ${zx},${zy}" fill="none" stroke="rgba(60,60,67,.6)" stroke-width="1.5"/>`;
  });
  lin.innerHTML = html;
}

// Bearbeiten: Punkte/Erdhaufen/Häuschen ziehen; Antippen = Infos bzw. Einstellungen
function planGesten() {
  const svg = $("plansvg"); if (!svg) return;
  let zug = null, raf = 0;
  const punkt = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener("pointerdown", ev => {
    const zn = ev.target.closest("[data-zaun]"), pk = ev.target.closest("[data-punkt]"), g = ev.target.closest("[data-beet]"), el = ev.target.closest("[data-element]"), pfl = ev.target.closest("[data-pflanzung]"), gp = ev.target.closest("[data-gpunkt]");
    zug = { sx: ev.clientX, sy: ev.clientY, p: punkt(ev), punkt: pk && pk.dataset.punkt, beet: g && g.dataset.beet, element: el && el.dataset.element, pfl: pfl && pfl.dataset.pflanzung, gpunkt: gp && gp.dataset.gpunkt, zaun: zn && zn.dataset.zaun, bewegt: false };
    if (bearbeiten) {
      if (zug.gpunkt) { const [gi, i] = zug.gpunkt.split(":"); zug.gel = gelaende[+gi]; zug.gi = i; zug.ziel = zug.gel; zug.start = zug.gel.p ? zug.gel.p.map(q => q.slice()) : [zug.gel.x, zug.gel.y]; }
      else if (zug.punkt) { const [id, i] = zug.punkt.split(":"); zug.ziel = daten.karte.beete.find(b => b.id === id); zug.i = +i; zug.start = zug.ziel.p.map(q => q.slice()); }
      else if (zug.element) { zug.ziel = daten.karte.elemente.find(e => e.id === zug.element); zug.start = [zug.ziel.x, zug.ziel.y]; }
      else if (zug.beet && daten.karte.beete.some(b => b.id === zug.beet)) { zug.ziel = daten.karte.beete.find(b => b.id === zug.beet); zug.start = zug.ziel.p.map(q => q.slice()); }
      if (zug.ziel) { svg.setPointerCapture(ev.pointerId); ev.preventDefault(); }
    }
  });
  svg.addEventListener("pointermove", ev => {
    if (!zug || !zug.ziel) return;
    if (Math.hypot(ev.clientX - zug.sx, ev.clientY - zug.sy) > 6) zug.bewegt = true;
    if (!zug.bewegt) return;
    const p = punkt(ev), dx = Math.round((p.x - zug.p.x) * 10) / 10, dy = Math.round((p.y - zug.p.y) * 10) / 10;
    if (zug.gel) {
      if (zug.gi === "c") { zug.gel.x = Math.round((zug.start[0] + dx) * 10) / 10; zug.gel.y = Math.round((zug.start[1] + dy) * 10) / 10; }
      else zug.gel.p[+zug.gi] = [Math.round((zug.start[+zug.gi][0] + dx) * 10) / 10, Math.round((zug.start[+zug.gi][1] + dy) * 10) / 10];
      beeteCache = null;
    }
    else if (zug.element) { zug.ziel.x = Math.round((zug.start[0] + dx) * 10) / 10; zug.ziel.y = Math.round((zug.start[1] + dy) * 10) / 10; }
    else if (zug.punkt) zug.ziel.p[zug.i] = [Math.round((zug.start[zug.i][0] + dx) * 10) / 10, Math.round((zug.start[zug.i][1] + dy) * 10) / 10];
    else zug.ziel.p = zug.start.map(([x, y]) => [Math.round((x + dx) * 10) / 10, Math.round((y + dy) * 10) / 10]);
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; const vb = svg.viewBox.baseVal, neu = karteBauen({ x: vb.x, y: vb.y, w: vb.width, h: vb.height }).svg; svg.innerHTML = neu.replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, ""); });
  });
  const ende = ev => {
    if (!zug) return;
    const z = zug; zug = null;
    if (z.bewegt && z.gel) { gelaendeGeaendert(); zeichnePlan(); return; }
    if (z.bewegt && z.ziel) { geaendert(); zeichnePlan(); return; }
    if (Math.hypot(ev.clientX - z.sx, ev.clientY - z.sy) > 10 || !tippErlaubt()) return;
    if (bearbeiten && z.gel) { if (z.gi === "c") baumBearbeiten(gelaende.indexOf(z.gel)); }
    else if (bearbeiten && z.punkt) beetBearbeiten(z.punkt.split(":")[0], +z.punkt.split(":")[1]);
    else if (bearbeiten && z.zaun !== undefined && z.zaun !== null && !z.beet) zaunBearbeiten(+z.zaun);
    else if (bearbeiten && z.element) elementBearbeiten(z.element);
    else if (bearbeiten && z.beet) beetBearbeiten(z.beet);

// Foto verkleinern: max. 1000 px und so stark komprimiert, dass es durch Home Assistant passt (< 150 000 Zeichen)
function bildVerkleinern(datei) {
  return new Promise((ok, fehler) => {
    const url = URL.createObjectURL(datei), img = new Image();
    img.onload = () => {
      const machen = (max, q) => {
        const f = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q).split(",")[1];
      };
      let b64 = null;
      for (const [max, q] of [[1000, 0.8], [1000, 0.65], [900, 0.6], [800, 0.55], [700, 0.5], [600, 0.45]]) { b64 = machen(max, q); if (b64.length < 150000) break; }
      URL.revokeObjectURL(url);
      ok({ b64, klein: machen(140, 0.55) });
    };
    img.onerror = fehler; img.src = url;
  });
}
function kiAntwortLesen(r) {

  if (!a) return { ok: false, fehler: "Keine Antwort – vielleicht hat es zu lange gedauert. Bitte nochmal versuchen." };

}

// Eignung einer Pflanze für ein Beet (für die Vorschläge beim Antippen eines Beets)
function eignung(pf, b) {
  const m = monat(), jahr = planSaison(), drin = daten.pflanzungen.filter(p => p.beet === b.id && p.saison === jahr), gruende = [];
  let w = passtInsBeet(pf, b, m) * 2;
  if (w <= -10) return { w: -99, gruende: ["gehört unters Dach"] };
  for (const x of drin) { const n = nachbarn(pf.id, x.pflanze); if (n > 0) { w += 3; gruende.push(["gut neben " + anzeigeName(x.pflanze), "#34A853"]); } if (n < 0) { w -= 6; gruende.push(["schlecht neben " + anzeigeName(x.pflanze), "#FF3B30"]); } }
  const ff = fruchtfolge(pf, b, jahr); w += ff.wert;
  if (ff.grund) gruende.push([ff.grund, ff.wert < 0 ? "#FF3B30" : "#34A853"]);
  const monate = b.bereich === "gh" ? [...pf.ghm, ...pf.vorziehen] : [...pf.draussen, ...pf.vorziehen];
  if (monate.some(x => x === m || x === m % 12 + 1)) { w += 2; gruende.push(["jetzt pflanzen", "#34A853"]); }
  if (WAERME[pf.id] && !b.warm) { w -= b.bereich === "gh" ? 2 : 4; gruende.push(["braucht Wärme", "#FF9500"]); }
  if (pf.gh === "bevorzugt" && b.bereich === "gh") gruende.push(["mag den Regenschutz", "#007AFF"]);
  if (drin.some(x => x.pflanze === pf.id)) w -= 5;
  return { w, gruende };
}
function freiImBeet(b) {
  const drin = daten.pflanzungen.filter(p => p.beet === b.id && p.saison === planSaison());
  return Math.max(0, lang(b) - drin.reduce((s, p) => Math.max(s, p.start + p.laenge), 0));
}

        const a = await kiFragen({ art: "foto", frage, pflanze: p ? anzeigeName(p.pflanze) : "", beet: p ? beet(p.beet)?.name : "",
          bereich: p ? bereichName(beet(p.beet)) : "", wetter: wetterText(), datum: new Date().toLocaleDateString("de-DE") }, fotoDaten.b64);
        $("foto-antwort").textContent = a.ok ? a.text : "Hat nicht geklappt: " + (a.fehler || "unbekannt");
        if (a.ok) {
          daten.fotos.push({ datum: new Date().toLocaleDateString("de-DE"), pflanze: p ? anzeigeName(p.pflanze) : "", beet: p ? beet(p.beet)?.name : "", frage, text: a.text, bild: fotoDaten.klein });
          daten.fotos = daten.fotos.slice(-20); geaendert();
        }
      } catch (e) { $("foto-antwort").textContent = "Hat nicht geklappt: " + (e && e.message || e); }
      el.textContent = "Prüfen lassen"; el.disabled = false; break;
    }
    case "foto-alt": {
      const f = daten.fotos[+w]; if (!f) return;
      blatt(`<h3>${esc(f.pflanze || "Foto")} – ${esc(f.datum)}</h3>${f.bild ? `<img class="vorschau" src="data:image/jpeg;base64,${f.bild}" style="width:140px">` : ""}
        ${f.frage ? `<p><b>Frage:</b> ${esc(f.frage)}</p>` : ""}<div class="antwort">${esc(f.text)}</div>
        <div class="zeile" style="margin-top:12px"><button class="knopf voll" data-a="zu">Schließen</button></div>`);
      break;
    }
  }
}

laden();
// Wetter alle 30 Minuten neu
setInterval(() => { wetterLaden(); }, 1800000);
// Selbst-Aktualisierung: alle 5 Minuten nachsehen, ob es eine neuere Fassung dieser Seite gibt
setInterval(async () => {
  if (bearbeiten || $("schleier").classList.contains("offen")) return;
  try {
    const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/SEITEN_VERSION = (\d+)/);
    if (m && Number(m[1]) > SEITEN_VERSION) location.replace(location.pathname + "?v=" + m[1] + "&t=" + Date.now());
  } catch (e) { /* später nochmal */ }
}, 300000);
