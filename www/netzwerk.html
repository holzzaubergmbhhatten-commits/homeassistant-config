<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netzwerk</title>
<!--
  Netzwerk (Dashboard-Reiter „Netzwerk“, packages/netzwerk.yaml): alle Geräte der Integration „TP-Link Omada“.
  Switches als Frontansicht mit Ports (PoE an/aus, eigene Beschriftung), Access Points und Router mit Status und Werten.
  Port antippen → Beschriftung ändern, PoE schalten, Gerät per PoE neu starten (mit Rückfrage).
  Beschriftungen: /local/netzwerk_daten.json über script.netzwerk_speichern. Keine IP-/MAC-Adressen auf der Seite.
-->
<style>
  :root { --bg: #f7f4ed; --karte: #fff; --text: #2d3329; --grau: #6b7266; --linie: #eee8d9; --gruen: #536b45; --dunkel: #33442b;
    --sand: #d8c7a3; --sand2: #efe8d8; --terra: #c96f4a; --ok: #4f7a3a; --rot: #b3412e; --gelb: #d9a72b; }
  .dunkel { --bg: #161a13; --karte: #232a1f; --text: #efe9dc; --grau: #a9a493; --linie: #343d2e; --gruen: #a9be8f; --dunkel: #c9d8b4;
    --sand: #4a4636; --sand2: #2c3326; --ok: #8fb36f; --rot: #e0705c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Montserrat, -apple-system, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  .kopf { display: flex; align-items: center; gap: 12px; padding: 10px 14px 8px; flex-wrap: wrap; }
  .kopf h1 { margin: 0; font-size: 26px; }
  .kopf .stand { font-size: 13px; color: var(--grau); }
  main { flex: 1; overflow: auto; padding: 12px 14px 90px; -webkit-overflow-scrolling: touch; }
  .karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(51,68,43,.08); }
  .karte h2 { margin: 0; font-size: 22px; }
  .klein { font-size: 13px; color: var(--grau); line-height: 1.45; }
  .zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .punkt { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: var(--ok); box-shadow: 0 0 0 3px rgba(79,122,58,.18); }
  .punkt.aus { background: var(--rot); box-shadow: 0 0 0 3px rgba(179,65,46,.2); }
  .knopf { padding: 11px 15px; border-radius: 13px; background: var(--sand2); font-weight: 600; font-size: 15px; color: var(--dunkel); }
  .knopf.voll { background: var(--dunkel); color: #fff; } .dunkel .knopf.voll { color: #161a13; }
  .knopf.rot { background: var(--terra); color: #fff; }
  .geraete { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  /* Switch-Front */
  .front { background: #2b2f2a; border-radius: 12px; padding: 12px; margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
  .port { background: #3c423a; border-radius: 9px; padding: 6px 4px 5px; color: #e8e4d8; text-align: center; display: grid; gap: 3px; min-height: 74px; position: relative; }
  .port .nr { font-size: 11px; opacity: .75; }
  .port .buchse { width: 30px; height: 22px; margin: 0 auto; border-radius: 3px; background: #191c18; position: relative; }
  .port .buchse::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 6px; background: #3c423a; border-radius: 2px 2px 0 0; }
  .port .led { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #555; }
  .port.poe .led { background: #f2b632; box-shadow: 0 0 6px #f2b632; animation: blink 2.4s ease-in-out infinite; }
  .port.link .buchse { box-shadow: 0 0 0 2px #6fbf4a inset; }
  .port .name { font-size: 10.5px; line-height: 1.15; max-height: 2.4em; overflow: hidden; color: #fff; }
  .port .w { font-size: 10px; color: #f2b632; }
  .port.gewaehlt { outline: 3px solid var(--sand); }
  @keyframes blink { 50% { opacity: .45; } }
  .werte { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-top: 10px; }
  .wert { background: var(--bg); border-radius: 11px; padding: 7px 9px; font-size: 12px; color: var(--grau); }
  .wert b { display: block; font-size: 16px; color: var(--text); }
  .update { background: rgba(217,167,43,.18); border-radius: 10px; padding: 6px 10px; font-size: 13px; margin-top: 8px; }
  .blatt { position: fixed; left: 0; right: 0; bottom: 0; background: var(--karte); border-radius: 22px 22px 0 0; padding: 18px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); z-index: 10; max-height: 80vh; overflow: auto; }
  .blatt label { display: grid; gap: 4px; font-size: 13px; color: var(--grau); margin-top: 10px; }
  .blatt input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--linie); background: var(--bg); color: var(--text); }
  .meldung { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--dunkel); color: #fff; padding: 11px 18px; border-radius: 99px; display: none; z-index: 20; }
  .name-knopf { text-align: left; } .name-knopf .stift { font-size: 15px; opacity: .55; }
  .leer { text-align: center; padding: 40px 20px; }
</style>
<link rel="stylesheet" href="/local/hausstil.css?v=2">
</head>
<body>
<div class="kopf"><h1>Netzwerk</h1><span class="stand" id="stand"></span></div>
<main id="inhalt"><div class="leer klein">Lädt …</div></main>
<div class="meldung" id="meldung"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
const st = id => { const h = hass(); return id && h && h.states[id]; };
function meldung(t) { const m = $("meldung"); m.textContent = t; m.style.display = "block"; clearTimeout(meldung.t); meldung.t = setTimeout(() => m.style.display = "none", 4000); }
const DATEN_URL = "/local/netzwerk_daten.json";

const fwLaeuft = {};
// Port-Belegung, wie Marco sie angesagt hat (31.10.2026). Wird einmal übernommen, wo noch nichts eingetragen ist,
// danach gilt nur noch die eigene Beschriftung (am Port antippen und ändern).
const VORBELEGT = 2;   // hochzählen, wenn die Vorbelegung korrigiert wird (überschreibt nur unveränderte Einträge)
const VORBELEGUNG = [
  { modell: /SG2428P/i, art: "switch", minPorts: 20, ports: {
    1: { name: "Zuleitung draußen", notiz: "Access Points draußen" },
    2: { name: "IKEA Dirigera Hub" },
    3: { name: "Access Point HWR", dose: "HWR-Raum" },
    4: { name: "PV-Anlage", dose: "Dachboden" },
    5: { name: "Access Point Hoftor", dose: "Hoftor vorne" },
    6: { name: "Viessmann Gridbox" },
    7: { name: "Home Assistant", dose: "Küche, normale Dose" },
    8: { name: "Klingel Haustür" },
    21: { name: "Access Point Bad", dose: "Bad", notiz: "soll später in den Flur" },
    23: { name: "OC200 Controller" },
    24: { name: "Router ER605", notiz: "geht in Port 3 vom ER605" } } },
  { modell: /ER605/i, art: "router", ports: {
    1: { name: "Internet Starlink", notiz: "WAN – zum Starlink-Router" },
    2: { name: "frei (Fritzbox tot)", notiz: "Fritzbox kann raus" },
    3: { name: "Switch SG2428P", notiz: "geht in Port 24 vom Switch" } } }
];
// passende Vorbelegung: nach Modell, sonst nach Art (großer Switch / Router)
function vorlage(g) {
  return VORBELEGUNG.find(x => x.modell.test(g.modell + " " + g.name))
    || VORBELEGUNG.find(x => x.art === g.art && g.ports.length >= (x.minPorts || 1) && GERAETE.filter(y => y.art === g.art && y.ports.length >= (x.minPorts || 1)).length === 1);
}
function vorName(g, nr) { const v = vorlage(g); return v && v.ports[nr] ? v.ports[nr] : null; }
async function vorbelegen() {
  if ((daten.vorbelegt || 0) >= VORBELEGT) return;
  const alteNamen = new Set(VORBELEGUNG.flatMap(v => Object.values(v.ports).map(b => b.name)));
  let gefunden = false;
  for (const g of GERAETE) {
    const v = vorlage(g); if (!v || !g.ports.length) continue;
    gefunden = true;
    for (const [nr, b] of Object.entries(v.ports)) {
      const k = g.id + "|" + nr, alt = daten.ports[k];
      if (alt && !alteNamen.has(alt.name)) continue;   // selbst geändert → bleibt
      daten.ports[k] = Object.assign({ name: "", dose: "", notiz: "" }, b);
    }
  }
  if (!gefunden) return;   // Switch noch nicht da → später nochmal
  daten.vorbelegt = VORBELEGT;
  await speichern();
}
let GERAETE = [], daten = { ports: {}, geraete: {} }, wahl = null, letzterFinger = 0;

// ---------- Geräte finden ----------
async function finden() {
  const h = hass();
  const [reg, devs] = await Promise.all([h.callWS({ type: "config/entity_registry/list" }), h.callWS({ type: "config/device_registry/list" })]);
  const omada = reg.filter(e => e.platform === "tplink_omada" && !e.disabled_by && e.device_id && !e.entity_id.startsWith("device_tracker."));
  const nachGeraet = {};
  for (const e of omada) (nachGeraet[e.device_id] = nachGeraet[e.device_id] || []).push(e);
  GERAETE = Object.entries(nachGeraet).map(([id, ents]) => {
    const d = devs.find(x => x.id === id) || {}, modell = d.model || "", name = d.name_by_user || d.name || "Omada-Gerät";
    const ports = {};
    for (const e of ents) {
      const text = [e.original_name, e.name, e.entity_id, e.translation_key].filter(Boolean).join(" ");
      const m = text.match(/port[ _-]?(\d+)/i); if (!m) continue;
      const p = (ports[m[1]] = ports[m[1]] || { nr: +m[1], ents: [] }); p.ents.push(e.entity_id);
      if (e.entity_id.startsWith("switch.") && /poe/i.test(text)) p.poe = e.entity_id;
      else if (e.entity_id.startsWith("switch.") && !p.poe) p.poe = e.entity_id;
      if (e.entity_id.startsWith("binary_sensor.") && /link|verbind|status/i.test(text)) p.link = e.entity_id;
      if (e.entity_id.startsWith("sensor.") && /power|leistung|watt/i.test(text)) p.watt = e.entity_id;
      if (e.entity_id.startsWith("sensor.") && /speed|geschw/i.test(text)) p.tempo = e.entity_id;
      if (!p.portname && e.original_name) {
        const rest = e.original_name.replace(/port\s*\d+/ig, " ").replace(/\b(poe|leistung|power|status|link|verbindung|geschwindigkeit|speed|modus|mode|profile?|profil|aktiviert|enabled)\b/ig, " ").replace(/^[\s\-–:()]+|[\s\-–:()]+$/g, "").replace(/\s+/g, " ");
        if (rest.length > 1) p.portname = rest;
      }
    }
    const istPortlos = !Object.keys(ports).length;
    const art = /^EAP|access ?point/i.test(modell + " " + name) ? "ap" : (/^ER\d|gateway|router/i.test(modell + " " + name) ? "router" : (istPortlos ? "sonst" : "switch"));
    const update = ents.find(e => e.entity_id.startsWith("update."));
    const werte = ents.filter(e => e.entity_id.startsWith("sensor.") && !/port[ _-]?\d+/i.test([e.original_name, e.entity_id].join(" "))).map(e => e.entity_id);
    return { id, name, modell, art, ports: Object.values(ports).sort((a, b) => a.nr - b.nr), ents: ents.map(e => e.entity_id), update: update && update.entity_id, werte };
  }).sort((a, b) => ({ router: 0, switch: 1, ap: 2, sonst: 3 }[a.art] - { router: 0, switch: 1, ap: 2, sonst: 3 }[b.art]) || a.name.localeCompare(b.name, "de"));
}
async function laden() {
  try { const r = await fetch(DATEN_URL + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) daten = Object.assign({ ports: {}, geraete: {} }, await r.json()); } catch (e) { /* noch leer */ }
}
async function speichern() {
  const h = hass(); if (!h) return false;
  try { const r = await h.callWS({ type: "call_service", domain: "script", service: "netzwerk_speichern", service_data: { daten: JSON.stringify(daten) }, return_response: true });
    const a = (r && r.response) || {}; if (a.ok === false) { meldung("Nicht gespeichert: " + (a.fehler || "?")); return false; } return true;
  } catch (e) { meldung("Nicht gespeichert: " + (e.message || e)); return false; }
}

// ---------- Anzeige ----------
const online = g => g.ents.some(id => st(id) && st(id).state !== "unavailable");
function wertText(id) { const s = st(id); if (!s || ["unknown", "unavailable"].includes(s.state)) return "–"; const u = s.attributes.unit_of_measurement || ""; const v = parseFloat(s.state); return (isFinite(v) ? v.toLocaleString("de-DE", { maximumFractionDigits: 1 }) : s.state) + (u ? " " + u : ""); }
function wertName(id, g) { const s = st(id); return ((s && s.attributes.friendly_name) || id).replace(g.name, "").trim() || id; }
function portKachel(g, p) {
  const k = g.id + "|" + p.nr, b = daten.ports[k] || {}, poe = p.poe && st(p.poe) && st(p.poe).state === "on", link = p.link && st(p.link) && st(p.link).state === "on";
  const name = b.name || (vorName(g, p.nr) || {}).name || p.portname || "";
  return `<button class="port ${poe ? "poe" : ""} ${link ? "link" : ""} ${wahl === k ? "gewaehlt" : ""}" data-port="${esc(k)}"><span class="led"></span><span class="nr">${p.nr}</span><span class="buchse"></span>
    <span class="name">${esc(name || "–")}</span>${p.watt ? `<span class="w">${esc(wertText(p.watt))}</span>` : ""}</button>`;
}
function geraetKarte(g) {
  const on = online(g), ort = (daten.geraete[g.id] || {}).ort || "";
  const art = { router: "Router", switch: "Switch", ap: "Access Point", sonst: "Gerät" }[g.art];
  const u = g.update && st(g.update), upd = u && u.state === "on", laeuft = u && (u.attributes.in_progress === true || typeof u.attributes.in_progress === "number" || fwLaeuft[g.update]);
  return `<div class="karte"><div class="zeile" style="justify-content:space-between"><div><button class="name-knopf" data-umbenennen="${esc(g.id)}"><h2>${esc(g.name)} <span class="stift">✏️</span></h2></button>
      <div class="klein">${esc(art)}${g.modell ? " · " + esc(g.modell) : ""}${ort ? " · " + esc(ort) : ""}</div></div>
      <div class="zeile"><span class="punkt ${on ? "" : "aus"}"></span><b style="color:${on ? "var(--ok)" : "var(--rot)"}">${on ? "online" : "offline"}</b></div></div>
    ${g.werte.length ? `<div class="werte">${g.werte.slice(0, 8).map(id => `<div class="wert">${esc(wertName(id, g))}<b>${esc(wertText(id))}</b></div>`).join("")}</div>` : ""}
    ${upd ? `<div class="update zeile" style="justify-content:space-between"><span>${laeuft ? "⏳ Firmware wird eingespielt … (ca. 5 Minuten, Gerät ist kurz weg)" : `Neue Firmware: ${esc(u.attributes.latest_version || "")} <span class="klein">(jetzt ${esc(u.attributes.installed_version || "?")})</span>`}</span>
      ${laeuft ? "" : `<button class="knopf voll" style="padding:7px 12px;font-size:13px" data-fw="${esc(g.update)}">Jetzt einspielen</button>`}</div>` : ""}
    ${g.ports.length ? `<div class="front">${g.ports.map(p => portKachel(g, p)).join("")}</div>
      <div class="klein" style="margin-top:6px">Gelbe Lampe = PoE an (Strom übers Kabel). Port antippen zum Beschriften oder Neustarten.</div>` : ""}
    <div style="margin-top:10px"><button class="knopf" data-ort="${esc(g.id)}" style="padding:7px 12px;font-size:13px">Standort eintragen</button></div></div>`;
}
function blatt() {
  if (!wahl) return "";
  const [gid, nr] = wahl.split("|"), g = GERAETE.find(x => x.id === gid), p = g && g.ports.find(x => String(x.nr) === nr); if (!p) return "";
  const b = daten.ports[wahl] || {}, poe = p.poe && st(p.poe), an = poe && poe.state === "on";
  return `<div class="blatt"><div class="zeile" style="justify-content:space-between"><h2 style="margin:0">${esc(g.name)} · Port ${p.nr}</h2><button class="knopf" data-zu="1">Schließen</button></div>
    <label>Was hängt dran?<input id="bname" value="${esc(b.name || (vorName(g, p.nr) || {}).name || p.portname || "")}" placeholder="z. B. Kamera Hoftor, Access Point Flur"></label>
    <label>Dose / Raum<input id="bdose" value="${esc(b.dose || "")}" placeholder="z. B. Dose Büro 2, Patchfeld 7"></label>
    <label>Notiz<input id="bnotiz" value="${esc(b.notiz || "")}" placeholder="z. B. Kabel neu 2026"></label>
    <div class="zeile" style="margin-top:14px"><button class="knopf voll" data-merken="1">Speichern</button>
      ${poe ? `<button class="knopf" data-poe="${esc(p.poe)}">PoE ${an ? "ausschalten" : "einschalten"}</button>
        ${an ? `<button class="knopf rot" data-neustart="${esc(p.poe)}">Gerät neu starten</button>` : ""}` : `<span class="klein">Kein PoE-Schalter an diesem Port.</span>`}</div>
    <div class="klein" style="margin-top:8px">Neu starten = PoE 10 Sekunden aus, dann wieder an. Hilft, wenn eine Kamera oder ein Access Point hängt.</div></div>`;
}
function zeichnen() {
  const h = hass();
  if (!GERAETE.length) {
    $("inhalt").innerHTML = `<div class="karte leer"><h2>Noch keine Omada-Geräte</h2><p class="klein">Sobald in Home Assistant die Integration „TP-Link Omada“ eingerichtet ist,
      erscheinen hier alle Switches mit ihren Ports, die Access Points und der Router – automatisch.<br><br>
      Einstellungen → Geräte &amp; Dienste → Integration hinzufügen → „TP-Link Omada“ → Adresse des Controllers, eigener Benutzer, „SSL prüfen“ aus.</p>
      <p><button class="knopf voll" data-suchen="1">Adresse des Controllers suchen</button></p><div id="suchergebnis" class="klein"></div></div>`;
    return;
  }
  const weg = GERAETE.filter(g => !online(g));
  $("stand").textContent = `${GERAETE.length} Geräte · ${weg.length ? weg.length + " offline" : "alle online"}`;
  const fw = GERAETE.filter(g => g.update && st(g.update) && st(g.update).state === "on");
  const fwText = fw.length ? `<div class="karte zeile" style="justify-content:space-between;border-color:var(--gelb)"><div><b>📡 Neue Firmware für ${fw.length} ${fw.length === 1 ? "Gerät" : "Geräte"}</b>
      <div class="klein">Nacheinander: erst Access Points, dann Switch, Router zuletzt. Pro Gerät ca. 5 Minuten, das jeweilige Gerät ist kurz weg.${st("input_boolean.netzwerk_update_nachts") && st("input_boolean.netzwerk_update_nachts").state === "on" ? " <b>Geplant für heute Nacht 2:30 Uhr.</b>" : ""}</div></div>
      <div class="zeile"><button class="knopf voll" data-fwalle="1">Alle einspielen</button><button class="knopf" data-fwnacht="1">Heute Nacht</button></div></div>` : "";
  $("inhalt").innerHTML = fwText + (weg.length ? `<div class="karte" style="border-color:var(--terra)"><b style="color:var(--rot)">Nicht erreichbar:</b> ${weg.map(g => esc(g.name)).join(", ")}</div>` : "")
    + `<div class="geraete">${GERAETE.map(geraetKarte).join("")}</div>` + blatt();
}

// ---------- Bedienung (Monitor meldet Finger doppelt → nur einmal auswerten) ----------
async function aktion(t) {
  const h = hass();
  if (t.dataset.suchen) {
    $("suchergebnis").textContent = "Sucht im Heimnetz … (ca. 20 Sekunden)";
    try { const r = await h.callWS({ type: "call_service", domain: "script", service: "netzwerk_controller_suchen", service_data: {}, return_response: true });
      const a = (r && r.response) || {}, g = a.gefunden || [];
      $("suchergebnis").innerHTML = g.length ? `Gefunden: <b>${g.map(x => esc(x.url)).join(" oder ")}</b> – diese Adresse bei „Host“ eintragen (SSL prüfen: aus). Steht auch in Telegram.`
        : `Nichts gefunden${a.fehler ? " (" + esc(a.fehler) + ")" : ""}. Ist die OC200 eingeschaltet und im selben Netz wie Home Assistant?`;
    } catch (e) { $("suchergebnis").textContent = "Fehler: " + (e.message || e); }
    return;
  }
  if (t.dataset.umbenennen) {
    const g = GERAETE.find(x => x.id === t.dataset.umbenennen);
    const neu = prompt(`Neuer Name für „${g.name}“ (z. B. „Access Point Flur“):`, g.name); if (neu == null || !neu.trim() || neu.trim() === g.name) return;
    try { await h.callWS({ type: "config/device_registry/update", device_id: g.id, name_by_user: neu.trim() }); g.name = neu.trim(); meldung("Umbenannt"); zeichnen(); finden().then(zeichnen).catch(() => {}); }
    catch (e) { meldung("Nicht umbenannt: " + (e.message || e)); }
    return;
  }
  if (t.dataset.fw) {
    const g = GERAETE.find(x => x.update === t.dataset.fw);
    if (!confirm(`Firmware für „${g.name}“ jetzt einspielen?\n\nDas Gerät startet dabei neu und ist ca. 5 Minuten weg${g.art === "router" ? " (Internet weg!)" : g.art === "ap" ? " (WLAN an diesem Access Point)" : g.art === "switch" ? " (alles, was am Switch hängt)" : ""}.`)) return;
    fwLaeuft[t.dataset.fw] = true; zeichnen();
