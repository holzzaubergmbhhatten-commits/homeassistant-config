<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wartung</title>
<!--
  Wartungskalender (Reiter "Wartung" im Flur-Dashboard). Die Aufgaben kommen von der Wartungsseite des
  Haus-Handbuchs (sensor.wartung, packages/wartung.yaml), "erledigt" merkt sich Home Assistant.
-->
<style>
  :root { --bg: #F2F2F7; --karte: #fff; --text: #1C1C1E; --grau: #8E8E93; --gruen: #34C759; --rot: #FF3B30; --orange: #FF9500; --blau: #007AFF; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", system-ui, sans-serif; }
  body { overflow: auto; touch-action: manipulation; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  .ic { width: 18px; height: 18px; fill: currentColor; vertical-align: -3px; flex: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
  .kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kopf h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; }
  .kopf .klein { flex: 1; }
  .klein { font-size: 13px; color: var(--grau); line-height: 1.4; }
  .knopf { padding: 9px 14px; border-radius: 12px; background: var(--karte); font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .knopf.gruen { background: var(--gruen); color: #fff; box-shadow: none; }
  .knopf.leise { background: var(--bg); box-shadow: none; }
  .zahlen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 10px; }
  .zahlen div { background: var(--karte); border-radius: 14px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .zahlen b { display: block; font-size: 26px; }
  .zahlen span { font-size: 13px; color: var(--grau); }
  .filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .filter button { padding: 7px 12px; border-radius: 16px; background: #E3E3E8; font-size: 14px; font-weight: 600; }
  .filter button.an { background: var(--text); color: #fff; }
  .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .aufgabe { background: var(--karte); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; gap: 12px; }
  .punkt { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: none; background: #C7C7CC; }
  .aufgabe b { font-size: 16px; }
  .zustand { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .hinweis { font-size: 13px; color: var(--grau); margin-top: 4px; line-height: 1.4; }
  .aktionen { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .aktionen .knopf { padding: 7px 10px; font-size: 13px; }
  .aktionen input[type=date] { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #D1D1D6; border-radius: 10px; background: #fff; }
  .meldung { background: #FFF4E5; color: #8A5300; border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-size: 14px; }
  .leer { text-align: center; padding: 40px 10px; color: var(--grau); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(28,28,30,.92); color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>
<main id="inhalt"></main>
<div class="toast" id="toast"></div>
<script>
const SEITEN_VERSION = 1;
const SENSOR = "sensor.wartung";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const ICON = {
  haken: "M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z",
  zurueck: "M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z",
  neu: "M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z",
  kalender: "M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H18V1M17,12H12V17H17V12Z",
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
function toast(t) { const m = $("toast"); m.textContent = t; m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 3000); }
const STATUS = {
  ueberfaellig: ["#FF3B30", 0], jetzt: ["#FF9500", 1], bald: ["#FFCC00", 2], ohne: ["#C7C7CC", 3], ok: ["#34C759", 4],
};
const datum = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
function zustandText(a) {
  if (a.status === "ueberfaellig") return `überfällig seit ${-a.tage} Tag${a.tage === -1 ? "" : "en"}`;
  if (a.status === "jetzt") return "jetzt dran (passende Jahreszeit)";
  if (a.status === "bald") return a.tage === 0 ? "heute fällig" : `fällig in ${a.tage} Tag${a.tage === 1 ? "" : "en"} (${datum(a.faellig_am)})`;
  if (a.status === "ok") return `erledigt am ${datum(a.zuletzt)} · nächstes Mal ${datum(a.faellig_am)}`;
  return "noch nie eingetragen";
}
let filter = "Alle", letzter = "", datumOffen = null;
function zeichnen(erzwingen) {
  const h = hass(); if (!h) return;
  const s = h.states[SENSOR], at = (s && s.attributes) || {};
  const sig = JSON.stringify([at.alle, at.fehler, at.stand, filter, datumOffen]);
  if (!erzwingen && sig === letzter) return;
  letzter = sig;
  const alle = (at.alle || []).slice().sort((a, b) => STATUS[a.status][1] - STATUS[b.status][1] || (a.tage ?? 9999) - (b.tage ?? 9999));
  const zahl = st => alle.filter(a => a.status === st).length;
  const bereiche = [...new Set(alle.map(a => a.bereich))];
  const sicht = alle.filter(a => filter === "Alle" || a.bereich === filter);
  $("inhalt").innerHTML = `
    <div class="kopf"><h1>Wartung</h1>
      <span class="klein">Aufgaben aus dem Haus-Handbuch${at.stand ? ` · Stand ${esc(at.stand)}` : ""}. „Erledigt“ antippen – dann rechnet Home Assistant das nächste Mal aus.</span>
      <button class="knopf" data-a="neu">${ic("neu")} Neu einlesen</button></div>
    ${at.fehler ? `<div class="meldung">${esc(at.fehler)}${alle.length ? " – es gilt die zuletzt gelesene Liste." : " – bitte prüfen, ob der Link zur Infos-Seite eingetragen ist."}</div>` : ""}
    <div class="zahlen">
      <div><b style="color:var(--rot)">${zahl("ueberfaellig")}</b><span>überfällig</span></div>
      <div><b style="color:var(--orange)">${zahl("jetzt") + zahl("bald")}</b><span>jetzt / bald dran</span></div>
      <div><b style="color:var(--gruen)">${zahl("ok")}</b><span>in Ordnung</span></div>
      <div><b style="color:var(--grau)">${zahl("ohne")}</b><span>noch nie eingetragen</span></div>
    </div>
    ${zahl("ohne") ? `<p class="klein">Tipp: Bei „noch nie eingetragen“ einmal „Erledigt am …“ mit dem ungefähren letzten Datum eintragen – dann weiß Home Assistant, wann es wieder dran ist.</p>` : ""}
    <div class="filter">${["Alle", ...bereiche].map(b => `<button data-a="filter" data-w="${esc(b)}" class="${b === filter ? "an" : ""}">${esc(b)}</button>`).join("")}</div>
    ${sicht.length ? `<div class="liste">${sicht.map(a => `
      <div class="aufgabe"><span class="punkt" style="background:${STATUS[a.status][0]}"></span><div style="flex:1">
        <b>${esc(a.titel)}</b>
        <div class="zustand" style="color:${a.status === "ok" ? "var(--grau)" : STATUS[a.status][0] === "#FFCC00" ? "#B38F00" : STATUS[a.status][0]}">${esc(zustandText(a))}</div>
        <div class="hinweis">${esc(a.bereich)} · alle ${a.intervall} Monat${a.intervall === 1 ? "" : "e"}${a.hinweis ? " · " + esc(a.hinweis) : ""}</div>
        <div class="aktionen">
          ${a.status === "ok" ? "" : `<button class="knopf gruen" data-a="erledigt" data-w="${esc(a.key)}">${ic("haken")} Heute erledigt</button>`}
          ${datumOffen === a.key ? `<input type="date" id="datum-${esc(a.key)}" max="${new Date().toISOString().slice(0, 10)}" value="${a.zuletzt || new Date().toISOString().slice(0, 10)}">
            <button class="knopf" data-a="datum-ok" data-w="${esc(a.key)}">OK</button>`
            : `<button class="knopf leise" data-a="datum" data-w="${esc(a.key)}">${ic("kalender")} Erledigt am …</button>`}
          ${a.zuletzt ? `<button class="knopf leise" data-a="zurueck" data-w="${esc(a.key)}">${ic("zurueck")} Zurücknehmen</button>` : ""}
        </div></div></div>`).join("")}</div>`
      : `<div class="leer">${alle.length ? "In diesem Bereich steht nichts an." : "Noch keine Aufgaben gelesen – „Neu einlesen“ antippen."}</div>`}`;
}
async function schicken(daten, text) {
  const h = hass(); if (!h) return;
  try {
    const r = await h.callWS({ type: "call_service", domain: "script", service: "wartung_erledigt", service_data: daten, return_response: true });
    const a = (r && r.response) || {};
    toast(a.ok === false || a.ok === "False" ? "Hat nicht geklappt: " + (a.fehler || "") : text);
  } catch (e) { toast("Hat nicht geklappt: " + (e && e.message || e)); }
}
// Kiosk-Touchscreen: doppelte "Geister-Klicks" und Wischen nicht als Tippen werten
let letzterTipp = 0, tippStart = null;
document.addEventListener("pointerdown", ev => { tippStart = { x: ev.clientX, y: ev.clientY }; }, true);
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  if (tippStart && Math.hypot(ev.clientX - tippStart.x, ev.clientY - tippStart.y) > 12) return;
  if (Date.now() - letzterTipp < 450) return; letzterTipp = Date.now();
  const w = el.dataset.w;
  switch (el.dataset.a) {
    case "filter": filter = w; zeichnen(true); break;
    case "erledigt": await schicken({ key: w, datum: "heute" }, "Erledigt ✓ – nächstes Mal wird berechnet"); break;
    case "datum": datumOffen = w; zeichnen(true); break;
    case "datum-ok": { const v = $("datum-" + w).value; datumOffen = null; if (v) await schicken({ key: w, datum: v }, "Gespeichert ✓"); else zeichnen(true); break; }
    case "zurueck":
      if (el.dataset.scharf !== "1") { el.dataset.scharf = "1"; el.textContent = "Wirklich zurücknehmen?"; return; }
      await schicken({ key: w, offen: true }, "Zurückgenommen"); break;
    case "neu": { const h = hass(); if (h) { await h.callService("script", "wartung_neu_laden", {}); toast("Wird neu eingelesen …"); } break; }
  }
});
function start() { if (!hass()) { setTimeout(start, 400); return; } zeichnen(true); setInterval(() => zeichnen(false), 1500); }
start();
// neue Version der Seite automatisch laden
setInterval(async () => {
  try {
    const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/SEITEN_VERSION = (\d+)/);
    if (m && Number(m[1]) > SEITEN_VERSION) location.replace(location.pathname + "?v=" + m[1] + "&t=" + Date.now());
  } catch (e) { /* später nochmal */ }
}, 300000);
</script>
</body>
</html>
