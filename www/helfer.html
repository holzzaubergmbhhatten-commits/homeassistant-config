<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Emoji-Schrift: der Flur-Monitor hat selbst keine und zeigt sonst Kästchen -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helfer</title>
<!--
  Helfer-Seite für Oma & Opa (Flur-Monitor → Knopf „🧰 Helfer“). Große Kacheln mit leichten Aufgaben, jede mit Schritten und Fotos.
  Aufgaben-Texte: claude_tools/helfer_vorlage.json · Fotos/erledigt: script.helfer_* (packages/helfer.yaml).
  „Jetzt dran“ kommt aus dem Wartungskalender (sensor.wartung) bzw. aus den Monaten der Aufgabe.
-->
<style>
  :root { --bg: #F2F2F7; --karte: #fff; --text: #1C1C1E; --grau: #6E6E73; --linie: rgba(0,0,0,.1);
    --gruen: #34C759; --orange: #FF9500; --rot: #FF3B30; --blau: #536b45; }
  .dunkel { --bg: #000; --karte: #1C1C1E; --text: #F2F2F7; --grau: #A1A1A6; --linie: rgba(255,255,255,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", system-ui, sans-serif, "Noto Color Emoji"; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 32px; margin: 4px 0 4px; }
  .unter { font-size: 18px; color: var(--grau); margin: 0 0 18px; }
  h2 { font-size: 22px; margin: 22px 0 10px; }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .kachel { background: var(--karte); border-radius: 22px; padding: 18px; text-align: left; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    display: flex; flex-direction: column; gap: 8px; min-height: 150px; border: 3px solid transparent; }
  .kachel.dran { border-color: var(--orange); }
  .kachel .ic { font-size: 44px; line-height: 1; }
  .kachel b { font-size: 21px; line-height: 1.25; }
  .kachel span { font-size: 16px; color: var(--grau); }
  .marke { display: inline-block; font-size: 14px; font-weight: 700; padding: 3px 10px; border-radius: 99px; align-self: flex-start; }
  .marke.dran { background: rgba(255,149,0,.18); color: #b86e00; }
  .marke.ok { background: rgba(52,199,89,.18); color: #1f8a3b; }
  .dunkel .marke.dran { color: #FFB340; } .dunkel .marke.ok { color: #63e083; }
  .leer { background: var(--karte); border-radius: 18px; padding: 18px; font-size: 19px; }
  /* Detail */
  .zurueck { font-size: 20px; font-weight: 600; padding: 10px 16px; border-radius: 14px; background: var(--karte); margin-bottom: 14px; }
  .kopf { display: flex; gap: 14px; align-items: center; }
  .kopf .ic { font-size: 56px; }
  .infos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 14px 0; }
  .info { background: var(--karte); border-radius: 16px; padding: 12px 14px; font-size: 18px; }
  .info small { display: block; color: var(--grau); font-size: 14px; }
  .vorsicht { background: rgba(255,59,48,.12); border-radius: 16px; padding: 12px 14px; font-size: 18px; margin: 10px 0; }
  .schritt { background: var(--karte); border-radius: 20px; padding: 16px; margin: 12px 0; display: grid; grid-template-columns: 56px 1fr; gap: 14px; }
  .nr { width: 52px; height: 52px; border-radius: 50%; background: var(--blau); color: #fff; font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .text { font-size: 21px; line-height: 1.4; }
  .foto { margin-top: 10px; }
  .foto img { max-width: 100%; max-height: 420px; border-radius: 14px; display: block; }
  .fotoknopf { margin-top: 8px; font-size: 15px; color: var(--grau); padding: 6px 10px; border-radius: 10px; background: var(--bg); }
  .erledigt { width: 100%; font-size: 26px; font-weight: 700; padding: 22px; border-radius: 22px; background: var(--gruen); color: #fff; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1C1C1E; color: #fff; padding: 14px 20px;
    border-radius: 16px; font-size: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 9; }
  .dialog { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 8; padding: 16px; }
  .dialog > div { background: var(--karte); border-radius: 22px; padding: 22px; max-width: 460px; width: 100%; font-size: 21px; }
  .dialog .knoepfe { display: flex; gap: 10px; margin-top: 18px; }
  .dialog button { flex: 1; font-size: 21px; font-weight: 700; padding: 16px; border-radius: 16px; background: var(--bg); }
  .dialog button.ja { background: var(--gruen); color: #fff; }
</style>
</head>
<body>
<main id="inhalt"><div class="leer">Lade …</div></main>
<input type="file" id="datei" accept="image/*" style="display:none">
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function hass() { try { return window.parent.document.querySelector("home-assistant").hass; } catch (e) { return null; } }
let D = null, offen = null, fotoZiel = null;
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

async function skript(name, daten) {
  const r = await hass().callWS({ type: "call_service", domain: "script", service: name, service_data: daten || {}, return_response: true });
  return (r && r.response) || {};
}
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3500); }

function wartung(key) {
  const s = hass() && hass().states["sensor.wartung"];
  return key && s ? ((s.attributes.alle || []).find(w => w.key === key) || null) : null;
}
function status(a) {        // dran | bald | ok
  if (a.wartung) {
    const w = wartung(a.wartung);
    if (!w) return "ok";
    if (w.status === "jetzt" || w.status === "ueberfaellig") return "dran";
    if (w.status === "bald") return "bald";
    return "ok";
  }
  if (a.muell) return "dran";
  const m = new Date().getMonth() + 1, z = D.zuletzt[a.id], tageHer = z ? (Date.now() - new Date(z)) / 864e5 : Infinity;
  if (a.monate && !a.monate.includes(m)) return "ok";
  if (a.tage) return tageHer >= a.tage ? "dran" : "ok";
  if (a.monate) return tageHer > 90 ? "dran" : "ok";
  return "ok";
}
function hinweisZeit(a) {
  const z = D.zuletzt[a.id];
  if (a.wartung) { const w = wartung(a.wartung); if (w && w.zuletzt) return "zuletzt " + new Date(w.zuletzt).toLocaleDateString("de-DE"); }
  if (z) return "zuletzt " + new Date(z).toLocaleDateString("de-DE");
  if (a.monate && a.monate.length <= 4) return "dran im " + a.monate.map(m => MONATE[m - 1]).join(" / ");
  if (a.tage) return "etwa alle " + (a.tage >= 28 ? Math.round(a.tage / 30) + " Monat(e)" : a.tage + " Tage");
  return "";
}
function kachel(a) {
  const s = status(a);
  return `<button class="kachel ${s === "dran" ? "dran" : ""}" data-auf="${esc(a.id)}">
    <div class="ic">${a.icon || "🧰"}</div><b>${esc(a.titel)}</b>
    <span>${esc(a.dauer || "")}</span>
    ${s === "dran" ? `<span class="marke dran">Jetzt dran</span>` : s === "bald" ? `<span class="marke dran">Bald dran</span>` : `<span class="marke ok">${esc(hinweisZeit(a) || "alles gut")}</span>`}
  </button>`;
}
// Mülltonne: kommt von selbst aus dem Müllkalender (sensor.muell) und verschwindet wieder, wenn sie erledigt oder nicht mehr dran ist
function muellAufgabe() {
  const s = hass() && hass().states["sensor.muell"]; if (!s) return null;
  const namen = l => (l || []).map(x => typeof x === "string" ? x : (x.art || x.name || "")).filter(Boolean);
  const heute = namen(s.attributes.heute), morgen = namen(s.attributes.morgen), h = new Date().getHours();
  const tag = d => d.toISOString().slice(0, 10), jetzt = new Date(), mo = new Date(Date.now() + 864e5);
  let art = null, tonnen = [], datum = "";
  if (heute.length && h >= 12) { art = "rein"; tonnen = heute; datum = tag(jetzt); }
  else if (heute.length && h < 10) { art = "raus"; tonnen = heute; datum = tag(jetzt); }
  else if (morgen.length) { art = "raus"; tonnen = morgen; datum = tag(mo); }
  if (!art) return null;
  const id = `muell-${art}-${datum}`;
  if (D.zuletzt[id]) return null;
  const liste = tonnen.join(", ");
  return art === "raus"
    ? { id, muell: true, fotoId: "muell", icon: "🗑️", dauer: "ca. 5 Minuten", brauchen: liste,
        titel: `Mülltonne rausstellen: ${liste}`,
        schritte: [`Diese Tonne(n) an die Straße stellen: ${liste} (siehe Foto).`, "Deckel zu, Griff zeigt zum Haus.",
          "Wird morgen früh abgeholt – heute Abend rausstellen reicht."], vorsicht: "" }
    : { id, muell: true, fotoId: "muell", icon: "🗑️", dauer: "ca. 5 Minuten", brauchen: liste,
        titel: `Mülltonne wieder reinholen: ${liste}`,
        schritte: [`Die geleerte(n) Tonne(n) wieder an ihren Platz stellen: ${liste}.`], vorsicht: "" };
}
function alleAufgaben() { const m = muellAufgabe(); return (m ? [m] : []).concat(D.aufgaben); }
function liste() {
  const alle = alleAufgaben();
  const dran = alle.filter(a => status(a) !== "ok"), rest = alle.filter(a => status(a) === "ok");
  $("inhalt").innerHTML = `<h1>🧰 Helfer</h1><p class="unter">Danke für eure Hilfe! Antippen, dann steht da genau, was zu tun ist.</p>
    <h2>Jetzt dran</h2>
    ${dran.length ? `<div class="kacheln">${dran.map(kachel).join("")}</div>` : `<div class="leer">Gerade ist nichts dringend. 👍</div>`}
    <h2>Alle Aufgaben</h2><div class="kacheln">${rest.map(kachel).join("")}</div>`;
}
function fotoBlock(a, nr) {
  const name = D.fotos[(a.fotoId || a.id) + "/" + nr];
  return `<div class="foto">${name ? `<img src="/local/helfer/${esc(name)}" alt="">` : ""}
    <button class="fotoknopf" data-foto="${nr}">📷 ${name ? "Foto ersetzen" : "Foto hinzufügen"}</button>
    ${name ? `<button class="fotoknopf" data-fotoweg="${nr}">✕ Foto weg</button>` : ""}</div>`;
}
function detail() {
  const a = alleAufgaben().find(x => x.id === offen); if (!a) { offen = null; return liste(); }
  $("inhalt").innerHTML = `<button class="zurueck" data-zurueck="1">← Alle Aufgaben</button>
    <div class="kopf"><div class="ic">${a.icon || "🧰"}</div><h1>${esc(a.titel)}</h1></div>
    <div class="infos"><div class="info"><small>Dauer</small>${esc(a.dauer || "–")}</div>
      <div class="info"><small>Das braucht ihr</small>${esc(a.brauchen || "–")}</div>
      <div class="info"><small>Stand</small>${esc(hinweisZeit(a) || "noch nie abgehakt")}</div></div>
    ${a.vorsicht ? `<div class="vorsicht">⚠️ ${esc(a.vorsicht)}</div>` : ""}
    <div class="schritt"><div class="nr">📍</div><div><div class="text">Hier ist es:</div>${fotoBlock(a, 0)}</div></div>
    ${a.schritte.map((t, i) => `<div class="schritt"><div class="nr">${i + 1}</div><div><div class="text">${esc(t)}</div>${fotoBlock(a, i + 1)}</div></div>`).join("")}
    <button class="erledigt" data-erledigt="1">✅ Erledigt</button>`;
  window.scrollTo(0, 0);
}
function zeichnen() { if (!D) return; offen ? detail() : liste(); }

function frage(text, ja) {
  const d = document.createElement("div"); d.className = "dialog";
  d.innerHTML = `<div>${esc(text)}<div class="knoepfe"><button data-x="nein">Noch nicht</button><button class="ja" data-x="ja">Ja, fertig</button></div></div>`;
  d.addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; d.remove(); if (b.dataset.x === "ja") ja(); });
  document.body.appendChild(d);
}
async function erledigt() {
  const a = alleAufgaben().find(x => x.id === offen);
  frage(`„${a.titel}“ ist fertig?`, async () => {
    try {
      await skript("helfer_erledigt", { aufgabe: a.id, titel: a.titel, wartung: a.wartung || "" });
      D.zuletzt[a.id] = new Date().toISOString().slice(0, 10);
      toast("Danke! Marco und Mirka wissen Bescheid. 👍");
      offen = null; setTimeout(laden, 1500); zeichnen();
    } catch (e) { toast("Ging nicht – bitte Marco Bescheid sagen."); }
  });
}
function bildVerkleinern(datei) {
  return new Promise((ok, fehl) => {
    const img = new Image(), url = URL.createObjectURL(datei);
    img.onload = () => {
      const f = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = fehl; img.src = url;
  });
}
async function fotoHochladen(datei) {
  const [aufgabe, schritt] = fotoZiel; toast("Foto wird gespeichert …");
  try {
    const b64 = await bildVerkleinern(datei), S = 150000, n = Math.ceil(b64.length / S);
    let r = {};
    for (let i = 0; i < n; i++) {
      r = await skript("helfer_foto", { aufgabe, schritt, teil: i, letzt: i === n - 1, daten: b64.slice(i * S, (i + 1) * S) });
      if (r.ok === false) throw new Error(r.fehler);
    }
    D.fotos[aufgabe + "/" + schritt] = r.foto; zeichnen(); toast("Foto gespeichert. 📷");
  } catch (e) { toast("Foto ging nicht: " + (e.message || e)); }
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-auf],[data-zurueck],[data-erledigt],[data-foto],[data-fotoweg]"); if (!t) return;
  if (t.dataset.auf) { offen = t.dataset.auf; zeichnen(); }
  else if (t.dataset.zurueck) { offen = null; zeichnen(); window.scrollTo(0, 0); }
  else if (t.dataset.erledigt) erledigt();
  else if (t.dataset.foto) { const a = alleAufgaben().find(x => x.id === offen); fotoZiel = [(a && a.fotoId) || offen, +t.dataset.foto]; $("datei").value = ""; $("datei").click(); }
  else if (t.dataset.fotoweg) {
    const a = alleAufgaben().find(x => x.id === offen), fid = (a && a.fotoId) || offen;
    frage("Dieses Foto entfernen?", async () => { await skript("helfer_foto_weg", { aufgabe: fid, schritt: +t.dataset.fotoweg });
      delete D.fotos[fid + "/" + t.dataset.fotoweg]; zeichnen(); });
  }
});
$("datei").addEventListener("change", ev => { const f = ev.target.files[0]; if (f && fotoZiel) fotoHochladen(f); });
async function laden() {
  try { const r = await skript("helfer_daten"); if (r.ok) { D = r; zeichnen(); } else $("inhalt").innerHTML = `<div class="leer">Fehler: ${esc(r.fehler)}</div>`; }
  catch (e) { $("inhalt").innerHTML = `<div class="leer">Konnte nicht laden: ${esc(e.message || e)}</div>`; }
}
let versuche = 0;
function start() {
  const h = hass();
  if (!h) { if (++versuche < 40) setTimeout(start, 300); else $("inhalt").innerHTML = `<div class="leer">Die Seite funktioniert nur im Dashboard.</div>`; return; }
  document.documentElement.classList.toggle("dunkel", !!(h.themes && h.themes.darkMode));
  laden();
  setInterval(() => { if (!offen && !document.querySelector(".dialog")) zeichnen(); }, 60000);
}
start();
</script>
</body>
</html>
