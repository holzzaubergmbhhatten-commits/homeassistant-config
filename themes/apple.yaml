# Apple-Stil im Look von iOS 26 ("Liquid Glass"): Hintergrund mit sanftem Farbverlauf, Karten aus
# halbdurchsichtigem "Glas" mit hellem Rand und weichem Schatten, Pillen-Form für Plaketten und Knöpfe.
# Bewusst OHNE Weichzeichner (backdrop-filter) – der Kiosk-Browser am Monitor hat keine Grafikbeschleunigung,
# Verläufe, Transparenz und Schatten schafft er aber flüssig.
# "Apple" ist die helle Variante (falls die Kiosk-App das Theme "Apple" fest vorgibt, bleibt es hell),
# "Apple Dunkel" die dunkle, "Apple Hell" = wie "Apple". Umschalten: packages/design.yaml (Hell/Dunkel/Automatisch).
# Dialoge und Menüs bleiben deckend (card-background-color), damit sie ohne Weichzeichner lesbar sind.
Apple:
  primary-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif
  paper-font-common-base_-_font-family: var(--primary-font-family)
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-heading: var(--primary-font-family)
  ha-card-border-radius: 28px
  ha-card-border-width: 1px
  ha-tile-border-radius: 24px
  ha-badge-border-radius: 999px
  ha-dialog-border-radius: 32px
  mdc-shape-medium: 24px
  mdc-shape-small: 999px
  ha-section-title-font-size: 24px
  ha-heading-card-title-font-size: 20px
  state-light-active-color: '#FFCC00'
  state-switch-active-color: '#34C759'
  state-script-active-color: '#007AFF'
  state-icon-active-color: '#FF9F0A'
  primary-color: '#007AFF'
  accent-color: '#007AFF'
  primary-background-color: '#F2F2F7'
  secondary-background-color: '#FFFFFF'
  lovelace-background: radial-gradient(ellipse at 8% 0%, #D4E4FF 0%, rgba(212,228,255,0) 55%), radial-gradient(ellipse at 95% 10%, #F3DDF3 0%, rgba(243,221,243,0) 50%), radial-gradient(ellipse at 75% 100%, #FFE7CC 0%, rgba(255,231,204,0) 55%), linear-gradient(165deg, #EDF2FA 0%, #F5F2F8 100%)
  card-background-color: '#FFFFFF'
  ha-card-background: rgba(255, 255, 255, 0.62)
  ha-card-border-color: rgba(255, 255, 255, 0.9)
  ha-card-box-shadow: 0 10px 30px rgba(40, 52, 90, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.95)
  primary-text-color: '#1C1C1E'
  secondary-text-color: '#6E6E73'
  disabled-text-color: '#C7C7CC'
  divider-color: rgba(60, 60, 67, 0.10)
  app-header-background-color: rgba(244, 245, 250, 0.82)
  app-header-text-color: '#1C1C1E'
  sidebar-background-color: '#F2F2F7'
  sidebar-selected-icon-color: '#007AFF'
  sidebar-selected-text-color: '#007AFF'
  switch-checked-color: '#34C759'
  switch-checked-button-color: '#FFFFFF'
  switch-checked-track-color: '#34C759'
  success-color: '#34C759'
  warning-color: '#FF9500'
  error-color: '#FF3B30'
