# Hausstil der Familie (Farben/Schrift wie das Handbuch „Zuhause“: Olivgrün, Sand, Creme, Terrakotta; Cormorant Garamond +
# Montserrat), aufgebaut auf dem Apple-Stil im Look von iOS 26 ("Liquid Glass"): Hintergrund mit sanftem Farbverlauf, Karten aus
# halbdurchsichtigem "Glas" mit hellem Rand und weichem Schatten, Pillen-Form für Plaketten und Knöpfe.
# Bewusst OHNE Weichzeichner (backdrop-filter) – der Kiosk-Browser am Monitor hat keine Grafikbeschleunigung,
# Verläufe, Transparenz und Schatten schafft er aber flüssig.
# "Apple" ist die helle Variante (falls die Kiosk-App das Theme "Apple" fest vorgibt, bleibt es hell),
# "Apple Dunkel" die dunkle, "Apple Hell" = wie "Apple". Umschalten: packages/design.yaml (Hell/Dunkel/Automatisch).
# Dialoge und Menüs bleiben deckend (card-background-color), damit sie ohne Weichzeichner lesbar sind.
Apple:
  primary-font-family: 'Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif'
  paper-font-common-base_-_font-family: var(--primary-font-family)
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-heading: '"Cormorant Garamond", Georgia, serif'
  ha-card-border-radius: 28px
  ha-card-border-width: 1px
  ha-tile-border-radius: 24px
  ha-badge-border-radius: 999px
  ha-dialog-border-radius: 32px
  mdc-shape-medium: 24px
  mdc-shape-small: 999px
  ha-section-title-font-size: 24px
  ha-heading-card-title-font-size: 20px
  state-light-active-color: '#e2b44b'
  state-switch-active-color: '#536b45'
  state-script-active-color: '#536b45'
  state-icon-active-color: '#c9a55a'
  primary-color: '#536b45'
  accent-color: '#536b45'
  primary-background-color: '#f7f4ed'
  secondary-background-color: '#FFFFFF'
  lovelace-background: radial-gradient(ellipse at 10% 0%, #e9e2cf 0%, rgba(233,226,207,0) 55%), radial-gradient(ellipse at 95% 15%, #dfe6d3 0%, rgba(223,230,211,0) 50%), linear-gradient(170deg, #f7f4ed 0%, #f1ece0 100%)
  card-background-color: '#FFFFFF'
  ha-card-background: rgba(255, 255, 255, 0.82)
  ha-card-border-color: rgba(216, 199, 163, 0.55)
  ha-card-box-shadow: 0 4px 16px rgba(51, 68, 43, 0.08)
  primary-text-color: '#2d3329'
  secondary-text-color: '#6b7266'
  disabled-text-color: '#C7C7CC'
  divider-color: rgba(216, 199, 163, 0.6)
  app-header-background-color: rgba(247, 244, 237, 0.92)
  app-header-text-color: '#2d3329'
  sidebar-background-color: '#f7f4ed'
  sidebar-selected-icon-color: '#536b45'
  sidebar-selected-text-color: '#536b45'
  switch-checked-color: '#536b45'
  switch-checked-button-color: '#FFFFFF'
  switch-checked-track-color: '#536b45'
  success-color: '#536b45'
  warning-color: '#c96f4a'
  error-color: '#b3412e'
